# Delivery: builds, scans and pushes the three images
# ghcr.io/privacybydesign/yivi-businesswallet/{business-wallet,postguard-sidecar,devverifier}.
# Push to main -> :edge, release vX.Y.Z -> :X.Y.Z and :latest, manual run ->
# :<branch>. The ops repo pulls them from ghcr.io (edge on dev, the release
# version on prod). PR builds are scanned in Status checks; published images
# are re-scanned weekly by image-rescan.yml.
name: Delivery

on:
  push:
    branches: [main]
  release:
    # Note: a current limitation is that when a release is edited after publication, then the Docker tags are not automatically updated.
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  docker:
    strategy:
      # A failed scan of one image must not stop the others from publishing.
      fail-fast: false
      matrix:
        include:
          # Root context: the image bundles the built frontend with the Go API.
          - component: business-wallet
            context: .
            dockerfile: backend/docker/production/Dockerfile
          - component: postguard-sidecar
            context: postguard-sidecar
            dockerfile: postguard-sidecar/Dockerfile
          # Staging-only OpenID4VP relying party, one Go command from backend/.
          - component: devverifier
            context: backend
            dockerfile: backend/docker/devverifier/Dockerfile
    uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    with:
      image-name: ghcr.io/${{ github.repository }}/${{ matrix.component }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      # The old Delivery tagged :latest on every stable release; keep doing so.
      tag-latest: true
    secrets:
      # The business-wallet image builds the API with -tags wsca, which clones
      # the private wallet-provider repo (RUN --mount=type=secret). Quoted so
      # the multi-line SSH key stays one secret; ignored by the other images.
      DOCKER_BUILD_SECRETS: |
        "wallet_provider_key=${{ secrets.WALLET_PROVIDER_DEPLOY_KEY }}"
