services:
  db:
    ports:
      - "5432:5432"

  backend:
    build:
      dockerfile: docker/development/Dockerfile
    healthcheck:
      start_period: 180s
      start_interval: 2s
    environment:
      # Ignore any host go.work (bind-mounted via ./backend): WSCA is opt-in and
      # its private module is only pulled in by a -tags wsca workspace build,
      # which the default dev container never does. See .ai/features/wsca-holder-binding.md.
      GOWORK: "off"
      # Login/disclosure runs over OpenID4VP against a hosted EUDI verifier.
      # Empty falls back to the config default (Yivi staging verifier).
      EUDI_VERIFIER_URL: ${EUDI_VERIFIER_URL:-}
      EUDI_ISSUER_CHAIN: ${EUDI_ISSUER_CHAIN:-}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-admin@yivi.app}
      # Claim links in dev point at the local frontend.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      # Attestation issuer: stub by default. Set ATTESTATION_ISSUER=veramo (+ token)
      # in .env to issue against the hosted Veramo staging issuer.
      ATTESTATION_ISSUER: ${ATTESTATION_ISSUER:-stub}
      ATTESTATION_ISSUER_URL: ${ATTESTATION_ISSUER_URL:-https://veramo-issuer.openid4vc.staging.yivi.app}
      ATTESTATION_ISSUER_INSTANCE: ${ATTESTATION_ISSUER_INSTANCE:-test-issuer}
      ATTESTATION_ISSUER_ADMIN_TOKEN: ${ATTESTATION_ISSUER_ADMIN_TOKEN:-}
      ATTESTATION_ISSUER_PING_CREDENTIAL: ${ATTESTATION_ISSUER_PING_CREDENTIAL:-}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:-}
      # Holder wallet: stub by default. Set ATTESTATION_HOLDER=irmago (+ master key)
      # in .env to actually hold received credentials in the irmago EUDI engine.
      ATTESTATION_HOLDER: ${ATTESTATION_HOLDER:-stub}
      ATTESTATION_HOLDER_STORAGE_DIR: ${ATTESTATION_HOLDER_STORAGE_DIR:-/tmp/eudiholder}
      ATTESTATION_HOLDER_MASTER_KEY: ${ATTESTATION_HOLDER_MASTER_KEY:-}
      ATTESTATION_HOLDER_TRUST_CHAIN: ${ATTESTATION_HOLDER_TRUST_CHAIN:-}
      ATTESTATION_HOLDER_STAGING_ANCHORS: ${ATTESTATION_HOLDER_STAGING_ANCHORS:-}
      ATTESTATION_HOLDER_ALLOW_INSECURE_HTTP: ${ATTESTATION_HOLDER_ALLOW_INSECURE_HTTP:-}
      # WSCA-backed holder binding (opt-in): set ATTESTATION_HOLDER_WSCA_URL to the
      # wallet-provider. Requires ATTESTATION_HOLDER_WSCA_KEK. See
      # .ai/features/wsca-holder-binding.md.
      ATTESTATION_HOLDER_WSCA_URL: ${ATTESTATION_HOLDER_WSCA_URL:-}
      ATTESTATION_HOLDER_WSCA_KEK: ${ATTESTATION_HOLDER_WSCA_KEK:-}
      ATTESTATION_HOLDER_WSCA_KEYSTORE_DIR: ${ATTESTATION_HOLDER_WSCA_KEYSTORE_DIR:-/tmp/eudiholder-wsca}
      ATTESTATION_HOLDER_WSCA_INSECURE: ${ATTESTATION_HOLDER_WSCA_INSECURE:-}
      # QERDS transport: stub by default. Set QERDS_PROVIDER=domibus (+ URL) in
      # .env to drive the real Domibus AS4 access point (run with --profile domibus).
      QERDS_PROVIDER: ${QERDS_PROVIDER:-stub}
      QERDS_PROVIDER_URL: ${QERDS_PROVIDER_URL:-}
      QERDS_AUTH_TOKEN: ${QERDS_AUTH_TOKEN:-}
      QERDS_DOMIBUS_FROM_PARTY: ${QERDS_DOMIBUS_FROM_PARTY:-}
      QERDS_DOMIBUS_TO_PARTY: ${QERDS_DOMIBUS_TO_PARTY:-}
      # Signing ceremony (--profile signer): the QTSP authorization server is
      # reachable at localhost:8084 from the browser (the authorize URL) but at
      # qtsp-authz:8084 from this backend container (the server-side token exchange).
      # This overrides only the backend's token-exchange host; empty in production
      # where the QTSP is one URL for both. See internal/signing.
      SIGNING_OAUTH_ISSUER_INTERNAL: ${SIGNING_OAUTH_ISSUER_INTERNAL:-http://qtsp-authz:8084}
    depends_on:
      seed:
        condition: service_completed_successfully
      # Optional: only present when the `domibus` profile is enabled. With
      # QERDS_PROVIDER=domibus the backend does a fatal one-shot ping at boot,
      # so wait for Domibus's WS plugin to be serving before starting.
      domibus:
        condition: service_healthy
        required: false
    volumes:
      - ./backend:/app
      - backend-go-build:/root/.cache/go-build
      - backend-go-mod:/go/pkg/mod

  migrate:
    build:
      dockerfile: docker/development/Dockerfile
    entrypoint: [ "go", "run", "./cmd/migrate"]
    environment:
      # Ignore any host go.work bind-mounted via ./backend (see backend service).
      GOWORK: "off"
    volumes:
      - ./backend:/app
      - backend-go-build:/root/.cache/go-build
      - backend-go-mod:/go/pkg/mod

  seed:
    build:
      context: backend
      dockerfile: docker/development/Dockerfile
    entrypoint: ["go", "run", "./cmd/seed"]
    environment:
      # Ignore any host go.work bind-mounted via ./backend (see backend service).
      GOWORK: "off"
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-yivi_business_wallet}?sslmode=disable
      # The dev seed provisions these accounts so the operator's own admin email
      # can log in (must match the backend service's value above).
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-admin@yivi.app}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - backend-go-build:/root/.cache/go-build
      - backend-go-mod:/go/pkg/mod

  # Dev SMTP catch-all: Mailpit (a maintained MailHog) captures all outbound mail
  # so credential-offer notifications are viewable without a real mail server.
  # Web UI: http://localhost:8025 . Per-org SMTP settings in dev point at
  # host "mailpit", port 1025 (no auth) — the seeder configures the demo org.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  frontend:
    build:
      context: frontend
      dockerfile: src/docker/development/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  # QERDS transport bench (AS4 / eDelivery). Opt-in — heavy and only needed when
  # exercising the real `domibus` provider driver instead of the in-process stub:
  #   docker compose --profile domibus up
  # then run the backend with QERDS_PROVIDER=domibus and
  # QERDS_PROVIDER_URL=http://domibus:8080/domibus/services/backend.
  # Admin console: http://localhost:8090/domibus (admin / 123456).
  # NOTE: proves AS4 plumbing, not qualified compliance — see .ai/features/qerds.md.
  domibus-mysql:
    image: fiware/domibus-mysql:latest
    # Published only for linux/amd64; runs under emulation on arm64 hosts.
    platform: linux/amd64
    profiles: ["domibus"]
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: domibus
      MYSQL_USER: edelivery
      MYSQL_PASSWORD: edelivery
    # First-run MySQL init is slow (slower still under amd64 emulation on arm64),
    # so gate readiness on a real ping before starting Domibus.
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      # The Domibus Tomcat image resolves its datasource host as "mysql".
      default:
        aliases:
          - mysql

  domibus:
    image: fiware/domibus-tomcat:latest
    platform: linux/amd64
    profiles: ["domibus"]
    environment:
      # The image requires exactly "MySQL" or "Oracle" (case-sensitive).
      DB_TYPE: MySQL
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: domibus
      DB_USER: edelivery
      DB_PASS: edelivery
      # Belt-and-suspenders: turn off Domibus's own cert-validation checks. Not
      # strictly needed now that the mounted keystores below hold non-expired
      # certs, but harmless and keeps submission unblocked (NOT for real
      # qualified delivery). The image's entrypoint appends to JAVA_OPTS, so
      # these -D overrides survive a container recreate.
      JAVA_OPTS: >-
        -Ddomibus.receiver.certificate.validation.onsending=false
        -Ddomibus.sender.certificate.validation.onsending=false
        -Ddomibus.sender.certificate.validation.onreceiving=false
    ports:
      - "8090:8080"
    # Overlay freshly-generated blue_gw/red_gw keystores over the image's baked-in
    # sample ones (which expired 2025-12-01). WSS4J rejects a message *signed* by
    # an expired cert on receipt (EBMS:0005/0004, "The provided certificate is
    # invalid") regardless of the validation flags above, so the self-send never
    # reached SENT with the stock certs. Same aliases (blue_gw/red_gw) and
    # password (test123) as the image, so domibus.properties needs no change. See
    # docker/development/domibus/README.md for regeneration.
    volumes:
      - ./docker/development/domibus/gateway_keystore.jks:/data/tomcat/conf/domibus/keystores/gateway_keystore.jks:ro
      - ./docker/development/domibus/gateway_truststore.jks:/data/tomcat/conf/domibus/keystores/gateway_truststore.jks:ro
    # Tomcat deploys the WAR + connects MySQL on first boot (slow under amd64
    # emulation on arm64), so gate readiness on the WS plugin actually serving
    # the WSDL — the exact endpoint the backend pings at startup.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/domibus/services/backend?wsdl"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 240s
    depends_on:
      domibus-mysql:
        condition: service_healthy

  # One-shot PMode provisioner: a fresh Domibus has no PMode, so submitMessage
  # fails with EBMS:0010 until one is uploaded. Waits for the WS plugin to be
  # healthy, then uploads the blue->red self-send PMode via the admin REST API.
  # Idempotent (re-uploading replaces the current PMode), so it re-runs cleanly
  # on every `up`. Same PMode file the live-Domibus integration test embeds.
  domibus-provision:
    image: curlimages/curl:latest
    platform: linux/amd64
    profiles: ["domibus"]
    restart: "no"
    depends_on:
      domibus:
        condition: service_healthy
    volumes:
      - ./backend/internal/qerdsprovider/testdata/pmode.xml:/pmode.xml:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        curl -s -c /tmp/cj.txt -o /dev/null -H "Content-Type: application/json" \
          -X POST http://domibus:8080/domibus/rest/security/authentication \
          -d '{"username":"admin","password":"123456"}'
        XSRF=$$(grep -i XSRF-TOKEN /tmp/cj.txt | awk '{print $$7}')
        echo "uploading PMode..."
        curl -sf -b /tmp/cj.txt -H "X-XSRF-TOKEN: $$XSRF" \
          -F "file=@/pmode.xml" -F "description=qerds bench blue->red self-send" \
          -X POST http://domibus:8080/domibus/rest/pmode
        echo "PMode uploaded"
        # Route inbound messages to the WS plugin. The image ships THREE backend
        # plugins (WS + JMS + FS) with no persisted message filter, so a received
        # message matches no backend and is dropped to notification.unknown
        # (listPendingMessages then stays empty and the recipient never sees it).
        # Persist a filter list with backendWebservice first (no routing criteria
        # => it catches everything) so retrieveMessage works.
        echo "configuring message filter (WS plugin first)..."
        curl -sf -b /tmp/cj.txt -H "X-XSRF-TOKEN: $$XSRF" -H "Content-Type: application/json" \
          -X PUT http://domibus:8080/domibus/rest/messagefilters \
          -d '[{"entityId":0,"index":0,"routingCriterias":[],"backendName":"backendWebservice","persisted":true},{"entityId":0,"index":1,"routingCriterias":[],"backendName":"backendFSPlugin","persisted":true},{"entityId":0,"index":2,"routingCriterias":[],"backendName":"Jms","persisted":true}]'
        echo "message filter configured"

  # Qualified-signing demo (QES over CSC API v2). Opt-in — heavy, and only for
  # demonstrating how remote QTSP signing works:
  #   docker compose --profile signer up --build
  # Hosts the EUDI wallet-driven QTSP reference implementation (built from source
  # at a pinned commit, patched for SoftHSM + an EJBCA-free self-sign path): the CSC
  # resource server (8085, SoftHSM2 as the QSCD stand-in) AND the OAuth2/OID4VP
  # authorization server (8084), so the full RP-centric signing ceremony works.
  # The ceremony's wallet step drives OID4VP at the PUBLIC EUDI verifier
  # (verifier-backend.eudiw.dev) and needs an EUDI reference wallet holding a dev
  # PID (mso_mdoc) — NOT our Yivi/SD-JWT login wallet. See the README.
  # NOTE: proves QES-over-CSC plumbing on a software HSM, NOT qualified compliance.
  # Quick no-wallet path: set SPRING_PROFILES_ACTIVE=noauth on qtsp-signer to drive
  # signHash directly (run-demo.sh) without the authorization server. See issue #194
  # and .ai/features/qtsp-signing-demo.md.
  signer-mysql:
    image: mysql:8
    profiles: ["signer"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: qtsp
      MYSQL_USER: qtsp
      MYSQL_PASSWORD: qtsp
    volumes:
      # Spring Authorization Server tables (JdbcRegisteredClientRepository /
      # JdbcOAuth2AuthorizationService) must exist before the authz server starts;
      # JPA ddl-auto does not create them. Loaded on first init of a fresh volume.
      - ./docker/development/qtsp-signer/schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uqtsp -pqtsp --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  qtsp-signer:
    build:
      context: ./docker/development/qtsp-signer
    image: yivi-qtsp-signer:demo
    profiles: ["signer"]
    depends_on:
      signer-mysql:
        condition: service_healthy
      # The RS validates the AS's JWTs; wait for the AS to be serving its JWKS.
      qtsp-authz:
        condition: service_healthy
    ports:
      - "8085:8085"
    environment:
      # Default: REAL auth — the RS validates the authorization server's JWTs, so
      # signHash requires the full OID4VP + OAuth ceremony (see qtsp-authz).
      # Quick no-wallet path: uncomment the next line to drive signHash directly
      # via X-Stub-* headers + /spike/seed-credential (run-demo.sh), no AS needed.
      # SPRING_PROFILES_ACTIVE: noauth
      # --- Datasource (the app builds jdbc:mysql://<DB_URL>/<DB_NAME>) ---
      SPRING_DATASOURCE_USERNAME: qtsp
      SPRING_DATASOURCE_PASSWORD: qtsp
      SPRING_DATASOURCE_DB_URL: signer-mysql:3306
      SPRING_DATASOURCE_DB_NAME: qtsp
      # --- DB field encryption + symmetric key (demo values, not secrets) ---
      DB_ENCRYPTION_PASSPHRASE: demo-passphrase
      DB_ENCRYPTION_SALT: MTIzNDU2Nzg5MDEyMzQ1Ng==            # base64("1234567890123456")
      SYMMETRIC_SECRET_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=  # base64(32 bytes)
      # --- Trust the authorization server's JWTs ---
      # ISSUER_URI must string-match the `iss` the AS stamps (its
      # SERVICE_URL_OAUTH2_ISSUER); JWT_SET_URI must be container-reachable for the
      # JWKS fetch (the app appends /oauth2/jwks). Hence localhost vs service name.
      AUTHORIZATION_SERVER_ISSUER_URI: http://localhost:8084
      AUTHORIZATION_SERVER_JWT_SET_URI: http://qtsp-authz:8084
      # --- EJBCA disabled: self-sign instead of enrolling against a CA ---
      EJBCA_ENABLED: "false"
      EJBCA_HOST: disabled.invalid
      EJBCA_CLIENT_P12_FILEPATH: /dev/null
      EJBCA_CLIENT_P12_PASSWORD: x
      EJBCA_MANAGEMENT_CA: /dev/null
      EJBCA_CERTIFICATE_PROFILE_NAME: x
      EJBCA_END_ENTITY_PROFILE_NAME: x
      EJBCA_USERNAME: x
      EJBCA_PASSWORD: x
      # --- SoftHSM / token (consumed by docker-entrypoint.sh) ---
      PKCS11_TOKEN_LABEL: qtsp-token
      PKCS11_PIN: "1234"
      PKCS11_SO_PIN: "1234"
    healthcheck:
      # /csc/v2/info is unauthenticated in both modes (real auth and noauth), so it
      # is a stable readiness probe; /spike/health only exists under the noauth profile.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -X POST -H 'Content-Type: application/json' -d '{\"lang\":\"en-US\"}' http://localhost:8085/csc/v2/info"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  # The OAuth2 + OID4VP authorization server (same image, QTSP_SERVER=authz). It
  # runs the wallet ceremony: on /oauth2/authorize it starts an OID4VP presentation
  # at the PUBLIC EUDI verifier and renders a QR the EUDI wallet scans, then issues
  # the credential-scoped access token (the SCAL2 SAD) the RS's signHash validates.
  qtsp-authz:
    build:
      context: ./docker/development/qtsp-signer
    image: yivi-qtsp-signer:demo
    profiles: ["signer"]
    depends_on:
      signer-mysql:
        condition: service_healthy
    ports:
      - "8084:8084"
    # Load the OAuth2 client registrations (our SCA client) at startup.
    # The reference app reads the property names VERIFIER-DOMAIN / WALLET-SCHEME
    # verbatim (hyphens). Docker Compose CANNOT pass hyphenated *env var* names
    # (invalid POSIX names — they are silently dropped), so they are supplied as
    # Spring command-line property overrides here instead.
    command:
      - "--spring.config.additional-location=file:/opt/app/config/clients/application-secret.yml"
      - "--VERIFIER-DOMAIN=verifier-backend.eudiw.dev"
      - "--WALLET-SCHEME=eudi-openid4vp://"
    volumes:
      - ./docker/development/qtsp-signer/config/application-secret.yml:/opt/app/config/clients/application-secret.yml:ro
    environment:
      QTSP_SERVER: authz
      # --- Shared datasource (same MySQL + db as the resource server) ---
      SPRING_DATASOURCE_USERNAME: qtsp
      SPRING_DATASOURCE_PASSWORD: qtsp
      SPRING_DATASOURCE_DB_URL: signer-mysql:3306
      SPRING_DATASOURCE_DB_NAME: qtsp
      # Must equal the resource server's value: the AS encrypts the identity claims
      # (givenName/surname/issuingCountry) the RS later decrypts.
      SYMMETRIC_SECRET_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=  # base64(32 bytes)
      # The OAuth2 issuer the AS stamps into tokens. MUST equal the RS's
      # AUTHORIZATION_SERVER_ISSUER_URI, and be reachable by the browser/wallet.
      SERVICE_URL_OAUTH2_ISSUER: http://localhost:8084
      SERVICE_URL: http://localhost:8084
      # OID4VP verifier (VERIFIER-DOMAIN) + wallet scheme (WALLET-SCHEME) are passed
      # as Spring command-line args above, NOT here — their hyphenated names are not
      # valid env var names and Docker would drop them. Public EUDI verifier:
      # requesting an mso_mdoc PID needs an EUDI reference wallet with a dev PID.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8084/oauth2/jwks"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # One-shot (noauth quick path only): seed a signing credential so signHash is
  # drivable without the ceremony. Under the default REAL-auth config the noauth
  # /spike endpoint is absent, so this degrades to a no-op with a hint instead of
  # failing the `up`. Enable SPRING_PROFILES_ACTIVE=noauth on qtsp-signer to use it.
  qtsp-signer-provision:
    image: curlimages/curl:latest
    profiles: ["signer"]
    restart: "no"
    depends_on:
      qtsp-signer:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        if curl -fsS -X POST "http://qtsp-signer:8085/spike/seed-credential?sub=demo-user" 2>/dev/null; then
          echo
          echo "seeded a demo credential. Drive signHash with run-demo.sh (noauth)."
        else
          echo "resource server is in REAL-auth mode (no /spike endpoint) — skipping seed."
          echo "Use the signing ceremony (authorize -> token -> signHash), or set"
          echo "SPRING_PROFILES_ACTIVE=noauth on qtsp-signer for the quick path."
        fi

volumes:
  backend-go-build:
  backend-go-mod:
  frontend-node-modules:
