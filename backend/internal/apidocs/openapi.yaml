# The apidocs.TestSpecCoversAllRoutes drift check fails CI if this list falls out
# of sync with the registered handlers.
openapi: 3.0.3
info:
  title: Yivi Business Wallet API
  description: |
    HTTP API for the Yivi Business Wallet backend. All endpoints live under the
    versioned `/api/v1` prefix. Authentication uses the `ybw_session` cookie set
    by the login flow; endpoints that do not require it are marked with no security.
  version: "1.0.0"
servers:
  - url: /
    description: Same origin; every path carries the versioned /api/v1 prefix
tags:
  - name: auth
    description: Login sessions and the current user.
  - name: wallet
    description: Organisation registration and the organisation wallet.
  - name: organizations
    description: Organisations, members, invitations and departments.
  - name: attestation
    description: Attestation schemas, templates, keys and issuance.
  - name: qerds
    description: Qualified electronic registered delivery service messaging.
  - name: postguard
    description: PostGuard attribute-based encryption settings and files.
  - name: email
    description: Per-organisation email settings and transactional mail templates.
  - name: issuer-settings
    description: Per-organisation issuer settings.
  - name: wsca
    description: Per-organisation WSCA holder-wallet activation and rotation.
  - name: wallet-unit
    description: Wallet unit attestations (WE BUILD CS-05) and their status lists.
  - name: theme
    description: Per-organisation colour scheme and logo.
  - name: notifications
    description: Per-organisation notification subscriptions per audit event.
  - name: slack
    description: Per-organisation Slack incoming-webhook notification settings.
  - name: msteams
    description: Per-organisation Microsoft Teams webhook notification settings.
  - name: provisioning
    description: Per-organisation user and department provisioning from an identity directory.
  - name: csc
    description: Per-organisation CSC API v2 signing-provider (remote QTSP) connection settings.
  - name: signing
    description: Qualified document signing — the RP-centric signing ceremony against a CSC provider.
  - name: openid4vp
    description: >-
      Inbound OpenID4VP — an external verifier invoking the business wallet as the
      holder of an organisation's credentials. The browser-facing entry point
      GET /openid4vp and the wallet-metadata document
      /.well-known/oauth-authorization-server live outside /api/v1.
  - name: idem-app
    description: >-
      The Idem app's proofing session routes. The path token names the
      session and the X-Device-Token header authorizes the device holding one of
      its slots; there is no wallet login. Only the app calls them: integrators
      use the proofing API.
  - name: identity-proofing
    x-displayName: 'Identity proofing'
    description: |
      The API an organisation's own software uses to have a person prove their identity and
      to read the outcome. You create a session for a flow, the person does the check, and
      the outcome comes back as a webhook and by reading the session.

      ### Before you start

      An organisation admin creates an **API key** (`yp_live_…`) once in the wallet, under
      **Identity proofing › Developers**, where an admin can show it again later (a key made
      before keys could be shown again cannot be: create a new one). It opens
      every route of this API. Everything else can be set up in the wallet or with that key:
      - the **flows** (`POST /proofing/flows`, and the routes under
        `/proofing/flows/{flowID}`). A flow fixes what is checked: which documents and
        countries are accepted, whether the chip is read, whether the document is
        photographed, whether there is a face check, and what the result carries. You choose
        a flow per session and never send those settings with it;
      - the **default flow** (`PUT /proofing/flow-selection`);
      - the **allowed redirect origins** (`PATCH /proofing/settings`): the origins you
        redirect back to, or embed the hosted page on;
      - a **webhook endpoint** (`PUT /proofing/webhook`, an https URL of yours) and the
        events it receives. Its signing secret (`whsec_…`) is shown once.

      Every call goes to `https://<the wallet's host>/api/v1/proofing/...` with the API key as
      a Bearer token. A call acts for the organisation the key belongs to, and only ever sees
      or changes that organisation's flows, sessions, settings and webhook, as in the wallet.
      Another organisation's flow or session is answered as unknown (422 `flow_not_found`,
      404 `session_not_found`).

      ```
      Authorization: Bearer YOUR_API_KEY
      ```

      ### A session, step by step

      1. **Pick the flow.** `GET /proofing/flows` lists the organisation's flows with their
         `id`.
      2. **Create the session.** `POST /proofing/sessions` with the `flowId` and
         `hosted: true`. Add the expected person (`name` with `birthDate`) to let only that
         person pass. The answer carries the session's `id` and a `hostedUrl`.
      3. **Let the person do the check**, in one of the three ways below.
      4. **Receive the outcome.** Your webhook endpoint gets `session.verified` with the
         result in `data.result`, or `session.failed` with an `errorCode`.
      5. **Or read it yourself.** `GET /proofing/sessions/{id}` for the status,
         `GET /proofing/sessions/{id}/result` for the result.

      ```
      POST /api/v1/proofing/sessions
      {
        "flowId": "6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10",
        "hosted": true,
        "name": "Anna de Vries",
        "birthDate": "1990-04-12",
        "redirectUrl": "https://portal.example.nl/onboarding/return"
      }
      ```

      ### Three ways to run the check

      **1. Our page, by link.** Send the person to `hostedUrl`. The page runs the whole flow
      and then sends them to your `redirectUrl` with `?session=<id>&status=<status>` added.

      **2. Our page, embedded.** Show `hostedUrl` in an iframe on one of your allowed redirect
      origins. Once the session settles, the page posts this to the parent window:

      ```
      { "type": "proofing.completed", "session": "ps_…", "status": "approved" }
      ```

      **3. Your own page.** Create the session with `hosted: true`, then start it in the app
      the person uses with `POST /proofing/sessions/{id}/methods/{method}` (`yivi_app` or
      `idem_app`). The answer carries the link to show as a button or QR code: `walletLink`
      for the Yivi app, `appLink` for the Idem app. Poll
      `GET /proofing/sessions/{id}/methods/{method}/status` until `done` is true; for the
      Yivi app that poll also collects what the person shared, so keep polling.

      For a flow that photographs the document, also show the scan in your page:
      `POST /proofing/sessions/{id}/document-scan` answers the `url` of the scan service's
      page. Show it in an iframe with camera access. The scan itself runs in that page
      and cannot be restyled. When it posts its `transactionId` and `resultId` to your
      page, hand them to `POST /proofing/sessions/{id}/document-scan/finish`.

      ```
      1. POST /proofing/sessions                       { "flowId": "…", "hosted": true }
      2. POST /proofing/sessions/{id}/methods/yivi_app  -> walletLink
      3. POST /proofing/sessions/{id}/document-scan     -> url (iframe)
      4. POST /proofing/sessions/{id}/document-scan/finish { "transactionId": "…", "resultId": "…" }
      5. GET  /proofing/sessions/{id}/methods/yivi_app/status   until done
      ```

      A flow that asks for the address, diplomas or the Verzekeringsbericht takes those on
      our page: use way 1 or 2 for such a flow.

      ### The result

      `GET /proofing/sessions/{id}/result` answers a settled session's result, and the
      `session.verified` webhook carries the same result in `data.result`. What it holds
      follows the session's flow, and only what the flow produced is in it:
      - `identity`: name, date of birth, nationality, and `bsn` when the flow keeps the BSN
        (in full, or only its last 3 digits as `****.**.123`). It comes from the BRP when the
        person shared their personal data through DigiD in the Yivi app, else from the
        document's chip or photo;
      - `documentImage` and `documentImageBack`: the photos of the document's front and back,
        for a flow that keeps them, each `{mimeType, data}` with `data` in base64. With
        "Black out the BSN" on, the BSN is covered in the photos, and only `bsn` carries it;
      - `photo`: the document's portrait from the chip, for a flow that keeps it;
      - `evidence`: what the identity rests on (`emrtd` the chip, `yivi_disclosure` the Yivi
        app, `document_photo` the photographed document) and the checks that ran on it.

      ### Webhooks

      Each event is a POST to your endpoint with a JSON body and three headers:

      | Header | Holds |
      |---|---|
      | `Yivi-Event` | the event's type, as `type` in the body |
      | `Yivi-Delivery` | the delivery's id, as `id` in the body; the same on every retry |
      | `Yivi-Signature` | `t=<unix time>,v1=<signature>` |

      ```
      {
        "id": "bf60aacd-e049-4363-92b4-cdcd97299949",
        "type": "session.verified",
        "createdAt": "2026-11-13T12:44:35Z",
        "data": {
          "sessionId": "ps_tmncasdiyffevjl6egt65h2lya",
          "status": "approved",
          "flowId": "6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10",
          "flowKind": "identity",
          "method": "yivi_app",
          "eidasLevel": "low",
          "result": { "…": "as GET /proofing/sessions/{id}/result" }
        }
      }
      ```

      | Event | Sent when |
      |---|---|
      | `session.created` | the session exists and the person can open it. For a hosted session it comes when the person starts the link, not at `POST /proofing/sessions` |
      | `session.started` | the person's app joined the session |
      | `session.handover` | a running Idem session moved to another phone |
      | `session.verified` | the session is approved; carries `data.result` |
      | `session.failed` | the session is rejected; `data.errorCode` says why |
      | `session.review_opened` | the session waits for a reviewer. `session.verified` or `session.failed` follows, or `session.expired` when the review ends undecided |
      | `session.expired` | the session ended without an outcome: a hosted link nobody started in time, a session the person did not finish, or a review that ended undecided (`data.expiryReason` says which) |
      | `session.cancelled` | the session was cancelled |
      | `session.purged` | the session's personal data was erased |
      | `session.address_added`, `session.diploma_added`, `session.employment_added` | the person added that extra step's data |
      | `session.address_reviewed`, `session.step_reviewed` | a reviewer decided an extra step |
      | `test` | you sent a test event (`POST /proofing/webhook/test`, or the Developers page) |

      **Check the signature** on every event, on the raw body as received:
      1. Read `t` and every `v1` from `Yivi-Signature`.
      2. Compute the HMAC-SHA256 of `<t>.<raw body>` with your `whsec_…` secret as the key,
         in hex.
      3. Accept the event when it equals one of the `v1` values, compared in constant time.
         For 24 hours after you rotate the secret there are two `v1` values, one per secret.
      4. Refuse an event whose `t` is more than a few minutes old.

      ```python
      import hashlib, hmac

      def valid(signature_header: str, raw_body: bytes, secret: str) -> bool:
          parts = [p.split("=", 1) for p in signature_header.split(",") if "=" in p]
          t = next((v for k, v in parts if k == "t"), "")
          want = hmac.new(secret.encode(), t.encode() + b"." + raw_body, hashlib.sha256).hexdigest()
          return any(k == "v1" and hmac.compare_digest(v, want) for k, v in parts)
      ```

      The same in Go:

      ```go
      func valid(signatureHeader string, rawBody []byte, secret string) bool {
      	var t string
      	var v1s []string
      	for part := range strings.SplitSeq(signatureHeader, ",") {
      		k, v, ok := strings.Cut(part, "=")
      		switch {
      		case !ok:
      		case k == "t":
      			t = v
      		case k == "v1":
      			v1s = append(v1s, v)
      		}
      	}
      	mac := hmac.New(sha256.New, []byte(secret))
      	mac.Write([]byte(t + "."))
      	mac.Write(rawBody)
      	want := hex.EncodeToString(mac.Sum(nil))
      	for _, v := range v1s {
      		if hmac.Equal([]byte(v), []byte(want)) {
      			return true
      		}
      	}
      	return false
      }
      ```

      **Answer 2xx** within 10 seconds. Anything else is tried again, up to 8 times in all
      over about 24 hours. An event can arrive more than once (deduplicate on `id`) and out of
      order: read the session when you need its current state.

      ### Assurance levels

      A flow's `requiredAssuranceLevel` is reached only by the checks that prove it, so a flow
      never claims a level it cannot reach. When you create or edit a flow with a level, the
      wallet adds what that level needs to what you send, as the wallet's own flow editor
      does. A `name` and a level are enough; anything else you send stays.

      | Level | What the flow gets | Apps |
      |---|---|---|
      | `none` (or leave it out) | nothing: any steps, no level required | any |
      | `low` | the document scan and chip read (`document_capture`, `nfc_read`), and the check that the chip's data is genuine (`nfc.passive_auth`) | Idem app, or the Yivi app, whose sessions count as `low` |
      | `substantial` | `low`, plus a live face check (`face_verification`) matched by Regula against the chip's photo, at a face match threshold of at least 0.75 (a lower one is raised), and the check that the chip is not a copy (`nfc.chip_auth`, `face.match`, `face.liveness`) | Idem app only: the Yivi app is not offered |
      | `high` | refused (400 `invalid_input`): no check here reaches it | |

      A document photo stays when you add it, at any level: on `substantial` its face check
      runs with Regula. A photo without the chip read, and a face matched against your own
      `referencePhoto`, reach no level, so a flow of only those has no level.

      Every session reports the level it reached in `eidasLevel`, also on a flow without one.
      A session on a flow with a level that falls short of it is `rejected` with
      `ASSURANCE_NOT_MET`.

      ```
      POST /api/v1/proofing/flows
      { "name": "Onboarding", "requiredAssuranceLevel": "substantial" }
      ```

      ### Review a session in your own system

      When a session waits for a reviewer (`session.review_opened`, or `status`
      `needs_review`), either
      - build the review yourself: `GET /proofing/sessions/{id}/review` reads what waits
        with the evidence, and `POST /proofing/sessions/{id}/review-items/{kind}` decides each
        part as the reviewer you name; or
      - use the wallet's review page: `POST /proofing/sessions/{id}/review-links` answers a
        link to it for the reviewer you name, to open or show in an iframe on an allowed
        origin. It posts `proofing.review_completed` to your page once nothing waits.

      Either way the decision is the same as one in the wallet: audited, shown there with the
      reviewer's name, and sent as the same webhooks.

      ### Outcomes and error codes

      A session's `status` ends as `approved`, `rejected`, `needs_review` (a reviewer of the
      organisation decides, then it is approved or rejected), `expired` or `cancelled`.

      An `expired` session carries `expiryReason`: `not_started` (a hosted link nobody
      started in time), `not_finished` (the person did not finish in time) or
      `review_ended` (a review nobody decided before it ended). A `cancelled` session carries
      `cancelledBy`: `api_key` (your software), `member` (someone in the wallet) or `subject`
      (the person declined on the hosted page). The `session.expired` and
      `session.cancelled` webhooks carry the same.

      A `rejected` session carries an `errorCode`:

      | `errorCode` | Meaning |
      |---|---|
      | `IDENTITY_MISMATCH` | the document is not the expected person's (`name` with `birthDate`) |
      | `DOCUMENT_MISMATCH` | the photographed document and the shared data are not the same person's |
      | `DOCUMENT_TYPE_NOT_ACCEPTED` | the flow does not accept this kind of document |
      | `DOCUMENT_COUNTRY_NOT_ACCEPTED` | the flow does not accept documents of this country |
      | `DOC_EXPIRED` | the document is past its expiry date |
      | `DOC_NOT_AUTHENTIC` | the document scan judged the document fake |
      | `DOC_FIELDS_INVALID` | a field on the photographed document failed its check |
      | `DOCUMENT_SCAN_FAILED` | the document could not be photographed within the allowed attempts |
      | `DOC_TAMPERED` | the chip's data does not match its signature |
      | `CHIP_CLONE_DETECTED` | the chip is a copy |
      | `FACE_NO_MATCH` | the live face is not the document's |
      | `LIVENESS_FAILED` | no live person was shown |
      | `FACE_STEP_NOT_COMPLETED` | the face check was not finished |
      | `AGE_NOT_DISCLOSED` | the age the flow asks for was not shared |
      | `ASSURANCE_NOT_MET` | the checks fell short of the level the flow requires |
      | `REVIEW_NOT_HOLDER`, `REVIEW_ALTERED`, `EVIDENCE_NOT_AS_REQUESTED`, `MANUAL_REVIEW_REJECTED` | a reviewer rejected it: someone else's, altered, not what was asked for, or another reason |
      | `REVIEW_LAPSED` | a review nobody decided in time |
      | `ORG_PAUSED` | the organisation's identity proofing was paused |
      | `LEGAL_RETENTION` | an erasure request refused because the data must be kept by law |

      A call the API refuses answers `{ "error": "<message>", "code": "<code>" }`: 400 for a
      body or field that is not valid, 401 for a missing or wrong API key, 403 for a key
      without the scope, or for creating or starting a session while proofing is paused, 404 for a session that is not the
      organisation's, 422 `flow_not_found` for a flow that is not, 409 and 422 for a call the
      session or flow does not allow (each route lists its codes), and 429 when you call too
      often. Act on `code`; `error` is for people and may change.
  - name: identity-proofing-internal
    description: >-
      The wallet's own identity proofing routes (flows, settings, API keys, webhook,
      requests) and the hosted page's, called only by the wallet's frontend. Left out of
      the served docs (apidocs.served): an integrator uses the `identity-proofing` API.
  - name: platform-admin
    description: >-
      The wallet operator's own routes over every organisation, called only by the
      wallet's frontend. Left out of the served docs (apidocs.served): no user of an
      organisation can call them.
paths:
  /api/v1/admin/identity-proofing/pauses:
    get:
      tags: [identity-proofing-internal]
      summary: List orgs whose identity proofing is paused (platform admin)
      description: >-
        Requires the platform administrator role. `pauses` holds one entry per paused org
        (`organizationId`). `paused` is whether identity proofing is stopped for the org;
        `platformPausedAt` and `platformPausedBy` say since when and by whom.
      responses:
        '200':
          description: Every paused org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingPauseList'
              examples:
                pauses:
                  summary: One org paused by the platform
                  value:
                    pauses:
                      - organizationId: 1b2c3d4e-5f60-4a7b-8c9d-0e1f2a3b4c5d
                        paused: true
                        platformPausedAt: "2026-10-01T22:15:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/organizations/{id}/identity-proofing/pause:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Organisation id.
    put:
      tags: [identity-proofing-internal]
      summary: Pause or resume an org's identity proofing (platform admin)
      description: >-
        Requires the platform administrator role. Body `{paused}`. While paused, nothing new
        starts: sending a request, creating a session through the API and starting a
        hosted link answer 403 `proofing_paused`. Every other route stays open, so an admin can
        still revoke a key, remove a webhook or erase data, and sessions already running still
        settle and their webhooks still go out. Pausing first rejects every session of the org waiting for review, `errorCode`
        `ORG_PAUSED` with a reason saying so: nothing can be decided while it is paused. A
        review that cannot be rejected refuses the pause (500); a session that reaches review
        while paused is rejected the same way as it arrives. Only a platform admin pauses or
        resumes: the org's own admin cannot. Audited `identity_proofing.paused` or
        `identity_proofing.resumed` with `by: platform`. `paused` is whether identity proofing
        is stopped for the org; `platformPausedAt` says since when and `platformPausedBy` by
        whom.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingSetPause'
            examples:
              pause:
                summary: Pause
                value:
                  paused: true
      responses:
        '200':
          description: The pause after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingPause'
              examples:
                paused:
                  summary: Paused by the platform
                  value:
                    organizationId: 1b2c3d4e-5f60-4a7b-8c9d-0e1f2a3b4c5d
                    paused: true
                    platformPausedAt: "2026-10-02T09:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/identity-reviews:
    get:
      tags: [platform-admin]
      summary: List pending identity reviews (platform admin)
      description: Requires the platform administrator role.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/identity-reviews/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource identifier.
    post:
      tags: [platform-admin]
      summary: Approve an identity review (platform admin)
      description: Requires the platform administrator role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON request payload; see the endpoint description.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/identity-reviews/{id}/reject:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource identifier.
    post:
      tags: [platform-admin]
      summary: Reject an identity review (platform admin)
      description: Requires the platform administrator role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON request payload; see the endpoint description.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/app/handover/{handoverToken}/claim:
    parameters:
      - name: handoverToken
        in: path
        required: true
        schema:
          type: string
        description: The single-use grant from the claim or handover link.
    post:
      tags: [idem-app]
      summary: Claim a session slot with a claim or handover link
      description: >-
        Moves the slot the grant is for to this device and returns its device token. Single use; a previous device is revoked. Takes no body.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdemAcceptLanguage'
      responses:
        '200':
          description: The slot is this device's; send `deviceToken` as X-Device-Token from now on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemClaim'
        '404':
          description: '`handover_invalid`: no grant matches the token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemAppError'
        '409':
          description: '`handover_used`, `device_already_claimed` or `session_complete`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemAppError'
        '410':
          description: '`handover_expired` or `session_expired`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemAppError'
        '429':
          $ref: '#/components/responses/IdemTooManyRequests'
        '500':
          $ref: '#/components/responses/IdemInternalError'
  /api/v1/app/{token}:
    parameters:
      - $ref: '#/components/parameters/IdemSessionToken'
    get:
      tags: [idem-app]
      summary: Read the session as the app sees it
      description: >-
        What to collect, who asks and how long the session has. Opening it marks a created session opened.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdemDeviceToken'
        - $ref: '#/components/parameters/IdemAcceptLanguage'
      responses:
        '200':
          description: The session view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemAppSession'
        '401':
          $ref: '#/components/responses/IdemDeviceUnauthorized'
        '403':
          $ref: '#/components/responses/IdemDeviceHandedOver'
        '404':
          $ref: '#/components/responses/IdemSessionNotFound'
        '409':
          $ref: '#/components/responses/IdemConflict'
        '500':
          $ref: '#/components/responses/IdemInternalError'
  /api/v1/app/{token}/claim:
    parameters:
      - $ref: '#/components/parameters/IdemSessionToken'
    post:
      tags: [idem-app]
      summary: Claim with the session token (retired)
      description: >-
        Always answers 410 `claim_token_required`: scan the claim or handover QR instead.
      security: []
      responses:
        '410':
          description: '`claim_token_required`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemAppError'
  /api/v1/app/{token}/device/state:
    parameters:
      - $ref: '#/components/parameters/IdemSessionToken'
    post:
      tags: [idem-app]
      summary: Report the device state
      description: >-
        Records whether the app is active or in the background, so the other device can offer a handover. Back to `active` cancels a handover code left for this device's slot.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdemDeviceToken'
        - $ref: '#/components/parameters/IdemAcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdemDeviceStateRequest'
      responses:
        '200':
          description: The session view after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemAppSession'
        '400':
          $ref: '#/components/responses/IdemBadRequest'
        '401':
          $ref: '#/components/responses/IdemDeviceUnauthorized'
        '403':
          $ref: '#/components/responses/IdemDeviceHandedOver'
        '404':
          $ref: '#/components/responses/IdemSessionNotFound'
        '409':
          $ref: '#/components/responses/IdemConflict'
        '410':
          $ref: '#/components/responses/IdemSessionExpired'
        '500':
          $ref: '#/components/responses/IdemInternalError'
  /api/v1/app/{token}/branding/logo:
    parameters:
      - $ref: '#/components/parameters/IdemSessionToken'
    get:
      tags: [idem-app]
      summary: Get the session's branding logo
      description: >-
        The logo of the session's `branding`, served with a locked-down content security policy.
        Only a device holding the session can read it.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdemDeviceToken'
      responses:
        '200':
          description: The logo image.
          content:
            'image/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/IdemDeviceUnauthorized'
        '403':
          $ref: '#/components/responses/IdemDeviceHandedOver'
        '404':
          description: No such session, or it has no logo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemAppError'
        '409':
          $ref: '#/components/responses/IdemConflict'
        '500':
          $ref: '#/components/responses/IdemInternalError'
  /api/v1/app/{token}/events:
    parameters:
      - $ref: '#/components/parameters/IdemSessionToken'
    get:
      tags: [idem-app]
      summary: Wait for a change to the session
      description: >-
        Long-polls until the app view changes (status, steps, resets, devices) or SessionEventsWait (25 s by default) passes, then answers the view. Capped per session and per server.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdemDeviceToken'
        - $ref: '#/components/parameters/IdemAcceptLanguage'
        - name: since
          in: query
          required: false
          schema:
            type: string
          description: The `changeKey` of the view the client last saw; answers at once when it differs.
      responses:
        '200':
          description: The session view, changed or after the wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemAppSession'
        '401':
          $ref: '#/components/responses/IdemDeviceUnauthorized'
        '403':
          $ref: '#/components/responses/IdemDeviceHandedOver'
        '404':
          $ref: '#/components/responses/IdemSessionNotFound'
        '409':
          $ref: '#/components/responses/IdemConflict'
        '429':
          $ref: '#/components/responses/IdemTooManyRequests'
        '500':
          $ref: '#/components/responses/IdemInternalError'
  /api/v1/app/{token}/handover:
    parameters:
      - $ref: '#/components/parameters/IdemSessionToken'
    post:
      tags: [idem-app]
      summary: Mint a handover link
      description: >-
        Issues a short-lived, single-use grant for one of the session slots, replacing its pending one. The body is optional; without it the grant is for the caller's own slot.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdemDeviceToken'
