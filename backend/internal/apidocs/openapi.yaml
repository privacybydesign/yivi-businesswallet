  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/yivi/start:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the API and webhooks show.
    post:
      tags: [identity-proofing-internal]
      summary: Start an on-screen request's Yivi disclosure
      description: >-
        Requires organisation membership, and a request sent on-screen for the Yivi
        app. Starts (or, after a cancel in the app, restarts) the OpenID4VP
        disclosure of the subject's passport or ID-card credential with its photo,
        at the wallet's EUDI verifier, and answers its `walletLink` (the
        `openid4vp://` request the Yivi app opens; shown as a QR code and a
        universal link) with `expiresAt`, the session's cap. The verifier's
        transaction id stays on the server.
      responses:
        '200':
          description: The disclosure request for the Yivi app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingYiviStart'
              examples:
                started:
                  summary: Started
                  value:
                    walletLink: openid4vp://?client_id=verifier.example.nl&request_uri=https%3A%2F%2Fverifier.example.nl%2Fr%2F8f3k
                    expiresAt: "2026-10-02T09:40:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request does not run in the Yivi app (`wrong_method`), or its session has ended (`session_over`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/yivi/disclosure:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the API and webhooks show.
    get:
      tags: [identity-proofing-internal]
      summary: Redeem an on-screen request's Yivi disclosure
      description: >-
        Requires organisation membership. `done` is false while the subject has not finished the
        OpenID4VP presentation in the Yivi app. Once done, the disclosure decides the session:
        `ok` true approved it, `ok` false rejected it and `code` says why
        (document_not_accepted; age_not_disclosed when an age check's claim did not come
        back; or face_not_verified when the face ID Scan checked with the document photo
        did not verify the person). No other face check runs: the Yivi app vouches for its
        holder, and the session reaches eIDAS low.
        The response returns no disclosed value; on approval the engine keeps the disclosed identity attributes (and the
        photo, when the flow requested it) as the session's result, readable through `result`,
        until its retention.
      responses:
        '200':
          description: The disclosure's state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingYiviDisclosure'
              examples:
                pending:
                  summary: Not finished in the app yet
                  value:
                    done: false
                    ok: false
                approved:
                  summary: The disclosure approved the session
                  value:
                    done: true
                    ok: true
                waitsForDocumentScan:
                  summary: Done in the Yivi app; the document photo, after it, decides
                  value:
                    done: false
                    ok: false
                    waitsForDocumentScan: true
                refused:
                  summary: The document is not one the flow accepts
                  value:
                    done: true
                    ok: false
                    code: document_not_accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request does not run in the Yivi app (`wrong_method`), or its session has ended (`session_over`). A disclosure finished before the flow's document photo answers 200 with `waitsForDocumentScan`, and is decided as the scan finishes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The proofing engine refused the step (`rejected_by_provider`), e.g. the disclosure is not complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
