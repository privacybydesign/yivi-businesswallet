                        status: approved
                        flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                        flowName: Onboarding
                        flowVersion: 3
                        method: idem_app
                        subjectEmail: anna@example.org
                        subjectName: Anna Jansen
                        proofedName: Anna Jansen
                        assuranceLevel: substantial
                        eidasLevel: substantial
                        expiresAt: "2026-10-02T09:40:00Z"
                        createdAt: "2026-10-02T09:30:00Z"
                        completedAt: "2026-10-02T09:34:12Z"
                        expectedSubject: false
                    nextCursor: MjAyNi0xMC0wMlQwOTozMDowMFp8M2Y2YjQ0YTAtOWQ2Yi00YjE4LWE1N2EtMmI3ZTRhMGE5YzEx
        '400':
          description: '`limit` is not a positive number, or `cursor` is not one this API gave (`invalid_input`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [identity-proofing-api]
      summary: Create a proofing session (public API)
      description: >-
        Send an `Idempotency-Key` header to make a retry safe: the same key and body
        within 24 hours get the first answer again (`Idempotent-Replayed: true`), the
        key with another body is 422 `idempotency_key_reused`, and while the first call
        still runs 409 `idempotency_in_flight`. A call whose outcome is unknown (the
        server lost it mid-call) keeps answering 409 until the key expires after 24
        hours, so that a retry can never create a second session; look the session up
        with `GET /proofing/sessions` or use a new key. Purging a session drops the
        answers stored for it. `cancel` takes the header too.
        Authenticated with a customer API key as a Bearer token. `email` and an optional
        `name` of the subject, `flowId` (absent is the customer's default flow) and
        `sendMail` (absent or true mails the subject as a member's request would), and
        `language` (`en` or `nl`: the mail's and the Idem app's; absent is the deployment
        default for the mail and the phone's language in the app). The answer carries the session's vcmrtd `deepLink`, for a caller that shows the QR code
        itself, and `mailSent`. Refused while the customer is paused.
        With `hosted: true` no session is created yet: the answer carries `hostedUrl`,
        a link to the public page the subject opens on their own device (valid 72 hours)
        and starts once from; nothing is mailed. `redirectUrl`, only with
        `hosted: true`, is where the page sends the subject once the session settles, with
        `?session=<id>&status=<status>` added; its origin must be one of the customer's
        `allowedRedirectOrigins` (else 400 `redirect_not_allowed`). `birthDate`
        (YYYY-MM-DD, with `name`) makes the session one for that person only, as for an
        account recovery: the name and birth date read off the document must match, else
        the session is `rejected` with `errorCode` `IDENTITY_MISMATCH`. The session and its
        webhooks then carry `expectedSubject: true`. The flow must read the document data
        (400 otherwise). On a flow whose face check runs without the chip read
        (`needsReferencePhoto` in the flow list), `referencePhoto` is required (422
        `reference_photo_required` otherwise): the customer's own photo of the person,
        standard base64 of a PNG, JPEG or WebP of at most 512 KiB, which the live face
        and its liveness are checked against in the Idem app. It is refused on any other
        flow, such a session runs in the Idem app only and reaches no assurance level,
        and the photo is deleted once the face check can no longer run. A body over
        1 MiB is 400 `invalid_body`, or 413 `body_too_large` when an `Idempotency-Key`
        is sent. Unknown fields are refused (400 `invalid_body`).
      security:
        - customerApiKey: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Makes a retry safe; the same key and body within 24 hours get the first answer again.
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingApiCreateSession'
            examples:
              onboarding:
                summary: Verify a new person by e-mail
                value:
                  email: anna@example.org
                  name: Anna Jansen
                  language: nl
              passwordReset:
                summary: Password reset for the account holder (hosted)
                value:
                  hosted: true
                  redirectUrl: https://portal.example.nl/reset/return
                  name: Anna de Vries
                  birthDate: "1990-04-12"
                  flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
              knownPerson:
                summary: Only Anna de Vries can pass
                value:
                  email: anna.devries@example.org
                  name: Anna de Vries
                  birthDate: "1990-04-12"
              bankAccountReferencePhoto:
                summary: Liveness check against your own photo (face-only flow)
                value:
                  hosted: true
                  redirectUrl: https://portal.example.nl/policy/bank-account/return
                  flowId: 9a2b4c6d-1e3f-4a5b-8c7d-0e1f2a3b4c5d
                  referencePhoto: /9j/4AAQSkZJRgABAQAAAQABAAD
      responses:
        '201':
          description: Created.
          headers:
            Idempotent-Replayed:
              description: '`true` when this is the stored answer to an earlier call with the same `Idempotency-Key`.'
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingApiCreatedSession'
              examples:
                mailed:
                  summary: Mailed session (the onboarding request)
                  value:
                    id: ps_q4r7tz2mxk3vbn6hw5jc2dfa7e
                    status: pending
                    flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                    flowName: Onboarding
                    flowVersion: 3
                    subjectEmail: anna@example.org
                    subjectName: Anna Jansen
                    expiresAt: "2026-10-02T09:40:00Z"
                    createdAt: "2026-10-02T09:30:00Z"
                    expectedSubject: false
                    deepLink: vcmrtd://verify?handover=hv_3m8x2kq7&api=https%3A%2F%2Fwallet.example.nl
                    mailSent: true
                hosted:
                  summary: Hosted link (the password reset request)
                  value:
                    id: ps_b7k2mq4xz6rt3vnw5hc2jd7fae
                    status: pending
                    flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                    flowName: Onboarding
                    subjectEmail: ""
                    subjectName: Anna de Vries
                    expiresAt: "2026-10-05T09:30:00Z"
                    createdAt: "2026-10-02T09:30:00Z"
                    expectedSubject: true
                    deepLink: ""
                    mailSent: false
                    hostedUrl: https://wallet.example.nl/p/BwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyAhIiMkJSY
        '400':
          description: >-
            The body is not valid JSON or has an unknown field (`invalid_body`), a field
            is invalid (`invalid_input`, the message says which), or `redirectUrl` is not on
            an allowed origin (`redirect_not_allowed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: enter a valid e-mail address
                code: invalid_input
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '409':
          description: >-
            The customer is paused (`customer_paused`), the customer has no API key
            (`customer_no_api_key`), the flow's hosted page is off (`hosted_disabled`),
            the deployment has no encryption key (`no_encryption_key`), or a call with this
            `Idempotency-Key` is still running or its outcome is unknown
            (`idempotency_in_flight`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The request body is over 1 MiB (`body_too_large`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            The flow does not exist (`flow_not_found`), cannot be finished
            (`flow_not_completable`), is not assigned to the customer (`flow_not_assigned`), needs a
            `referencePhoto` (`reference_photo_required`), or asks for diplomas and so needs
            `hosted: true` (`diplomas_need_page`); or the `Idempotency-Key` was used with
            another body (`idempotency_key_reused`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/proofing/sessions/{sessionID}:
    parameters:
      - name: sessionID
        in: path
        required: true
        schema:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        description: Session id (`ps_…`), as the create answer and webhooks give it.
    get:
      tags: [identity-proofing-api]
      summary: Get a proofing session (public API)
      description: >-
        Authenticated with a customer API key as a Bearer token. One of the customer's
        sessions, re-checked with the engine first (at most every 10 seconds) while it
        may still change: its `status`, assurance, `errorCode`, and for an approved subject the name
        read off the document (`proofedName`) until the customer's data retention clears
        it. `expectedSubject: true` is a session created for one person (`name` with
        `birthDate`). Rejection codes the wallet itself sets: `IDENTITY_MISMATCH` (the
        document is another person's), `ASSURANCE_NOT_MET` (the checks fell short of the
        flow's required level) and `REVIEW_LAPSED` (a data request nobody reviewed within 30
        days) and `ORG_PAUSED` (a review left open when the organisation paused proofing). The
        session itself is rejected, on any flow, for a face that did not match (`FACE_NO_MATCH`),
        `DOC_EXPIRED`, `DOC_TAMPERED`, and for an achieved eIDAS level below the flow's
        (`ASSURANCE_NOT_MET`). A failed liveness (`LIVENESS_FAILED`) rejects it when the flow
        requires a level or lists `face.liveness`; otherwise the match alone decides, and a
        face that failed liveness never counts as matched. `CHIP_CLONE_DETECTED` is an Active
        Authentication that failed, or, on a flow listing `nfc.chip_auth`, a chip with an AA key
        whose response is missing (a recorded chip read replayed). `CHIP_AUTH_MISSING` appears
        only on sessions decided under an earlier rule.
      security:
        - customerApiKey: []
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingApiSession'
              examples:
                approved:
                  summary: An approved session
                  value:
                    id: ps_q4r7tz2mxk3vbn6hw5jc2dfa7e
                    status: approved
                    flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                    flowName: Onboarding
                    flowVersion: 3
                    method: idem_app
                    subjectEmail: anna@example.org
                    subjectName: Anna Jansen
                    proofedName: Anna Jansen
                    assuranceLevel: substantial
                    eidasLevel: substantial
                    expiresAt: "2026-10-02T09:40:00Z"
                    createdAt: "2026-10-02T09:30:00Z"
                    completedAt: "2026-10-02T09:34:12Z"
                    expectedSubject: false
                mismatch:
                  summary: Someone else's document on a session for one person
                  value:
                    id: ps_b7k2mq4xz6rt3vnw5hc2jd7fae
                    status: rejected
                    flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                    flowName: Onboarding
                    flowVersion: 3
                    method: idem_app
                    subjectEmail: ""
                    subjectName: Anna de Vries
                    errorCode: IDENTITY_MISMATCH
                    expiresAt: "2026-10-02T09:40:00Z"
                    createdAt: "2026-10-02T09:30:00Z"
                    completedAt: "2026-10-02T09:33:05Z"
                    expectedSubject: true
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [identity-proofing-api]
      summary: Erase a proofing session (public API)
      description: >-
        Authenticated with a customer API key as a Bearer token. Erases the session in
        the engine and what the wallet holds of its outcome (the
        proofed name), whatever its state, and sends `session.purged`. The session stays
        readable with `purgedAt` set, for the audit trail. Audited
        `identity_proofing.session_purged`; erasing it again changes nothing.
      security:
        - customerApiKey: []
      responses:
        '204':
          description: Erased.
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
