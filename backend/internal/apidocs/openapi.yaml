  /api/v1/app/{token}/events:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: The session token from the claim or handover link.
    get:
      tags: [idem-app]
      summary: Wait for a change to the session
      description: >-
        Long-polls until the app view changes (status, steps, devices) or SessionEventsWait passes, then answers the view. `since` is the change key the client last saw. Capped per session and per server.
      security: []
      parameters:
