          description: The flow is not one of the organisation's (`flow_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [identity-proofing]
      summary: Save a flow's own branding
      description: >-
        Requires an administrator role in the organisation. A multipart form: `custom` (`true`
        or `false`, required; a missing one is 400 `invalid_body`), and for a custom flow the
        fields of the organisation's branding without "powered by", which stays the
        organisation's: `displayName`, `primaryColor` (`#rrggbb`), `supportContact`,
        `privacyUrl` (an https URL) and a `logo` file (PNG, JPEG, GIF or WebP, at most 512
        KiB) or `removeLogo=true`; a field left empty falls back to the organisation's. `custom`
        false removes the flow's branding, its logo included. The flow's proofing mail, its
        hosted page (`organization`, `theme` and the logo) and the Idem app (for an external
        person) use the result, over the organisation's white-label colours and font. Audited
        `identity_proofing.flow_branding_configured` with before and after (whether a logo is
        set, never its bytes); saving what it already holds changes and audits nothing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProofingFlowBrandingForm'
      responses:
        '200':
          description: The flow's own branding as saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingFlowBranding'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '413':
          description: The logo is too large (`payload_too_large`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The flow is See my data or Delete my data, the wallet's own (`data_request_flow`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The flow is not one of the organisation's (`flow_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
