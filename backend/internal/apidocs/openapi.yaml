                  value:
                    id: 3f6b44a0-9d6b-4b18-a57a-2b7e4a0a9c11
                    requestedByName: Sanne de Vries
                    external: true
                    subjectName: Anna Jansen
                    subjectEmail: anna@example.org
                    proofedName: Anna Jansen
                    flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                    flowName: Onboarding
                    flowVersion: 3
                    method: idem_app
                    status: approved
                    assuranceLevel: substantial
                    eidasLevel: substantial
                    linkExpiresAt: "2026-10-02T09:40:00Z"
                    createdAt: "2026-10-02T09:30:00Z"
                    completedAt: "2026-10-02T09:34:12Z"
                    purgeAt: "2026-11-01T09:34:12Z"
                    diplomaMode: "off"
                    addressMode: "off"
                    diplomas: []
                    expectedSubject: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/claim-link:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the API and webhooks show.
    post:
      tags: [identity-proofing-internal]
      summary: Get a fresh Idem app link for a running request
      description: >-
        Requires organisation membership, and a live request for the Idem app whose
        session still runs. Answers a new `deepLink` (the `vcmrtd://` claim link,
        shown as a QR code) with its `expiresAt`: a new claim when the first
        lapsed unscanned, or a handover to another phone when the app that held
        the session left it (backgrounded, closed or silent). The session keeps
        what was done so far; the phone that scans takes it over.
      responses:
        '200':
          description: A new link for the Idem app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingClaimLink'
              examples:
                link:
                  summary: A new code
                  value:
                    deepLink: vcmrtd://verify?handover=hv_3m8x2kq7&api=https%3A%2F%2Fwallet.example.nl
                    expiresAt: "2026-10-02T09:36:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request does not run in the Idem app or is a test request (`wrong_method`), its session has ended (`session_over`), the app holding it is still active (`device_active`), or the app already did its part (`app_finished`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/app:
    parameters:
      - name: slug
