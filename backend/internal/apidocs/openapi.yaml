  /api/v1/orgs/{slug}/identity-proofing/requests:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    get:
      tags: [identity-proofing]
      summary: List identity proofing requests
      description: >-
        Requires organisation membership. An administrator sees every request of the
        organisation, a member the requests they sent; `?customerId=` narrows either to one
        customer's (a malformed one is 400 `invalid_id`). At most the 200 newest, as stored:
        outcomes land as the engine reports them, and a list read does not re-check it. Only the
        outcome and assurance level are returned, and for a customer's approved subject the name
        read off the document (`proofedName`), until the customer's data retention
        (`dataRetentionDays`, default 30 days) clears it. No other document data.
      parameters:
        - name: customerId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Only the requests sent for this customer.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '409':
          description: The deployment has no identity proofing encryption key (`no_encryption_key`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [identity-proofing]
      summary: Send an identity proofing request
      description: >-
        Requires organisation membership. Either `userId` (a member of the organisation) with
        `flowId` a flow an administrator made available to members, or `customerId` (one of the
        organisation's customers) with `email` and an optional `name` of that customer's
        subject, an external person, and `flowId` a flow assigned to that customer (its default
        when absent). Creates the proofing session and e-mails the subject its vcmrtd deep link
        as a QR code and a button; after the session ends, a new request means a new mail. The
        session runs 10 minutes, or the customer's session length, from the send; once the
        subject opens it the engine may extend it by up to 10 minutes, never past 15 minutes
        from its creation. `mailSent` is false when the mail could not be sent. `method` is the
        app the subject proofs with (`idem_app`, the default, or `yivi_app`) and `channel` how
        the session reaches them (`email`, the default, `on_screen`, or `hosted` for a
        customer's subject: the answer carries `hostedUrl`, a link to the customer's hosted
        page valid 72 hours, which the member hands the person; nothing is mailed, the
        session starts when the person picks an app there, and a flow whose hosted page is
        off is 409 `hosted_disabled`). An on-screen request
        mails nothing and needs no `email` for a customer's subject; an on-screen Idem request
        answers the vcmrtd link as `deepLink` (scannable until `deepLinkExpiresAt`), and a Yivi
        one must be on-screen (an e-mailed one is 400), its disclosure started through
        `yivi/start`. A Yivi request needs Regula on the deployment (else 409
        `method_unavailable`), and a flow that takes no document photos, whose face provider is
        not Idem-only (Iris), and that is not matched against a reference photo (else 400
        `invalid_input`). A flow that asks for diplomas cannot be e-mailed (422
        `diplomas_need_page`), and a customer flow matched against a reference photo cannot be
        sent from here, which takes no photo (422 `reference_photo_required`). A customer's
        request with `birthDate` (a past date, YYYY-MM-DD, with `name`) is for that one person:
        an approval of anyone else is recorded as `rejected` with `errorCode`
        `IDENTITY_MISMATCH`, and the request reads `expectedSubject: true`. The flow must read
        the document data (dg1), and a member's request cannot carry `birthDate`. Other 400
        `invalid_input` causes are an unknown `method`, `channel` or `language`, both `userId`
        and `customerId`, and an invalid `email`.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '409':
          description: The deployment has no identity proofing encryption key (`no_encryption_key`), proofing is paused for the customer (`customer_paused`), the request is for a customer without a live API key (`customer_no_api_key`), or the deployment cannot run Yivi sessions (`method_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The person is not a member (`member_not_found`), or the flow does not exist, cannot be completed in the app, is not available to members or assigned to the customer, asks for diplomas on an e-mailed request (`diplomas_need_page`), or needs a reference photo (`reference_photo_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}:
