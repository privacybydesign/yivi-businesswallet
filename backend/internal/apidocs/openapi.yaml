  /api/v1/proof/{token}/employment:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: The hosted link's token.
    post:
      tags: [identity-proofing-internal]
      summary: Upload the UWV Verzekeringsbericht on a hosted page
      description: >-
        Anonymous: the link's token is the credential. As the on-screen upload, for the subject
        of a hosted session. The link is checked before the body is read. One multipart `file`
        part, at most 5 MiB. Only within an hour of the identity check finishing (approved, or in
        review) on a request that asks for it, and kept once: the first accepted statement closes the step. The
        file is checked: UWV's seal (unchanged, a qualified e-seal certificate of UWV on the
        EU Trusted Lists, its revocation checked online), then the printed holder (initials,
        surname, alone or joined to a married name, and date of birth) against the proofed
        identity, then its date (at most 30 days old). The answer is `{fileName, accepted,
        employment}` or `{fileName, accepted: false, reason, failedCheck}` with `reason`
        `not_a_statement`, `signature_invalid`, `holder_mismatch` or `stale`; a refused file
        can be followed by another within the window. An accepted statement keeps the
        statement date and the relations current on it (reporting a month at most two
        months before the statement's): employer, payroll tax number, contract form, since
        when and the newest month, sealed. Never past relations, the PDF, the holder, the
        hours or the wages.
        Audited `identity_proofing.employment_added` (webhook `session.employment_added`), a
        refused one `identity_proofing.employment_rejected`. A kept statement with no current
        job (`employed: false`) goes to review with `reviewReason` `no_current_employment`, one
        with a current UWV benefit beside a job with `current_benefit`, and one with other
        current income paid without hours worked beside a job with `current_other_income`: an
        `employment` review item (`employmentReview: pending`), decided through
        `.../review-items/employment`. The session keeps the identity's outcome.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProofingEmploymentUpload'
      responses:
        '200':
          description: The verdict on the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingEmploymentVerdict'
              examples:
                accepted:
                  summary: Kept
                  value:
                    fileName: Verzekeringsbericht.pdf
                    accepted: true
                    employment:
                      statementDate: "2026-10-15"
                      employed: true
                      relations:
                        - kind: employment
                          employer: VOORBEELD B.V.
                          payrollTaxNumber: 123456789L01
                          contractForm: schriftelijke arbeidsovereenkomst voor onbepaalde tijd
                          from: "2025-01-01"
                          to: "2026-09-30"
                refused:
                  summary: Refused
                  value:
                    fileName: Verzekeringsbericht.pdf
                    accepted: false
                    reason: stale
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The session asks for no Verzekeringsbericht (`employment_not_asked`), holds one already or the window is closed (`employment_closed`), the session was cancelled or erased (`session_over`), or the deployment checks no Verzekeringsbericht (`no_employment_checker`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The file is too large (`too_large`).
        '503':
          description: The seal cannot be checked now (`seal_check_unavailable`), as the EU Trusted Lists or the revocation responder cannot be reached, and the file could not be kept for a reviewer either. Try again later; the file is not at fault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/proof/{token}/documents:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: The hosted link's token.
    post:
      tags: [identity-proofing-internal]
      summary: Upload documents on a hosted page
      description: >-
        Anonymous: the link's token is the credential. As the on-screen upload, for the subject
        of a hosted session. The link is checked before the body is read, and no more files are
        read than the session still takes.
        Each file is read from who sealed it: DUO's seal is a diploma extract, UWV's a
        Verzekeringsbericht. That document's own check then runs, as on its own upload route
        (`.../diplomas`, `.../employment`). A file sealed by neither is refused `not_supported`,
        and a document the session does not ask for `not_asked`, without a check. A session
        keeps at most 10 extracts (a further one is `too_many`) and one statement (a further one
        is `duplicate`). The answer is a verdict per file, in upload order: `{fileName, kind,
        accepted, diploma | employment}` or `{fileName, kind, accepted: false, reason,
        failedCheck}`. What is kept, audited and reviewed is as on the document's own route.
        A check that breaks on the server's side (the PDF reader, or a seal that can be neither
        checked nor kept for a reviewer) fails only its file, `check_failed`, with nothing of it
        kept: the others keep their verdicts. Only a session that no longer takes documents fails
        the whole upload.

        A seal that cannot be checked as the EU Trusted Lists or a revocation responder cannot
        be reached is tried three times. Still unreachable, the file is not refused: its PDF and
        the identity it must name are kept encrypted, its step's review item opens, and its
        verdict is `seal_check_pending`, audited `identity_proofing.document_unchecked`. The step
        reads as given; a reviewer checks the seal again (`.../review-items/{kind}/seal-check`).
        Up to three statements wait so, since a wrong one cannot be told from the real one
        yet: the check keeps the first that holds.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProofingDocumentUpload'
      responses:
        '200':
          description: A verdict per file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingDocumentVerdictList'
              examples:
                verdicts:
                  summary: A diploma kept, a file nobody sealed refused
                  value:
                    - fileName: diploma.pdf
                      kind: diploma
                      accepted: true
                      diploma:
                        documentType: Diploma
                        qualification: HBO Bachelor Verpleegkunde
                        profiles: []
                        institution: Hogeschool van Amsterdam
                        placeOfIssue: Amsterdam
                        dateAwarded: "2019-07-05"
                        nlqfLevel: "6"
                        eqfLevel: "6"
                        documentNumber: "2019-0042137"
                        signedAt: "2026-10-02T09:36:40Z"
                        addedAt: "2026-10-02T09:37:02Z"
                    - fileName: scan.pdf
                      accepted: false
                      reason: not_supported
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The session asks for no document (`documents_not_asked`), the upload window is closed (`diplomas_closed`, `employment_closed`), the session was cancelled or erased (`session_over`), or the deployment checks no diplomas (`no_diploma_checker`) or no Verzekeringsbericht (`no_employment_checker`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: A file or the upload is too large (`too_large`).
  /api/v1/proofing/sessions:
