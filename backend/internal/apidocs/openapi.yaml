        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    get:
      tags: [organizations]
      summary: Read the caller's own basis of authority over mandates
      description: >-
        Whether the caller may grant and revoke mandates in this organisation, and
        on what basis: a register-backed legal representative, an active
        organisation-wide full mandate, or neither. jointAuthority marks a
        director registered as only able to act together with another one, whom
        this layer still honours as a sole representative. Requires an
        administrator role in the organisation.
      responses:
        '2XX':
          description: Successful response.
