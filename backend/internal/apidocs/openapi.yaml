  /api/v1/proofing/sessions/{sessionID}/methods/{method}:
    parameters:
      - name: sessionID
        in: path
        required: true
        schema:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        description: Session id (`ps_…`), as the create answer and webhooks give it.
      - name: method
        in: path
        required: true
        schema:
          type: string
          enum: [idem_app, yivi_app]
        description: The app the subject proofs with.
    post:
      tags: [identity-proofing-api]
      summary: Start a hosted session in an app, headless (public API)
      description: >-
        Authenticated with the organisation's API key with `sessions:write`, for an
        organisation building its own UI: starts a session created with `hosted: true` in the app, as
        the subject picking it on the hosted page would, and answers the link to show:
        `appLink` (the Idem app's `vcmrtd://` link) or `walletLink` (the Yivi app's
        `openid4vp://` request, its disclosure started already), with `expiresAt`. The
        Yivi disclosure is then polled through `/api/v1/proof/{token}/yivi/disclosure` with the token
        of the `hostedUrl`, which also serves `claim-link` for a new Idem code. Takes an
        `Idempotency-Key`.
      security:
        - apiKey: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Makes a retry safe; the same key and body within 24 hours get the first answer again.
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingApiMethodStart'
              examples:
                idem:
                  summary: Idem app
                  value:
                    id: ps_b7k2mq4xz6rt3vnw5hc2jd7fae
                    method: idem_app
                    appLink: vcmrtd://verify?handover=hv_3m8x2kq7&api=https%3A%2F%2Fwallet.example.nl
                    expiresAt: "2026-10-02T09:40:00Z"
                yivi:
                  summary: Yivi app
                  value:
                    id: ps_b7k2mq4xz6rt3vnw5hc2jd7fae
                    method: yivi_app
                    walletLink: openid4vp://?client_id=verifier.example.nl&request_uri=https%3A%2F%2Fverifier.example.nl%2Fr%2F8f3k
                    expiresAt: "2026-10-02T09:40:00Z"
        '400':
          description: >-
            `method` is not `idem_app` or `yivi_app`, or the flow's face check only runs in
            the Idem app (`invalid_input`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The session was not created hosted (`not_hosted`), was started already
            (`link_started`), or ended (`session_over`); or a call with this
            `Idempotency-Key` is still running or its outcome is unknown
            (`idempotency_in_flight`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            The session's flow can no longer be finished (`flow_not_completable`), or the
            `Idempotency-Key` was used with another body (`idempotency_key_reused`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/proofing/sessions/{sessionID}/methods/{method}/status:
    parameters:
      - name: sessionID
        in: path
