            	    "face_verification"
            	  ],
            	  "requiredChecks": [
            	    "nfc.passive_auth",
            	    "face.match"
            	  ],
            	  "requestedAttributes": [
            	    "dg1"
            	  ],
            	  "attributeReasons": {
            	    "dg1": {
