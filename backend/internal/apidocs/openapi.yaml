  /api/v1/proofing/sessions/{sessionID}/document-scan/finish:
    parameters:
      - name: sessionID
        in: path
        required: true
        schema:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        description: Session id (`ps_…`), as the create answer and webhooks give it.
    post:
      tags: [identity-proofing]
      summary: Finish the document photo in your own page (public API)
      description: >-
        Authenticated with the organisation's API key with `sessions:write`. Hands the
        session the scan the person finished: the `transactionId` and `resultId` the scan
        page posted to your page. The photos and the document check then belong to the
        session, and a flow of the document photo alone is settled by it. Without a
        `resultId` (the person stopped), the session is told the scan did not finish. That
        answers 422 `document_scan_failed` while the person may try again. It rejects the
        session (answering 204) once the scan service's attempts are used up, or at once when
        the person stopped at a face check. The rejection's `errorCode` is `LIVENESS_FAILED`
        or `FACE_NO_MATCH` for a face check, `DOC_EXPIRED` for an expired document, and
        `DOCUMENT_SCAN_FAILED` otherwise. Finishing the same scan again answers 204 and
        changes nothing while the session runs. Once that scan settled the session it
        answers 409 `session_over`.
      security:
        - apiKey: []
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -X POST 'https://wallet.example.org/api/v1/proofing/sessions/ps_q4r7tz2mxk3vbn6hw5jc2dfa7e/document-scan/finish' \
              -H "Authorization: Bearer YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "transactionId": "821bb247-8c77-463b-b1d1-8d8a76ed27fe",
                "resultId": "450f3433-7167-4da0-8857-ea0d8d664779"
              }'
        - lang: Go
          label: Go
          source: |
            package main

            import (
            	"fmt"
            	"io"
            	"log"
            	"net/http"
            	"strings"
            )

            func main() {
            	req, err := http.NewRequest(http.MethodPost, "https://wallet.example.org/api/v1/proofing/sessions/ps_q4r7tz2mxk3vbn6hw5jc2dfa7e/document-scan/finish", strings.NewReader(`{
            	  "transactionId": "821bb247-8c77-463b-b1d1-8d8a76ed27fe",
            	  "resultId": "450f3433-7167-4da0-8857-ea0d8d664779"
            	}`))
            	if err != nil {
            		log.Fatal(err)
            	}
            	// YOUR_API_KEY: your organisation's API key, from Identity proofing › Developers.
            	req.Header.Set("Authorization", "Bearer YOUR_API_KEY")
            	req.Header.Set("Content-Type", "application/json")
            	resp, err := http.DefaultClient.Do(req)
            	if err != nil {
            		log.Fatal(err)
            	}
            	defer resp.Body.Close()
            	body, err := io.ReadAll(resp.Body)
            	if err != nil {
            		log.Fatal(err)
            	}
            	// Any status of 400 or higher carries {"error", "code"}: act on code.
            	fmt.Println(resp.Status, string(body))
            }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [transactionId]
              properties:
                transactionId:
                  type: string
                  description: >-
                    Required. The scan's id, as the scan page posted it. Missing or not the
                    scan started last, it answers 409 `document_scan_mismatch`.
                resultId:
                  type: string
                  description: >-
                    Optional. The result's id, as the scan page posted it. Leave it out when the
                    person stopped (no `state: completed`).
            example:
              transactionId: 821bb247-8c77-463b-b1d1-8d8a76ed27fe
              resultId: 450f3433-7167-4da0-8857-ea0d8d664779
      responses:
        '204':
          description: >-
            The photos are in, the scan was finished already, or a stopped scan rejected the
            session.
        '400':
          description: The body is not valid JSON or has an unknown field (`invalid_body`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The session is not started yet (`session_not_started`), has ended
            (`session_over`), takes no document photo (`document_scan_not_asked`), or this is
            not the scan started last (`document_scan_mismatch`), or the deployment has no scan
            service (`no_document_scanner`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The scan did not finish (`document_scan_failed`); start another.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          description: >-
            The scan service could not give this scan's result
            (`document_scan_unavailable`); start another scan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
