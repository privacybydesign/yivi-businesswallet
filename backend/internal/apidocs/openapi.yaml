    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    post:
      tags: [identity-proofing]
      summary: Rotate the webhook signing secret
      description: >-
        Requires an administrator role in the organisation. The answer carries the new `secret`,
        the one time it is readable. For 24 hours every delivery is signed under both the new and
        the previous secret, so the endpoint can switch over without refusing any. An organisation
        without an endpoint is 404 `webhook_not_found`.
      responses:
        '200':
          description: The endpoint with its new secret, shown once.
