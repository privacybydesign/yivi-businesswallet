  /api/v1/orgs/{slug}/identity-proofing/settings:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    get:
      tags: [identity-proofing]
      summary: Get the organisation's identity proofing settings
      description: >-
        Requires organisation membership. What the organisation set once for all its flows:
        `sessionTtlSeconds` (how long a session runs) and `dataRetentionDays` (how long an
        external person's data is kept after the check), fixed defaults of 600 seconds and 7
        days for a flow that sets no lifetime or retention of its own; `erasureHandling` (how
        "delete my data" requests are decided), `legalRetention` (what the law makes the
        organisation keep, or null), `branding` (with `logoUri` and `hidePoweredBy`) and
        `allowedRedirectOrigins`. An organisation that set nothing reads the defaults:
        review, no legal retention, no branding and no origins.
      responses:
        '200':
          description: The settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingSettings'
              examples:
                settings:
                  summary: Configured settings
                  value:
                    sessionTtlSeconds: 600
                    dataRetentionDays: 7
                    erasureHandling: review
                    legalRetention:
                      months: 60
                      reasonEn: The Wwft requires us to keep proof of identity for five years.
                      reasonNl: De Wwft verplicht ons het identiteitsbewijs vijf jaar te bewaren.
                    branding:
                      displayName: Acme Verzekeringen
                      primaryColor: "#1f6feb"
                      secondaryColor: ""
                      supportContact: support@acme.example
                      privacyUrl: https://acme.example/privacy
                      logoUri: /api/v1/orgs/acme/identity-proofing/settings/logo?v=1759397400
                      hidePoweredBy: false
                    allowedRedirectOrigins: [https://portal.acme.example]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
    patch:
      tags: [identity-proofing]
      summary: Change the organisation's identity proofing settings
      description: >-
        Requires an administrator role in the organisation. The session lifetime and the data
        retention are fixed defaults, which each flow overrides (`sessionTtlSeconds` and
        `retentionOverrideSeconds` on its version): a body with `sessionTtlSeconds` or
        `dataRetentionDays` is 400 `invalid_input`, whatever their value. `erasureHandling` is
        how the organisation's "delete my data" requests are decided once the person is proven:
        `review` (default) by a reviewer; `automatic` erases the sessions proven to be the
        person's at once and leaves a reviewer only those found by e-mail address or name.
        `legalRetention` (`months` 1 to 600, with a `reasonEn` and a `reasonNl`, both
        required) is how long the law makes the organisation keep the data of every approved
        identity check, counted from the check's end; null removes it. A check that was
        rejected, expired, cancelled or never started is not held. It is the least any flow
        keeps that data: an approved check is purged at the later of its flow's retention and
        this, and neither a "delete my data" request nor the organisation's own purge
        (`DELETE /api/v1/proofing/sessions/{sessionID}`, 409 `legal_retention`) takes it before
        it has passed, so an `automatic` erasure leaves such a session too. A request that
        finds only held checks is declined with `LEGAL_RETENTION`. A change moves the purge
        time of the organisation's unpurged external checks, and the engine's retention of
        their sessions follows. `allowedRedirectOrigins` replaces the origins
        (`https://host[:port]`, or `http` on a loopback host; the host a DNS name or an IP
        address; at most 10) a hosted page may send its subject back to and be embedded on.
        Leaving out the origin of a flow's return page is 409 `redirect_origin_in_use`:
        change that flow's return page first.
        An absent field is left as it is; a body with none is 400 `invalid_body`, and a value
        outside these options 400 `invalid_input`. Every field is checked before any is saved,
        so a refused update changes nothing. The answer is the settings after the change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingUpdateSettings'
            examples:
              settings:
                summary: Automatic erasure, a legal retention, a return origin
                value:
                  erasureHandling: automatic
                  legalRetention:
                    months: 60
                    reasonEn: The Wwft requires us to keep proof of identity for five years.
                    reasonNl: De Wwft verplicht ons het identiteitsbewijs vijf jaar te bewaren.
                  allowedRedirectOrigins: [https://portal.acme.example]
      responses:
        '200':
          description: The settings after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '409':
          description: A flow's return page is on an origin the change leaves out (`redirect_origin_in_use`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/settings/branding:
    parameters:
