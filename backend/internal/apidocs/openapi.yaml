  /api/v1/proofing/flows:
    get:
      tags: [identity-proofing]
      summary: List your organisation's flows (public API)
      description: >-
        Authenticated with the organisation's API key as a Bearer token, with `flows:read`. Only the
        flows of the organisation the API key belongs to, never another organisation's: every
        flow of yours that a person can finish, with the organisation's default
        flow marked (`default`). A session may use any of them. `needsReferencePhoto: true`
        marks a flow whose face check runs without the chip read: every session on it must
        carry a `referencePhoto`. See my data and Delete my data are not listed: start one
        with `flowKind` on `POST /proofing/sessions`.
      security:
        - apiKey: []
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -X GET 'https://wallet.example.org/api/v1/proofing/flows' \
              -H "Authorization: Bearer YOUR_API_KEY"
        - lang: Go
          label: Go
          source: |
            package main

            import (
            	"fmt"
            	"io"
            	"log"
            	"net/http"
            )

            func main() {
            	req, err := http.NewRequest(http.MethodGet, "https://wallet.example.org/api/v1/proofing/flows", nil)
            	if err != nil {
            		log.Fatal(err)
            	}
            	// YOUR_API_KEY: your organisation's API key, from Identity proofing › Developers.
            	req.Header.Set("Authorization", "Bearer YOUR_API_KEY")
            	resp, err := http.DefaultClient.Do(req)
            	if err != nil {
            		log.Fatal(err)
            	}
            	defer resp.Body.Close()
            	body, err := io.ReadAll(resp.Body)
            	if err != nil {
            		log.Fatal(err)
            	}
            	// Any status of 400 or higher carries {"error", "code"}: act on code.
            	fmt.Println(resp.Status, string(body))
            }
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingApiFlowList'
              examples:
                flows:
                  summary: A default flow and a face-only flow
                  value:
                    - id: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                      name: Onboarding
                      version: 3
                      requiredAssuranceLevel: substantial
                      requestedAttributes: [dg1, dg2, selfie]
                      default: true
                      needsReferencePhoto: false
                      allowed: true
                      hostedEnabled: true
                      hostedReturnUrl: https://portal.example.org/done
                      diplomaMode: "off"
                      addressMode: required
                      employmentMode: "off"
                    - id: 9a2b4c6d-1e3f-4a5b-8c7d-0e1f2a3b4c5d
                      name: Bank account change
                      version: 1
                      requestedAttributes: [selfie]
                      default: false
                      needsReferencePhoto: true
                      allowed: false
                      hostedEnabled: false
                      diplomaMode: "off"
                      addressMode: "off"
                      employmentMode: "off"
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [identity-proofing]
      summary: Create a flow (public API)
      description: >-
        Authenticated with the organisation's API key as a Bearer token, with `flows:write`. Creates a flow as an admin does in the wallet,
        version 1, active at once, audited `identity_proofing.flow_created`. The body is the flow:
        its `name`, `steps`, `requiredChecks`, `requestedAttributes` and the rest of the spec.
        Make it the default with `PUT /proofing/flow-selection`, and set its hosted page and steps
        with the routes under `/proofing/flows/{flowID}`. Takes an `Idempotency-Key`. The flow
        takes only what the wallet's flow editor offers, and the choices that depend on each other
        the same way; anything else is 400 `invalid_input`:
        `steps` are `document_capture`, `nfc_read`, `document_photo` and `face_verification`, each
        once, stored in the order the app runs them; each item in `requestedAttributes` (`dg1`,
        `age_over`, `chip_checks`, `dg11`, `dg2`, `biometrics`, `selfie`, `document_image`, or
        `outcome_only` alone) needs a step that produces it; `ageOver` is 12, 16, 18, 21 or 65;
        `acceptedDocumentTypes` are `passport`, `identity_card`, `residence_permit`,
        `drivers_license` and `personal_data` (all four kinds alone is stored as any document);
        a `face.match` threshold is a whole hundredth; `retentionOverrideSeconds` is 0, or 1, 30 or
        90 days; `legalBasis`, `processingPurpose` and `assuranceTiers` are not set; a flow locked
        to `apps: [yivi]` must be one the Yivi app runs (no face check without `nfc_read`), and on
        `substantial` the Idem app is added to its `apps`; `faceProvider: idscan` always requires
        `face.liveness`. An edit may keep a
        value the version already has, as the editor does, and leaving out `legalBasis`,
        `processingPurpose` and `assuranceTiers` keeps the version's.
