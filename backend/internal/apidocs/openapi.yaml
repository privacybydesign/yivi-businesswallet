      responses:
        '200':
          description: The revoked key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingApiKey'
              examples:
                revoked:
                  summary: Revoked
                  value:
                    id: 5e4d3c2b-1a09-4f8e-8d7c-6b5a49382716
                    name: Production backend
                    prefix: yp_live_3kq7
                    scopes: [sessions:write, sessions:read, results:read, flows:read, flows:write, settings:read, settings:write, webhooks:write, reviews:read, reviews:write]
                    createdAt: "2026-09-01T10:05:00Z"
                    lastUsedAt: "2026-10-02T09:30:00Z"
                    revokedAt: "2026-10-02T10:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
