          type: string
        description: Organisation slug.
    post:
      tags: [msteams]
      summary: Post a test notification to the organisation Microsoft Teams webhook
      description: >-
        Requires an administrator role in the organisation. Answers 204 when the
        webhook accepted the card, 409 `not_configured` when the organisation has no
        stored webhook or has switched delivery off, and 502 `webhook_failed` with
        the status this side read when the post was not accepted. No part of the
        answer is repeated, not even the status line's reason phrase: the webhook URL
        is a secret, neither endpoint kind documents a closed set of refusals to
        allowlist, and an intermediary's error document can quote the URL back.
      responses:
        '204':
          description: The test notification was accepted by the webhook.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
