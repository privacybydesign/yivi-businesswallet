    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    get:
      tags: [attestation]
      summary: List inbound credential offers awaiting a decision
      description: >-
        Credential offers delivered to the organisation over QERDS that have not
        been accepted or declined yet. Receiving an offer does not add the
        credential to the wallet; accepting it does. The offer deeplink itself is
        not returned, since anyone holding it could redeem the credential.
        Requires membership of the organisation.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/orgs/{slug}/attestations/offers/{id}/accept:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource identifier.
    post:
      tags: [attestation]
      summary: Accept an inbound credential offer
      description: >-
        Redeems the offer through the organisation's holder wallet and indexes
        the received credential as held. Requires an administrator role. Returns
        404 when the offer is absent, already decided, or being accepted by
        another request: the offer is claimed before the issuer is called, so of
        several simultaneous accepts exactly one redeems. A redemption that fails
        returns the offer to the queue so it can be accepted again.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
