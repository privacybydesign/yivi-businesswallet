components:
  securitySchemes:
    customerApiKey:
      type: http
      scheme: bearer
      description: A proofing customer's API key (`yp_live_…`), for the public `/api/v1/proofing` routes.
    cookieAuth:
      type: apiKey
      in: cookie
      name: ybw_session
  schemas:
    OutboundPresentationRequest:
      type: object
      properties:
        id:
          type: string
        sender:
          type: string
        recipient:
          type: string
        status:
          type: string
          enum: [sent, completed, failed, expired]
        failureReason:
          type: string
        fetched:
          type: boolean
          description: Whether the recipient's wallet has fetched the Request Object.
        credentials:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              vct:
                type: string
              claims:
                type: array
                items:
                  type: string
        disclosed:
          type: array
          items:
            type: object
            properties:
              queryId:
                type: string
              vct:
                type: string
              issuer:
                type: string
              claims:
                type: object
                additionalProperties: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
    Error:
      type: object
      description: Error response body returned by respond.Error.
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Stable machine-readable error code.
      required: [error, code]
  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid session cookie was supplied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The session lacks the required role for this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The referenced resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: >-
        The customer spent its public API budget (code `rate_limited`): 120 calls a
        minute, and of those 10 session creations. `Retry-After` says in how many
        seconds to try again.
      headers:
        Retry-After:
          description: Seconds until the next call is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
security:
  - cookieAuth: []
