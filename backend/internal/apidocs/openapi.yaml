          $ref: '#/components/responses/NotFound'
  /api/v1/orgs/{slug}/identity-proofing/api-keys/{keyID}/secret:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: keyID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: API key id.
    get:
      tags: [identity-proofing-internal]
      summary: Show an API key again
      description: >-
        Requires an administrator role in the organisation. Answers an active key itself, as
        often as needed, each read audited `identity_proofing.api_key_revealed`; never cached
        (`Cache-Control: no-store`). A revoked key, or one that is not the organisation's, is
        404 `api_key_not_found`. A key made before keys were kept to be shown again has only
        its hash: 409 `api_key_not_revealable` (`revealable: false` in the list).
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                    description: The key, `yp_live_…`.
                required: [secret]
              example:
                secret: yp_live_EXAMPLE_NOT_A_REAL_KEY
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The key was made before keys were kept to be shown again (`api_key_not_revealable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/webhook:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    get:
      tags: [identity-proofing-internal]
      summary: Get the organisation's webhook endpoint
      description: >-
        Requires an administrator role in the organisation. The organisation has one endpoint,
        for the events of all its flows. `configured` is false for an organisation without one.
        The endpoint's `url`, subscribed `events`, the last four characters of its
        signing secret, its `health` (`delivering`, `failing` since `failingSince` with
        `pendingRetries`, or `not_configured`, and the `lastStatusCode`; only what the
        current `url` answered counts), the `availableEvents` and `maxAttempts`.
      responses:
        '200':
          description: The organisation's endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingWebhookEndpoint'
              examples:
                configured:
                  summary: An endpoint that delivers
                  value:
                    configured: true
                    url: https://portal.acme.example/hooks/yivi
                    events: [session.verified, session.failed, session.review_opened, session.expired]
                    secretLast4: x9Qa
                    health:
                      state: delivering
                      lastStatusCode: 200
                      pendingRetries: 0
                    availableEvents: [session.created, session.started, session.handover, session.verified, session.failed, session.review_opened, session.expired, session.cancelled, session.purged, session.diploma_added, session.address_added, session.address_reviewed, session.employment_added, session.step_reviewed]
                    maxAttempts: 8
                none:
                  summary: No endpoint
                  value:
                    configured: false
                    events: []
                    health:
                      state: not_configured
                      pendingRetries: 0
                    availableEvents: [session.created, session.started, session.handover, session.verified, session.failed, session.review_opened, session.expired, session.cancelled, session.purged, session.diploma_added, session.address_added, session.address_reviewed, session.employment_added, session.step_reviewed]
                    maxAttempts: 8
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
    put:
      tags: [identity-proofing-internal]
      summary: Set the organisation's webhook endpoint
      description: >-
        Requires an administrator role in the organisation. `url` (absolute https; it
        must resolve to a public address when an event is sent) and `events`, at least one
        of `session.created`, `session.started`, `session.handover`, `session.verified`, `session.failed`,
        `session.review_opened`, `session.expired`, `session.cancelled`, `session.purged`,
        `session.diploma_added`, `session.address_added`, `session.address_reviewed`,
        `session.employment_added` and `session.step_reviewed`. An
        endpoint is sent only the events it was saved with: save it again to add a new one. A
        new endpoint's answer carries its signing `secret` (`whsec_…`), the one time it is
        readable. Each event is a POST of `{id, type, createdAt, data}`; `data` holds
        `sessionId` (`ps_…`), `status`, `flowId`, `flowKind`, and when known `method`,
        `assuranceLevel`, `eidasLevel`, `errorCode` (such as `IDENTITY_MISMATCH`), `reviewReason`
        and `expectedSubject: true`; never the person's name or photo. Only what the person added
        after their identity check carries their data: `session.diploma_added` the diploma
        (`diploma`), `session.address_added` the address they entered (`address`, never the
        registered (BRP) one) and `session.employment_added` the statement (`employment`). `session.address_reviewed` carries the decision as `addressReview`, and
        `session.step_reviewed` another step's as `step`. `steps` lists the flow's extra steps,
        each with its own outcome. It is signed in the
        `Yivi-Signature` header as `t=<unix>,v1=<hex HMAC-SHA256 of "<t>.<body>">`, with
        `Yivi-Event` and `Yivi-Delivery`; for 24 hours after a secret rotation it carries a
        second `v1` under the previous secret. An organisation without an endpoint is sent no
        events, and neither are requests sent to members. A non-2xx answer is retried with
        exponential back-off, up to 8 attempts over about 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingSaveWebhook'
            examples:
              outcomes:
                summary: The outcomes only
                value:
                  url: https://portal.acme.example/hooks/yivi
                  events: [session.verified, session.failed, session.review_opened, session.expired]
      responses:
        '200':
          description: The endpoint; a new one carries its secret, once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingWebhookEndpoint'
              examples:
                created:
                  summary: A new endpoint
                  value:
                    configured: true
                    url: https://portal.acme.example/hooks/yivi
                    events: [session.verified, session.failed, session.review_opened, session.expired]
                    secretLast4: x9Qa
                    health:
                      state: delivering
                      lastStatusCode: 200
                      pendingRetries: 0
                    availableEvents: [session.created, session.started, session.handover, session.verified, session.failed, session.review_opened, session.expired, session.cancelled, session.purged, session.diploma_added, session.address_added, session.address_reviewed, session.employment_added, session.step_reviewed]
                    maxAttempts: 8
                    secret: whsec_4tY8mK2qN6vB1xC9zR3wP7sL5dF0gH8jA2eU6iO4x9Qa
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '409':
          description: The deployment has no identity proofing encryption key to seal the secret with.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [identity-proofing-internal]
      summary: Remove the organisation's webhook endpoint
      description: >-
        Requires an administrator role in the organisation. Deliveries still waiting for it are
        dropped. An organisation without one is 404 `webhook_not_found`.
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/orgs/{slug}/identity-proofing/webhook/rotate-secret:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    post:
      tags: [identity-proofing-internal]
      summary: Rotate the webhook signing secret
      description: >-
        Requires an administrator role in the organisation. The answer carries the new `secret`,
