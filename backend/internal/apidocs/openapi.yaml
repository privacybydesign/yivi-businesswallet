          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The organisation already has a customer with this name (`customer_exists`), or a pause is asked while one of the customer's sessions waits for review (`customer_has_open_reviews`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [identity-proofing]
      summary: Remove a customer
      description: >-
        Requires an administrator role in the organisation. Deletes the customer with every
        session sent for it, its API keys and webhook endpoint. Each session is purged first,
        in the engine too: its subject's address and name leave the audit trail, which stays.
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Sessions kept being sent for the customer while it was being removed (`customer_sessions_left`); the customer stays, try again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
