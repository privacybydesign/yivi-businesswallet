  /api/v1/orgs/{slug}/openid4vp/outbound:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    post:
      tags: [openid4vp]
      summary: Request credentials from another organisation over QERDS
      description: >-
        Certifies this organisation as OpenID4VP relying party for one request
        (a certificate naming the organisation and the sending QERDS address),
        signs an Authorization Request asking for the given credential types
        and claims, and sends the invocation to the recipient's QERDS address.
        The recipient's administrator approves or declines it; the answer
        arrives at the request's response endpoint. Requires an administrator
        role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient, credentials]
              properties:
                from:
                  type: string
                  description: One of this organisation's QERDS addresses; empty uses the default.
                recipient:
                  type: string
                  description: The other organisation's QERDS address.
                credentials:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [vct]
                    properties:
                      vct:
                        type: string
                      claims:
                        type: array
                        maxItems: 50
                        items:
                          type: string
      responses:
        '201':
          description: The request was signed and sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundPresentationRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The organisation has no default QERDS address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The QERDS message could not be sent; the request is marked failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [openid4vp]
      summary: List the organisation's outbound credential requests
      description: Newest first, at most 100. Requires an administrator role.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OutboundPresentationRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
