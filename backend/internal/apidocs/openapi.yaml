      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource identifier.
    get:
      tags: [openid4vp]
      summary: Get one outbound credential request and what was disclosed
      description: Requires an administrator role.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundPresentationRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/orgs/{slug}/openid4vp/templates:
    parameters:
      - name: slug
