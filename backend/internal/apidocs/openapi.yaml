            application/json:
              schema:
                $ref: '#/components/schemas/ProofingPause'
              examples:
                paused:
                  summary: Paused
                  value:
                    organizationId: 1b2c3d4e-5f60-4a7b-8c9d-0e1f2a3b4c5d
                    paused: true
                    orgPausedAt: "2026-10-02T08:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
