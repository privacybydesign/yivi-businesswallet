    patch:
      tags: [identity-proofing]
      summary: Rename, pause or resume a customer
      description: >-
        Requires an administrator role in the organisation. `name`, as on create, and/or
        `paused`: while a customer is paused (`status` `paused`), no request can be sent for it;
        requests already sent run out as usual. A customer with a session waiting for review
        cannot be paused until it is decided (409 `customer_has_open_reviews`). An absent field is left as it is; a body with
        none is 400 `invalid_body`. `sessionTtlSeconds` (120, 300 or 600) is how long each of
        the customer's sessions runs; `dataRetentionDays` (7, 30, 90, 180 or 365; default 30)
        how long an approved subject's name is kept. `allowedRedirectOrigins` replaces the
        origins (`https://host[:port]`, or `http` on a loopback host; at most 10) a hosted page
        may send its subject back to and be embedded on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingUpdateCustomer'
            examples:
              pause:
                summary: Pause the customer
                value:
                  paused: true
              settings:
                summary: Shorter sessions, longer retention, a return origin
                value:
                  sessionTtlSeconds: 300
                  dataRetentionDays: 90
                  allowedRedirectOrigins: [https://portal.acme.example]
      responses:
        '200':
          description: The customer after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingCustomer'
