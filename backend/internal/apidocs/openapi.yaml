  /api/v1/openid4vp/outbound/{id}/request-object:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource identifier.
    get:
      tags: [openid4vp]
      summary: Fetch the signed Request Object (request_uri)
      description: >-
        Fetched by the receiving business wallet when the QERDS invocation
        arrives. Unauthenticated; served once, while the request is open.
        Anything else — unknown, already fetched, answered or expired — is 404.
      security: []
      responses:
        '200':
          description: The Request Object as a compact JWS.
          content:
            application/oauth-authz-req+jwt:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/openid4vp/outbound/{id}/response:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource identifier.
    post:
      tags: [openid4vp]
      summary: Receive the Authorization Response (response_uri, direct_post)
      description: >-
        Unauthenticated; the request's state authenticates the post. A post
        with the wrong state is refused without changing the request. With the
        right state, the request completes only when every credential asked
        for is presented and verifies (issuer signature, key binding over the
        request's nonce and client_id, requested type); otherwise it is marked
        failed.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [vp_token, state]
              properties:
                vp_token:
                  type: string
                state:
                  type: string
      responses:
        '200':
          description: The answer was accepted. An empty object; there is no redirect_uri.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request was already answered or has expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
