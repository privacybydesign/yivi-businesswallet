  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/result:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the API and webhooks show.
    get:
      tags: [identity-proofing]
      summary: Read an external person's request's verified identity
      description: >-
        Requires an administrator role in the organisation, or the reviewer right, which reaches
        a request waiting for review and a data request only (any other is 404). A settled
        external request's result,
        read from the engine's session on each call, in the shape of the API's `GET
        /proofing/sessions/{id}/result`: `identity` for an approval and for a check waiting for
        review, `evidence`, and `diplomas` (the DUO extracts the subject added). For an approval,
        and for a check waiting for review, it also carries `photo` (the document's portrait),
        `selfie` (the live face matched against it), and `documentImage` and `documentImageBack`
        (photos of the document's front and back; no back for a passport), each `{mimeType,
        data}` with `data` base64, when the flow requested them; the API never does. A check
        waiting for review holds its face photos until it is decided, also on a flow that does
        not keep them after the match. Audited `identity_proofing.result_read`
        with the administrator as actor on every read. A member's request, one erased, or a
        hosted one never started is 404.
      responses:
        '200':
          description: The verified identity, with the images for an approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingAdminResult'
              examples:
                approved:
                  summary: Approved, with the chip photo and the selfie
                  value:
                    id: ps_q4r7tz2mxk3vbn6hw5jc2dfa7e
                    status: approved
                    method: idem_app
                    assuranceLevel: substantial
                    eidasLevel: substantial
                    verifiedAt: "2026-10-02T09:34:12Z"
                    identity:
                      givenName: Anna
                      familyName: Jansen
                      birthDate: "1991-03-14"
                      nationality: NLD
                    evidence:
                      - type: emrtd
                        documentType: P
                        issuingState: NLD
                        expiryDate: "2031-05-02"
                        passiveAuth: valid
                        activeAuth: valid
                        faceMatch: 0.97
                        liveness: passed
                    diplomas: []
                    photo:
                      mimeType: image/jpeg
                      data: /9j/4AAQSkZJRgABAQAAAQABAAD
                    selfie:
                      mimeType: image/jpeg
                      data: /9j/4AAQSkZJRgABAQAAAQABAAD
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request has no outcome (`result_not_ready`), which stays so for one that expired or was cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/review:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the API and webhooks show.
    post:
      tags: [identity-proofing]
      summary: Decide a request under review
      description: >-
        Requires an administrator role in the organisation, or the reviewer right (a request
        that waits for review; any other is 404 for a reviewer). `decision` is `approve` or `reject`,
        `reason` (required, at most 500 characters) says why, and a rejection may name what is
        wrong as `errorCode`: `REVIEW_NOT_HOLDER` (it is someone else's), `REVIEW_ALTERED` (it
        looks altered), `EVIDENCE_NOT_AS_REQUESTED` (it is not what was asked for) or
        `MANUAL_REVIEW_REJECTED` (something else, also when absent). The engine settles the
        session and the outcome lands as any other: an approval still has to meet the flow's
        assurance level, and the organisation's webhook is sent. Deciding drops the face photos a
        check held for its review, unless its flow keeps them. Audited
        `identity_proofing.review_decided` with the administrator as actor. The answer is the
        request. An `errorCode` with an approval, or any other code, is 400 `invalid_input`. An
        identity check the caller sent, or one about the caller, is 403 `own_review`: another
        reviewer decides it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingReviewDecision'
            examples:
              approve:
                summary: Approve
                value:
                  decision: approve
                  reason: Document checked by hand against the original
              reject:
                summary: Reject with a code
                value:
                  decision: reject
                  reason: The payslip is in another person's name
                  errorCode: REVIEW_NOT_HOLDER
      responses:
        '200':
          description: The request after the decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Not an administrator (`forbidden`), or an identity check the caller sent or is the
            subject of (`own_review`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The request is not under review (`not_under_review`), decided already or its session
            ended; or an approved erasure names a session still within the organisation's legal
            retention (`legal_retention`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/address:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the API and webhooks show.
    post:
      tags: [identity-proofing]
      summary: Enter the postal address on an on-screen request
      description: >-
        Requires organisation membership (an admin, or the member who sent it). Once, within an
        hour of the identity check finishing (approved, or in review) on a request that asks for the address. Every field is
        required, at most 200 characters, trimmed; a missing one is 400 `invalid_input`. An
        address with a Dutch postal code (`1234 AB`) is checked against the Dutch address
        register (the BAG): one it has is kept as the register writes its street, house number,
        postal code and city (`verification: verified`), one it lacks is 422
        `address_not_found`; while the register cannot be reached it is kept as entered
        (`unchecked`). Any other address is kept as entered (`unsupported`). On a Yivi app
        request whose disclosure carried the registered (BRP) address, the address is then
        compared with it instead: the same postal code and house number (with any letter or
        addition) is `registered`; another postal code or house number is
        `registered_mismatch`, carrying the registered address as `registered` for the reviewer.
        One that differs only in its letter or addition is kept as the register checked it
        (`verified` or `unchecked`). Only `registered` confirms where the person lives; every
        other address, `registered_mismatch` and `verified` included, waits for a reviewer
        (`addressReview: pending`, see `.../address/review`), and the session keeps its outcome.
        The address is kept sealed and shown with the request; audited
        `identity_proofing.address_added` with its `verification` but without the address (webhook
        `session.address_added`, which carries it without `registered`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingAddress'
            examples:
              address:
                summary: An address
                value:
                  street: Kerkstraat
                  houseNumber: 12a
                  postalCode: 6511 AB
                  city: Nijmegen
                  country: Nederland
      responses:
        '204':
          description: The address is kept.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request asks for no address (`address_not_asked`), it holds one already or the window is closed (`address_closed`), or the request was cancelled or erased (`session_over`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The address has a Dutch postal code but is not in the Dutch address register (`address_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/address/lookup:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the API and webhooks show.
      - name: postalCode
        in: query
        required: true
        schema:
          type: string
          maxLength: 200
        description: The postal code the subject typed; one that is not Dutch finds nothing.
      - name: houseNumber
        in: query
        required: true
        schema:
          type: string
          maxLength: 200
        description: The house number the subject typed; only the number it starts with is looked up.
    get:
      tags: [identity-proofing]
      summary: Look up a Dutch address on an on-screen request
      description: >-
        Requires organisation membership (an admin, or the member who sent it). While the
        request takes its address (as the POST), every address in the Dutch address register
        (the BAG, through PDOK) at `postalCode` and the number `houseNumber` starts with, with
        each letter and addition. The page fills in the street and city from it; the POST
        checks the address again.
      responses:
        '200':
          description: The addresses found; none for a postal code that is not Dutch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingAddressLookup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request takes no address now (`address_not_asked`, `address_closed`, `session_over`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The Dutch address register cannot be reached (`address_lookup_unavailable`); the address is entered in full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/address/review:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the API and webhooks show.
    post:
      tags: [identity-proofing]
      summary: Confirm or reject an address waiting for review
      description: >-
        Requires an administrator role in the organisation, or the reviewer right. An address
        the registered (BRP) address did not confirm (any `verification` but `registered`, so
        every Idem app address and a `registered_mismatch`) waits for a reviewer as
        `addressReview: pending`. `decision` is `confirm` or `reject`, with a required `reason`
        (at most 500 characters; 400 `invalid_input` otherwise). Only the address is decided: the
        session keeps its outcome. Audited `identity_proofing.address_reviewed` with the reason,
        sent as webhook `session.address_reviewed`. The answer is the request; to a reviewer who
        is not an administrator, without `proofedName`, `employment` and diplomas. To an administrator, an
        address that waits for no review, decided already or erased, is 409
        `address_not_under_review`; a reviewer who is not an administrator no longer reaches
        that request, so it is 404 `session_not_found`. One on a request the caller sent, or
        about the caller, is 403 `own_review`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision:
                  type: string
                  enum: [confirm, reject]
                reason:
                  type: string
                  maxLength: 500
            examples:
              confirm:
                summary: Confirm
                value:
                  decision: confirm
                  reason: Matches the rental contract
      responses:
        '200':
          description: The request after the decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Not an administrator or reviewer (`forbidden`), or a request the caller sent or is the
            subject of (`own_review`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The address waits for no review (`address_not_under_review`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/diplomas:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the API and webhooks show.
    post:
      tags: [identity-proofing]
      summary: Upload diploma extracts on an on-screen request
      description: >-
        Requires organisation membership (an admin, or the member who sent it). Multipart `file`
        parts, each a DUO diploma extract PDF of at most 5 MiB, at most 10 per session. Only
        within an hour of the identity check finishing (approved, or in review) on a request that asks for diplomas. Each file is
        checked: DUO's PAdES signature (unchanged, DUO's qualified e-seal, trusted timestamp,
        chain on the EU Trusted Lists), then the printed holder against the proofed name and
        date of birth. The answer is a verdict per file: `{fileName, accepted, diploma}` or
        `{fileName, accepted: false, reason, failedCheck}` with `reason` `not_a_diploma`,
        `signature_invalid`, `holder_mismatch` or `duplicate`. An accepted extract keeps what
        DUO printed about the qualification, never the PDF, the name or the date of birth;
        audited `identity_proofing.diploma_added` (webhook `session.diploma_added`), a refused
        one `identity_proofing.diploma_rejected`. More than 10 `file` parts is 400
        `too_many_files`, and more than a session can still hold is 400 `invalid_input`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProofingDiplomaUpload'
      responses:
        '200':
          description: A verdict per file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingDiplomaVerdictList'
              examples:
                verdicts:
                  summary: One accepted, one refused
                  value:
                    - fileName: diploma.pdf
                      accepted: true
                      diploma:
                        documentType: Diploma
                        qualification: HBO Bachelor Verpleegkunde
                        profiles: []
                        institution: Hogeschool van Amsterdam
                        placeOfIssue: Amsterdam
                        dateAwarded: "2019-07-05"
                        nlqfLevel: "6"
                        eqfLevel: "6"
                        documentNumber: "2019-0042137"
                        signedAt: "2026-10-02T09:36:40Z"
                        addedAt: "2026-10-02T09:37:02Z"
                    - fileName: cijferlijst.pdf
                      accepted: false
                      reason: not_a_diploma
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request asks for no diplomas (`diplomas_not_asked`), the upload window is closed (`diplomas_closed`), or the request was cancelled or erased (`session_over`).
        '413':
          description: An extract or the upload is too large (`too_large`).
        '503':
          description: The seal cannot be checked now (`seal_check_unavailable`), as the EU Trusted Lists or the revocation responder cannot be reached. Try again later; the file is not at fault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/employment:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the API and webhooks show.
    post:
      tags: [identity-proofing]
      summary: Upload the UWV Verzekeringsbericht on an on-screen request
      description: >-
        Requires organisation membership (an admin, or the member who sent it). One multipart
        `file` part, the Verzekeringsbericht PDF as downloaded from Mijn UWV, at most 5 MiB.
        Only within an hour of the identity check finishing (approved, or in review) on a request
        that asks for it, and kept once: the first accepted statement closes the step. The
        file is checked: UWV's seal (unchanged, a qualified e-seal certificate of UWV on the
        EU Trusted Lists, its revocation checked online), then the printed holder (initials,
        surname, alone or joined to a married name, and date of birth) against the proofed
        identity, then its date (at most 30 days old). The answer is `{fileName, accepted,
        employment}` or `{fileName, accepted: false, reason, failedCheck}` with `reason`
        `not_a_statement`, `signature_invalid`, `holder_mismatch` or `stale`; a refused file
        can be followed by another within the window. An accepted statement keeps the
        statement date and the relations current on it (reporting a month at most two
        months before the statement's): employer, payroll tax number, contract form, since
        when and the newest month, sealed. Never past relations, the PDF, the holder, the
        hours or the wages.
        Audited `identity_proofing.employment_added` (webhook `session.employment_added`), a
        refused one `identity_proofing.employment_rejected`. A kept statement with no current
        job (`employed: false`) moves the approved session to `needs_review` with
        `reviewReason` `no_current_employment`, one with a current UWV benefit beside a job
        with `current_benefit`, and one with other current income paid without hours worked
        beside a job with `current_other_income` (webhook `session.review_opened`), decided by an
        administrator through the review endpoint.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProofingEmploymentUpload'
      responses:
        '200':
          description: The verdict on the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingEmploymentVerdict'
              examples:
                accepted:
                  summary: Kept
                  value:
                    fileName: Verzekeringsbericht.pdf
                    accepted: true
                    employment:
                      statementDate: "2026-10-15"
                      employed: true
                      relations:
                        - kind: employment
                          employer: VOORBEELD B.V.
                          payrollTaxNumber: 123456789L01
                          contractForm: schriftelijke arbeidsovereenkomst voor onbepaalde tijd
                          from: "2025-01-01"
                          to: "2026-09-30"
                refused:
                  summary: Refused
                  value:
                    fileName: Verzekeringsbericht.pdf
                    accepted: false
                    reason: stale
        '400':
