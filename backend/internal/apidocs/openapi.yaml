          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the customer API and webhooks show.
    get:
      tags: [identity-proofing]
      summary: Read a customer request's verified identity
      description: >-
        Requires an administrator role in the organisation. A settled customer request's result,
        read from the engine's session on each call, in the shape of the customer API's `GET
        /proofing/sessions/{id}/result`: `identity` only for an approval, `evidence`, and
        `diplomas` (the DUO extracts the subject added). For an approval it also carries `photo`
        (the document's portrait), `selfie` (the live face matched against it), and
        `documentImage` and `documentImageBack` (photos of the document's front and back; no
        back for a passport), each `{mimeType, data}` with `data` base64, when the flow
        requested them; the customer API never does. Audited `identity_proofing.result_read`
        with the administrator as actor on every read. A member's request, one erased, or a
        hosted one never started is 404.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
