components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: One of the organisation's identity proofing API keys (`yp_live_…`), for the public `/api/v1/proofing` routes.
    cookieAuth:
      type: apiKey
      in: cookie
      name: ybw_session
  schemas:
    OutboundPresentationRequest:
      type: object
      properties:
        id:
          type: string
        sender:
          type: string
        recipient:
          type: string
        status:
          type: string
          enum: [sent, completed, failed, expired]
        failureReason:
          type: string
        fetched:
          type: boolean
          description: Whether the recipient's wallet has fetched the Request Object.
        credentials:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              vct:
                type: string
              claims:
                type: array
                items:
                  type: string
        disclosed:
          type: array
          items:
            type: object
            properties:
              queryId:
                type: string
              vct:
                type: string
              issuer:
                type: string
              claims:
                type: object
                additionalProperties: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
    ProofingApiFlow:
      type: object
      description: A flow of the organisation a subject can finish.
      properties:
        id:
          type: string
          description: The flow's id, stable across versions; `flowId` when creating a session.
        name:
          type: string
        version:
          type: integer
          description: The active version, which new sessions run.
        requiredAssuranceLevel:
          type: string
          enum: [low, substantial]
          description: The eIDAS level an approval must reach; absent for none.
        requestedAttributes:
          type: array
          items:
            type: string
          description: What the result may carry (`dg1` the document data with name and birth date, `dg2` the chip photo, `selfie`, `age_over` only whether the person is `ageOver` or older, …); empty is the outcome only.
        ageOver:
          type: integer
          description: The age `age_over` answers for; absent when the flow does not request it.
        default:
          type: boolean
          description: The organisation's default flow, the one a session without `flowId` runs.
        needsReferencePhoto:
          type: boolean
          description: The face is checked without reading the chip, against the `referencePhoto` every session on this flow must carry.
      required: [id, name, version, requestedAttributes, default, needsReferencePhoto]
    ProofingApiFlowList:
      type: array
      items:
        $ref: '#/components/schemas/ProofingApiFlow'
    ProofingApiCreateSession:
      type: object
      additionalProperties: false
      description: >-
        Who to verify and how. Without `hosted`, the session starts now and runs 10 minutes
        (or the organisation's session length); with `hosted: true` you get a link valid 72 hours,
        and the session starts when the person opens it.
      properties:
        email:
          type: string
          format: email
          description: The person's address; required unless `hosted` or `sendMail` is false.
        name:
          type: string
          maxLength: 200
          description: The person's name. Only a label, unless `birthDate` is given too.
        birthDate:
          type: string
          format: date
          example: "1990-04-12"
          description: >-
            With `name`, makes the session one for that person only: the name and birth date
            on the document must match, or the session is `rejected` with `IDENTITY_MISMATCH`.
            The flow must read the document data.
        referencePhoto:
          type: string
          format: byte
          description: >-
            Your own photo of the person's face, standard base64 of a PNG, JPEG or WebP of
            at most 512 KiB. Required on a flow with `needsReferencePhoto`, refused on any
            other. One that does not decode is refused (400) when its session is made: here,
            or for a hosted request when its subject starts. Deleted once the face check can
            no longer run.
        flowId:
          type: string
          description: Any flow of the organisation a subject can finish; absent runs the organisation's default flow.
        flowKind:
          type: string
          enum: [identity, data_access, data_erasure]
          description: >-
            `data_access` ("See my data") or `data_erasure` ("Delete my data") starts a data
            request on the organisation's own flow of that kind; absent or `identity` is an
            identity check on `flowId`.
        sendMail:
          type: boolean
          default: true
          description: False skips the mail; show the answer's `deepLink` as a QR code yourself.
        language:
          type: string
          enum: [en, nl]
          description: The mail's, the page's and the Idem app's language.
        hosted:
          type: boolean
          default: false
          description: Answer a `hostedUrl` to hand the person instead of starting the session now. Live keys only.
        redirectUrl:
          type: string
          format: uri
          description: >-
            With `hosted`, where the page sends the person once the session settles, with
            `?session=<id>&status=<status>` added. Its origin must be one of the organisation's
            allowed redirect origins. Absent takes the flow's return page, if it has one.
        redirect:
          type: boolean
          default: true
          description: >-
            With `hosted`, false ends the page on its own thank-you screen even when the flow
            has a return page. Not with a `redirectUrl` (400 `invalid_input`).
    ProofingApiSession:
      type: object
      description: A session as stored, with its outcome. Never document data beyond the proofed name.
      properties:
        id:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        status:
          type: string
          enum: [pending, in_progress, approved, rejected, needs_review, expired, cancelled]
        flowId:
          type: string
        flowName:
          type: string
        flowVersion:
          type: integer
        method:
          type: string
          enum: [idem_app, yivi_app, browser]
          description: The app the person used; absent while nobody opened the session.
        subjectEmail:
          type: string
        subjectName:
          type: string
        proofedName:
          type: string
          description: The name read off an approved document, until the organisation's data retention clears it.
        assuranceLevel:
          type: string
        eidasLevel:
          type: string
          enum: [low, substantial, high]
          description: >-
            The eIDAS level the checks reached, whether or not the flow requires one; a face
            step lifts it past low only with Regula. Absent when no level was reached.
        errorCode:
          type: string
          example: IDENTITY_MISMATCH
          description: >-
            Why a session was rejected. The wallet itself sets `IDENTITY_MISMATCH` (the
            document is not the expected person's), `ASSURANCE_NOT_MET` (the checks fell
            short of the flow's level), `REVIEW_LAPSED` (a review nobody decided in time),
            `LEGAL_RETENTION` (an erasure refused because the organisation must keep the data by law: its legal
            retention holds every identity check found) and
            `EMPLOYMENT_NOT_PROVIDED` (no Verzekeringsbericht kept in time on a flow that
            requires one); a reviewer
            `REVIEW_NOT_HOLDER`, `REVIEW_ALTERED`, `EVIDENCE_NOT_AS_REQUESTED` or
            `MANUAL_REVIEW_REJECTED`; others come from
            the session itself
            (`FACE_NO_MATCH`, `LIVENESS_FAILED`, `DOC_EXPIRED`, `DOC_TAMPERED`,
            `CHIP_CLONE_DETECTED`, `ASSURANCE_NOT_MET`, …).
        expiresAt:
          type: string
          format: date-time
          description: When the session, or an unstarted hosted link, ends.
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
        purgedAt:
          type: string
          format: date-time
          description: When its personal data was erased.
        expectedSubject:
          type: boolean
          description: Created for one known person (`name` with `birthDate`).
        flowKind:
          type: string
          enum: [identity, data_access, data_erasure]
          description: >-
            A data request (`data_access`, `data_erasure`) goes to the organisation's review
            (`needs_review`) once the person is proven; its approval erases the person's sessions
            (each sends `session.purged`) or opens their data at `GET .../data-export`.
        dataExportUntil:
          type: string
          format: date-time
          description: Until when an approved `data_access` session's data downloads.
        addressReview:
          type: string
          enum: [pending, confirmed, rejected]
          description: >-
            The review of an address the registered (BRP) address did not confirm: `pending`
            until a reviewer confirms or rejects it. Absent on a registered address and without
            an address.
      required: [id, status, flowId, flowName, subjectEmail, expiresAt, createdAt, expectedSubject]
    ProofingApiCreatedSession:
      allOf:
        - $ref: '#/components/schemas/ProofingApiSession'
        - type: object
          properties:
            deepLink:
              type: string
              description: The Idem app's `vcmrtd://` link, to show as a QR code; empty for a hosted or test session.
            mailSent:
              type: boolean
            hostedUrl:
              type: string
              format: uri
              description: A hosted session's link to hand the person.
          required: [deepLink, mailSent]
    ProofingApiSessionPage:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ProofingApiSession'
        nextCursor:
          type: string
          nullable: true
          description: Pass back as `cursor` for the next page; null on the last.
      required: [sessions, nextCursor]
    ProofingApiResult:
      type: object
      description: A settled session's verified identity and the evidence it rests on. Never the document number or an image.
      properties:
        id:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        status:
          type: string
          enum: [approved, rejected, needs_review, expired, cancelled]
        method:
          type: string
          enum: [idem_app, yivi_app, browser]
        assuranceLevel:
          type: string
        eidasLevel:
          type: string
          enum: [low, substantial, high]
        errorCode:
          type: string
          description: Why the session was rejected; see `ProofingApiSession.errorCode`.
        reviewReason:
          type: string
          enum: [no_current_employment, current_benefit, current_other_income]
          description: Why the session went to review after its identity was approved. `no_current_employment` is a Verzekeringsbericht that lists no current job, `current_benefit` one that lists a current UWV benefit beside a job, `current_other_income` one that lists other current income paid without hours worked beside a job; a reviewer decides it in the wallet. Absent otherwise.
        verifiedAt:
          type: string
          format: date-time
          description: When an approved session was verified.
        identity:
          type: object
          description: Only for an approved session.
          properties:
            givenName:
              type: string
            familyName:
              type: string
            birthDate:
              type: string
            nationality:
              type: string
            ageOver:
              type: object
              description: >-
                For a flow that requests `age_over`: whether the person is `age` or older on the
                day of the check, derived from the chip's date of birth, which is not released.
              properties:
                age:
                  type: integer
                over:
                  type: boolean
              required: [age, over]
        evidence:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [emrtd, yivi_disclosure, reference_photo, document_photo]
                description: >-
                  `reference_photo`: no document was read; the live face was matched
                  against the `referencePhoto` the session was created with.
                  `document_photo`: the document was photographed, its chip not read.
              documentType:
                type: string
              documentKind:
                type: string
                enum: [passport, identity_card, residence_permit]
                description: >-
                  What the document is, which `documentType` (the MRZ code) alone does not say.
                  Absent when the document does not tell.
              issuingState:
                type: string
              expiryDate:
                type: string
              passiveAuth:
                type: string
                enum: [valid, invalid, not_performed]
              activeAuth:
                type: string
                enum: [valid, invalid, not_performed]
              faceMatch:
                type: number
                description: The face match score, 0 to 1; absent when no face was matched.
              liveness:
                type: string
                enum: [passed, failed, not_performed]
            required: [type, passiveAuth, activeAuth]
        diplomas:
          type: array
          description: The DUO diploma extracts the person added, each checked against DUO's signature and the proofed identity.
          items:
            $ref: '#/components/schemas/ProofingDiploma'
        address:
          description: The address the person entered, without `registered`.
          allOf:
            - $ref: '#/components/schemas/ProofingAddress'
        employment:
          $ref: '#/components/schemas/ProofingEmployment'
        addressReview:
          type: string
          enum: [pending, confirmed, rejected]
          description: >-
            The review of an address the registered (BRP) address did not confirm: `pending`
            until a reviewer confirms or rejects it. Absent on a registered address and without
            an address.
      required: [id, status, evidence, diplomas]
    ProofingApiMethodStart:
      type: object
      properties:
        id:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        method:
          type: string
          enum: [idem_app, yivi_app]
        appLink:
          type: string
          description: The Idem app's link, for `idem_app`.
        walletLink:
          type: string
          description: The Yivi app's link, for `yivi_app`.
        expiresAt:
          type: string
          format: date-time
      required: [id, method, expiresAt]
    ProofingApiMethodStatus:
      type: object
      properties:
        id:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        method:
          type: string
          enum: [idem_app, yivi_app]
        status:
          type: string
          enum: [pending, in_progress, approved, rejected, needs_review, expired, cancelled]
        done:
          type: boolean
          description: True once the session has an outcome or ended.
      required: [id, method, status, done]
    ProofingWebhookEvent:
      type: object
      description: >-
        What the organisation's webhook endpoint receives: a POST signed in `Yivi-Signature`
        (`t=<unix>,v1=<hex HMAC-SHA256 of "<t>.<body>">` with the endpoint's `whsec_…`
        secret; for 24 hours after a rotation a second `v1` under the previous one), with `Yivi-Event` and `Yivi-Delivery` headers. Answer 2xx; anything else
        is tried up to 8 times in all over about 24 hours.
      properties:
        id:
          type: string
          format: uuid
          description: The delivery's id; the same on every retry.
        type:
          type: string
          enum: [session.created, session.started, session.handover, session.verified, session.failed, session.review_opened, session.expired, session.cancelled, session.purged, session.diploma_added, session.address_added, session.address_reviewed, session.employment_added, test]
        createdAt:
          type: string
          format: date-time
        data:
          type: object
          description: >-
            Never the person's name or photo. Only `session.address_added` carries a person's
            data, the address they entered. A `test` event's data is only `message`.
          properties:
            sessionId:
              type: string
              pattern: '^ps_[a-z2-7]{26}$'
            status:
              type: string
              enum: [pending, in_progress, approved, rejected, needs_review, expired, cancelled]
            flowId:
              type: string
            method:
              type: string
            assuranceLevel:
              type: string
            eidasLevel:
              type: string
            errorCode:
              type: string
              example: IDENTITY_MISMATCH
            expectedSubject:
              type: boolean
              description: Only present, as true, on a session created for one person.
            address:
              description: >-
                Only on `session.address_added`: the address the person entered, without
                `registered`.
              allOf:
                - $ref: '#/components/schemas/ProofingAddress'
            employment:
              $ref: '#/components/schemas/ProofingEmployment'
            addressReview:
              type: string
              enum: [confirmed, rejected]
              description: Only on `session.address_reviewed`, the reviewer's decision.
            diploma:
              type: object
              description: Only on `session.diploma_added`.
              properties:
                qualification:
                  type: string
                institution:
                  type: string
                dateAwarded:
                  type: string
                  format: date
                nlqfLevel:
                  type: string
                eqfLevel:
                  type: string
            message:
              type: string
              description: Only on `test`.
      required: [id, type, createdAt, data]
      example:
        id: 0b9d3c1e-7f2a-4e6b-9c8d-5a4f3e2d1c0b
        type: session.verified
        createdAt: "2026-10-02T09:34:13Z"
        data:
          sessionId: ps_q4r7tz2mxk3vbn6hw5jc2dfa7e
          status: approved
          flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
          method: idem_app
          assuranceLevel: substantial
          eidasLevel: substantial
    ProofingDiploma:
      type: object
      description: A DUO diploma extract the person added, as DUO printed it. Never the PDF, the name or the date of birth.
      properties:
        documentType:
          type: string
        qualification:
          type: string
        profiles:
          type: array
          items:
            type: string
        institution:
          type: string
        placeOfIssue:
          type: string
        dateAwarded:
          type: string
          format: date
        nlqfLevel:
          type: string
        eqfLevel:
          type: string
        documentNumber:
          type: string
        signedAt:
          type: string
          format: date-time
        addedAt:
          type: string
          format: date-time
      required: [documentType, qualification, profiles, institution, placeOfIssue, dateAwarded, documentNumber, addedAt]
    ProofingHostedDiploma:
      type: object
      description: >-
        A DUO diploma extract as the hosted page lists it: only what the subject needs to
        recognise it. The link's token alone opens the page, so the document number and the
        rest of `ProofingDiploma` are left out.
      properties:
        qualification:
          type: string
        institution:
          type: string
        dateAwarded:
          type: string
          format: date
        nlqfLevel:
          type: string
      required: [qualification, institution, dateAwarded]
    ProofingDiplomaVerdictList:
      type: array
      description: What became of each uploaded file, in upload order.
      items:
        type: object
        properties:
          fileName:
            type: string
          accepted:
            type: boolean
          diploma:
            $ref: '#/components/schemas/ProofingDiploma'
          reason:
            type: string
            enum: [not_a_diploma, signature_invalid, holder_mismatch, duplicate]
            description: Why a file was refused.
          failedCheck:
            type: string
            description: Which signature or holder check failed, for a refused file.
        required: [fileName, accepted]
    ProofingDiplomaUpload:
      type: object
      properties:
        file:
          type: array
          maxItems: 10
          description: The DUO diploma extract PDFs, each at most 5 MiB, sent as repeated `file` parts.
          items:
            type: string
            format: binary
      required: [file]
    ProofingFlowEmployment:
      type: object
      additionalProperties: false
      properties:
        employmentMode:
          type: string
          enum: ['off', required]
      required: [employmentMode]
    ProofingEmployment:
      type: object
      description: What was kept of a subject's UWV Verzekeringsbericht, checked against UWV's seal and the proofed identity. Only the relations current on the statement's date; never past ones, the PDF, the holder, the hours or the wages.
      properties:
        statementDate:
          type: string
          format: date
          description: The day UWV made the statement.
        employed:
          type: boolean
          description: A current relation that is not a benefit (a job with hours worked in one of the last two months, or sick pay through the employer). Without one the session goes to review (`reviewReason` `no_current_employment`).
        relations:
          type: array
          description: The employment and benefit relations current on the statement's date (reporting a month at most two months before its month, as payroll is filed a month late), one per employer and contract; empty when none is.
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [employment, benefit, other_income]
                description: '`benefit` is a benefit UWV pays, recognised as HDN''s Inkomensbepaling Loondienst does (Appendix 5) by its description and loonheffingennummer. Sick pay through the employer is that employer''s `employment`. `other_income` is a current payment without hours worked from any other payer: a pension, AOW, social assistance, or a final payment.'
              employer:
                type: string
                description: The employer or paying body (`Werkgever/Instantie`); `UWV` for a UWV benefit. Never a benefit's name, which can tell of sickness, disability or pregnancy.
              payrollTaxNumber:
                type: string
                description: Its `Loonheffingennummer`; empty for a UWV benefit.
              contractForm:
                type: string
                description: The printed `Contractvorm`; empty when the statement prints none.
              from:
                type: string
                format: date
                description: Since when, the first day of the relation's first month on the statement.
              to:
                type: string
                format: date
                description: The last day of the newest month the statement reports for it.
            required: [kind, employer, payrollTaxNumber, contractForm, from, to]
      required: [statementDate, employed, relations]
    ProofingEmploymentVerdict:
      type: object
      properties:
        fileName:
          type: string
        accepted:
          type: boolean
        employment:
          $ref: '#/components/schemas/ProofingEmployment'
        reason:
          type: string
          enum: [not_a_statement, signature_invalid, holder_mismatch, stale]
          description: Why the file was refused.
        failedCheck:
          type: string
          description: Which seal check failed, with `signature_invalid`.
      required: [fileName, accepted]
    ProofingEmploymentUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: The Verzekeringsbericht PDF as downloaded from Mijn UWV, at most 5 MiB.
      required: [file]
    ProofingFlowSpec:
      type: object
      description: A flow's configuration, as sent to create a flow or save a new version. Unknown fields are refused (400 `invalid_body`).
      properties:
        name:
          type: string
        steps:
          type: array
          minItems: 1
          items:
            type: string
            enum: [document_capture, nfc_read, document_photo, face_verification, selfie, liveness, face_match]
        requestedAttributes:
          type: array
          items:
            type: string
            enum: [dg1, dg11, dg2, selfie, chip_checks, biometrics, document_image, age_over]
          description: >-
            What a session's result may carry; absent or empty releases the outcome only (the
            assurance summary, no data). `age_over` releases only whether the person is `ageOver`
            or older, derived from the chip's date of birth; it needs `nfc_read`.
        ageOver:
          type: integer
          minimum: 1
          maximum: 120
          description: The age, in years, `age_over` answers for; set exactly when `requestedAttributes` has `age_over`.
        attributeReasons:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
              maxLength: 300
          description: >-
            Why each requested attribute is collected, by attribute and then language (`en`,
            `nl`): what the person reads before they start. Every attribute in `requestedAttributes`
            other than `outcome_only` needs a reason in each language the flow's hosted page
            offers (every supported one until its admin sets them), or the flow is refused (400
            `invalid_input`). A flow saved before reasons existed has none.
        selfieLocation:
          type: string
          description: Ignored; the wallet always sets the face capture to the app.
        faceProvider:
          type: string
          enum: [regula]
          description: What verifies the face step; absent is `regula`, the only one.
        acceptedDocumentTypes:
          type: array
          items:
            type: string
          description: >-
            Document codes accepted (the MRZ document code, such as `P`, or `drivers_license` for a Dutch
            driving licence) or kinds (`passport`, `identity_card`, `residence_permit`); empty accepts any.
            `eu_driving_licence`, the chip evidence's type, is refused (422 `rejected_by_provider`). Only Dutch
            driving licences are verified: the engine holds the RDW's licence CSCAs and no other state's.
        acceptedIssuingCountries:
          type: array
          items:
            type: string
            pattern: '^[A-Z]{3}$'
          description: >-
            3-letter ICAO 9303 codes (ISO 3166-1 alpha-3, or an ICAO-only code such as `EUE`
            or `UNO`); an unknown code is refused (422 `rejected_by_provider`). A German
            document's `D` counts as `DEU`. Empty accepts any country.
        requiredChecks:
          type: array
          items:
            type: string
        checkThresholds:
          type: object
          additionalProperties:
            type: number
          description: >-
            Only `face.match` takes one: the similarity from 0 to 1 the face match must reach,
            in place of the deployment's, at the Idem app's face step (the Yivi app runs no face
            check). Absent, the
            deployment's applies. A flow requiring `substantial` may not set it under 0.75 (422
            `rejected_by_provider` otherwise), and matches at 0.75 at least when it sets none,
            whatever the deployment's.
        requiredAssuranceLevel:
          type: string
          enum: [low, substantial]
        bsnPolicy:
          type: string
          enum: [retrieve, mask, omit]
          description: Absent is omit, the BSN dropped before storage.
        keepFacePhotos:
          type: boolean
          description: >-
            Keep the face photos (the document portrait, the selfie and the sender's
            reference photo) in the result and the stored evidence, for an organisation that must
            keep them. Absent is false: they are dropped once the face match is done, and its
            verdicts stay.
        blurBsn:
          type: boolean
          description: Cover the BSN region of a document photo. Absent is false.
        retentionOverrideSeconds:
          type: integer
          minimum: 1
          maximum: 31536000
          description: >-
            How long the flow's finished sessions keep their data, at most a year. Set, it
            applies in place of the organisation's data retention; absent, the organisation's
            fixed 7 days apply.
        sessionTtlSeconds:
          type: integer
          enum: [120, 300, 600]
          description: >-
            How long a session of this flow runs. Absent, the organisation's fixed 10 minutes
            apply. Any other value is 400 `invalid_input`.
        assuranceTiers:
          type: array
          items:
            type: object
            properties:
              level:
                type: string
              minPercent:
                type: number
            required: [level, minPercent]
        legalBasis:
          type: string
        processingPurpose:
          type: string
      required: [name, steps]
    ProofingFlow:
      description: >-
        A flow version as the organisation sees it. `allowed`, `default`, `diplomaMode`,
        `kind`, `hostedEnabled`, `hostedReturnUrl` and `retentionDays` are only meaningful in a
        flow list; a single version (create, edit, versions, activate) reads `allowed` and
        `default` false and leaves `diplomaMode`, `kind`, `hostedEnabled`, `hostedReturnUrl`
        and `retentionDays` out.
      allOf:
        - $ref: '#/components/schemas/ProofingFlowSpec'
        - type: object
          properties:
            id:
              type: string
              description: Stable across versions.
            version:
              type: integer
            active:
              type: boolean
              description: The version new requests run.
            createdAt:
              type: string
              format: date-time
            completable:
              type: boolean
              description: False for a flow a recipient cannot finish with only the Idem app; it cannot be made available to members.
            allowed:
              type: boolean
              description: An administrator made the flow available to members.
            default:
              type: boolean
              description: >-
                The organisation's one default flow: the one sent to an external person that
                names no flow, and the one the request form preselects. Independent of
                `allowed`.
            diplomaMode:
              type: string
              enum: ['off', required]
            addressMode:
              type: string
              enum: ['off', required]
            employmentMode:
              type: string
              enum: ['off', required]
            needsReferencePhoto:
              type: boolean
              description: The face is matched against a reference photo; only the API can send such a flow.
            kind:
              type: string
              enum: [identity, data_access, data_erasure]
              description: >-
                What the flow's sessions are for: an identity check, or a person asking for their
                data (`data_access`) or its erasure (`data_erasure`), which only the
                `data-request-flows` list holds; absent on a single version.
            hostedEnabled:
              type: boolean
              description: >-
                The flow's "Allow sending this flow as a link" switch (its hosted page's
                `enabled`): off, the wallet's Verify a person dialog offers only Show on this
                screen. Absent on a single version.
            hostedReturnUrl:
              type: string
              description: >-
                The flow's return page (its hosted page's `returnUrl`), where its links send the
                person once the session settles. Absent for none and on a single version.
            retentionDays:
              type: integer
              description: >-
                The most days an external person's data is kept on this flow: the flow's
                retention when it sets one, else the organisation's `dataRetentionDays`, plus
                the day the proofing engine keeps its copy longer, rounded up to whole days.
                What the on-screen page tells the person; absent on a single version.
          required: [id, version, active, createdAt, completable, allowed, default, needsReferencePhoto]
    ProofingFlowList:
      type: array
      items:
        $ref: '#/components/schemas/ProofingFlow'
    ProofingFlowSelection:
      type: object
      additionalProperties: false
      properties:
        flowIds:
          type: array
          items:
            type: string
          description: The flows members may use.
        defaultFlowId:
          type: string
          description: >-
            The organisation's default flow: any active identity flow an external person can
            be sent, whether or not it is in `flowIds`; empty for none.
      required: [flowIds]
    ProofingFlowHosted:
      type: object
      properties:
        enabled:
          type: boolean
          description: Hosted links may be made for the flow.
        locales:
          type: array
          description: The languages the page offers; empty is every one.
          items:
            type: string
            enum: [en, nl]
        completion:
          type: string
          enum: [redirect, done]
        returnUrl:
          type: string
          description: >-
            Where a link for the flow sends the person when it names no `redirectUrl` of its
            own; empty for none.
      required: [enabled, locales, completion, returnUrl]
    ProofingFlowHostedUpdate:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        locales:
          type: array
          description: Empty or absent is every language.
          items:
            type: string
            enum: [en, nl]
        completion:
          type: string
          enum: [redirect, done]
        returnUrl:
          type: string
          description: >-
            On one of the organisation's allowed redirect origins, and only with `completion:
            redirect`. Absent or empty removes the return page.
      required: [enabled, completion]
    ProofingDataMatches:
      type: object
      properties:
        flowKind:
          type: string
          enum: [identity, data_access, data_erasure]
        matches:
          type: array
          items:
            type: object
            properties:
              requestId:
                type: string
                format: uuid
              sessionId:
                type: string
                pattern: '^ps_[a-z2-7]{26}$'
              flowName:
                type: string
              status:
                type: string
              method:
                type: string
              assuranceLevel:
                type: string
              eidasLevel:
                type: string
              createdAt:
                type: string
                format: date-time
              completedAt:
                type: string
                format: date-time
              purgedAt:
                type: string
                format: date-time
              level:
                type: string
                enum: [strong, probable, email]
                description: >-
                  strong when proven with the same document, probable on name and date of birth
                  alone, email an unfinished session to the same address (no proofed identity).
              approved:
                type: boolean
                description: The reviewer's choice; absent until the decision.
              heldUntil:
                type: string
                format: date-time
                description: >-
                  When the organisation's legal retention lets an erasure take the session, an
                  approved identity check; absent when none applies or it passed, and on a
                  request that is not an erasure. An erasure approval naming a session before then is 409
                  `legal_retention`.
            required: [requestId, sessionId, flowName, status, createdAt, level]
      required: [flowKind, matches]
    ProofingDataExport:
      type: object
      description: >-
        An approved `data_access` session's data: each session the reviewer approved, with what
        the check read. Images are named in `imagesHeld`, never included.
      properties:
        sessionId:
          type: string
          description: The data request's own session.
        exportedAt:
          type: string
          format: date-time
        sessions:
          type: array
          items:
            type: object
            properties:
              sessionId:
                type: string
              flow:
                type: string
              status:
                type: string
              method:
                type: string
              assuranceLevel:
                type: string
              eidasLevel:
                type: string
              createdAt:
                type: string
                format: date-time
              completedAt:
                type: string
                format: date-time
              purgeAt:
                type: string
                format: date-time
              purgedAt:
                type: string
                format: date-time
              match:
                type: string
                enum: [strong, probable, email, name]
              contact:
                type: object
                properties:
                  name:
                    type: string
                  email:
                    type: string
              identity:
                type: object
                properties:
                  givenName:
                    type: string
                  familyName:
                    type: string
                  birthDate:
                    type: string
                  nationality:
                    type: string
                  evidence:
                    type: object
                  imagesHeld:
                    type: array
                    items:
                      type: string
                      enum: [documentPortrait, selfie, referencePhoto, documentFront, documentBack]
              diplomas:
                type: array
                items:
                  $ref: '#/components/schemas/ProofingDiploma'
              address:
                $ref: '#/components/schemas/ProofingAddress'
              employment:
                $ref: '#/components/schemas/ProofingEmployment'
      required: [sessionId, exportedAt, sessions]
    ProofingFlowAddress:
      type: object
      additionalProperties: false
      properties:
        addressMode:
          type: string
          enum: ['off', required]
      required: [addressMode]
    ProofingAddress:
      type: object
      description: The postal address a subject entered, as they declared it; not read off a document.
      properties:
        street:
          type: string
          maxLength: 200
        houseNumber:
          type: string
          maxLength: 200
        postalCode:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 200
        country:
          type: string
          maxLength: 200
        verification:
          type: string
          readOnly: true
          enum: [verified, unchecked, unsupported, registered, registered_mismatch]
          description: >-
            How the address was checked when it was kept: `verified` is in the Dutch address
            register and written as the register writes it, `unchecked` has a Dutch postal code
            but the register could not be reached, `unsupported` is outside the Netherlands.
            `registered` is the registered (BRP) address the subject's Yivi app disclosed,
            `registered_mismatch` differs from it. Only `registered` confirms where the person
            lives; the others are self-declared, `verified` too (the address exists, not that the
            person lives there). Absent on an address kept before addresses were checked; ignored
            in a request body.
        registered:
          readOnly: true
          description: >-
            The registered (BRP) address a `registered_mismatch` differs from, as the Yivi
            app disclosed it, for the reviewer. Never sent to the integrator: absent in the API
            result and webhooks. Ignored in a request body.
          allOf:
            - $ref: '#/components/schemas/ProofingAddress'
      required: [street, houseNumber, postalCode, city, country]
    ProofingAddressLookup:
      type: object
      properties:
        addresses:
          type: array
          items:
            type: object
            description: An address as the Dutch address register writes it.
            properties:
              street:
                type: string
              houseNumber:
                type: string
                description: With its letter and addition, as `12A` or `1-2`.
              postalCode:
                type: string
                description: Written `1015 CP`.
              city:
                type: string
            required: [street, houseNumber, postalCode, city]
      required: [addresses]
    ProofingFlowDiplomas:
      type: object
      additionalProperties: false
      properties:
        diplomaMode:
          type: string
          enum: ['off', required]
      required: [diplomaMode]
    ProofingRequest:
      type: object
      description: A proofing request as the organisation sees it.
      properties:
        id:
          type: string
          format: uuid
        requestedById:
          type: string
          format: uuid
          description: >-
            The member who sent it; absent for one sent through the API, and once that member's
            account is gone. A reviewer does not decide an identity check they sent.
        requestedByName:
          type: string
          description: The member who sent it, or the API key's name.
        apiKeyName:
          type: string
          description: The API key it was sent with.
        subjectUserId:
          type: string
          format: uuid
          description: The member being proofed, for a member's request.
        external:
          type: boolean
          description: The request went to an external person (no login), not to a member.
        subjectName:
          type: string
        subjectEmail:
          type: string
        proofedName:
          type: string
          description: The name read off an external person's approved document, until its retention clears it.
        flowId:
          type: string
        flowName:
          type: string
        flowVersion:
          type: integer
        method:
          type: string
          enum: [idem_app, yivi_app, browser]
        status:
          type: string
          enum: [pending, in_progress, approved, rejected, needs_review, expired, cancelled]
        assuranceLevel:
          type: string
        eidasLevel:
          type: string
          enum: [low, substantial, high]
        errorCode:
          type: string
          example: IDENTITY_MISMATCH
        linkExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        purgeAt:
          type: string
          format: date-time
          description: When its personal data is due to be erased.
        purgedAt:
          type: string
          format: date-time
        diplomaMode:
          type: string
          enum: ['off', required]
        diplomas:
          type: array
          items:
            $ref: '#/components/schemas/ProofingDiploma'
        diplomasUntil:
          type: string
          format: date-time
          description: When the person can last add a diploma extract; absent until the identity is approved.
        addressMode:
          type: string
          enum: ['off', required]
        address:
          $ref: '#/components/schemas/ProofingAddress'
        addressUntil:
          type: string
          format: date-time
          description: When the person can last enter their address; absent until the identity is approved, and once they did.
        addressReview:
          type: string
          readOnly: true
          enum: [pending, confirmed, rejected]
          description: >-
            The review of an address the registered (BRP) address did not confirm: `pending`
            until a reviewer confirms or rejects it. Absent on a registered address, without an
            address, and once a pending one was erased.
        employmentMode:
          type: string
          enum: ['off', required]
        employment:
          $ref: '#/components/schemas/ProofingEmployment'
        employmentUntil:
          type: string
          format: date-time
          description: When the person can last upload their Verzekeringsbericht; absent until the identity is approved, and once one was kept.
        reviewReason:
          type: string
          enum: [no_current_employment, current_benefit, current_other_income]
          description: Why the wallet put the session in review after the identity was approved (no current job, a current UWV benefit, or other current income paid without hours worked, on the Verzekeringsbericht). A reviewer's decision settles it in the wallet. Absent otherwise.
        expectedSubject:
          type: boolean
        flowKind:
          type: string
          enum: [identity, data_access, data_erasure]
          description: A data request (`data_access`, `data_erasure`) goes to review once the person is proven.
        dataExportUntil:
          type: string
          format: date-time
          description: Until when an approved `data_access` session's data downloads.
      required: [id, requestedByName, external, subjectName, subjectEmail, flowId, flowName, status, linkExpiresAt, createdAt, diplomaMode, diplomas, addressMode, expectedSubject]
    ProofingRequestList:
      type: array
      items:
        $ref: '#/components/schemas/ProofingRequest'
    ProofingCreateRequest:
      type: object
      additionalProperties: false
      description: >-
        A member (`userId`), or without `userId` an external person (`email` and an optional
        `name` and `birthDate`).
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 200
        flowId:
          type: string
          description: >-
            For a member, a flow members may use. For an external person, any flow a recipient
            can finish when the sender is an organisation admin, else a flow members may use;
            absent is the organisation's default flow.
        flowKind:
          type: string
          enum: [identity, data_access, data_erasure]
          description: >-
            `data_access` or `data_erasure` sends a data request on the organisation's own flow
            of that kind, from an administrator to an external person; absent or `identity` is
            an identity check on `flowId`.
        method:
          type: string
          enum: [idem_app, yivi_app]
          default: idem_app
        channel:
          type: string
          enum: [email, on_screen, hosted]
          default: email
        language:
          type: string
          enum: [en, nl]
        birthDate:
          type: string
          format: date
        redirect:
          type: boolean
          default: true
          description: >-
            With `channel: hosted`, false ends the link on its own thank-you screen though the
            flow has a return page (`hostedReturnUrl`).
    ProofingCreatedRequest:
      allOf:
        - $ref: '#/components/schemas/ProofingRequest'
        - type: object
          properties:
            mailSent:
              type: boolean
              description: False when the mail could not be sent; the request stands.
            deepLink:
              type: string
              description: An on-screen Idem request's `vcmrtd://` link, to show as a QR code.
            deepLinkExpiresAt:
              type: string
              format: date-time
            hostedUrl:
              type: string
              format: uri
              description: A hosted request's link, valid 72 hours.
          required: [mailSent]
    ProofingReviewDecision:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          maxLength: 500
        errorCode:
          type: string
          enum: [REVIEW_NOT_HOLDER, REVIEW_ALTERED, EVIDENCE_NOT_AS_REQUESTED, MANUAL_REVIEW_REJECTED]
          description: >-
            Only with `reject`: what the reviewer found wrong. It is someone else's, it looks
            altered, it is not what was asked for, or something else; absent is
            `MANUAL_REVIEW_REJECTED`.
        requestIds:
          type: array
          items:
            type: string
            format: uuid
          description: >-
            Only on a data request: the matched sessions an approval takes. Absent takes, for an
            erasure, the `strong` and `probable` ones (the same name and date of birth off a
            verified chip) and, for an access request, the `strong` ones; any other is taken
            only when listed. An erasure purges them, and one an automatic erasure purged
            already counts as taken. An access request opens their data for download.
      required: [decision, reason]
    ProofingClaimLink:
      type: object
      properties:
        deepLink:
          type: string
          description: The Idem app's `vcmrtd://` link, to show as a QR code.
        expiresAt:
          type: string
          format: date-time
      required: [deepLink, expiresAt]
    ProofingAppState:
      type: object
      properties:
        app:
          type: string
          enum: [waiting, connected, away]
      required: [app]
    ProofingYiviStart:
      type: object
      properties:
        walletLink:
          type: string
          description: The `openid4vp://` request the Yivi app opens.
        expiresAt:
          type: string
          format: date-time
      required: [walletLink, expiresAt]
    ProofingYiviDisclosure:
      type: object
      properties:
        done:
          type: boolean
          description: False while the person has not finished in the Yivi app.
        ok:
          type: boolean
          description: The disclosure approved the session; false rejected it.
        code:
          type: string
          enum: [document_not_accepted, age_not_disclosed]
      required: [done, ok]
    ProofingRequestEvents:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              occurredAt:
                type: string
                format: date-time
              action:
                type: string
                example: identity_proofing.request_sent
              targetType:
                type: string
              targetId:
                type: string
              metadata:
                type: object
              actor:
                type: object
                nullable: true
                properties:
                  userId:
                    type: string
                    format: uuid
                  preferredName:
                    type: string
                    nullable: true
                  givenNames:
                    type: string
                  lastName:
                    type: string
                  avatarUri:
                    type: string
              actorLabel:
                type: string
                nullable: true
                description: A non-user actor, such as `api_key:<prefix>`.
            required: [id, occurredAt, action, targetType, targetId, metadata, actor, actorLabel]
      required: [events]
    ProofingStats:
      type: object
      properties:
        since:
          type: string
          format: date-time
        rows:
          type: array
          items:
            type: object
            properties:
              flowId:
                type: string
              sessions:
                type: integer
              approved:
                type: integer
              rejected:
                type: integer
              needsReview:
                type: integer
              expired:
                type: integer
              cancelled:
                type: integer
                description: Cancelled before an outcome; not counted in `expired`.
            required: [flowId, sessions, approved, rejected, needsReview, expired, cancelled]
      required: [since, rows]
    ProofingImage:
      type: object
      properties:
        mimeType:
          type: string
        data:
          type: string
          format: byte
          description: The image, standard base64.
      required: [mimeType, data]
    ProofingAdminResult:
      description: The API's result plus, for an approval, the images the flow requested.
      allOf:
        - $ref: '#/components/schemas/ProofingApiResult'
        - type: object
          properties:
            photo:
              $ref: '#/components/schemas/ProofingImage'
            selfie:
              $ref: '#/components/schemas/ProofingImage'
            referencePhoto:
              $ref: '#/components/schemas/ProofingImage'
            documentImage:
              $ref: '#/components/schemas/ProofingImage'
            documentImageBack:
              $ref: '#/components/schemas/ProofingImage'
    ProofingPause:
      type: object
      properties:
        organizationId:
          type: string
          format: uuid
        paused:
          type: boolean
        platformPausedAt:
          type: string
          format: date-time
          description: Set while a platform administrator has it paused; only they lift it.
        platformPausedBy:
          $ref: '#/components/schemas/ProofingPausedBy'
      required: [organizationId, paused]
    ProofingPausedBy:
      type: object
      description: Who set a pause, while it holds; absent when unknown (set before this was kept, or the user was removed).
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
      required: [userId, name]
    ProofingPauseList:
      type: object
      properties:
        pauses:
          type: array
          items:
            $ref: '#/components/schemas/ProofingPause'
      required: [pauses]
    ProofingSetPause:
      type: object
      additionalProperties: false
      properties:
        paused:
          type: boolean
      required: [paused]
    ProofingWebhookHealth:
      type: object
      properties:
        state:
          type: string
          enum: [not_configured, delivering, failing]
        lastStatusCode:
          type: integer
        failingSince:
          type: string
          format: date-time
        pendingRetries:
          type: integer
      required: [state, pendingRetries]
    ProofingBranding:
      type: object
      properties:
        displayName:
          type: string
        primaryColor:
          type: string
          example: '#1f6feb'
        secondaryColor:
          type: string
          example: '#5412c7'
        textColor:
          type: string
        surfaceColor:
          type: string
        borderColor:
          type: string
        linkColor:
          type: string
        successColor:
          type: string
        warningColor:
          type: string
        errorColor:
          type: string
        topbarColor:
          type: string
        fontFamily:
          type: string
          description: A CSS font-family list; empty keeps the design's.
        supportContact:
          type: string
        privacyUrl:
          type: string
        logoUri:
          type: string
          description: Empty without a logo; carries a version so a replaced logo is fetched again.
        hidePoweredBy:
          type: boolean
      required: [displayName, primaryColor, secondaryColor, supportContact, privacyUrl, logoUri, hidePoweredBy]
    ProofingSettings:
      type: object
      description: What the organisation set once for all its flows.
      properties:
        sessionTtlSeconds:
          type: integer
          description: How long a session runs on a flow without a lifetime of its own, a fixed 600.
        dataRetentionDays:
          type: integer
          description: >-
            How long an external person's data is kept after the check on a flow without a
            retention of its own, a fixed 7.
        erasureHandling:
          type: string
          enum: [review, automatic]
          description: How the organisation's "delete my data" requests are decided once the person is proven.
        legalRetention:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ProofingLegalRetention'
          description: What the law makes the organisation keep; null for none.
        branding:
          $ref: '#/components/schemas/ProofingBranding'
        allowedRedirectOrigins:
          type: array
          description: Where a hosted page may send its subject back to and be embedded on.
          items:
            type: string
      required: [sessionTtlSeconds, dataRetentionDays, erasureHandling, legalRetention, branding, allowedRedirectOrigins]
    ProofingLegalRetention:
      type: object
      additionalProperties: false
      description: >-
        How long the organisation must keep the data of every approved identity check by law,
        counted from the check's end, and why.
      properties:
        months:
          type: integer
          minimum: 1
          maximum: 600
        reasonEn:
          type: string
          maxLength: 500
          description: >-
            Shown to a person whose "delete my data" request it declines, or leaves sessions of, in
            English.
        reasonNl:
          type: string
          maxLength: 500
          description: The same, in Dutch.
      required: [months, reasonEn, reasonNl]
    ProofingUpdateSettings:
      type: object
      additionalProperties: false
      description: At least one field; an absent one is left as it is.
      minProperties: 1
      properties:
        sessionTtlSeconds:
          type: integer
          deprecated: true
          description: Refused with 400 `invalid_input`; a flow sets its own (`sessionTtlSeconds`).
        dataRetentionDays:
          type: integer
          deprecated: true
          description: Refused with 400 `invalid_input`; a flow sets its own (`retentionOverrideSeconds`).
        erasureHandling:
          type: string
          enum: [review, automatic]
        legalRetention:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ProofingLegalRetention'
        allowedRedirectOrigins:
          type: array
          maxItems: 10
          items:
            type: string
    ProofingBrandingForm:
      type: object
      properties:
        displayName:
          type: string
        primaryColor:
          type: string
          description: '`#rrggbb`; empty is the organisation''s in the mail, and the design''s in a look of the organisation''s own.'
        secondaryColor:
          type: string
          description: '`#rrggbb`, the Idem app''s second colour; empty keeps the design''s in a look of the organisation''s own.'
        textColor:
          type: string
          description: '`#rrggbb`; empty keeps the design''s.'
        surfaceColor:
          type: string
          description: '`#rrggbb`; empty keeps the design''s.'
        borderColor:
          type: string
          description: '`#rrggbb`; empty keeps the design''s.'
        linkColor:
          type: string
          description: '`#rrggbb`; empty keeps the design''s.'
        successColor:
          type: string
          description: '`#rrggbb`; empty keeps the design''s.'
        warningColor:
          type: string
          description: '`#rrggbb`; empty keeps the design''s.'
        errorColor:
          type: string
          description: '`#rrggbb`; empty keeps the design''s.'
        topbarColor:
          type: string
          description: '`#rrggbb`; empty keeps the design''s.'
        fontFamily:
          type: string
          description: A CSS font-family list, as the organisation theme takes it; empty keeps the design's.
        supportContact:
          type: string
        privacyUrl:
          type: string
          description: An https URL.
        logo:
          type: string
          format: binary
          description: PNG, JPEG, GIF or WebP, at most 512 KiB.
        removeLogo:
          type: string
          enum: ['true']
        hidePoweredBy:
          type: string
          enum: ['true', 'false']
    ProofingFlowBranding:
      type: object
      properties:
        custom:
          type: boolean
          description: False is the organisation's branding, and the other fields are empty.
        displayName:
          type: string
        primaryColor:
          type: string
        supportContact:
          type: string
        privacyUrl:
          type: string
        logoUri:
          type: string
          description: The flow's own logo; empty without one.
      required: [custom, displayName, primaryColor, supportContact, privacyUrl, logoUri]
    ProofingFlowBrandingForm:
      type: object
      properties:
        custom:
          type: string
          enum: ['true', 'false']
        displayName:
          type: string
        primaryColor:
          type: string
          description: '`#rrggbb`; empty is the organisation''s.'
        supportContact:
          type: string
        privacyUrl:
          type: string
          description: An https URL.
        logo:
          type: string
          format: binary
          description: PNG, JPEG, GIF or WebP, at most 512 KiB.
        removeLogo:
          type: string
          enum: ['true']
      required: [custom]
    ProofingApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: The key's public start, to recognise it by.
        scopes:
          type: array
          items:
            type: string
            enum: [sessions:write, sessions:read, results:read, flows:read]
        createdByName:
          type: string
          description: Who created the key; absent once that user is gone.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
      required: [id, name, prefix, scopes, createdAt]
    ProofingApiKeyList:
      type: array
      items:
        $ref: '#/components/schemas/ProofingApiKey'
    ProofingCreateApiKey:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
      required: [name]
    ProofingCreatedApiKey:
      allOf:
        - $ref: '#/components/schemas/ProofingApiKey'
        - type: object
          properties:
            secret:
              type: string
              description: The key itself, the one time it is readable.
          required: [secret]
    ProofingWebhookEndpoint:
      type: object
      properties:
        configured:
          type: boolean
          description: False, with the rest empty, for an organisation without an endpoint.
        url:
          type: string
        events:
          type: array
          items:
            type: string
        secretLast4:
          type: string
        secret:
          type: string
          description: Only in the answer that created the endpoint or rotated its secret.
        health:
          $ref: '#/components/schemas/ProofingWebhookHealth'
        availableEvents:
          type: array
          items:
            type: string
        maxAttempts:
          type: integer
      required: [configured, events, health, availableEvents, maxAttempts]
    ProofingSaveWebhook:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum: [session.created, session.started, session.handover, session.verified, session.failed, session.review_opened, session.expired, session.cancelled, session.purged, session.diploma_added, session.address_added, session.address_reviewed, session.employment_added]
      required: [url, events]
    ProofingWebhookDeliveryList:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
          event:
            type: string
          sessionId:
            type: string
            example: ps_q4r7tz2mxk3vbn6hw5jc2dfa7e
            description: The session's `ps_` id, as the delivery's payload carries it; absent for a `test` event.
          endpointUrl:
            type: string
          status:
            type: string
            enum: [pending, delivered, failed]
          attempts:
            type: integer
          lastStatusCode:
            type: integer
          lastError:
            type: string
          lastAttemptAt:
            type: string
            format: date-time
          deliveredAt:
            type: string
            format: date-time
          createdAt:
            type: string
            format: date-time
        required: [id, event, status, attempts, createdAt]
    ProofingHostedProgress:
      type: object
      properties:
        status:
          type: string
          enum: [pending, in_progress, approved, rejected, needs_review, expired, cancelled]
        errorCode:
          type: string
        method:
          type: string
          enum: [idem_app, yivi_app]
        linkExpiresAt:
          type: string
          format: date-time
          description: The link's end until it is started, then the session's.
        started:
          type: boolean
        sessionTtlSeconds:
          type: integer
          description: >-
            The lifetime the started session was created with (the flow's own, else the
            organisation's, at the start), which the page names when the check ends unfinished.
            Absent before a start, and for a session started before the wallet kept it.
        completedAt:
          type: string
          format: date-time
        diplomasUntil:
          type: string
          format: date-time
        addressUntil:
          type: string
          format: date-time
          description: When the subject can last enter their address; absent while they cannot, and once they did.
        addressGiven:
          type: boolean
          description: The subject entered their address.
        employmentUntil:
          type: string
          format: date-time
          description: When the subject can last upload their Verzekeringsbericht; absent while they cannot, and once one was kept.
        employmentGiven:
          type: boolean
          description: A Verzekeringsbericht of the subject was kept.
        dataExportUntil:
          type: string
          format: date-time
          description: Until when an approved "see my data" session's data downloads through the link (`GET /api/v1/proof/{token}/data-export`), 24 hours from the approval.
        dataMatchesKept:
          type: integer
          description: On an approved erasure, how many of the person's matched sessions were kept, not deleted.
        legalRetention:
          type: object
          description: >-
            What the organisation's legal retention kept of a "delete my data" session's
            person: it declined the session (`errorCode` `LEGAL_RETENTION`), or an approved one
            left sessions it holds (they are among `dataMatchesKept`). How many sessions, the
            organisation's reason in each language, and the date from which all of them can be
            erased (and are, by the pruner). Absent otherwise, and once that date passed.
          properties:
            sessions:
              type: integer
              minimum: 1
              description: How many of the person's sessions the legal retention holds.
            until:
              type: string
              format: date-time
            reason:
              type: object
              properties:
                en:
                  type: string
                nl:
                  type: string
              required: [en, nl]
          required: [sessions, until, reason]
      required: [status, linkExpiresAt, started, addressGiven]
    ProofingHostedView:
      allOf:
        - $ref: '#/components/schemas/ProofingHostedProgress'
        - type: object
          properties:
            sessionId:
              type: string
              pattern: '^ps_[a-z2-7]{26}$'
            redirectUrl:
              type: string
            embedOrigins:
              type: array
              items:
                type: string
            language:
              type: string
              enum: [en, nl]
            locales:
              type: array
              items:
                type: string
                enum: [en, nl]
            organization:
              type: object
              properties:
                name:
                  type: string
                branding:
                  $ref: '#/components/schemas/ProofingBranding'
                dataRetentionDays:
                  type: integer
              required: [name, branding, dataRetentionDays]
            flow:
              type: object
              description: >-
                What the person is asked for. The flow's name and its assurance level are left
                out: the person's page shows neither.
              properties:
                requestedAttributes:
                  type: array
                  items:
                    type: string
                attributeReasons:
                  type: object
                  additionalProperties:
                    type: object
                    additionalProperties:
                      type: string
                  description: >-
                    Why each requested attribute is collected, by attribute and language. Empty
                    for a flow saved without reasons.
                yiviAvailable:
                  type: boolean
                  description: >-
                    Whether the Yivi app can run the flow: not when it photographs the document,
                    matches the face against a reference photo, checks an age the Yivi passport
                    and ID card carry no claim for (other than 12, 16, 18, 21 and 65), or requires
                    more than `low`, the level a Yivi session reaches.
                diplomaMode:
                  type: string
                  enum: ['off', required]
                addressMode:
                  type: string
                  enum: ['off', required]
                employmentMode:
                  type: string
                  enum: ['off', required]
                kind:
                  type: string
                  enum: [identity, data_access, data_erasure]
                retentionDays:
                  type: integer
                  description: >-
                    The most days the session's data is kept: the flow's retention when it set
                    one, else the organisation's `dataRetentionDays`, plus the day the proofing engine
                    keeps its copy longer, rounded up to whole days. What the page tells the subject.
              required: [requestedAttributes, attributeReasons, yiviAvailable, diplomaMode, addressMode, retentionDays]
            diplomas:
              type: array
              description: The extracts the subject added, as the page lists them.
              items:
                $ref: '#/components/schemas/ProofingHostedDiploma'
            theme:
              type: object
              description: >-
                The look the page takes, the one the Idem app shows the session in: the
                proofing look (the flow's own branding over the organisation's) when it has a
                colour or a font of its own, else the organisation's theme. Colours are `#rrggbb`,
                `fontFamily` a CSS font-family list; "" keeps the page's own. Absent when neither
                the organisation's proofing nor its theme set any.
              properties:
                primaryColor:
                  type: string
                secondaryColor:
                  type: string
                textColor:
                  type: string
                surfaceColor:
                  type: string
                borderColor:
                  type: string
                linkColor:
                  type: string
                successColor:
                  type: string
                warningColor:
                  type: string
                errorColor:
                  type: string
                headerColor:
                  type: string
                fontFamily:
                  type: string
          required: [sessionId, embedOrigins, locales, organization, flow, diplomas]
    ProofingHostedStart:
      type: object
      additionalProperties: false
      properties:
        method:
          type: string
          enum: [idem_app, yivi_app]
      required: [method]
    ProofingHostedStarted:
      allOf:
        - $ref: '#/components/schemas/ProofingHostedProgress'
        - type: object
          properties:
            deepLink:
              type: string
              description: An Idem session's `vcmrtd://` link.
    Error:
      type: object
      description: Error response body returned by respond.Error.
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Stable machine-readable error code.
      required: [error, code]
    IdemAppError:
      type: object
      description: An Idem app route's error body.
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: >-
            Stable machine-readable code, where the route sets one: device_unauthorized, device_handed_over,
            device_already_claimed, session_expired, session_complete, handover_invalid, handover_expired,
            handover_used, claim_token_required, flow_steps_required, steps_incomplete, not_app_session,
            document_unsupported, face_attempts_spent, FACE_PROVIDER_UNAVAILABLE.
      required: [error]
    IdemFlowStep:
      type: string
      enum: [document_capture, nfc_read, document_photo, face_verification, selfie, liveness, face_match]
    IdemSessionStatus:
      type: string
      enum: [created, opened, in_progress, needs_review, approved, rejected, expired, cancelled]
    IdemLifecycle:
      type: string
      enum: [ACTIVE, COMPLETE, EXPIRED, CANCELLED]
      description: COMPLETE means every step has a result and `status` holds the decided outcome.
    IdemDeviceRole:
      type: string
      enum: [web, native]
      description: The session slot; the Idem app is native, the browser web.
    IdemDevice:
      type: object
      description: One slot's device, never its token.
      properties:
        claimed:
          type: boolean
        state:
          type: string
          enum: [active, inactive]
        stale:
          type: boolean
          description: No request for DeviceStaleAfter, or its long-poll dropped; treat as inactive.
        claimedAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
      required: [claimed]
    IdemCallerDevice:
      allOf:
        - $ref: '#/components/schemas/IdemDevice'
        - type: object
          properties:
            authorized:
              type: boolean
            role:
              $ref: '#/components/schemas/IdemDeviceRole'
          required: [authorized]
    IdemChipAccessKey:
      type: object
      description: The MRZ-derived key to open the document's chip.
      properties:
        documentType:
          type: string
          enum: [passport, identity_card, residence_permit, drivers_license]
        documentNumber:
          type: string
        countryCode:
          type: string
        dateOfBirth:
          type: string
        dateOfExpiry:
          type: string
        version:
          type: string
        randomData:
          type: string
        configuration:
          type: string
      required: [documentType, documentNumber]
    IdemStepResult:
      type: object
      description: A step's verdicts as the app sees them, never its evidence.
      properties:
        step:
          type: string
        completed:
          type: boolean
        completedAt:
          type: string
          format: date-time
        summary:
          type: object
          additionalProperties: true
          description: >-
            document_capture: documentType, allChecksValid; face steps: livenessPassed and, after a match,
            faceVerified.
      required: [step, completed]
    IdemBranding:
      type: object
      description: >-
        The look of the organisation that requested the session, so the app looks like its own:
        resolved from the session itself. A person it sent the session to who is no member gets the
        organisation's proofing look when that has a colour or a font of its own (its colours, font and
        logo); otherwise the organisation's theme under the name its proofing mail signs with, with the
        proofing logo or else the theme's. A member gets the organisation's theme. Colours are
        `#rrggbb`; an absent one keeps the app's own. Absent altogether when neither set any.
      properties:
        name:
          type: string
          description: The name the organisation's proofing mail signs with, or the organisation's name.
        primaryColor:
          type: string
          description: 'Buttons, links and progress.'
        secondaryColor:
          type: string
          description: 'Labels and badges: the theme''s accent colour.'
        textColor:
          type: string
          description: 'Body text.'
        surfaceColor:
          type: string
          description: 'Screen background.'
        borderColor:
          type: string
          description: 'Borders and dividers.'
        linkColor:
          type: string
          description: 'Links.'
        successColor:
          type: string
          description: 'Completed and verified states.'
        warningColor:
          type: string
          description: 'Warnings.'
        errorColor:
          type: string
          description: 'Errors.'
        headerColor:
          type: string
          description: 'The dark top of the screens: the theme''s top bar colour.'
        fontFamily:
          type: string
          description: A CSS font-family list, as the organisation's theme stores it.
        hasLogo:
          type: boolean
          description: Whether `GET /api/v1/app/{token}/branding/logo` serves a logo.
      required: [name, hasLogo]
    IdemAppSession:
      type: object
      description: The session as the app sees it; the org by display name only.
      properties:
        id:
          type: string
        method:
          type: string
          enum: [face, nfc_passport]
        relyingParty:
          type: string
          description: The asking organisation's display name.
        branding:
          $ref: '#/components/schemas/IdemBranding'
        status:
          $ref: '#/components/schemas/IdemSessionStatus'
        language:
          type: string
          enum: [en, nl]
        requestedAttributes:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/IdemFlowStep'
        selfieLocation:
          type: string
          enum: [browser, native]
        expiresAt:
          type: string
          format: date-time
        aaChallenge:
          type: string
          description: The RND.IFD to send to the chip's INTERNAL AUTHENTICATE.
        requiredChecks:
          type: array
          nullable: true
          items:
            type: string
            enum: [mrz.parse, mrz.checkdigits, viz.ocr, viz.mrz.crossmatch, document.template, document.tamper,
              document.screen_replay, nfc.passive_auth, nfc.chip_auth, face.match, face.liveness, chip.viz.crossmatch]
        completedSteps:
          type: array
          items:
            type: string
        nativeHandoff:
          type: object
          description: Present while the Idem app still has work; the browser mints its QR with POST .../handover.
          properties:
            role:
              $ref: '#/components/schemas/IdemDeviceRole'
            claimed:
              type: boolean
          required: [role, claimed]
        changeKey:
          type: string
          description: The `since` for GET .../events; opaque.
        flowId:
          type: string
        flowVersion:
          type: integer
        currentStep:
          type: string
          description: The step to continue with, empty once complete; absent without a flow.
        chipAccess:
          $ref: '#/components/schemas/IdemChipAccessKey'
        faceVerification:
          type: object
          description: Present when the app runs the face step as a Regula liveness session.
          properties:
            provider:
              type: string
              enum: [regula]
            faceApiUrl:
              type: string
            tag:
              type: string
          required: [provider, faceApiUrl, tag]
        faceProvider:
          type: string
          enum: [regula, engine]
        stepResults:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/IdemStepResult'
        lifecycle:
          $ref: '#/components/schemas/IdemLifecycle'
        readyToSubmit:
          type: boolean
          description: Every step has a result and the session waits for POST .../submit.
        device:
          $ref: '#/components/schemas/IdemCallerDevice'
        devices:
          type: object
          description: Every slot's device, keyed web and native.
          properties:
            web:
              $ref: '#/components/schemas/IdemDevice'
            native:
              $ref: '#/components/schemas/IdemDevice'
          required: [web, native]
      required: [id, method, relyingParty, status, selfieLocation, expiresAt, requiredChecks, changeKey,
        stepResults, lifecycle, device, devices]
    IdemClaim:
      type: object
      properties:
        token:
          type: string
          description: Names the session in the app paths; it authorizes nothing.
        deviceToken:
          type: string
          description: The X-Device-Token from now on.
        role:
          $ref: '#/components/schemas/IdemDeviceRole'
        session:
          $ref: '#/components/schemas/IdemAppSession'
      required: [token, deviceToken, role, session]
    IdemHandoverRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/IdemDeviceRole'
      description: Role defaults to the caller's own slot.
    IdemHandover:
      type: object
      properties:
        handoverToken:
          type: string
        role:
          $ref: '#/components/schemas/IdemDeviceRole'
        expiresAt:
          type: string
          format: date-time
          description: Never after the session itself expires.
        qr:
          type: string
          description: What to render, the Idem app's deep link (vcmrtd://verify?handover=…&api=…).
        url:
          type: string
        deepLink:
          type: string
        slotClaimed:
          type: boolean
          description: A device already holds the slot, so redeeming this moves the session.
      required: [handoverToken, role, expiresAt, qr]
    IdemDeviceStateRequest:
      type: object
      properties:
        state:
          type: string
          enum: [active, inactive]
      required: [state]
    IdemDocument:
      type: object
      description: A document as the app read it.
      properties:
        type:
          type: string
          description: ICAO document code, e.g. P.
        number:
          type: string
        issuingState:
          type: string
        nationality:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        displayName:
          type: string
        sex:
          type: string
        dateOfBirth:
          type: string
          description: YYYY-MM-DD.
        dateOfExpiry:
          type: string
          description: YYYY-MM-DD.
        personalNumber:
          type: string
        placeOfBirth:
          type: string
        validity:
          type: object
          properties:
            documentNumberCheckDigitValid:
              type: boolean
            dateOfBirthCheckDigitValid:
              type: boolean
            dateOfExpiryCheckDigitValid:
              type: boolean
            compositeCheckDigitValid:
              type: boolean
            notExpired:
              type: boolean
    IdemDocumentCaptureRequest:
      type: object
      properties:
        document:
          allOf:
            - $ref: '#/components/schemas/IdemDocument'
          description: Required with at least `number`. A driving licence answers 422.
        chipAccess:
          $ref: '#/components/schemas/IdemChipAccessKey'
      required: [document]
    IdemImageRegion:
      type: object
      description: A box within the image, as fractions of its size; x+w and y+h at most 1.
      properties:
        x:
          type: number
        y:
          type: number
        w:
          type: number
        h:
          type: number
      required: [x, y, w, h]
    IdemDocumentPhotoSide:
      type: object
      properties:
        image:
          type: string
          description: Base64 image.
        mimeType:
          type: string
          description: Defaults to image/jpeg.
        bsnRegion:
          $ref: '#/components/schemas/IdemImageRegion'
      required: [image]
    IdemDocumentPhotoRequest:
      type: object
      properties:
        front:
          $ref: '#/components/schemas/IdemDocumentPhotoSide'
        back:
          $ref: '#/components/schemas/IdemDocumentPhotoSide'
      required: [front]
    IdemPhoto:
      type: object
      properties:
        imageBase64:
          type: string
        mimeType:
          type: string
          description: e.g. image/jpeg, image/jp2.
    IdemMrtdEvidence:
      type: object
      description: The chip as read; Passive Authentication hashes these bytes.
      properties:
        efSod:
          type: string
          description: EF.SOD, hex.
        dataGroups:
          type: object
          additionalProperties:
            type: string
          description: Raw data groups by name (DG1, DG2, …), hex.
        documentType:
          type: string
          description: Picks the Passive Authentication path; empty is ICAO. A driving licence answers 422.
        aaKeyDataGroup:
          type: string
          description: The data group with the Active Authentication key (DG15, or DG13 for a licence).
        nonce:
          type: string
          description: The challenge sent to the chip; required with aaKeyDataGroup.
        aaSignature:
          type: string
          description: The chip's signature over nonce; required with aaKeyDataGroup.
      required: [efSod, dataGroups]
    IdemNFCRequest:
      type: object
      properties:
        photo:
          allOf:
            - $ref: '#/components/schemas/IdemPhoto'
          description: >-
            The chip's DG2 portrait, byte for byte; required when the flow matches the face against the chip
            and no reference photo was sent with the session.
        document:
          allOf:
            - $ref: '#/components/schemas/IdemDocument'
          description: Accepted but ignored; the document is read from the evidence.
        mrtdEvidence:
          $ref: '#/components/schemas/IdemMrtdEvidence'
        device:
          type: object
          properties:
            appVersion:
              type: string
            devicePlatform:
              type: string
              description: e.g. android, ios.
      required: [mrtdEvidence]
    IdemSelfieRequest:
      type: object
      properties:
        livenessTransactionId:
          type: string
          description: The Regula liveness transaction the app ran.
      required: [livenessTransactionId]
    IdemStepResponse:
      type: object
      description: Every step route's answer, and the submit's.
      properties:
        status:
          $ref: '#/components/schemas/IdemSessionStatus'
        completedSteps:
          type: array
          items:
            type: string
        currentStep:
          type: string
          description: What comes next, empty once complete; absent without a flow.
        lifecycle:
          $ref: '#/components/schemas/IdemLifecycle'
        errorCode:
          type: string
          description: Why a decided session was rejected.
        readyToSubmit:
          type: boolean
        alreadyRecorded:
          type: boolean
          description: The step (or the submit) was already recorded, so nothing was stored.
      required: [status, completedSteps, lifecycle]
    IdemSelfieStepResponse:
      allOf:
        - $ref: '#/components/schemas/IdemStepResponse'
        - type: object
          properties:
            biometrics:
              type: object
              description: Absent when the step was already recorded.
              properties:
                faceMatchScore:
                  type: number
                faceVerified:
                  type: boolean
                livenessResult:
                  type: string
                  enum: [passed, failed]
                livenessScore:
                  type: number
                engine:
                  type: string
                threshold:
                  type: number
    IdemStepResultResponse:
      allOf:
        - $ref: '#/components/schemas/IdemStepResult'
        - $ref: '#/components/schemas/IdemStepResponse'
  parameters:
    IdemSessionToken:
      name: token
      in: path
      required: true
      schema:
        type: string
      description: The session token from the claim response; it names the session and authorizes nothing.
    IdemDeviceToken:
      name: X-Device-Token
      in: header
      required: true
      schema:
        type: string
      description: The device token the claim or handover returned.
    IdemAcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
      description: Picks the view's `language` when the session was sent without one.
    IdemStep:
      name: step
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdemFlowStep'
      description: A step of the session's flow; any face step name maps to the flow's own.
  responses:
    ApiUnauthorized:
      description: No API key was sent as a Bearer token (`unauthorized`), or it is unknown or revoked (`invalid_api_key`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ApiForbidden:
      description: The API key lacks the scope this call needs (`insufficient_scope`), or proofing is paused (`proofing_paused`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid session cookie was supplied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The session lacks the required role for this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProofingForbidden:
      description: >-
        The session lacks the required role for this resource, or identity proofing is
        paused for the organisation (`proofing_paused`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: >-
        The organisation spent its public API budget (code `rate_limited`, "too many
        requests for this organization"): 120 calls a minute, and of those 10 session
        creations. A client address presenting unknown or revoked keys gets this too past 60 a
        minute, instead of 401 (an IPv6 address counts with its /64). `Retry-After` says in how
        many seconds to try again.
      headers:
        Retry-After:
          description: Seconds until the next call is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    HostedTooManyRequests:
      description: >-
        A hosted link's budget is spent (code `rate_limited`): 600 calls a minute per client
        address (an IPv6 address counts with its /64), 3000 a minute across all of the
        organisation's links still in use, and 60 a minute for a link that is not (its session
        over and nothing left to download or upload). `Retry-After` says in how many seconds
        to try again.
      headers:
        Retry-After:
          description: Seconds until the next call is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The referenced resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IdemBadRequest:
      description: The body, step or role is invalid (plain `error`, no code).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemAppError'
    IdemDeviceUnauthorized:
      description: '`device_unauthorized`: X-Device-Token is missing or holds no slot of this session.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemAppError'
    IdemDeviceHandedOver:
      description: '`device_handed_over`: the slot moved to another device.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemAppError'
    IdemSessionNotFound:
      description: No session has this token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemAppError'
    IdemConflict:
      description: >-
        The session cannot take this request now: `session_complete`, `not_app_session` (a Yivi session), or
        without a code (no flow, or a state change that lost a race).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemAppError'
    IdemSessionExpired:
      description: '`session_expired`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemAppError'
    IdemDocumentUnsupported:
      description: '`document_unsupported`: EU driving licences are not supported yet.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemAppError'
    IdemTooManyRequests:
      description: Too many claims or waiting clients for this session; retry after Retry-After.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemAppError'
    IdemInternalError:
      description: A store or flow lookup failed; the detail is logged, not returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemAppError'
    IdemStepRecorded:
      description: The step is stored, or was already (`alreadyRecorded`, nothing stored).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemStepResponse'
security:
  - cookieAuth: []
