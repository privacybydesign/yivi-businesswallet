  /api/v1/proof/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: Opaque hosted-link token from the `hostedUrl` of a hosted proofing session.
    get:
      tags: [identity-proofing]
      summary: Open a hosted proofing link
      security: []
      description: >-
        The hosted page, unauthenticated: the token is the whole authorization, and every route
        is rate-limited per link. `customer` (its `name`, `branding`, whose `logoUri` is this
        link's logo route, and `dataRetentionDays`), `flow` (its `name`, `requestedAttributes`,
        `requiredAssuranceLevel`, `yiviAvailable`, `diplomaMode` and `retentionDays`, the most
        days the session's data is kept), the extracts added so far
        (`diplomas`), and the progress: `status`, `errorCode`, `method`, `started`,
        `completedAt`, `diplomasUntil` and `linkExpiresAt` (the link's end until started, then
        the session's). `sessionId` is the customer's id for the session; `redirectUrl` (absent
        for the page's own done screen) where the page sends the subject once settled;
        `embedOrigins` the customer's allowed redirect origins, the only ones the page posts its
        `proofing.completed` message to; `language` (`en` or `nl`, absent for the browser's) the
        page's language, and `locales` the languages the flow's page offers (empty is every
        one). No identity data; `diplomas` lists each extract the person added by
        `qualification`, `institution`, `dateAwarded` and `nlqfLevel` only, never its document
        number, since whoever holds the link can read it. A flow no longer in the organisation is 422 `flow_not_found`.
      responses:
        '200':
          description: What the page shows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingHostedView'
              examples:
                unstarted:
                  summary: Not started yet
                  value:
                    status: pending
                    linkExpiresAt: "2026-10-05T09:30:00Z"
                    started: false
                    sessionId: ps_b7k2mq4xz6rt3vnw5hc2jd7fae
                    redirectUrl: https://portal.acme.example/reset/return
                    embedOrigins: [https://portal.acme.example]
                    language: nl
                    locales: []
                    customer:
                      name: Acme Verzekeringen
                      branding:
                        displayName: Acme Verzekeringen
                        primaryColor: "#1f6feb"
                        supportContact: support@acme.example
                        privacyUrl: https://acme.example/privacy
                        logoUri: /api/v1/proof/BwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyAhIiMkJSY/logo?v=1759397400
                        hidePoweredBy: false
                      dataRetentionDays: 30
                    flow:
                      name: Onboarding
                      requiredAssuranceLevel: substantial
                      requestedAttributes: [dg1, dg2, selfie]
                      yiviAvailable: true
                      diplomaMode: "off"
                      retentionDays: 31
                    diplomas: []
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The flow is not one of the organisation's (`flow_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/HostedTooManyRequests'
