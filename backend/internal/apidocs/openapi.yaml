  /api/v1/register/session:
    post:
      tags: [wallet]
      summary: Start an organisation registration session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON request payload; see the endpoint description.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/wallet:
    post:
      tags: [wallet]
      summary: Open the wallet for the authenticated user
      description: Requires an authenticated session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON request payload; see the endpoint description.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    customerApiKey:
      type: http
      scheme: bearer
      description: A proofing customer's API key (`yp_live_…`), for the public `/api/v1/proofing` routes.
    cookieAuth:
      type: apiKey
      in: cookie
      name: ybw_session
  schemas:
    OutboundPresentationRequest:
      type: object
      properties:
        id:
          type: string
        sender:
          type: string
        recipient:
          type: string
        status:
          type: string
          enum: [sent, completed, failed, expired]
        failureReason:
          type: string
        fetched:
          type: boolean
          description: Whether the recipient's wallet has fetched the Request Object.
        credentials:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              vct:
                type: string
              claims:
                type: array
                items:
                  type: string
        disclosed:
          type: array
          items:
            type: object
            properties:
              queryId:
                type: string
              vct:
                type: string
              issuer:
                type: string
              claims:
                type: object
                additionalProperties: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
    Error:
      type: object
      description: Error response body returned by respond.Error.
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Stable machine-readable error code.
      required: [error, code]
    ProofingApiFlow:
      type: object
      description: A flow assigned to the customer.
      properties:
        id:
          type: string
          description: The flow's id, stable across versions; `flowId` when creating a session.
        name:
          type: string
        version:
          type: integer
          description: The active version, which new sessions run.
        requiredAssuranceLevel:
          type: string
          enum: [low, substantial]
          description: The eIDAS level an approval must reach; absent for none.
        requestedAttributes:
          type: array
          items:
            type: string
          description: What the result may carry (`dg1` the document data with name and birth date, `dg2` the chip photo, `selfie`, …); empty is the outcome only.
        default:
          type: boolean
          description: The flow a session without `flowId` runs.
        needsReferencePhoto:
          type: boolean
          description: The face is checked without reading the chip, against the `referencePhoto` every session on this flow must carry.
      required: [id, name, version, requestedAttributes, default, needsReferencePhoto]
    ProofingApiFlowList:
      type: array
      items:
        $ref: '#/components/schemas/ProofingApiFlow'
    ProofingApiCreateSession:
      type: object
      additionalProperties: false
      description: >-
        Who to verify and how. Without `hosted`, the session starts now and runs 10 minutes
        (or the customer's session length); with `hosted: true` you get a link valid 72 hours,
        and the session starts when the person opens it.
      properties:
        email:
          type: string
          format: email
          description: The person's address; required unless `hosted` or `sendMail` is false.
        name:
          type: string
          maxLength: 200
          description: The person's name. Only a label, unless `birthDate` is given too.
        birthDate:
          type: string
          format: date
          example: "1990-04-12"
          description: >-
            With `name`, makes the session one for that person only: the name and birth date
            on the document must match, or the session is `rejected` with `IDENTITY_MISMATCH`.
            The flow must read the document data.
        referencePhoto:
          type: string
          format: byte
          description: >-
            Your own photo of the person's face, standard base64 of a PNG, JPEG or WebP of
            at most 512 KiB. Required on a flow with `needsReferencePhoto`, refused on any
            other. Deleted once the face check can no longer run.
        flowId:
          type: string
          description: One of the customer's flows; absent runs its default flow.
        sendMail:
          type: boolean
          default: true
          description: False skips the mail; show the answer's `deepLink` as a QR code yourself.
        language:
          type: string
          enum: [en, nl]
          description: The mail's, the page's and the Idem app's language.
        hosted:
          type: boolean
          default: false
          description: Answer a `hostedUrl` to hand the person instead of starting the session now. Live keys only.
        redirectUrl:
          type: string
          format: uri
          description: >-
            With `hosted`, where the page sends the person once the session settles, with
            `?session=<id>&status=<status>` added. Its origin must be one of the customer's
            allowed redirect origins.
    ProofingApiSession:
      type: object
      description: A session as stored, with its outcome. Never document data beyond the proofed name.
      properties:
        id:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        status:
          type: string
          enum: [pending, in_progress, approved, rejected, needs_review, expired, cancelled]
        flowId:
          type: string
        flowName:
          type: string
        flowVersion:
          type: integer
        method:
          type: string
          enum: [idem_app, yivi_app, browser]
          description: The app the person used; absent while nobody opened the session.
        subjectEmail:
          type: string
        subjectName:
          type: string
        proofedName:
          type: string
          description: The name read off an approved document, until the customer's data retention clears it.
        assuranceLevel:
          type: string
        eidasLevel:
          type: string
          enum: [low, substantial, high]
          description: >-
            The eIDAS level the checks reached, whether or not the flow requires one; a face
            step lifts it past low only with Regula. Absent when no level was reached.
        errorCode:
          type: string
          example: IDENTITY_MISMATCH
          description: >-
            Why a session was rejected. The wallet itself sets `IDENTITY_MISMATCH` (the
            document is not the expected person's), `ASSURANCE_NOT_MET` (the checks fell
            short of the flow's level) and `REVIEW_LAPSED` (a data request nobody reviewed
            within 30 days); others come from the session itself
            (`FACE_NO_MATCH`, `LIVENESS_FAILED`, `DOC_EXPIRED`, `DOC_TAMPERED`,
            `CHIP_CLONE_DETECTED`, `ASSURANCE_NOT_MET`, …).
        expiresAt:
          type: string
          format: date-time
          description: When the session, or an unstarted hosted link, ends.
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
        purgedAt:
          type: string
          format: date-time
          description: When its personal data was erased.
        expectedSubject:
          type: boolean
          description: Created for one known person (`name` with `birthDate`).
        flowKind:
          type: string
          enum: [identity, data_access, data_erasure]
          description: >-
            A data request (`data_access`, `data_erasure`) goes to the organisation's review
            (`needs_review`) once the person is proven; its approval erases the person's sessions
            (each sends `session.purged`) or opens their data at `GET .../data-export`.
        dataExportUntil:
          type: string
          format: date-time
          description: Until when an approved `data_access` session's data downloads.
      required: [id, status, flowId, flowName, subjectEmail, expiresAt, createdAt, expectedSubject]
    ProofingApiCreatedSession:
      allOf:
        - $ref: '#/components/schemas/ProofingApiSession'
        - type: object
          properties:
            deepLink:
              type: string
              description: The Idem app's `vcmrtd://` link, to show as a QR code; empty for a hosted or test session.
            mailSent:
              type: boolean
            hostedUrl:
              type: string
              format: uri
              description: A hosted session's link to hand the person.
          required: [deepLink, mailSent]
    ProofingApiSessionPage:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ProofingApiSession'
        nextCursor:
          type: string
          nullable: true
          description: Pass back as `cursor` for the next page; null on the last.
      required: [sessions, nextCursor]
    ProofingApiResult:
      type: object
      description: A settled session's verified identity and the evidence it rests on. Never the document number or an image.
      properties:
        id:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        status:
          type: string
          enum: [approved, rejected, needs_review, expired, cancelled]
        method:
          type: string
          enum: [idem_app, yivi_app, browser]
        assuranceLevel:
          type: string
        eidasLevel:
          type: string
          enum: [low, substantial, high]
        errorCode:
          type: string
          description: Why the session was rejected; see `ProofingApiSession.errorCode`.
        verifiedAt:
          type: string
          format: date-time
          description: When an approved session was verified.
        identity:
          type: object
          description: Only for an approved session.
          properties:
            givenName:
              type: string
            familyName:
              type: string
            birthDate:
              type: string
            nationality:
              type: string
        evidence:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [emrtd, yivi_disclosure, reference_photo, document_photo]
                description: >-
                  `reference_photo`: no document was read; the live face was matched
                  against the `referencePhoto` the session was created with.
                  `document_photo`: the document was photographed, its chip not read.
              documentType:
                type: string
              issuingState:
                type: string
              expiryDate:
                type: string
              passiveAuth:
                type: string
                enum: [valid, invalid, not_performed]
              activeAuth:
                type: string
                enum: [valid, invalid, not_performed]
              faceMatch:
                type: number
                description: The face match score, 0 to 1; absent when no face was matched.
              liveness:
                type: string
                enum: [passed, failed, not_performed]
            required: [type, passiveAuth, activeAuth]
        diplomas:
          type: array
          description: The DUO diploma extracts the person added, each checked against DUO's signature and the proofed identity.
          items:
            $ref: '#/components/schemas/ProofingDiploma'
      required: [id, status, evidence, diplomas]
    ProofingApiMethodStart:
      type: object
      properties:
        id:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        method:
          type: string
          enum: [idem_app, yivi_app]
        appLink:
          type: string
          description: The Idem app's link, for `idem_app`.
        walletLink:
          type: string
          description: The Yivi app's link, for `yivi_app`.
        expiresAt:
          type: string
          format: date-time
      required: [id, method, expiresAt]
    ProofingApiMethodStatus:
      type: object
      properties:
        id:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        method:
          type: string
          enum: [idem_app, yivi_app]
        status:
          type: string
          enum: [pending, in_progress, approved, rejected, needs_review, expired, cancelled]
        done:
          type: boolean
          description: True once the session has an outcome or ended.
      required: [id, method, status, done]
    ProofingWebhookEvent:
      type: object
      description: >-
        What a customer's webhook endpoint receives: a POST signed in `Yivi-Signature`
        (`t=<unix>,v1=<hex HMAC-SHA256 of "<t>.<body>">` with the endpoint's `whsec_…`
        secret; for 24 hours after a rotation a second `v1` under the previous one), with `Yivi-Event` and `Yivi-Delivery` headers. Answer 2xx; anything else
        is tried up to 8 times in all over about 24 hours.
      properties:
        id:
          type: string
          format: uuid
          description: The delivery's id; the same on every retry.
        type:
          type: string
          enum: [session.created, session.started, session.handover, session.verified, session.failed, session.review_opened, session.expired, session.cancelled, session.purged, session.diploma_added, test]
        createdAt:
          type: string
          format: date-time
        data:
          type: object
          description: >-
            Never the person's name, address or photo. A `test` event's data is only
            `message`.
          properties:
            sessionId:
              type: string
              pattern: '^ps_[a-z2-7]{26}$'
            status:
              type: string
              enum: [pending, in_progress, approved, rejected, needs_review, expired, cancelled]
            flowId:
              type: string
            method:
              type: string
            assuranceLevel:
              type: string
            eidasLevel:
              type: string
            errorCode:
              type: string
              example: IDENTITY_MISMATCH
            expectedSubject:
              type: boolean
              description: Only present, as true, on a session created for one person.
            diploma:
              type: object
              description: Only on `session.diploma_added`.
              properties:
                qualification:
                  type: string
                institution:
                  type: string
                dateAwarded:
                  type: string
                  format: date
                nlqfLevel:
                  type: string
                eqfLevel:
                  type: string
            message:
              type: string
              description: Only on `test`.
      required: [id, type, createdAt, data]
      example:
        id: 0b9d3c1e-7f2a-4e6b-9c8d-5a4f3e2d1c0b
        type: session.verified
        createdAt: "2026-10-02T09:34:13Z"
        data:
          sessionId: ps_q4r7tz2mxk3vbn6hw5jc2dfa7e
          status: approved
          flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
          method: idem_app
          assuranceLevel: substantial
          eidasLevel: substantial
    ProofingDiploma:
      type: object
      description: A DUO diploma extract the person added, as DUO printed it. Never the PDF, the name or the date of birth.
      properties:
        documentType:
          type: string
        qualification:
          type: string
        profiles:
          type: array
          items:
            type: string
        institution:
          type: string
        placeOfIssue:
          type: string
        dateAwarded:
          type: string
          format: date
        nlqfLevel:
          type: string
        eqfLevel:
          type: string
        documentNumber:
          type: string
        signedAt:
          type: string
          format: date-time
        addedAt:
          type: string
          format: date-time
      required: [documentType, qualification, profiles, institution, placeOfIssue, dateAwarded, documentNumber, addedAt]
    ProofingHostedDiploma:
      type: object
      description: >-
        A DUO diploma extract as the hosted page lists it: only what the subject needs to
        recognise it. The link's token alone opens the page, so the document number and the
        rest of `ProofingDiploma` are left out.
      properties:
        qualification:
          type: string
        institution:
          type: string
        dateAwarded:
          type: string
          format: date
        nlqfLevel:
          type: string
      required: [qualification, institution, dateAwarded]
    ProofingDiplomaVerdictList:
      type: array
      description: What became of each uploaded file, in upload order.
      items:
        type: object
        properties:
          fileName:
            type: string
          accepted:
            type: boolean
          diploma:
            $ref: '#/components/schemas/ProofingDiploma'
          reason:
            type: string
            enum: [not_a_diploma, signature_invalid, holder_mismatch, duplicate]
            description: Why a file was refused.
          failedCheck:
            type: string
            description: Which signature or holder check failed, for a refused file.
        required: [fileName, accepted]
    ProofingDiplomaUpload:
      type: object
      properties:
        file:
          type: array
          maxItems: 10
          description: The DUO diploma extract PDFs, each at most 5 MiB, sent as repeated `file` parts.
          items:
            type: string
            format: binary
      required: [file]
    ProofingFlowSpec:
      type: object
      description: A flow's configuration, as sent to create a flow or save a new version. Unknown fields are refused (400 `invalid_body`).
      properties:
        name:
          type: string
        steps:
          type: array
          minItems: 1
          items:
            type: string
            enum: [document_capture, nfc_read, document_photo, face_verification, selfie, liveness, face_match]
        requestedAttributes:
          type: array
          items:
            type: string
            enum: [dg1, dg11, dg2, selfie, chip_checks, biometrics, document_image]
          description: What a session's result may carry; absent or empty releases the outcome only (the assurance summary, no data).
        selfieLocation:
          type: string
          description: Ignored; the wallet always sets the face capture to the app.
        faceProvider:
          type: string
          enum: [regula]
          description: What verifies the face step; absent is `regula`, the only one.
        acceptedDocumentTypes:
          type: array
          items:
            type: string
          description: >-
            Document codes accepted (the MRZ document code, such as `P`); empty accepts any.
            An EU driving licence, `drivers_license` or `eu_driving_licence`, is refused (422 `rejected_by_provider`):
            the engine has no CSCA source to verify a licence's chip, so it refuses every one.
        acceptedIssuingCountries:
          type: array
          items:
            type: string
            pattern: '^[A-Z]{3}$'
          description: >-
            3-letter ICAO 9303 codes (ISO 3166-1 alpha-3, or an ICAO-only code such as `EUE`
            or `UNO`); an unknown code is refused (422 `rejected_by_provider`). A German
            document's `D` counts as `DEU`. Empty accepts any country.
        requiredChecks:
          type: array
          items:
            type: string
        checkThresholds:
          type: object
          additionalProperties:
            type: number
        requiredAssuranceLevel:
          type: string
          enum: [low, substantial]
        bsnPolicy:
          type: string
          enum: [retrieve, mask, omit]
          description: Absent inherits the organisation's.
        blurFace:
          type: boolean
          description: Absent inherits the organisation's redaction policy.
        blurBsn:
          type: boolean
          description: Absent inherits the organisation's redaction policy.
        retentionOverrideSeconds:
          type: integer
          minimum: 1
          maximum: 31536000
          description: >-
            How long the flow's finished sessions keep their data, at most a year. Set, it
            applies in place of a customer's data retention; absent, the customer's applies.
        assuranceTiers:
          type: array
          items:
            type: object
            properties:
              level:
                type: string
              minPercent:
                type: number
            required: [level, minPercent]
        legalBasis:
          type: string
        processingPurpose:
          type: string
      required: [name, steps]
    ProofingFlow:
      description: >-
        A flow version as the organisation sees it. `allowed`, `default` and `diplomaMode`
        are only meaningful in the flow list; a single version (create, edit, versions,
        activate) reads them false and leaves `diplomaMode` out.
      allOf:
        - $ref: '#/components/schemas/ProofingFlowSpec'
        - type: object
          properties:
            id:
              type: string
              description: Stable across versions.
            version:
              type: integer
            active:
              type: boolean
              description: The version new requests run.
            createdAt:
              type: string
              format: date-time
            completable:
              type: boolean
              description: False for a flow a recipient cannot finish with only the Idem app; it cannot be made available to members.
            allowed:
              type: boolean
              description: An administrator made the flow available to members.
            default:
              type: boolean
              description: The flow the request form preselects.
            diplomaMode:
              type: string
              enum: ['off', required]
            needsReferencePhoto:
              type: boolean
              description: The face is matched against a reference photo; only a customer's API can send such a flow.
            kind:
              type: string
              enum: [identity, data_access, data_erasure]
              description: >-
                What the flow's sessions are for: an identity check, or a person asking for their
                data (`data_access`) or its erasure (`data_erasure`); absent on a single version.
          required: [id, version, active, createdAt, completable, allowed, default, needsReferencePhoto]
    ProofingFlowList:
      type: array
      items:
        $ref: '#/components/schemas/ProofingFlow'
    ProofingCustomerFlow:
      allOf:
        - $ref: '#/components/schemas/ProofingFlowSpec'
        - type: object
          properties:
            id:
              type: string
            version:
              type: integer
            active:
              type: boolean
            createdAt:
              type: string
              format: date-time
            completable:
              type: boolean
              description: The flow can be finished by the customer's subject, counting a reference-photo flow sent through the customer API.
            assigned:
              type: boolean
              description: An administrator assigned the flow to this customer.
            default:
              type: boolean
              description: The flow the request form preselects for this customer.
            diplomaMode:
              type: string
              enum: ['off', required]
            needsReferencePhoto:
              type: boolean
            kind:
              type: string
              enum: [identity, data_access, data_erasure]
            retentionDays:
              type: integer
              description: >-
                The most days a subject's data is kept on this flow for this customer: the flow's
                retention when it sets one, else the customer's `dataRetentionDays`, plus the day
                the proofing engine keeps its copy longer, rounded up to whole days. What the
                on-screen page tells the subject.
          required: [id, version, active, createdAt, completable, assigned, default, diplomaMode, needsReferencePhoto, retentionDays]
    ProofingCustomerFlowList:
      type: array
      items:
        $ref: '#/components/schemas/ProofingCustomerFlow'
    ProofingFlowSelection:
      type: object
      additionalProperties: false
      properties:
        flowIds:
          type: array
          items:
            type: string
        defaultFlowId:
          type: string
          description: One of `flowIds`, or empty when the list is.
      required: [flowIds]
    ProofingFlowHosted:
      type: object
      properties:
        enabled:
          type: boolean
          description: Hosted links may be made for the flow.
        locales:
          type: array
          description: The languages the page offers; empty is every one.
          items:
            type: string
            enum: [en, nl]
        completion:
          type: string
          enum: [redirect, done]
      required: [enabled, locales, completion]
    ProofingFlowHostedUpdate:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        locales:
          type: array
          description: Empty or absent is every language.
          items:
            type: string
            enum: [en, nl]
        completion:
          type: string
          enum: [redirect, done]
      required: [enabled, completion]
    ProofingFlowKind:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [identity, data_access, data_erasure]
      required: [kind]
    ProofingDataMatches:
      type: object
      properties:
        flowKind:
          type: string
          enum: [identity, data_access, data_erasure]
        matches:
          type: array
          items:
            type: object
            properties:
              requestId:
                type: string
                format: uuid
              sessionId:
                type: string
                pattern: '^ps_[a-z2-7]{26}$'
              flowName:
                type: string
              status:
                type: string
              method:
                type: string
              assuranceLevel:
                type: string
              eidasLevel:
                type: string
              createdAt:
                type: string
                format: date-time
              completedAt:
                type: string
                format: date-time
              purgedAt:
                type: string
                format: date-time
              level:
                type: string
                enum: [strong, probable, email]
                description: >-
                  strong when proven with the same document, probable on name and date of birth
                  alone, email an unfinished session to the same address (no proofed identity).
              approved:
                type: boolean
                description: The reviewer's choice; absent until the decision.
            required: [requestId, sessionId, flowName, status, createdAt, level]
      required: [flowKind, matches]
    ProofingDataExport:
      type: object
      description: >-
        An approved `data_access` session's data: each session the reviewer approved, with what
        the check read. Images are named in `imagesHeld`, never included.
      properties:
        sessionId:
          type: string
          description: The data request's own session.
        exportedAt:
          type: string
          format: date-time
        sessions:
          type: array
          items:
            type: object
            properties:
              sessionId:
                type: string
              flow:
                type: string
              status:
                type: string
              method:
                type: string
              assuranceLevel:
                type: string
              eidasLevel:
                type: string
              createdAt:
                type: string
                format: date-time
              completedAt:
                type: string
                format: date-time
              purgeAt:
                type: string
                format: date-time
              purgedAt:
                type: string
                format: date-time
              match:
                type: string
                enum: [strong, probable, email, name]
              contact:
                type: object
                properties:
                  name:
                    type: string
                  email:
                    type: string
              identity:
                type: object
                properties:
                  givenName:
                    type: string
                  familyName:
                    type: string
                  birthDate:
                    type: string
                  nationality:
                    type: string
                  evidence:
                    type: object
                  imagesHeld:
                    type: array
                    items:
                      type: string
                      enum: [documentPortrait, selfie, referencePhoto, documentFront, documentBack]
              diplomas:
                type: array
                items:
                  $ref: '#/components/schemas/ProofingDiploma'
      required: [sessionId, exportedAt, sessions]
    ProofingFlowDiplomas:
      type: object
      additionalProperties: false
      properties:
        diplomaMode:
          type: string
          enum: ['off', required]
      required: [diplomaMode]
    ProofingRequest:
      type: object
      description: A proofing request as the organisation sees it.
      properties:
        id:
          type: string
          format: uuid
        requestedByName:
          type: string
          description: The member who sent it, or the API key's name.
        apiKeyName:
          type: string
          description: The customer API key it was sent with.
        subjectUserId:
          type: string
          format: uuid
          description: The member being proofed, for a member's request.
        customerId:
          type: string
          format: uuid
        customerName:
          type: string
        subjectName:
          type: string
        subjectEmail:
          type: string
        proofedName:
          type: string
          description: The name read off a customer's subject's approved document, until its retention clears it.
        flowId:
          type: string
        flowName:
          type: string
        flowVersion:
          type: integer
        method:
          type: string
          enum: [idem_app, yivi_app, browser]
        status:
          type: string
          enum: [pending, in_progress, approved, rejected, needs_review, expired, cancelled]
        assuranceLevel:
          type: string
        eidasLevel:
          type: string
          enum: [low, substantial, high]
        errorCode:
          type: string
          example: IDENTITY_MISMATCH
        linkExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        purgeAt:
          type: string
          format: date-time
          description: When its personal data is due to be erased.
        purgedAt:
          type: string
          format: date-time
        diplomaMode:
          type: string
          enum: ['off', required]
        diplomas:
          type: array
          items:
            $ref: '#/components/schemas/ProofingDiploma'
        diplomasUntil:
          type: string
          format: date-time
          description: When the person can last add a diploma extract; absent until the identity is approved.
        expectedSubject:
          type: boolean
        flowKind:
          type: string
          enum: [identity, data_access, data_erasure]
          description: A data request (`data_access`, `data_erasure`) goes to review once the person is proven.
        dataExportUntil:
          type: string
          format: date-time
          description: Until when an approved `data_access` session's data downloads.
      required: [id, requestedByName, subjectName, subjectEmail, flowId, flowName, status, linkExpiresAt, createdAt, diplomaMode, diplomas, expectedSubject]
    ProofingRequestList:
      type: array
      items:
        $ref: '#/components/schemas/ProofingRequest'
    ProofingCreateRequest:
      type: object
      additionalProperties: false
      description: A member (`userId`) or a customer's subject (`customerId` with `email` and `name`).
      properties:
        userId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 200
        flowId:
          type: string
        method:
          type: string
          enum: [idem_app, yivi_app]
          default: idem_app
        channel:
          type: string
          enum: [email, on_screen, hosted]
          default: email
        language:
          type: string
          enum: [en, nl]
        birthDate:
          type: string
          format: date
    ProofingCreatedRequest:
      allOf:
        - $ref: '#/components/schemas/ProofingRequest'
        - type: object
          properties:
            mailSent:
              type: boolean
              description: False when the mail could not be sent; the request stands.
            deepLink:
              type: string
              description: An on-screen Idem request's `vcmrtd://` link, to show as a QR code.
            deepLinkExpiresAt:
              type: string
              format: date-time
            hostedUrl:
              type: string
              format: uri
              description: A hosted request's link, valid 72 hours.
          required: [mailSent]
    ProofingReviewDecision:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          maxLength: 500
        errorCode:
          type: string
          pattern: '^[A-Z0-9_]{1,64}$'
          description: Only with `reject`; absent is `MANUAL_REVIEW_REJECTED`.
        requestIds:
          type: array
          items:
            type: string
            format: uuid
          description: >-
            Only on a data request: the matched sessions an approval takes (absent takes only
            the `strong` ones, proven with the same document; a `probable` or `email` match is
            taken only when listed). An erasure purges them; an access request opens their data
            for download.
      required: [decision, reason]
    ProofingClaimLink:
      type: object
      properties:
        deepLink:
          type: string
          description: The Idem app's `vcmrtd://` link, to show as a QR code.
        expiresAt:
          type: string
          format: date-time
      required: [deepLink, expiresAt]
    ProofingAppState:
      type: object
      properties:
        app:
          type: string
          enum: [waiting, connected, away]
      required: [app]
    ProofingYiviStart:
      type: object
      properties:
        walletLink:
          type: string
          description: The `openid4vp://` request the Yivi app opens.
        expiresAt:
          type: string
          format: date-time
      required: [walletLink, expiresAt]
    ProofingYiviDisclosure:
      type: object
      properties:
        done:
          type: boolean
          description: False while the person has not finished in the Yivi app.
        ok:
          type: boolean
          description: The disclosure gave a photo to check the face against; false ended the session.
        code:
          type: string
          enum: [photo_missing, reference_no_face, document_not_accepted]
        stableFrames:
          type: integer
        maxAttempts:
          type: integer
      required: [done, ok]
    ProofingFaceFrame:
      type: object
      additionalProperties: false
      properties:
        image:
          type: string
          description: One camera frame as a JPEG data URL, at most 2 MiB.
      required: [image]
    ProofingFaceVerdict:
      type: object
      properties:
        faceDetected:
          type: boolean
        matched:
          type: boolean
        consecutive:
          type: integer
        stableFrames:
          type: integer
        attempts:
          type: integer
        maxAttempts:
          type: integer
        decision:
          type: string
          enum: [pending, approved, rejected]
      required: [faceDetected, matched, consecutive, stableFrames, attempts, maxAttempts, decision]
    ProofingRequestEvents:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              occurredAt:
                type: string
                format: date-time
              action:
                type: string
                example: identity_proofing.request_sent
              targetType:
                type: string
              targetId:
                type: string
              metadata:
                type: object
              actor:
                type: object
                nullable: true
                properties:
                  userId:
                    type: string
                    format: uuid
                  preferredName:
                    type: string
                    nullable: true
                  givenNames:
                    type: string
                  lastName:
                    type: string
                  avatarUri:
                    type: string
              actorLabel:
                type: string
                nullable: true
                description: A non-user actor, such as `api_key:<prefix>`.
            required: [id, occurredAt, action, targetType, targetId, metadata, actor, actorLabel]
      required: [events]
    ProofingStats:
      type: object
      properties:
        since:
          type: string
          format: date-time
        rows:
          type: array
          items:
            type: object
            properties:
              customerId:
                type: string
                format: uuid
              flowId:
                type: string
              sessions:
                type: integer
              approved:
                type: integer
              rejected:
                type: integer
              needsReview:
                type: integer
              expired:
                type: integer
              cancelled:
                type: integer
                description: Cancelled before an outcome; not counted in `expired`.
            required: [customerId, flowId, sessions, approved, rejected, needsReview, expired, cancelled]
      required: [since, rows]
    ProofingImage:
      type: object
      properties:
        mimeType:
          type: string
        data:
          type: string
          format: byte
          description: The image, standard base64.
      required: [mimeType, data]
    ProofingAdminResult:
      description: The customer API's result plus, for an approval, the images the flow requested.
      allOf:
        - $ref: '#/components/schemas/ProofingApiResult'
        - type: object
          properties:
            photo:
              $ref: '#/components/schemas/ProofingImage'
            selfie:
              $ref: '#/components/schemas/ProofingImage'
            referencePhoto:
              $ref: '#/components/schemas/ProofingImage'
            documentImage:
              $ref: '#/components/schemas/ProofingImage'
            documentImageBack:
              $ref: '#/components/schemas/ProofingImage'
    ProofingPause:
      type: object
      properties:
        organizationId:
          type: string
          format: uuid
        paused:
          type: boolean
        platformPausedAt:
          type: string
          format: date-time
          description: Set while a platform administrator paused it.
        orgPausedAt:
          type: string
          format: date-time
          description: Set while the organisation's administrator paused it.
        platformPausedBy:
          $ref: '#/components/schemas/ProofingPausedBy'
        orgPausedBy:
          $ref: '#/components/schemas/ProofingPausedBy'
      required: [organizationId, paused]
    ProofingPausedBy:
      type: object
      description: Who set a pause, while it holds; absent when unknown (set before this was kept, or the user was removed).
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
      required: [userId, name]
    ProofingPauseList:
      type: object
      properties:
        pauses:
          type: array
          items:
            $ref: '#/components/schemas/ProofingPause'
      required: [pauses]
    ProofingSetPause:
      type: object
      additionalProperties: false
      properties:
        paused:
          type: boolean
      required: [paused]
    ProofingWebhookHealth:
      type: object
      properties:
        state:
          type: string
          enum: [not_configured, delivering, failing]
        lastStatusCode:
          type: integer
        failingSince:
          type: string
          format: date-time
        pendingRetries:
          type: integer
      required: [state, pendingRetries]
    ProofingBranding:
      type: object
      properties:
        displayName:
          type: string
        primaryColor:
          type: string
          example: '#1f6feb'
        supportContact:
          type: string
        privacyUrl:
          type: string
        logoUri:
          type: string
          description: Empty without a logo; carries a version so a replaced logo is fetched again.
        hidePoweredBy:
          type: boolean
      required: [displayName, primaryColor, supportContact, privacyUrl, logoUri, hidePoweredBy]
    ProofingCustomer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        flowIds:
          type: array
          items:
            type: string
        defaultFlowId:
          type: string
        status:
          type: string
          enum: [active, paused]
        pausedAt:
          type: string
          format: date-time
        sessionTtlSeconds:
          type: integer
        dataRetentionDays:
          type: integer
        webhook:
          $ref: '#/components/schemas/ProofingWebhookHealth'
        branding:
          $ref: '#/components/schemas/ProofingBranding'
        allowedRedirectOrigins:
          type: array
          items:
            type: string
        hasApiKey:
          type: boolean
          description: Whether the customer holds an unrevoked API key; a request for it needs one.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, flowIds, status, sessionTtlSeconds, dataRetentionDays, webhook, branding, allowedRedirectOrigins, hasApiKey, createdAt, updatedAt]
    ProofingCustomerList:
      type: array
      items:
        $ref: '#/components/schemas/ProofingCustomer'
    ProofingCreateCustomer:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
      required: [name]
    ProofingUpdateCustomer:
      type: object
      additionalProperties: false
      description: At least one field; an absent one is left as it is.
      minProperties: 1
      properties:
        name:
          type: string
        paused:
          type: boolean
        sessionTtlSeconds:
          type: integer
          enum: [120, 300, 600]
        dataRetentionDays:
          type: integer
          enum: [7, 30, 90, 180, 365]
        allowedRedirectOrigins:
          type: array
          maxItems: 10
          items:
            type: string
    ProofingBrandingForm:
      type: object
      properties:
        displayName:
          type: string
        primaryColor:
          type: string
          description: '`#rrggbb`; empty is the organisation''s.'
        supportContact:
          type: string
        privacyUrl:
          type: string
          description: An https URL.
        logo:
          type: string
          format: binary
          description: PNG, JPEG, GIF or WebP, at most 512 KiB.
        removeLogo:
          type: string
          enum: ['true']
        hidePoweredBy:
          type: string
          enum: ['true', 'false']
    ProofingApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: The key's public start, to recognise it by.
        scopes:
          type: array
          items:
            type: string
            enum: [sessions:write, sessions:read, results:read, flows:read]
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
      required: [id, name, prefix, scopes, createdAt]
    ProofingApiKeyList:
      type: array
      items:
        $ref: '#/components/schemas/ProofingApiKey'
    ProofingCreateApiKey:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
      required: [name]
    ProofingCreatedApiKey:
      allOf:
        - $ref: '#/components/schemas/ProofingApiKey'
        - type: object
          properties:
            secret:
              type: string
              description: The key itself, the one time it is readable.
          required: [secret]
    ProofingWebhookEndpoint:
      type: object
      properties:
        configured:
          type: boolean
          description: False, with the rest empty, for a customer without an endpoint.
        url:
          type: string
        events:
          type: array
          items:
            type: string
        secretLast4:
          type: string
        secret:
          type: string
          description: Only in the answer that created the endpoint or rotated its secret.
        health:
          $ref: '#/components/schemas/ProofingWebhookHealth'
        availableEvents:
          type: array
          items:
            type: string
        maxAttempts:
          type: integer
      required: [configured, events, health, availableEvents, maxAttempts]
    ProofingSaveWebhook:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum: [session.created, session.started, session.handover, session.verified, session.failed, session.review_opened, session.expired, session.cancelled, session.purged, session.diploma_added]
      required: [url, events]
    ProofingWebhookDeliveryList:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
          event:
            type: string
          sessionId:
            type: string
            example: ps_q4r7tz2mxk3vbn6hw5jc2dfa7e
            description: The session's `ps_` id, as the delivery's payload carries it; absent for a `test` event.
          endpointUrl:
            type: string
          status:
            type: string
            enum: [pending, delivered, failed]
          attempts:
            type: integer
          lastStatusCode:
            type: integer
          lastError:
            type: string
          lastAttemptAt:
            type: string
            format: date-time
          deliveredAt:
            type: string
            format: date-time
          createdAt:
            type: string
            format: date-time
        required: [id, event, status, attempts, createdAt]
    ProofingHostedProgress:
      type: object
      properties:
        status:
          type: string
          enum: [pending, in_progress, approved, rejected, needs_review, expired, cancelled]
        errorCode:
          type: string
        method:
          type: string
          enum: [idem_app, yivi_app]
        linkExpiresAt:
          type: string
          format: date-time
          description: The link's end until it is started, then the session's.
        started:
          type: boolean
        completedAt:
          type: string
          format: date-time
        diplomasUntil:
          type: string
          format: date-time
        dataExportUntil:
          type: string
          format: date-time
          description: Until when an approved "see my data" session's data downloads through the link (`GET /api/v1/proof/{token}/data-export`), 24 hours from the approval.
      required: [status, linkExpiresAt, started]
    ProofingHostedView:
      allOf:
        - $ref: '#/components/schemas/ProofingHostedProgress'
        - type: object
          properties:
            sessionId:
              type: string
              pattern: '^ps_[a-z2-7]{26}$'
            redirectUrl:
              type: string
            embedOrigins:
              type: array
              items:
                type: string
            language:
              type: string
              enum: [en, nl]
            locales:
              type: array
              items:
                type: string
                enum: [en, nl]
            customer:
              type: object
              properties:
                name:
                  type: string
                branding:
                  $ref: '#/components/schemas/ProofingBranding'
                dataRetentionDays:
                  type: integer
              required: [name, branding, dataRetentionDays]
            flow:
              type: object
              properties:
                name:
                  type: string
                requiredAssuranceLevel:
                  type: string
                requestedAttributes:
                  type: array
                  items:
                    type: string
                yiviAvailable:
                  type: boolean
                diplomaMode:
                  type: string
                  enum: ['off', required]
                kind:
                  type: string
                  enum: [identity, data_access, data_erasure]
                retentionDays:
                  type: integer
                  description: >-
                    The most days the session's data is kept: the flow's retention when it set
                    one, else the customer's `dataRetentionDays`, plus the day the proofing engine
                    keeps its copy longer, rounded up to whole days. What the page tells the subject.
              required: [name, requestedAttributes, yiviAvailable, diplomaMode, retentionDays]
            diplomas:
              type: array
              description: The extracts the subject added, as the page lists them.
              items:
                $ref: '#/components/schemas/ProofingHostedDiploma'
          required: [sessionId, embedOrigins, locales, customer, flow, diplomas]
    ProofingHostedStart:
      type: object
      additionalProperties: false
      properties:
        method:
          type: string
          enum: [idem_app, yivi_app]
      required: [method]
    ProofingHostedStarted:
      allOf:
        - $ref: '#/components/schemas/ProofingHostedProgress'
        - type: object
          properties:
            deepLink:
              type: string
              description: An Idem session's `vcmrtd://` link.
  responses:
    ApiUnauthorized:
      description: No API key was sent as a Bearer token (`unauthorized`), or it is unknown or revoked (`invalid_api_key`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ApiForbidden:
      description: The API key lacks the scope this call needs (`insufficient_scope`), or proofing is paused (`proofing_paused`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid session cookie was supplied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The session lacks the required role for this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProofingForbidden:
      description: >-
        The session lacks the required role for this resource, or identity proofing is
        paused for the organisation (`proofing_paused`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The referenced resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: >-
        The customer spent its public API budget (code `rate_limited`): 120 calls a
        minute, and of those 10 session creations. `Retry-After` says in how many
        seconds to try again.
      headers:
        Retry-After:
          description: Seconds until the next call is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    HostedTooManyRequests:
      description: >-
        The link spent its budget (code `rate_limited`, "too many requests for this
        link"): 300 calls a minute per hosted link. `Retry-After` says in how many
        seconds to try again.
      headers:
        Retry-After:
          description: Seconds until the next call is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
security:
  - cookieAuth: []
