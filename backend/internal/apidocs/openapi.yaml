    post:
      tags: [identity-proofing]
      summary: Create a proofing session (public API)
      description: >-
        Authenticated with the organisation's API key with `sessions:write`. Starts a check of
        an external person on one of the organisation's flows. Each field and whether it is
        required is listed under the request body.

        - Mailed (the default): the person gets a mail with the QR code, and the session runs
          10 minutes, or the flow's own length. The answer has the `deepLink` too, to show the
          QR code yourself (with `sendMail: false` nothing is mailed). A flow that runs in the
          Yivi app only cannot be sent this way, even with `sendMail: false`: 400
          `invalid_input`. Send it with `hosted: true`.
        - `hosted: true`: the answer has a `hostedUrl` valid 72 hours. The session starts when
          the person opens it, and nothing is mailed. `session.created` is sent then, not now.

        Answers 201 with the session. Refused while the organisation's proofing is paused.
        Send an `Idempotency-Key` to make a retry safe: the same key and body within 24 hours
        get the first answer again (`Idempotent-Replayed: true`). Each API key keeps its own
        keys.
      security:
        - apiKey: []
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -X POST 'https://wallet.example.org/api/v1/proofing/sessions' \
              -H "Authorization: Bearer YOUR_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
                "flowId": "6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10",
                "hosted": true,
                "name": "Anna de Vries",
                "redirectUrl": "https://portal.example.org/onboarding/return"
              }'
        - lang: Go
          label: Go
          source: |
            package main

            import (
            	"fmt"
            	"io"
            	"log"
            	"net/http"
            	"strings"
            )

            func main() {
            	req, err := http.NewRequest(http.MethodPost, "https://wallet.example.org/api/v1/proofing/sessions", strings.NewReader(`{
            	  "flowId": "6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10",
            	  "hosted": true,
            	  "name": "Anna de Vries",
            	  "redirectUrl": "https://portal.example.org/onboarding/return"
            	}`))
            	if err != nil {
            		log.Fatal(err)
            	}
            	// YOUR_API_KEY: your organisation's API key, from Identity proofing › Developers.
            	req.Header.Set("Authorization", "Bearer YOUR_API_KEY")
            	req.Header.Set("Content-Type", "application/json")
            	resp, err := http.DefaultClient.Do(req)
            	if err != nil {
            		log.Fatal(err)
            	}
            	defer resp.Body.Close()
            	body, err := io.ReadAll(resp.Body)
            	if err != nil {
            		log.Fatal(err)
            	}
            	// Any status of 400 or higher carries {"error", "code"}: act on code.
            	fmt.Println(resp.Status, string(body))
            }
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional. Makes a retry safe; the same key and body within 24 hours get the first answer again.
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingApiCreateSession'
            examples:
              onboarding:
                summary: Verify a new person by e-mail
                value:
                  email: anna@example.org
                  name: Anna Jansen
                  language: nl
              passwordReset:
                summary: Password reset for the account holder (hosted)
                value:
                  hosted: true
                  redirectUrl: https://portal.example.nl/reset/return
                  name: Anna de Vries
                  birthDate: "1990-04-12"
                  flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
              knownPerson:
                summary: Only Anna de Vries can pass
                value:
                  email: anna.devries@example.org
                  name: Anna de Vries
                  birthDate: "1990-04-12"
              bankAccountReferencePhoto:
                summary: Liveness check against your own photo (face-only flow)
                value:
                  hosted: true
                  redirectUrl: https://portal.example.nl/policy/bank-account/return
                  flowId: 9a2b4c6d-1e3f-4a5b-8c7d-0e1f2a3b4c5d
                  referencePhoto: /9j/4AAQSkZJRgABAQAAAQABAAD
      responses:
        '201':
          description: Created.
          headers:
            Idempotent-Replayed:
              description: '`true` when this is the stored answer to an earlier call with the same `Idempotency-Key`.'
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingApiCreatedSession'
              examples:
                mailed:
                  summary: Mailed session (the onboarding request)
                  value:
                    id: ps_q4r7tz2mxk3vbn6hw5jc2dfa7e
                    status: pending
                    flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                    flowName: Onboarding
                    flowVersion: 3
                    subjectEmail: anna@example.org
                    subjectName: Anna Jansen
                    expiresAt: "2026-10-02T09:40:00Z"
                    createdAt: "2026-10-02T09:30:00Z"
                    expectedSubject: false
                    flowKind: identity
                    deepLink: vcmrtd://verify?handover=hv_3m8x2kq7&api=https%3A%2F%2Fwallet.example.nl
                    mailSent: true
                hosted:
                  summary: Hosted link (the password reset request)
                  value:
                    id: ps_b7k2mq4xz6rt3vnw5hc2jd7fae
                    status: pending
                    flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                    flowName: Onboarding
                    subjectEmail: ""
                    subjectName: Anna de Vries
                    expiresAt: "2026-10-05T09:30:00Z"
                    createdAt: "2026-10-02T09:30:00Z"
                    expectedSubject: true
                    flowKind: identity
                    deepLink: ""
                    mailSent: false
                    hostedUrl: https://wallet.example.nl/p/BwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyAhIiMkJSY
        '400':
          description: >-
            The body is not valid JSON or has an unknown field (`invalid_body`), a field
            is invalid (`invalid_input`, the message says which), or `redirectUrl` is not on
            an allowed origin (`redirect_not_allowed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: enter a valid e-mail address
                code: invalid_input
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '409':
          description: >-
            The flow's hosted page is off (`hosted_disabled`),
            the deployment has no encryption key (`no_encryption_key`), the flow requires the
            Verzekeringsbericht on a deployment that checks none (`no_employment_checker`), the flow
            photographs the document on a deployment without ID Scan (`no_document_scanner`), or a call with this
            `Idempotency-Key` is still running or its outcome is unknown
            (`idempotency_in_flight`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The request body is over 1 MiB (`body_too_large`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            The flow does not exist (`flow_not_found`), cannot be finished
            (`flow_not_completable`), needs a `referencePhoto` (`reference_photo_required`), or
            asks for diplomas, the address or the Verzekeringsbericht, or photographs the document,
            and so needs `hosted: true` (`diplomas_need_page`, `address_needs_page`,
            `employment_needs_page`, `document_scan_needs_page`); no flow is
            named and the organisation has no default flow (`no_default_flow`); or the
            `Idempotency-Key` was used with another body (`idempotency_key_reused`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
