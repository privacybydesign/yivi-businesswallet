x-webhooks:
  proofing-session-event:
    post:
      tags: [identity-proofing]
      summary: A proofing session's event, sent to the organisation's webhook endpoint
      description: >-
        Sent for the events the endpoint subscribes to, signed with the endpoint's secret.
        `session.verified` carries the session's result in `data.result`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingWebhookEvent'
            examples:
              verified:
                summary: session.verified, with the result
                value:
                  id: bf60aacd-e049-4363-92b4-cdcd97299949
                  type: session.verified
                  createdAt: "2026-11-13T12:44:35Z"
                  data:
                    sessionId: ps_tmncasdiyffevjl6egt65h2lya
                    status: approved
                    flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                    flowKind: identity
                    method: yivi_app
                    eidasLevel: low
                    result:
                      id: ps_tmncasdiyffevjl6egt65h2lya
                      status: approved
                      method: yivi_app
                      eidasLevel: low
                      verifiedAt: "2026-11-13T12:44:35Z"
                      identity:
                        givenName: Anna
                        familyName: Jansen
                        birthDate: "1991-03-14"
                        nationality: NLD
                        bsn: "111222333"
                      evidence:
                        - type: yivi_disclosure
                          documentKind: identity_card
                          documentCheck:
                            verdict: authentic
                            score: 0.93
                            fields: valid
                            zones: valid
                      documentImage:
                        mimeType: image/jpeg
                        data: /9j/4AAQSkZJRgABAQAAAQABAAD
                      documentImageBack:
                        mimeType: image/jpeg
                        data: /9j/4AAQSkZJRgABAQAAAQABAAD
              failed:
                summary: session.failed, with the reason
                value:
                  id: 4d0f6d1a-7c0e-4c58-9a3b-0c2a6f1e8b77
                  type: session.failed
                  createdAt: "2026-11-13T12:50:02Z"
                  data:
                    sessionId: ps_b7k2mq4xz6rt3vnw5hc2jd7fae
                    status: rejected
                    flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                    flowKind: identity
                    method: yivi_app
                    errorCode: DOCUMENT_MISMATCH
              created:
                summary: session.created
                value:
                  id: 9b2e4c1f-3a5d-4e6f-8a7b-1c2d3e4f5a6b
                  type: session.created
                  createdAt: "2026-11-13T12:43:41Z"
                  data:
                    sessionId: ps_tmncasdiyffevjl6egt65h2lya
                    status: pending
                    flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                    flowKind: identity
      responses:
        '200':
          description: Received; any 2xx answer counts.
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: One of the organisation's identity proofing API keys (`yp_live_…`), for the public `/api/v1/proofing` routes.
    cookieAuth:
      type: apiKey
      in: cookie
      name: ybw_session
  schemas:
    CredentialRequestTemplate:
      type: object
      required: [id, name, credentials, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        credentials:
          type: array
          items:
            type: object
            required: [vct, claims]
            properties:
              vct:
                type: string
              claims:
                type: array
                items:
                  type: string
        createdAt:
          type: string
          format: date-time
    OutboundPresentationRequest:
      type: object
      properties:
        id:
          type: string
        sender:
          type: string
        recipient:
          type: string
        status:
          type: string
          enum: [sent, completed, failed, expired]
        failureReason:
          type: string
        fetched:
          type: boolean
          description: Whether the recipient's wallet has fetched the Request Object.
        credentials:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              vct:
                type: string
              claims:
                type: array
                items:
                  type: string
        disclosed:
          type: array
          items:
            type: object
            properties:
              queryId:
                type: string
              vct:
                type: string
              issuer:
                type: string
              claims:
                type: object
                additionalProperties: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
    ProofingApiFlow:
      type: object
      description: A flow of the organisation a subject can finish.
      properties:
        id:
          type: string
          description: The flow's id, stable across versions; `flowId` when creating a session.
        name:
          type: string
        version:
          type: integer
          description: The active version, which new sessions run.
        requiredAssuranceLevel:
          type: string
          enum: [low, substantial]
          description: The eIDAS level an approval must reach; absent for none.
        requestedAttributes:
          type: array
          items:
            type: string
          description: What the result may carry (`dg1` the document data with name and birth date, `dg2` the chip photo, `selfie`, `age_over` only whether the person is `ageOver` or older, …). A flow that carries only the outcome lists `outcome_only`.
        ageOver:
          type: integer
          description: The age `age_over` answers for; absent when the flow does not request it.
        default:
          type: boolean
          description: The organisation's default flow, the one a session without `flowId` runs.
        needsReferencePhoto:
          type: boolean
          description: The face is checked without reading the chip, against the `referencePhoto` every session on this flow must carry.
        allowed:
          type: boolean
          description: Offered to the organisation's members in the wallet (`PUT /proofing/flow-selection`).
        hostedEnabled:
          type: boolean
          description: The flow may be sent as a hosted link (`PUT /proofing/flows/{flowID}/hosted`).
        hostedReturnUrl:
          type: string
          description: The page the flow's hosted links send the person back to; absent for none.
        diplomaMode:
          type: string
          enum: ['off', required, always_review]
          description: Whether the flow asks for DUO diploma extracts after the identity check.
        addressMode:
          type: string
          enum: ['off', required, always_review]
          description: Whether the flow asks for the postal address after the identity check.
        employmentMode:
          type: string
          enum: ['off', required, always_review]
          description: Whether the flow asks for the UWV Verzekeringsbericht after the identity check.
      required: [id, name, version, requestedAttributes, default, needsReferencePhoto, allowed, hostedEnabled,
        diplomaMode, addressMode, employmentMode]
    ProofingApiFlowList:
      type: array
      items:
        $ref: '#/components/schemas/ProofingApiFlow'
    ProofingApiCreateSession:
      type: object
      additionalProperties: false
      description: >-
        No field is required on its own. A session is mailed by default, so send `email`, or
        `hosted: true` or `sendMail: false` when nothing should be mailed.
      properties:
        email:
          type: string
          format: email
          description: >-
            Optional. The person's e-mail address, which the session is mailed to. Leave it out
            only with `hosted: true` or `sendMail: false`, where nothing is mailed.
        name:
          type: string
          maxLength: 200
          description: Optional. The person's name, shown in the wallet and the mail.
        birthDate:
          type: string
          format: date
          example: "1990-04-12"
          description: >-
            Optional. Needs `name` too. Makes the session one for that person only: the name and
            birth date on the document must match, or the session is `rejected` with
            `IDENTITY_MISMATCH`. The flow must read the document data.
        referencePhoto:
          type: string
          format: byte
          description: >-
            Optional. Send it on a flow with `needsReferencePhoto: true`, and only there. Your
            own photo of the person's face, base64 of a PNG, JPEG or WebP of at most 512 KiB.
        flowId:
          type: string
          description: Optional. The flow to run. Default the organisation's default flow.
        flowKind:
          type: string
          enum: [identity, data_access, data_erasure]
          default: identity
          description: >-
            Optional. `data_access` ("See my data") or `data_erasure` ("Delete my data") starts
            a data request instead of an identity check.
        sendMail:
          type: boolean
          default: true
          description: >-
            Optional. `false` sends no mail: show the answer's `deepLink` as a QR code
            yourself.
        language:
          type: string
          enum: [en, nl]
          description: >-
            Optional. The language of the mail, the hosted page and the Idem app. Default the
            deployment's for the mail, and the phone's in the app.
        hosted:
          type: boolean
          default: false
          description: >-
            Optional. `true` answers a `hostedUrl` (valid 72 hours) to hand the person, instead
            of starting the session now. Nothing is mailed.
        redirectUrl:
          type: string
          format: uri
          description: >-
            Optional, only with `hosted: true`. Where the page sends the person once the
            session ends, with `?session=<id>&status=<status>` added. Must be on one of the
            organisation's `allowedRedirectOrigins`. Default the flow's return page.
        redirect:
          type: boolean
          default: true
          description: >-
            Optional, only with `hosted: true`. `false` ends the page on its own thank-you
            screen, even when the flow has a return page. Not together with `redirectUrl`.
    ProofingApiSession:
      type: object
      description: A session as stored, with its outcome. Never document data beyond the proofed name.
      properties:
        id:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        status:
          type: string
          enum: [pending, in_progress, approved, rejected, needs_review, expired, cancelled]
        flowId:
          type: string
        flowName:
          type: string
        flowVersion:
          type: integer
        method:
          type: string
          enum: [idem_app, yivi_app, browser]
          description: The app the person used; absent while nobody opened the session.
        subjectEmail:
          type: string
        subjectName:
          type: string
        proofedName:
          type: string
          description: The name read off an approved document, until the organisation's data retention clears it.
        assuranceLevel:
          type: string
        eidasLevel:
          type: string
          enum: [low, substantial, high]
          description: >-
            The eIDAS level the checks reached, whether or not the flow requires one; a face
            step lifts it past low only with Regula. Absent when no level was reached.
        errorCode:
          type: string
          example: IDENTITY_MISMATCH
          description: >-
            Why a session was rejected. The wallet itself sets `IDENTITY_MISMATCH` (the
            document is not the expected person's), `ASSURANCE_NOT_MET` (the checks fell
            short of the flow's level), `REVIEW_LAPSED` (a review nobody decided in time),
            `LEGAL_RETENTION` (an erasure refused because the organisation must keep the data by law: its legal
            retention holds every identity check found), `ORG_PAUSED` (a review left open when
            the wallet's operator paused the organisation's proofing) and, on sessions from before the
            Verzekeringsbericht had its own outcome, `EMPLOYMENT_NOT_PROVIDED` (no statement kept
            in time; `steps` says that now); a reviewer
            `REVIEW_NOT_HOLDER`, `REVIEW_ALTERED`, `EVIDENCE_NOT_AS_REQUESTED` or
            `MANUAL_REVIEW_REJECTED`; others come from
            the session itself
            (`FACE_NO_MATCH`, `LIVENESS_FAILED`, `DOC_EXPIRED`, `DOC_TAMPERED`,
            `CHIP_CLONE_DETECTED`, `ASSURANCE_NOT_MET`, …).
        expiresAt:
          type: string
          format: date-time
          description: When the session, or an unstarted hosted link, ends.
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
        cancelledBy:
          type: string
          enum: [api_key, member, subject]
          description: >-
            Who cancelled the session: the organisation's software with its API key, a member in
            the wallet, or the person declining on the hosted page. Absent for a session cancelled
            before the wallet kept this.
        expiryReason:
          type: string
          enum: [not_started, not_finished, review_ended]
          description: >-
            Why an `expired` session expired: a hosted link nobody started in time
            (`not_started`), a session the person did not finish in time (`not_finished`), or a
            review nobody decided before it ended (`review_ended`). Absent otherwise.
        purgedAt:
          type: string
          format: date-time
          description: When its personal data was erased.
        expectedSubject:
          type: boolean
          description: Created for one known person (`name` with `birthDate`).
        flowKind:
          type: string
          enum: [identity, data_access, data_erasure]
          description: >-
            A data request (`data_access`, `data_erasure`) goes to the organisation's review
            (`needs_review`) once the person is proven; its approval erases the person's sessions
            (each sends `session.purged`) or opens their data at `GET .../data-export`.
        dataExportUntil:
          type: string
          format: date-time
          description: Until when an approved `data_access` session's data downloads.
        addressReview:
          type: string
          enum: [pending, confirmed, rejected, lapsed]
          description: >-
            The review of an address the registered (BRP) address did not confirm: `pending`
            until a reviewer confirms or rejects it, `lapsed` when nobody did within the request's
            data retention. Absent on a registered address and without an address.
      required: [id, status, flowId, flowName, subjectEmail, expiresAt, createdAt, expectedSubject, flowKind]
    ProofingStep:
      type: object
      required: [kind, state]
      properties:
        kind:
          type: string
          enum: [address, diplomas, employment]
          description: The steps the session's flow asks for, in the order the person does them.
        state:
          type: string
          enum: [not_started, open, done, in_review, rejected, not_provided]
          description: >-
            `not_started` until the identity check finished (approved or in review); `open` while
            it takes the person's input (until `until`); `done`; `in_review` while a reviewer
            decides it; `rejected` by a reviewer or lapsed; `not_provided` once the window closed
            without the input.
        until:
          type: string
          format: date-time
          description: When an open step closes.
        code:
          type: string
          example: EMPLOYMENT_NOT_PROVIDED
          description: >-
            Why a step did not pass: `ADDRESS_NOT_PROVIDED`, `ADDRESS_REJECTED`,
            `DIPLOMA_NOT_PROVIDED`, `DIPLOMA_REJECTED`, `EMPLOYMENT_NOT_PROVIDED`,
            `EMPLOYMENT_REJECTED` or
            `REVIEW_LAPSED`.
        reviewed:
          type: boolean
          description: A `done` step a reviewer accepted.
    ProofingApiCreatedSession:
      allOf:
        - $ref: '#/components/schemas/ProofingApiSession'
        - type: object
          properties:
            deepLink:
              type: string
              description: The Idem app's `vcmrtd://` link, to show as a QR code; empty for a hosted session.
            mailSent:
              type: boolean
            hostedUrl:
              type: string
              format: uri
              description: A hosted session's link to hand the person.
          required: [deepLink, mailSent]
    ProofingApiSessionPage:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ProofingApiSession'
        nextCursor:
          type: string
          nullable: true
          description: Pass back as `cursor` for the next page; null on the last.
      required: [sessions, nextCursor]
    ProofingApiResult:
      type: object
      description: A settled session's verified identity, the evidence it rests on and, for an approval, the document's images. Never the document number or a selfie.
      properties:
        id:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        status:
          type: string
          enum: [approved, rejected, needs_review, expired, cancelled]
        method:
          type: string
          enum: [idem_app, yivi_app, browser]
        assuranceLevel:
          type: string
        eidasLevel:
          type: string
          enum: [low, substantial, high]
        errorCode:
          type: string
          description: Why the session was rejected; see `ProofingApiSession.errorCode`.
        reviewReason:
          type: string
          enum: [no_current_employment, current_benefit, current_other_income]
          description: Why the kept Verzekeringsbericht went to review. `no_current_employment` is one that lists no current job, `current_benefit` one that lists a current UWV benefit beside a job, `current_other_income` one that lists other current income paid without hours worked beside a job; a reviewer decides it as the employment step's review. Absent otherwise.
        steps:
          type: array
          description: >-
            The extra steps the flow asks for (the address, DUO diplomas, the
            Verzekeringsbericht), each with its own outcome beside the identity's: a step never
            changes the session's `status`. Absent when the flow asks none.
          items:
            $ref: '#/components/schemas/ProofingStep'
        verifiedAt:
          type: string
          format: date-time
          description: When an approved session was verified.
        identity:
          type: object
          description: Only for an approved session.
          properties:
            givenName:
              type: string
            familyName:
              type: string
            birthDate:
              type: string
            nationality:
              type: string
            bsn:
              type: string
              description: >-
                The person's BSN, for a flow whose BSN policy keeps it (`retrieve`, or `mask`
                for a masked one): the registered one when the Yivi app shared the personal
                data (DigiD), else the one a Dutch document's chip or photo carries. Another
                country's personal number is never sent. Absent otherwise.
            ageOver:
              type: object
              description: >-
                For a flow that requests `age_over`: whether the person is `age` or older on the
                day of the check, derived from the chip's date of birth, which is not released.
              properties:
                age:
                  type: integer
                over:
                  type: boolean
              required: [age, over]
        evidence:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [emrtd, yivi_disclosure, reference_photo, document_photo]
                description: >-
                  `reference_photo`: no document was read; the live face was matched
                  against the `referencePhoto` the session was created with.
                  `document_photo`: the document was photographed, its chip not read.
              documentType:
                type: string
              documentKind:
                type: string
                enum: [passport, identity_card, residence_permit, drivers_license]
                description: >-
                  What the document is, which `documentType` (the MRZ code) alone does not say.
                  Absent when the document does not tell.
              issuingState:
                type: string
              expiryDate:
                type: string
              passiveAuth:
                type: string
                enum: [valid, invalid, not_performed]
                description: The chip's signature check; only on `emrtd` evidence.
              activeAuth:
                type: string
                enum: [valid, invalid, not_performed]
                description: The chip's clone check; only on `emrtd` evidence.
              faceMatch:
                type: number
                description: The face match score, 0 to 1; absent when no face was matched.
              liveness:
                type: string
                enum: [passed, failed, not_performed]
              documentCheck:
                type: object
                description: >-
                  The document scan's result on a photographed document (`document_photo`);
                  absent without one. A `fake` document, or `fields` `invalid`, rejected the
                  session; `doubtful`, or `zones` `invalid`, sent it to review.
                properties:
                  verdict:
                    type: string
                    enum: [authentic, doubtful, fake]
                  score:
                    type: number
                    description: The scan service's confidence the document is genuine, 0 to 1 (-1 when it could not tell).
                  fields:
                    type: string
                    enum: [valid, invalid, not_performed]
                    description: Whether every field the scan validated (number, names, dates) was valid.
                  zones:
                    type: string
                    enum: [valid, invalid, not_performed]
                    description: Whether every field read twice (MRZ and printed text) read the same.
                required: [verdict, fields, zones]
            required: [type]
        diplomas:
          type: array
          description: The DUO diploma extracts the person added, each checked against DUO's signature and the proofed identity. Absent when there are none.
          items:
            $ref: '#/components/schemas/ProofingDiploma'
        address:
          description: The address the person entered, without `registered`.
          allOf:
            - $ref: '#/components/schemas/ProofingAddress'
        employment:
          $ref: '#/components/schemas/ProofingEmployment'
        addressReview:
          type: string
          enum: [pending, confirmed, rejected, lapsed]
          description: >-
            The review of an address the registered (BRP) address did not confirm: `pending`
            until a reviewer confirms or rejects it, `lapsed` when nobody did within the request's
            data retention. Absent on a registered address and without an address.
        photo:
          description: The document's portrait, for an approval; absent once the engine dropped it.
          allOf:
            - $ref: '#/components/schemas/ProofingImage'
        documentImage:
          description: The photo of the document's front, for an approval of a flow that photographs it.
          allOf:
            - $ref: '#/components/schemas/ProofingImage'
        documentImageBack:
          description: >-
            The photo of the document's back (a residence permit's back, a passport's personal
            number page), for an approval of a flow that photographs it.
          allOf:
            - $ref: '#/components/schemas/ProofingImage'
      required: [id, status, evidence]
    ProofingApiMethodStart:
      type: object
      properties:
        id:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        method:
          type: string
          enum: [idem_app, yivi_app, browser]
        appLink:
          type: string
          description: >-
            The Idem app's link, for `idem_app`: `vcmrtd://verify`, or the https App Link where
            the deployment sets one. Absent for `browser`.
        walletLink:
          type: string
          description: The Yivi app's link, for `yivi_app`. Absent for `browser`.
        expiresAt:
          type: string
          format: date-time
      required: [id, method, expiresAt]
    ProofingApiMethodStatus:
      type: object
      properties:
        id:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        method:
          type: string
          enum: [idem_app, yivi_app, browser]
        status:
          type: string
          enum: [pending, in_progress, approved, rejected, needs_review, expired, cancelled]
        done:
          type: boolean
          description: True once the session has an outcome or ended.
      required: [id, method, status, done]
    ProofingWebhookEvent:
      type: object
      description: >-
        What the organisation's webhook endpoint receives: a POST signed in `Yivi-Signature`
        (`t=<unix>,v1=<hex HMAC-SHA256 of "<t>.<body>">` with the endpoint's `whsec_…`
        secret; for 24 hours after a rotation a second `v1` under the previous one), with `Yivi-Event` and `Yivi-Delivery` headers. Answer 2xx; anything else
        is tried up to 8 times in all over about 24 hours. An event can arrive more than once
        (deduplicate on `id`) and out of order, and a session can skip one (a session decided
        before its start was seen sends no `session.started`): read the session for its
        current state.
      properties:
        id:
          type: string
          format: uuid
          description: The delivery's id; the same on every retry.
        type:
          type: string
          enum: [session.created, session.started, session.handover, session.verified, session.failed, session.review_opened, session.expired, session.cancelled, session.purged, session.diploma_added, session.address_added, session.address_reviewed, session.employment_added, session.step_reviewed, test]
        createdAt:
          type: string
          format: date-time
        data:
          type: object
          description: >-
            Only `session.verified` (its `result`), `session.diploma_added`,
            `session.address_added` and `session.employment_added` carry a person's data. A
            `test` event's data is only `message`.
          properties:
            sessionId:
              type: string
              pattern: '^ps_[a-z2-7]{26}$'
            status:
              type: string
              enum: [pending, in_progress, approved, rejected, needs_review, expired, cancelled]
              description: >-
                The status the event brings the session to. On `session.purged` and the extra
                step events it is the stored status, which for a session that ended without an
                outcome can still read `pending`, `in_progress` or `needs_review`. Read the
                session for its current `status`.
            flowId:
              type: string
            flowKind:
              type: string
              enum: [identity, data_access, data_erasure]
              description: >-
                What the session is for: an identity check, or a person's request to see
                (`data_access`) or erase (`data_erasure`) their data.
            method:
              type: string
            assuranceLevel:
              type: string
            eidasLevel:
              type: string
            errorCode:
              type: string
              example: IDENTITY_MISMATCH
            reviewReason:
              type: string
              enum: [no_current_employment, current_benefit, current_other_income]
              description: >-
                Why the wallet sent the session to review after its identity was approved,
                as on the session. Absent otherwise.
            expectedSubject:
              type: boolean
              description: Only present, as true, on a session created for one person.
            cancelledBy:
              type: string
              enum: [api_key, member, subject]
              description: On `session.cancelled`, who cancelled it, as on the session.
            expiryReason:
              type: string
              enum: [not_started, not_finished, review_ended]
              description: >-
                Why it expired, as on the session: on `session.expired`, and on any other event
                that reports the status `expired`.
            result:
              description: >-
                Only on `session.verified`: the session's result as `GET
                /proofing/sessions/{id}/result` answers it, read when the event is sent (so
                audited `identity_proofing.result_read`), and never stored with the event.
                Absent when the session was erased before it went out.
              allOf:
                - $ref: '#/components/schemas/ProofingApiResult'
            address:
              description: >-
                Only on `session.address_added`: the address the person entered, without
                `registered`. Absent when the session was erased before the event went out.
              allOf:
                - $ref: '#/components/schemas/ProofingAddress'
            employment:
              description: >-
                Only on `session.employment_added`. Absent when the session was erased before
                the event went out.
              allOf:
                - $ref: '#/components/schemas/ProofingEmployment'
            addressReview:
              type: string
              enum: [confirmed, rejected]
              description: Only on `session.address_reviewed`, the reviewer's decision.
            step:
              type: object
              description: Only on `session.step_reviewed`, the step and the reviewer's decision.
              properties:
                kind:
                  type: string
                  enum: [employment, diplomas]
                state:
                  type: string
                  enum: [confirmed, rejected]
            steps:
              type: array
              description: >-
                The flow's extra steps, each with its own outcome, when it asks for any. Absent on
                events after the session was erased. `session.purged` itself still carries them,
                as they stood just before the erasure.
              items:
                $ref: '#/components/schemas/ProofingStep'
            diploma:
              type: object
              description: >-
                Only on `session.diploma_added`. Absent when the session was erased before the
                event went out.
              properties:
                qualification:
                  type: string
                institution:
                  type: string
                dateAwarded:
                  type: string
                  format: date
                nlqfLevel:
                  type: string
                eqfLevel:
                  type: string
            message:
              type: string
              description: Only on `test`.
      required: [id, type, createdAt, data]
      example:
        id: 0b9d3c1e-7f2a-4e6b-9c8d-5a4f3e2d1c0b
        type: session.verified
        createdAt: "2026-10-02T09:34:13Z"
        data:
          sessionId: ps_q4r7tz2mxk3vbn6hw5jc2dfa7e
          status: approved
          flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
          flowKind: identity
          method: idem_app
          assuranceLevel: substantial
          eidasLevel: substantial
    ProofingDiploma:
      type: object
      description: A DUO diploma extract the person added, as DUO printed it. Never the PDF, the name or the date of birth.
      properties:
        documentType:
          type: string
        qualification:
          type: string
        profiles:
          type: array
          items:
            type: string
        institution:
          type: string
        placeOfIssue:
          type: string
        dateAwarded:
          type: string
          format: date
        nlqfLevel:
          type: string
        eqfLevel:
          type: string
        documentNumber:
          type: string
        signedAt:
          type: string
          format: date-time
        addedAt:
          type: string
          format: date-time
      required: [documentType, qualification, profiles, institution, placeOfIssue, dateAwarded, documentNumber, addedAt]
    ProofingHostedDiploma:
      type: object
      description: >-
        A DUO diploma extract as the hosted page lists it: only what the subject needs to
        recognise it. The link's token alone opens the page, so the document number and the
        rest of `ProofingDiploma` are left out.
      properties:
        qualification:
          type: string
        institution:
          type: string
        dateAwarded:
          type: string
          format: date
        nlqfLevel:
          type: string
      required: [qualification, institution, dateAwarded]
    ProofingDiplomaVerdictList:
      type: array
      description: What became of each uploaded file, in upload order.
      items:
        type: object
        properties:
          fileName:
            type: string
          accepted:
            type: boolean
          diploma:
            $ref: '#/components/schemas/ProofingDiploma'
          reason:
            type: string
            enum: [not_a_diploma, signature_invalid, holder_mismatch, duplicate, seal_check_pending]
            description: >-
              Why a file was refused; `seal_check_pending` is one not refused but kept for a
              reviewer, as its seal could not be checked.
          failedCheck:
            type: string
            description: Which signature or holder check failed, for a refused file.
        required: [fileName, accepted]
    ProofingDiplomaUpload:
      type: object
      properties:
        file:
          type: array
          maxItems: 10
          description: The DUO diploma extract PDFs, each at most 5 MiB, sent as repeated `file` parts.
          items:
            type: string
            format: binary
      required: [file]
    ProofingDocumentUpload:
      type: object
      properties:
        file:
          type: array
          maxItems: 11
          description: The PDFs, each at most 5 MiB, sent as repeated `file` parts.
          items:
            type: string
            format: binary
      required: [file]
    ProofingDocumentVerdictList:
      type: array
      description: What became of each uploaded file, in upload order.
      items:
        type: object
        properties:
          fileName:
            type: string
          kind:
            type: string
            enum: [diploma, employment]
            description: The document the file's seal names; absent for one the step does not take.
          accepted:
            type: boolean
          diploma:
            $ref: '#/components/schemas/ProofingDiploma'
          employment:
            $ref: '#/components/schemas/ProofingEmployment'
          reason:
            type: string
            enum: [not_supported, not_asked, too_many, check_failed, duplicate, not_a_diploma, not_a_statement, signature_invalid, holder_mismatch, stale, seal_check_pending]
            description: >-
              Why a file was refused; `seal_check_pending` is one not refused but kept for a
              reviewer, as its seal could not be checked.
          failedCheck:
            type: string
            description: Which seal check failed, with `signature_invalid`.
        required: [fileName, accepted]
    ProofingFlowEmployment:
      type: object
      additionalProperties: false
      properties:
        employmentMode:
          type: string
          enum: ['off', required, always_review]
          description: >-
            Required. Whether the flow asks for the UWV Verzekeringsbericht after the identity check: `off`,
            `required`, or `always_review` (asked, and always checked by a reviewer).
      required: [employmentMode]
    ProofingEmployment:
      type: object
      description: What was kept of a subject's UWV Verzekeringsbericht, checked against UWV's seal and the proofed identity. Only the relations current on the statement's date; never past ones, the PDF, the holder, the hours or the wages.
      properties:
        statementDate:
          type: string
          format: date
          description: The day UWV made the statement.
        employed:
          type: boolean
          description: A current relation that is not a benefit (a job with hours worked in one of the last two months, or sick pay through the employer). Without one the session goes to review (`reviewReason` `no_current_employment`).
        relations:
          type: array
          description: The employment and benefit relations current on the statement's date (reporting a month at most two months before its month, as payroll is filed a month late), one per employer and contract; empty when none is.
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [employment, benefit, other_income]
                description: '`benefit` is a benefit UWV pays, recognised as HDN''s Inkomensbepaling Loondienst does (Appendix 5) by its description and loonheffingennummer. Sick pay through the employer is that employer''s `employment`. `other_income` is a current payment without hours worked from any other payer: a pension, AOW, social assistance, or a final payment.'
              employer:
                type: string
                description: The employer or paying body (`Werkgever/Instantie`); `UWV` for a UWV benefit. Never a benefit's name, which can tell of sickness, disability or pregnancy.
              payrollTaxNumber:
                type: string
                description: Its `Loonheffingennummer`; empty for a UWV benefit.
              contractForm:
                type: string
                description: The printed `Contractvorm`; empty when the statement prints none.
              from:
                type: string
                format: date
                description: Since when, the first day of the relation's first month on the statement.
              to:
                type: string
                format: date
                description: The last day of the newest month the statement reports for it.
            required: [kind, employer, payrollTaxNumber, contractForm, from, to]
      required: [statementDate, employed, relations]
    ProofingEmploymentVerdict:
      type: object
      properties:
        fileName:
          type: string
        accepted:
          type: boolean
        employment:
          $ref: '#/components/schemas/ProofingEmployment'
        reason:
          type: string
          enum: [not_a_statement, signature_invalid, holder_mismatch, stale, seal_check_pending]
          description: >-
            Why the file was refused; `seal_check_pending` is one not refused but kept for a
            reviewer, as its seal could not be checked.
        failedCheck:
          type: string
          description: Which seal check failed, with `signature_invalid`.
      required: [fileName, accepted]
    ProofingEmploymentUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: The Verzekeringsbericht PDF as downloaded from Mijn UWV, at most 5 MiB.
      required: [file]
    ProofingFlowSpec:
      type: object
      description: >-
        A flow's configuration, sent to create a flow or save its next version. Only `name` is
        always required. `steps` is required too, unless a `requiredAssuranceLevel` of `low` or
        `substantial` adds the steps it needs. Unknown fields are refused (400 `invalid_body`).
      properties:
        name:
          type: string
          description: Required. The flow's name, shown in the wallet.
        steps:
          type: array
          minItems: 1
          items:
            type: string
            enum: [document_capture, nfc_read, document_photo, face_verification]
          description: >-
            Required, unless `requiredAssuranceLevel` is `low` or `substantial`. What the person
            does, in order. `document_capture` and `nfc_read` go together: scan the document and
            read its chip.
        requestedAttributes:
          type: array
          items:
            type: string
            enum: [dg1, dg11, dg2, selfie, chip_checks, biometrics, document_image, age_over, outcome_only]
          description: >-
            Optional. What a session's result may carry. Left out or empty, it carries everything
            the steps collect, and the flow read back lists those. `["outcome_only"]` (alone)
            carries only the outcome. `age_over` releases only whether the person is `ageOver` or
            older, and needs `nfc_read` or `document_photo`.
        ageOver:
          type: integer
          minimum: 1
          maximum: 120
          description: Optional, only with `age_over` in `requestedAttributes`. The age in years it answers for, one of 12, 16, 18, 21 or 65 (a flow keeps an age it already has).
        attributeReasons:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
              maxLength: 300
          description: >-
            Optional. Why each requested attribute is collected, by attribute and language
            (`en`, `nl`), shown to the person before they start. Give one for every attribute
            in `requestedAttributes`, in every language the flow's page offers, or the flow is
            refused (400 `invalid_input`).
        selfieLocation:
          type: string
          description: Optional. Ignored.
        faceProvider:
          type: string
          enum: [regula, idscan]
          default: regula
          description: >-
            Optional. What checks the face. `regula` runs in the Idem app; `idscan` runs in the
            browser right after the document photo, and needs the `document_photo` step.
        apps:
          type: array
          items:
            type: string
            enum: [idem, yivi]
          description: >-
            Optional. The apps a session may run in. Default both. Only `yivi`: the flow cannot
            be mailed. Only `idem`: the flow needs a step the Idem app runs.
        acceptedDocumentTypes:
          type: array
          items:
            type: string
          description: >-
            Optional. The documents accepted: kinds (`passport`, `identity_card`,
            `residence_permit`), `drivers_license` (Dutch only), or `personal_data` (the BRP data
            the Yivi app shares, only on a flow the Yivi app runs, and next to the Idem app only
            with a document kind as well, or 422 `rejected_by_provider`). Default any document; all
            four kinds alone is stored as any document.
        acceptedIssuingCountries:
          type: array
          items:
            type: string
            pattern: '^[A-Z]{3}$'
          description: >-
            Optional. 3-letter ICAO codes (ISO 3166-1 alpha-3, or an ICAO code such as `EUE`).
            Default any country. An unknown code is refused (422 `rejected_by_provider`).
        requiredChecks:
          type: array
          items:
            type: string
          description: >-
            Optional. The checks an approval needs, such as `nfc.passive_auth`,
            `nfc.chip_auth`, `face.match` and `face.liveness`. Default none.
        checkThresholds:
          type: object
          additionalProperties:
            type: number
          description: >-
            Optional. Only `face.match` takes one: the similarity from 0 to 1 the face must
            reach. Default the deployment's. At least 0.75 on a flow requiring `substantial`.
        requiredAssuranceLevel:
          type: string
          enum: [none, low, substantial]
          default: none
          description: >-
            Optional. The eIDAS level an approval must reach. The flow gets the steps and checks
            that level needs, added to what you send (see "Assurance levels" in the
            introduction). `none` requires no level. `high` is refused: no check here reaches it.
        bsnPolicy:
          type: string
          enum: [retrieve, mask, omit]
          default: omit
          description: Optional. What happens to the BSN. `omit` drops it before it is stored.
        keepFacePhotos:
          type: boolean
          default: false
          description: >-
            Optional. `true` keeps the face photos in the result. By default they are dropped
            once the face match is done.
        blurBsn:
          type: boolean
          default: false
          description: Optional. `true` covers the BSN on a document photo.
        retentionOverrideSeconds:
          type: integer
          minimum: 0
          description: >-
            Optional. How long finished sessions keep their data, in seconds: 86400, 2592000 or
            7776000 (1, 30 or 90 days), or 0 to follow the organisation's retention. Default 0.
        sessionTtlSeconds:
          type: integer
          enum: [120, 300, 600]
          default: 600
          description: Optional. How long a session of this flow runs.
        assuranceTiers:
          type: array
          items:
            type: object
            properties:
              level:
                type: string
                description: Required. The level this tier gives.
              minPercent:
                type: number
                description: Required. The score from which it applies.
            required: [level, minPercent]
          description: Optional. Refused (400 `invalid_input`) unless it equals the version's; leave it out to keep the version's.
        legalBasis:
          type: string
          description: Optional. Refused (400 `invalid_input`) unless it equals the version's; leave it out to keep the version's.
        processingPurpose:
          type: string
          description: Optional. Refused (400 `invalid_input`) unless it equals the version's; leave it out to keep the version's.
        alwaysReview:
          type: boolean
          default: false
          description: >-
            Optional. `true` sends a session the checks would approve to `needs_review`
            instead. A rejection stays a rejection.
      required: [name]
    ProofingFlow:
      description: >-
        A flow version as the organisation sees it. `allowed`, `default`, `diplomaMode`,
        `addressMode`, `employmentMode`, `kind`, `hostedEnabled`, `hostedReturnUrl` and
        `retentionDays` are only meaningful in a flow list. A single version (create, edit,
        versions, activate) reads `allowed` and `default` false and leaves `diplomaMode`,
        `addressMode`, `employmentMode`, `kind`, `hostedEnabled`, `hostedReturnUrl` and
        `retentionDays` out.
      allOf:
        - $ref: '#/components/schemas/ProofingFlowSpec'
        - type: object
          properties:
            id:
              type: string
              description: Stable across versions.
            version:
              type: integer
            active:
              type: boolean
              description: The version new requests run.
            createdAt:
              type: string
              format: date-time
            browserOnly:
              type: boolean
              description: >-
                The page runs every step of the flow by itself, so no app is chosen: a flow of
                only the document photo, say.
            completable:
              type: boolean
              description: False for a flow a recipient cannot finish with only the Idem app; it cannot be made available to members.
            allowed:
              type: boolean
              description: An administrator made the flow available to members.
            default:
              type: boolean
              description: >-
                The organisation's one default flow: the one sent to an external person that
                names no flow, and the one the request form preselects. Independent of
                `allowed`.
            diplomaMode:
              type: string
              enum: ['off', required, always_review]
            addressMode:
              type: string
              enum: ['off', required, always_review]
            employmentMode:
              type: string
              enum: ['off', required, always_review]
            needsReferencePhoto:
              type: boolean
              description: The face is matched against a reference photo; only the API can send such a flow.
            kind:
              type: string
              enum: [identity, data_access, data_erasure]
              description: >-
                What the flow's sessions are for: an identity check, or a person asking for their
                data (`data_access`) or its erasure (`data_erasure`), which only the
                `data-request-flows` list holds; absent on a single version.
            hostedEnabled:
              type: boolean
              description: >-
                The flow's "Allow sending this flow as a link" switch (its hosted page's
                `enabled`): off, the wallet's Verify a person dialog offers only Show on this
                screen. Absent on a single version.
            hostedReturnUrl:
              type: string
              description: >-
                The flow's return page (its hosted page's `returnUrl`), where its links send the
                person once the session settles. Absent for none and on a single version.
            retentionDays:
              type: integer
              description: >-
                The most days an external person's data is kept on this flow: the flow's
                retention when it sets one, else the organisation's `dataRetentionDays`, plus
                the day the proofing engine keeps its copy longer, rounded up to whole days.
                What the on-screen page tells the person; absent on a single version.
          required: [id, steps, version, active, createdAt, completable, allowed, default, needsReferencePhoto]
    ProofingFlowList:
      type: array
      items:
        $ref: '#/components/schemas/ProofingFlow'
    ProofingFlowSelection:
      type: object
      additionalProperties: false
      properties:
        flowIds:
          type: array
          items:
            type: string
          description: >-
            Optional. The flows members may send in the wallet, replacing the list. `[]`, or
            leaving it out, is none.
        defaultFlowId:
          type: string
          description: >-
            Optional. The default flow: the one a session without `flowId` runs. Any active
            identity flow, whether or not it is in `flowIds`. Leave it out or send `""` for
            none.
    ProofingFlowHosted:
      type: object
      properties:
        enabled:
          type: boolean
          description: Hosted links may be made for the flow.
        locales:
          type: array
          description: The languages the page offers; empty is every one.
          items:
            type: string
            enum: [en, nl]
        completion:
          type: string
          enum: [redirect, done]
        returnUrl:
          type: string
          description: >-
            Where a link for the flow sends the person when it names no `redirectUrl` of its
            own; empty for none.
      required: [enabled, locales, completion, returnUrl]
    ProofingFlowHostedUpdate:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: Required. Whether the flow may be sent as a hosted link.
        completion:
          type: string
          enum: [redirect, done]
          description: >-
            Required. How the page ends: `redirect` sends the person to the return page,
            `done` always shows the page's own thank-you screen.
        locales:
          type: array
          items:
            type: string
            enum: [en, nl]
          description: Optional. The languages the page offers. Default every language.
        returnUrl:
          type: string
          description: >-
            Optional, only with `completion: redirect`. The return page, on one of the
            organisation's `allowedRedirectOrigins`. Leave it out for no return page.
      required: [enabled, completion]
    ProofingDataMatches:
      type: object
      properties:
        flowKind:
          type: string
          enum: [identity, data_access, data_erasure]
        matches:
          type: array
          items:
            type: object
            properties:
              requestId:
                type: string
                format: uuid
              sessionId:
                type: string
                pattern: '^ps_[a-z2-7]{26}$'
              flowName:
                type: string
              status:
                type: string
              method:
                type: string
              assuranceLevel:
                type: string
              eidasLevel:
                type: string
              createdAt:
                type: string
                format: date-time
              completedAt:
                type: string
                format: date-time
              purgedAt:
                type: string
                format: date-time
              level:
                type: string
                enum: [strong, probable, email]
                description: >-
                  strong when proven with the same document, probable on name and date of birth
                  alone, email an unfinished session to the same address (no proofed identity).
              approved:
                type: boolean
                description: The reviewer's choice; absent until the decision.
              heldUntil:
                type: string
                format: date-time
                description: >-
                  When the organisation's legal retention lets an erasure take the session, an
                  approved identity check; absent when none applies or it passed, and on a
                  request that is not an erasure. An erasure approval naming a session before then is 409
                  `legal_retention`.
            required: [requestId, sessionId, flowName, status, createdAt, level]
      required: [flowKind, matches]
    ProofingDataExport:
      type: object
      description: >-
        An approved `data_access` session's data: each session the reviewer approved, with what
        the check read. Images are named in `imagesHeld`, never included.
      properties:
        sessionId:
          type: string
          description: The data request's own session.
        exportedAt:
          type: string
          format: date-time
        sessions:
          type: array
          items:
            type: object
            properties:
              sessionId:
                type: string
              flow:
                type: string
              status:
                type: string
              method:
                type: string
              assuranceLevel:
                type: string
              eidasLevel:
                type: string
              createdAt:
                type: string
                format: date-time
              completedAt:
                type: string
                format: date-time
              purgeAt:
                type: string
                format: date-time
              purgedAt:
                type: string
                format: date-time
              match:
                type: string
                enum: [strong, probable, email, name]
              contact:
                type: object
                properties:
                  name:
                    type: string
                  email:
                    type: string
              identity:
                type: object
                properties:
                  givenName:
                    type: string
                  familyName:
                    type: string
                  birthDate:
                    type: string
                  nationality:
                    type: string
                  evidence:
                    type: object
                  imagesHeld:
                    type: array
                    items:
                      type: string
                      enum: [documentPortrait, selfie, referencePhoto, documentFront, documentBack]
              diplomas:
                type: array
                items:
                  $ref: '#/components/schemas/ProofingDiploma'
              address:
                $ref: '#/components/schemas/ProofingAddress'
              employment:
                $ref: '#/components/schemas/ProofingEmployment'
      required: [sessionId, exportedAt, sessions]
    ProofingFlowAddress:
      type: object
      additionalProperties: false
      properties:
        addressMode:
          type: string
          enum: ['off', required, always_review]
          description: >-
            Required. Whether the flow asks for the postal address after the identity check: `off`,
            `required`, or `always_review` (asked, and always checked by a reviewer).
      required: [addressMode]
    ProofingAddress:
      type: object
      description: The postal address a subject entered, as they declared it; not read off a document.
      properties:
        street:
          type: string
          maxLength: 200
        houseNumber:
          type: string
          maxLength: 200
        postalCode:
          type: string
          maxLength: 200
        city:
          type: string
          maxLength: 200
        country:
          type: string
          maxLength: 200
        verification:
          type: string
          readOnly: true
          enum: [verified, unchecked, unsupported, registered, registered_mismatch]
          description: >-
            How the address was checked when it was kept: `verified` is in the Dutch address
            register and written as the register writes it, `unchecked` has a Dutch postal code
            but the register could not be reached, `unsupported` is outside the Netherlands.
            `registered` is the registered (BRP) address the subject's Yivi app disclosed,
            `registered_mismatch` differs from it. Only `registered` confirms where the person
            lives; the others are self-declared, `verified` too (the address exists, not that the
            person lives there). Absent on an address kept before addresses were checked; ignored
            in a request body.
        registered:
          readOnly: true
          description: >-
            The registered (BRP) address a `registered_mismatch` differs from, as the Yivi
            app disclosed it, for the reviewer. Never sent to the integrator: absent in the API
            result and webhooks. Ignored in a request body.
          allOf:
            - $ref: '#/components/schemas/ProofingAddress'
      required: [street, houseNumber, postalCode, city, country]
    ProofingAddressLookup:
      type: object
      properties:
        addresses:
          type: array
          items:
            type: object
            description: An address as the Dutch address register writes it.
            properties:
              street:
                type: string
              houseNumber:
                type: string
                description: With its letter and addition, as `12A` or `1-2`.
              postalCode:
                type: string
                description: Written `1015 CP`.
              city:
                type: string
            required: [street, houseNumber, postalCode, city]
      required: [addresses]
    ProofingFlowDiplomas:
      type: object
      additionalProperties: false
      properties:
        diplomaMode:
          type: string
          enum: ['off', required, always_review]
          description: >-
            Required. Whether the flow asks for DUO diploma extracts after the identity check: `off`,
            `required`, or `always_review` (asked, and always checked by a reviewer).
      required: [diplomaMode]
    ProofingRequest:
      type: object
      description: A proofing request as the organisation sees it.
      properties:
        id:
          type: string
          format: uuid
        requestedById:
          type: string
          format: uuid
          description: >-
            The member who sent it; absent for one sent through the API, and once that member's
            account is gone. A reviewer does not decide an identity check they sent.
        requestedByName:
          type: string
          description: The member who sent it, or the API key's name.
        apiKeyName:
          type: string
          description: The API key it was sent with.
        subjectUserId:
          type: string
          format: uuid
          description: The member being proofed, for a member's request.
        external:
          type: boolean
          description: The request went to an external person (no login), not to a member.
        subjectName:
          type: string
        subjectEmail:
          type: string
        proofedName:
          type: string
          description: The name read off an external person's approved document, until its retention clears it.
        flowId:
          type: string
        flowName:
          type: string
        flowVersion:
          type: integer
        method:
          type: string
          enum: [idem_app, yivi_app, browser]
        status:
          type: string
          enum: [pending, in_progress, approved, rejected, needs_review, expired, cancelled]
        assuranceLevel:
          type: string
        eidasLevel:
          type: string
          enum: [low, substantial, high]
        errorCode:
          type: string
          example: IDENTITY_MISMATCH
        linkExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        purgeAt:
          type: string
          format: date-time
          description: When its personal data is due to be erased.
        purgedAt:
          type: string
          format: date-time
        diplomaMode:
          type: string
          enum: ['off', required, always_review]
        diplomas:
          type: array
          items:
            $ref: '#/components/schemas/ProofingDiploma'
        diplomasUntil:
          type: string
          format: date-time
          description: When the person can last add a diploma extract; absent until the identity is approved.
        addressMode:
          type: string
          enum: ['off', required, always_review]
        address:
          $ref: '#/components/schemas/ProofingAddress'
        addressUntil:
          type: string
          format: date-time
          description: When the person can last enter their address; absent until the identity is approved, and once they did.
        addressReview:
          type: string
          readOnly: true
          enum: [pending, confirmed, rejected, lapsed]
          description: >-
            The review of an address the registered (BRP) address did not confirm: `pending`
            until a reviewer confirms or rejects it, `lapsed` when nobody did within the request's
            data retention. Absent on a registered address, without an address, and once a
            pending one was erased.
        addressReviewedAt:
          type: string
          format: date-time
          readOnly: true
          description: When a reviewer confirmed or rejected the address, or it lapsed; absent while it waits.
        identityReviewedAt:
          type: string
          format: date-time
          readOnly: true
          description: When a reviewer last approved or rejected the identity check in review; absent when none did.
        stepReviewDueAt:
          type: string
          format: date-time
          readOnly: true
          description: When the first waiting step review (address, Verzekeringsbericht) lapses unanswered (`REVIEW_LAPSED`); absent while none waits.
        decisions:
          type: array
          readOnly: true
          description: >-
            What reviewers decided, oldest first: the session's review (`kind: review`, outcome
            `approved` or `rejected`) and its address (`kind: address`, outcome `confirmed` or
            `rejected`), each with its reason, reviewer and time, read from the request's audit
            events. Only on `GET .../requests/{requestID}`, and only for an administrator or a
            member with the reviewer right; one who reaches the check only for its address gets
            the address decisions alone. A purge erases the reasons.
          items:
            type: object
            required: [kind, outcome, decidedAt]
            properties:
              kind:
                type: string
                enum: [review, address]
              outcome:
                type: string
              reason:
                type: string
              errorCode:
                type: string
              decidedBy:
                type: string
                description: The reviewer's name; absent when the wallet decided on its own.
              decidedAt:
                type: string
                format: date-time
        employmentMode:
          type: string
          enum: ['off', required, always_review]
        employment:
          $ref: '#/components/schemas/ProofingEmployment'
        employmentUntil:
          type: string
          format: date-time
          description: When the person can last upload their Verzekeringsbericht; absent until the identity is approved, and once one was kept.
        reviewReason:
          type: string
          enum: [no_current_employment, current_benefit, current_other_income]
          description: Why the kept Verzekeringsbericht went to review (no current job, a current UWV benefit, or other current income paid without hours worked). A reviewer's decision settles the employment step, never the session. Absent otherwise.
        employmentReview:
          type: string
          readOnly: true
          enum: [pending, confirmed, rejected, lapsed]
          description: The review of the kept Verzekeringsbericht, when it went to one.
        employmentReviewedAt:
          type: string
          format: date-time
          readOnly: true
          description: When a reviewer decided the statement's review, or it lapsed.
        diplomasReview:
          type: string
          readOnly: true
          enum: [pending, confirmed, rejected, lapsed]
          description: The review of the kept diploma extracts, on a flow that sends them to one.
        diplomasReviewedAt:
          type: string
          format: date-time
          readOnly: true
          description: When the diplomas review was decided or lapsed.
        uncheckedDiplomas:
          type: integer
          readOnly: true
          description: >-
            How many diploma extracts wait for a reviewer to check their seal again, as it could
            not be checked at upload; absent for none. The diplomas review cannot be confirmed
            before.
        uncheckedEmployment:
          type: boolean
          readOnly: true
          description: >-
            The Verzekeringsbericht waits for a reviewer to check its seal again, as it could not
            be checked at upload; absent otherwise. The employment review cannot be confirmed
            before.
        sealChecks:
          type: array
          readOnly: true
          description: >-
            The files kept for a reviewer as their seal could not be checked at upload, oldest
            first, waiting or decided; absent for none. Only those of a step the caller reaches.
            Their PDFs are deleted once decided; the names and outcomes at the session's purge.
          items:
            type: object
            properties:
              kind:
                type: string
                enum: [diplomas, employment]
              fileName:
                type: string
              outcome:
                type: string
                description: >-
                  Empty while it waits; `kept`; `not_checked` when the step's review closed
                  first; else why it was refused (`signature_invalid`, `holder_mismatch`,
                  `not_a_diploma`, `not_a_statement`, `stale`, `duplicate`).
              uploadedAt:
                type: string
                format: date-time
              checkedAt:
                type: string
                format: date-time
                nullable: true
            required: [kind, fileName, outcome, uploadedAt]
        steps:
          type: array
          readOnly: true
          description: >-
            The extra steps the flow asks for (the address, DUO diplomas, the
            Verzekeringsbericht), each with its own outcome beside the identity's: a step never
            changes the session's `status`.
          items:
            $ref: '#/components/schemas/ProofingStep'
        flowAlwaysReview:
          type: boolean
          description: Set on a request in `needs_review` whose flow version sends every session to review. Absent otherwise.
        documentScan:
          type: string
          enum: [pending, done]
          description: The document photo, taken in the browser through `document-scan/start`; absent when the flow takes none.
        expectedSubject:
          type: boolean
        flowKind:
          type: string
          enum: [identity, data_access, data_erasure]
          description: A data request (`data_access`, `data_erasure`) goes to review once the person is proven.
        dataExportUntil:
          type: string
          format: date-time
          description: Until when an approved `data_access` session's data downloads.
      required: [id, requestedByName, external, subjectName, subjectEmail, flowId, flowName, status, linkExpiresAt, createdAt, diplomaMode, diplomas, addressMode, expectedSubject]
    ProofingRequestList:
      type: array
      items:
        $ref: '#/components/schemas/ProofingRequest'
    ProofingCreateRequest:
      type: object
      additionalProperties: false
      description: >-
        A member (`userId`), or without `userId` an external person (`email` and an optional
        `name` and `birthDate`).
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          maxLength: 200
        flowId:
          type: string
          description: >-
            For a member, a flow members may use. For an external person, any flow a recipient
            can finish when the sender is an organisation admin, else a flow members may use;
            absent is the organisation's default flow.
        flowKind:
          type: string
          enum: [identity, data_access, data_erasure]
          description: >-
            `data_access` or `data_erasure` sends a data request on the organisation's own flow
            of that kind, from an administrator to an external person; absent or `identity` is
            an identity check on `flowId`.
        method:
          type: string
          enum: [idem_app, yivi_app, browser, pending]
          description: >-
            Absent follows the flow: `browser` for a flow the page runs alone (`browserOnly`),
            else `idem_app`. `browser` is taken only for such a flow, and the apps only for any
            other. `pending`, on screen only, starts the session with the flow and leaves the app
            to `/method`.
        channel:
          type: string
          enum: [email, on_screen, hosted]
          default: email
        language:
          type: string
          enum: [en, nl]
        birthDate:
          type: string
          format: date
        redirect:
          type: boolean
          default: true
          description: >-
            With `channel: hosted`, false ends the link on its own thank-you screen though the
            flow has a return page (`hostedReturnUrl`).
    ProofingCreatedRequest:
      allOf:
        - $ref: '#/components/schemas/ProofingRequest'
        - type: object
          properties:
            mailSent:
              type: boolean
              description: False when the mail could not be sent; the request stands.
            deepLink:
              type: string
              description: An on-screen Idem request's `vcmrtd://` link, to show as a QR code.
            deepLinkExpiresAt:
              type: string
              format: date-time
            hostedUrl:
              type: string
              format: uri
              description: A hosted request's link, valid 72 hours.
          required: [mailSent]
    ProofingReviewDecision:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum: [approve, reject]
        reason:
          type: string
          maxLength: 500
        errorCode:
          type: string
          enum: [REVIEW_NOT_HOLDER, REVIEW_ALTERED, EVIDENCE_NOT_AS_REQUESTED, MANUAL_REVIEW_REJECTED]
          description: >-
            Only with `reject`: what the reviewer found wrong. It is someone else's, it looks
            altered, it is not what was asked for, or something else; absent is
            `MANUAL_REVIEW_REJECTED`.
        requestIds:
          type: array
          items:
            type: string
            format: uuid
          description: >-
            Only on a data request: the matched sessions an approval takes. Absent takes, for an
            erasure, the `strong` and `probable` ones (the same name and date of birth off a
            verified chip) and, for an access request, the `strong` ones; any other is taken
            only when listed. An erasure purges them, and one an automatic erasure purged
            already counts as taken. An access request opens their data for download.
      required: [decision, reason]
    ProofingClaimLink:
      type: object
      properties:
        deepLink:
          type: string
          description: The Idem app's `vcmrtd://` link, to show as a QR code.
        expiresAt:
          type: string
          format: date-time
      required: [deepLink, expiresAt]
    ProofingAppState:
      type: object
      properties:
        app:
          type: string
          enum: [waiting, connected, away, finished]
      required: [app]
    ProofingChooseMethod:
      type: object
      additionalProperties: false
      properties:
        method:
          type: string
          enum: [idem_app, yivi_app]
      required: [method]
    ProofingDocumentScanStartRequest:
      type: object
      properties:
        locale:
          type: string
          description: The page's language; `nl` gets ID Scan's Dutch, anything else its English.
    ProofingDocumentScanStart:
      type: object
      properties:
        url:
          type: string
          description: The ID Scan page the person photographs the document on.
      required: [url]
    ProofingDocumentScanFinishRequest:
      type: object
      properties:
        transactionId:
          type: string
          description: The transaction id the embedded ID Scan page posted when done.
        resultId:
          type: string
          description: The result id the embedded ID Scan page posted when done; absent for a scan that did not complete.
      required: [transactionId]
    ProofingYiviStart:
      type: object
      properties:
        walletLink:
          type: string
          description: The `openid4vp://` request the Yivi app opens.
        expiresAt:
          type: string
          format: date-time
      required: [walletLink, expiresAt]
    ProofingYiviDisclosure:
      type: object
      properties:
        done:
          type: boolean
          description: False while the person has not finished in the Yivi app.
        ok:
          type: boolean
          description: The disclosure approved the session; false rejected it.
        code:
          type: string
          enum: [document_not_accepted, age_not_disclosed, face_not_verified]
      required: [done, ok]
    ProofingRequestEvents:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              occurredAt:
                type: string
                format: date-time
              action:
                type: string
                example: identity_proofing.request_sent
              targetType:
                type: string
              targetId:
                type: string
              metadata:
                type: object
              actor:
                type: object
                nullable: true
                properties:
                  userId:
                    type: string
                    format: uuid
                  preferredName:
                    type: string
                    nullable: true
                  givenNames:
                    type: string
                  lastName:
                    type: string
                  avatarUri:
                    type: string
              actorLabel:
                type: string
                nullable: true
                description: A non-user actor, such as `api_key:<prefix>`.
            required: [id, occurredAt, action, targetType, targetId, metadata, actor, actorLabel]
      required: [events]
    ProofingStats:
      type: object
      properties:
        since:
          type: string
          format: date-time
        rows:
          type: array
          items:
            type: object
            properties:
              flowId:
                type: string
              sessions:
                type: integer
              approved:
                type: integer
              rejected:
                type: integer
              needsReview:
                type: integer
              expired:
                type: integer
              cancelled:
                type: integer
                description: Cancelled before an outcome; not counted in `expired`.
            required: [flowId, sessions, approved, rejected, needsReview, expired, cancelled]
      required: [since, rows]
    ProofingImage:
      type: object
      properties:
        mimeType:
          type: string
        data:
          type: string
          format: byte
          description: The image, standard base64.
      required: [mimeType, data]
    ProofingApiReview:
      type: object
      description: What a reviewer outside the wallet decides a session on.
      properties:
        id:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        status:
          type: string
          enum: [pending, in_progress, approved, rejected, needs_review, expired, cancelled]
        flowKind:
          type: string
          enum: [identity, data_access, data_erasure]
        waiting:
          type: array
          description: The parts that wait for a decision, in the order the review walks them; empty once nothing waits.
          items:
            type: string
            enum: [identity, address, employment, diplomas, data_request]
        items:
          type: array
          description: Every part a reviewer decides, waiting or decided.
          items:
            type: object
            required: [kind, state]
            properties:
              kind:
                type: string
                enum: [identity, address, employment, diplomas, data_request]
              state:
                type: string
                enum: [pending, confirmed, rejected, lapsed]
              decidedAt:
                type: string
                format: date-time
        stepReviewDueAt:
          type: string
          format: date-time
          description: When the first waiting step lapses undecided; absent for none.
        flowAlwaysReview:
          type: boolean
          description: In review because the flow sends every session there, not because the checks doubted it.
        sealChecks:
          type: array
          description: The files whose seal could not be checked at upload, with what became of each.
          items:
            type: object
            required: [kind, fileName, outcome, uploadedAt, checkedAt]
            properties:
              kind:
                type: string
                enum: [diplomas, employment]
              fileName:
                type: string
              outcome:
                type: string
                description: >-
                  Empty while the file waits, then `kept`, the reason it was refused, or
                  `not_checked` when its step closed first.
              uploadedAt:
                type: string
                format: date-time
              checkedAt:
                type: string
                format: date-time
                nullable: true
        decisions:
          type: array
          description: What reviewers decided so far, oldest first.
          items:
            type: object
            required: [kind, outcome, decidedAt]
            properties:
              kind:
                type: string
                enum: [review, address, employment, diplomas]
              outcome:
                type: string
                enum: [approved, rejected, confirmed, lapsed]
                description: >-
                  `approved` or `rejected` for a `review`, `confirmed`, `rejected` or `lapsed`
                  for a step.
              reason:
                type: string
              errorCode:
                type: string
              decidedBy:
                type: string
                description: The member, or the reviewer an API key or review link named.
              decidedAt:
                type: string
                format: date-time
        result:
          $ref: '#/components/schemas/ProofingAdminResult'
      required: [id, status, flowKind, waiting, items, flowAlwaysReview, sealChecks, decisions]
    ProofingReviewLinkPage:
      type: object
      description: What a review link's page shows.
      properties:
        sessionId:
          type: string
        request:
          $ref: '#/components/schemas/ProofingRequest'
        result:
          $ref: '#/components/schemas/ProofingAdminResult'
        reviewer:
          type: string
        expiresAt:
          type: string
          format: date-time
        embedOrigins:
          type: array
          items:
            type: string
        organization:
          type: string
      required: [sessionId, request, reviewer, expiresAt, embedOrigins, organization]
    ProofingAdminResult:
      description: The API's result plus, for an approval and a check in review, the selfie and the reference photo.
      allOf:
        - $ref: '#/components/schemas/ProofingApiResult'
        - type: object
          properties:
            selfie:
              $ref: '#/components/schemas/ProofingImage'
            referencePhoto:
              $ref: '#/components/schemas/ProofingImage'
    ProofingPause:
      type: object
      properties:
        organizationId:
          type: string
          format: uuid
        paused:
          type: boolean
        platformPausedAt:
          type: string
          format: date-time
          description: Set while the wallet's operator has it paused; only the operator lifts it.
        platformPausedBy:
          $ref: '#/components/schemas/ProofingPausedBy'
      required: [organizationId, paused]
    ProofingPausedBy:
      type: object
      description: Who set a pause, while it holds; absent when unknown (set before this was kept, or the user was removed).
      properties:
        userId:
          type: string
          format: uuid
        name:
          type: string
      required: [userId, name]
    ProofingPauseList:
      type: object
      properties:
        pauses:
          type: array
          items:
            $ref: '#/components/schemas/ProofingPause'
      required: [pauses]
    ProofingSetPause:
      type: object
      additionalProperties: false
      properties:
        paused:
          type: boolean
      required: [paused]
    ProofingWebhookHealth:
      type: object
      properties:
        state:
          type: string
          enum: [not_configured, delivering, failing]
        lastStatusCode:
          type: integer
        failingSince:
          type: string
          format: date-time
        pendingRetries:
          type: integer
      required: [state, pendingRetries]
    ProofingBranding:
      type: object
      description: >-
        What the proofing mail, hosted page and Idem app say besides the organisation's theme,
        their one look. The organisation's has no colour or logo; a hosted page's carries its
        flow's own.
      properties:
        displayName:
          type: string
        primaryColor:
          type: string
          description: A flow's own colour over the theme's; empty for the organisation's.
          example: '#1f6feb'
        supportContact:
          type: string
        privacyUrl:
          type: string
        logoUri:
          type: string
          description: Empty without a logo; carries a version so a replaced logo is fetched again.
        hidePoweredBy:
          type: boolean
        showTheme:
          type: boolean
          description: Whether the Idem app and the hosted page wear the organisation's theme.
      required: [displayName, primaryColor, supportContact, privacyUrl, logoUri, hidePoweredBy, showTheme]
    ProofingSettings:
      type: object
      description: What the organisation set once for all its flows.
      properties:
        sessionTtlSeconds:
          type: integer
          description: How long a session runs on a flow without a lifetime of its own, a fixed 600.
        dataRetentionDays:
          type: integer
          description: >-
            How long an external person's data is kept after the check on a flow without a
            retention of its own, a fixed 7.
        erasureHandling:
          type: string
          enum: [review, automatic]
          description: How the organisation's "delete my data" requests are decided once the person is proven.
        legalRetention:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ProofingLegalRetention'
          description: What the law makes the organisation keep; null for none.
        branding:
          $ref: '#/components/schemas/ProofingBranding'
        allowedRedirectOrigins:
          type: array
          description: Where a hosted page may send its subject back to and be embedded on.
          items:
            type: string
      required: [sessionTtlSeconds, dataRetentionDays, erasureHandling, legalRetention, branding, allowedRedirectOrigins]
    ProofingApiSettings:
      type: object
      description: >-
        What the organisation set once for all its flows, as its software reads it: the wallet's
        settings without the branding.
      properties:
        sessionTtlSeconds:
          type: integer
        dataRetentionDays:
          type: integer
        erasureHandling:
          type: string
          enum: [review, automatic]
        legalRetention:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ProofingLegalRetention'
          description: What the law makes the organisation keep; null for none.
        allowedRedirectOrigins:
          type: array
          description: Where a hosted page may send its person back to and be framed on.
          items:
            type: string
      required: [sessionTtlSeconds, dataRetentionDays, erasureHandling, legalRetention, allowedRedirectOrigins]
    ProofingLegalRetention:
      type: object
      additionalProperties: false
      description: >-
        How long the organisation must keep the data of every approved identity check by law,
        counted from the check's end, and why.
      properties:
        months:
          type: integer
          minimum: 1
          maximum: 600
          description: Required. How many months the data must be kept.
        reasonEn:
          type: string
          maxLength: 500
          description: >-
            Required. Why, in English: shown to a person whose "delete my data" request this
            declines, or leaves sessions of.
        reasonNl:
          type: string
          maxLength: 500
          description: Required. The same, in Dutch.
      required: [months, reasonEn, reasonNl]
    ProofingUpdateSettings:
      type: object
      additionalProperties: false
      description: >-
        Send at least one field. A field you leave out stays as it is. `sessionTtlSeconds` and
        `dataRetentionDays` cannot be changed: sending either is refused (400 `invalid_input`),
        since each flow sets its own.
      minProperties: 1
      properties:
        erasureHandling:
          type: string
          enum: [review, automatic]
          description: Optional. How "delete my data" requests are decided once the person is proven.
        legalRetention:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ProofingLegalRetention'
          description: Optional. What the law makes the organisation keep. `null` removes it.
        allowedRedirectOrigins:
          type: array
          maxItems: 10
          items:
            type: string
          description: >-
            Optional. Replaces the list of origins a hosted page may send its person back to
            and be framed on: each `https://host[:port]` (or `http` on `localhost`, `127.0.0.1`
            or `[::1]`). An origin a
            flow's return page is on cannot be removed (409 `redirect_origin_in_use`).
    ProofingBrandingForm:
      type: object
      properties:
        displayName:
          type: string
        supportContact:
          type: string
        privacyUrl:
          type: string
          description: An https URL.
        hidePoweredBy:
          type: string
          enum: ['true', 'false']
        showTheme:
          type: string
          enum: ['true', 'false']
          description: Left out keeps it as it is.
    ProofingFlowBranding:
      type: object
      properties:
        custom:
          type: boolean
          description: False is the organisation's branding, and the other fields are empty.
        displayName:
          type: string
        primaryColor:
          type: string
        supportContact:
          type: string
        privacyUrl:
          type: string
        logoUri:
          type: string
          description: The flow's own logo; empty without one.
      required: [custom, displayName, primaryColor, supportContact, privacyUrl, logoUri]
    ProofingFlowBrandingForm:
      type: object
      properties:
        custom:
          type: string
          enum: ['true', 'false']
        displayName:
          type: string
        primaryColor:
          type: string
          description: '`#rrggbb`; empty is the organisation''s.'
        supportContact:
          type: string
        privacyUrl:
          type: string
          description: An https URL.
        logo:
          type: string
          format: binary
          description: PNG, JPEG, GIF or WebP, at most 512 KiB.
        removeLogo:
          type: string
          enum: ['true']
      required: [custom]
    ProofingApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: The key's public start, to recognise it by.
        scopes:
          type: array
          items:
            type: string
            enum: [sessions:write, sessions:read, results:read, flows:read, flows:write, settings:read,
              settings:write, webhooks:write, reviews:read, reviews:write]
        createdByName:
          type: string
          description: Who created the key; absent once that user is gone.
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        revealable:
          type: boolean
          description: >-
            The key can be shown again (`GET .../api-keys/{keyID}/secret`). False for a key made
            before keys were kept for that: only its hash is stored.
      required: [id, name, prefix, scopes, createdAt]
    ProofingApiKeyList:
      type: array
      items:
        $ref: '#/components/schemas/ProofingApiKey'
    ProofingCreateApiKey:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
      required: [name]
    ProofingCreatedApiKey:
      allOf:
        - $ref: '#/components/schemas/ProofingApiKey'
        - type: object
          properties:
            secret:
              type: string
              description: The key itself, the one time it is readable.
          required: [secret]
    ProofingWebhookEndpoint:
      type: object
      properties:
        configured:
          type: boolean
          description: False, with the rest empty, for an organisation without an endpoint.
        url:
          type: string
        events:
          type: array
          items:
            type: string
        secretLast4:
          type: string
        secret:
          type: string
          description: Only in the answer that created the endpoint or rotated its secret.
        health:
          $ref: '#/components/schemas/ProofingWebhookHealth'
        availableEvents:
          type: array
          items:
            type: string
        maxAttempts:
          type: integer
      required: [configured, events, health, availableEvents, maxAttempts]
    ProofingSaveWebhook:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: >-
            Required. Where events are sent: an `https` URL that resolves to a public address.
            A private, loopback or link-local address is never called.
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum: [session.created, session.started, session.handover, session.verified, session.failed, session.review_opened, session.expired, session.cancelled, session.purged, session.diploma_added, session.address_added, session.address_reviewed, session.employment_added, session.step_reviewed]
          description: Required. The events to send, at least one.
      required: [url, events]
    ProofingWebhookDeliveryList:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
          event:
            type: string
          sessionId:
            type: string
            example: ps_q4r7tz2mxk3vbn6hw5jc2dfa7e
            description: The session's `ps_` id, as the delivery's payload carries it; absent for a `test` event.
          endpointUrl:
            type: string
          status:
            type: string
            enum: [pending, delivered, failed]
          attempts:
            type: integer
          lastStatusCode:
            type: integer
          lastError:
            type: string
          lastAttemptAt:
            type: string
            format: date-time
          deliveredAt:
            type: string
            format: date-time
          createdAt:
            type: string
            format: date-time
        required: [id, event, status, attempts, createdAt]
    ProofingHostedProgress:
      type: object
      properties:
        status:
          type: string
          enum: [pending, in_progress, approved, rejected, needs_review, expired, cancelled]
        errorCode:
          type: string
        method:
          type: string
          enum: [idem_app, yivi_app, browser]
        linkExpiresAt:
          type: string
          format: date-time
          description: The link's end until it is started, then the session's.
        started:
          type: boolean
        sessionTtlSeconds:
          type: integer
          description: >-
            The lifetime the started session was created with (the flow's own, else the
            organisation's, at the start), which the page names when the check ends unfinished.
            Absent before a start, and for a session started before the wallet kept it.
        completedAt:
          type: string
          format: date-time
        diplomasUntil:
          type: string
          format: date-time
        addressUntil:
          type: string
          format: date-time
          description: When the subject can last enter their address; absent while they cannot, and once they did.
        addressGiven:
          type: boolean
          description: The subject entered their address.
        employmentUntil:
          type: string
          format: date-time
          description: When the subject can last upload their Verzekeringsbericht; absent while they cannot, and once one was kept.
        employmentGiven:
          type: boolean
          description: A Verzekeringsbericht of the subject was kept, or waits for a reviewer to check its seal.
        uncheckedDiplomas:
          type: integer
          description: How many of the subject's diploma extracts wait for a reviewer to check their seal; absent for none.
        steps:
          type: array
          description: Where each of the flow's extra steps stands, which the end screen tells the person. Empty for a flow without them.
          items:
            $ref: '#/components/schemas/ProofingStep'
        documentScan:
          type: string
          enum: [pending, done]
          description: The document photo, taken in the browser through `document-scan/start`; absent when the flow takes none.
        dataExportUntil:
          type: string
          format: date-time
          description: Until when an approved "see my data" session's data downloads through the link (`GET /api/v1/proof/{token}/data-export`), 24 hours from the approval.
        dataMatchesKept:
          type: integer
          description: On an approved erasure, how many of the person's matched sessions were kept, not deleted.
        legalRetention:
          type: object
          description: >-
            What the organisation's legal retention kept of a "delete my data" session's
            person: it declined the session (`errorCode` `LEGAL_RETENTION`), or an approved one
            left sessions it holds (they are among `dataMatchesKept`). How many sessions, the
            organisation's reason in each language, and the date from which all of them can be
            erased (and are, by the pruner). Absent otherwise, and once that date passed.
          properties:
            sessions:
              type: integer
              minimum: 1
              description: How many of the person's sessions the legal retention holds.
            until:
              type: string
              format: date-time
            reason:
              type: object
              properties:
                en:
                  type: string
                nl:
                  type: string
              required: [en, nl]
          required: [sessions, until, reason]
      required: [status, linkExpiresAt, started, addressGiven]
    ProofingHostedView:
      allOf:
        - $ref: '#/components/schemas/ProofingHostedProgress'
        - type: object
          properties:
            sessionId:
              type: string
              pattern: '^ps_[a-z2-7]{26}$'
            redirectUrl:
              type: string
            embedOrigins:
              type: array
              items:
                type: string
            language:
              type: string
              enum: [en, nl]
            locales:
              type: array
              items:
                type: string
                enum: [en, nl]
            organization:
              type: object
              properties:
                name:
                  type: string
                branding:
                  $ref: '#/components/schemas/ProofingBranding'
                dataRetentionDays:
                  type: integer
              required: [name, branding, dataRetentionDays]
            flow:
              type: object
              description: >-
                What the person is asked for. The flow's name and its assurance level are left
                out: the person's page shows neither.
              properties:
                requestedAttributes:
                  type: array
                  items:
                    type: string
                attributeReasons:
                  type: object
                  additionalProperties:
                    type: object
                    additionalProperties:
                      type: string
                  description: >-
                    Why each requested attribute is collected, by attribute and language. Empty
                    for a flow saved without reasons.
                yiviAvailable:
                  type: boolean
                  description: >-
                    Whether the Yivi app can run the flow: not when it needs no app
                    (`browserOnly`), matches the face against a reference photo, checks an age the Yivi passport
                    and ID card carry no claim for (other than 12, 16, 18, 21 and 65), or requires
                    more than `low`, the level a Yivi session reaches.
                idemAvailable:
                  type: boolean
                  description: >-
                    Whether the Idem app can run the flow: not when it needs no app
                    (`browserOnly`) or is locked to the Yivi app (`apps`).
                yiviPersonalData:
                  type: boolean
                  description: >-
                    The flow accepts the registered personal data (`acceptedDocumentTypes`
                    `personal_data`), which the Yivi app may share: the page says so on its app
                    choice.
                browserOnly:
                  type: boolean
                  description: >-
                    Whether the page runs every step of the flow by itself, so no app is chosen:
                    a flow of only the document photo, say.
                diplomaMode:
                  type: string
                  enum: ['off', required]
                addressMode:
                  type: string
                  enum: ['off', required]
                employmentMode:
                  type: string
                  enum: ['off', required]
                kind:
                  type: string
                  enum: [identity, data_access, data_erasure]
                retentionDays:
                  type: integer
                  description: >-
                    The most days the session's data is kept: the flow's retention when it set
                    one, else the organisation's `dataRetentionDays`, plus the day the proofing engine
                    keeps its copy longer, rounded up to whole days. What the page tells the subject.
              required: [requestedAttributes, attributeReasons, yiviAvailable, idemAvailable, yiviPersonalData, browserOnly, diplomaMode, addressMode, retentionDays]
            diplomas:
              type: array
              description: The extracts the subject added, as the page lists them.
              items:
                $ref: '#/components/schemas/ProofingHostedDiploma'
            theme:
              type: object
              description: >-
                The look the page takes, the one the Idem app shows the session in: the
                proofing look (the flow's own branding over the organisation's) when it has a
                colour or a font of its own, else the organisation's theme. Colours are `#rrggbb`,
                `fontFamily` a CSS font-family list; "" keeps the page's own. Absent when neither
                the organisation's proofing nor its theme set any.
              properties:
                primaryColor:
                  type: string
                secondaryColor:
                  type: string
                textColor:
                  type: string
                surfaceColor:
                  type: string
                borderColor:
                  type: string
                linkColor:
                  type: string
                successColor:
                  type: string
                warningColor:
                  type: string
                errorColor:
                  type: string
                headerColor:
                  type: string
                fontFamily:
                  type: string
          required: [sessionId, embedOrigins, locales, organization, flow, diplomas]
    ProofingHostedStart:
      type: object
      additionalProperties: false
      properties:
        method:
          type: string
          enum: [idem_app, yivi_app, browser, pending]
          description: '`pending` starts the session with the flow; the app is chosen after (`/method`).'
      required: [method]
    ProofingHostedStarted:
      allOf:
        - $ref: '#/components/schemas/ProofingHostedProgress'
        - type: object
          properties:
            deepLink:
              type: string
              description: An Idem session's `vcmrtd://` link.
    Error:
      type: object
      description: Error response body returned by respond.Error.
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Stable machine-readable error code.
      required: [error, code]
    IdemAppError:
      type: object
      description: An Idem app route's error body.
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: >-
            Stable machine-readable code, where the route sets one: device_unauthorized, device_handed_over,
            device_already_claimed, session_expired, session_complete, handover_invalid, handover_expired,
            handover_used, claim_token_required, flow_steps_required, steps_incomplete, not_app_session,
            document_unsupported, face_attempts_spent, FACE_PROVIDER_UNAVAILABLE.
      required: [error]
    IdemFlowStep:
      type: string
      enum: [document_capture, nfc_read, document_photo, face_verification, selfie, liveness, face_match]
    IdemSessionStatus:
      type: string
      enum: [created, opened, in_progress, needs_review, approved, rejected, expired, cancelled]
    IdemLifecycle:
      type: string
      enum: [ACTIVE, COMPLETE, EXPIRED, CANCELLED]
      description: COMPLETE means every step has a result and `status` holds the decided outcome.
    IdemDeviceRole:
      type: string
      enum: [web, native]
      description: The session slot; the Idem app is native, the browser web.
    IdemDevice:
      type: object
      description: One slot's device, never its token.
      properties:
        claimed:
          type: boolean
        state:
          type: string
          enum: [active, inactive]
        stale:
          type: boolean
          description: No request for DeviceStaleAfter, or its long-poll dropped; treat as inactive.
        claimedAt:
          type: string
          format: date-time
        lastActiveAt:
          type: string
          format: date-time
      required: [claimed]
    IdemCallerDevice:
      allOf:
        - $ref: '#/components/schemas/IdemDevice'
        - type: object
          properties:
            authorized:
              type: boolean
            role:
              $ref: '#/components/schemas/IdemDeviceRole'
          required: [authorized]
    IdemChipAccessKey:
      type: object
      description: The MRZ-derived key to open the document's chip.
      properties:
        documentType:
          type: string
          enum: [passport, identity_card, residence_permit, drivers_license]
        documentNumber:
          type: string
        countryCode:
          type: string
        dateOfBirth:
          type: string
        dateOfExpiry:
          type: string
        version:
          type: string
        randomData:
          type: string
        configuration:
          type: string
      required: [documentType, documentNumber]
    IdemStepResult:
      type: object
      description: A step's verdicts as the app sees them, never its evidence.
      properties:
        step:
          type: string
        completed:
          type: boolean
        completedAt:
          type: string
          format: date-time
        summary:
          type: object
          additionalProperties: true
          description: >-
            document_capture: documentType, allChecksValid; face steps: livenessPassed and, after a match,
            faceVerified.
      required: [step, completed]
    IdemBranding:
      type: object
      description: >-
        The look of the organisation that requested the session, so the app looks like its own:
        resolved from the session itself. A person it sent the session to who is no member gets the
        organisation's proofing look when that has a colour or a font of its own (its colours, font and
        logo); otherwise the organisation's theme under the name its proofing mail signs with, with the
        proofing logo or else the theme's. A member gets the organisation's theme. Colours are
        `#rrggbb`; an absent one keeps the app's own. Absent altogether when neither set any.
      properties:
        name:
          type: string
          description: The name the organisation's proofing mail signs with, or the organisation's name.
        primaryColor:
          type: string
          description: 'Buttons, links and progress.'
        secondaryColor:
          type: string
          description: 'Labels and badges: the theme''s accent colour.'
        textColor:
          type: string
          description: 'Body text.'
        surfaceColor:
          type: string
          description: 'Screen background.'
        borderColor:
          type: string
          description: 'Borders and dividers.'
        linkColor:
          type: string
          description: 'Links.'
        successColor:
          type: string
          description: 'Completed and verified states.'
        warningColor:
          type: string
          description: 'Warnings.'
        errorColor:
          type: string
          description: 'Errors.'
        headerColor:
          type: string
          description: 'The dark top of the screens: the theme''s top bar colour.'
        fontFamily:
          type: string
          description: A CSS font-family list, as the organisation's theme stores it.
        hasLogo:
          type: boolean
          description: Whether `GET /api/v1/app/{token}/branding/logo` serves a logo.
      required: [name, hasLogo]
    IdemAppSession:
      type: object
      description: The session as the app sees it; the org by display name only.
      properties:
        id:
          type: string
        method:
          type: string
          enum: [face, nfc_passport]
        relyingParty:
          type: string
          description: The asking organisation's display name.
        branding:
          $ref: '#/components/schemas/IdemBranding'
        status:
          $ref: '#/components/schemas/IdemSessionStatus'
        language:
          type: string
          enum: [en, nl]
        requestedAttributes:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/IdemFlowStep'
        selfieLocation:
          type: string
          enum: [browser, native]
        expiresAt:
          type: string
          format: date-time
        aaChallenge:
          type: string
          description: The RND.IFD to send to the chip's INTERNAL AUTHENTICATE.
        requiredChecks:
          type: array
          nullable: true
          items:
            type: string
            enum: [nfc.passive_auth, nfc.chip_auth, face.match, face.liveness]
        completedSteps:
          type: array
          items:
            type: string
        nativeHandoff:
          type: object
          description: Present while the Idem app still has work; the browser mints its QR with POST .../handover.
          properties:
            role:
              $ref: '#/components/schemas/IdemDeviceRole'
            claimed:
              type: boolean
          required: [role, claimed]
        changeKey:
          type: string
          description: The `since` for GET .../events; opaque.
        flowId:
          type: string
        flowVersion:
          type: integer
        currentStep:
          type: string
          description: The step to continue with, empty once complete; absent without a flow.
        chipAccess:
          $ref: '#/components/schemas/IdemChipAccessKey'
        faceVerification:
          type: object
          description: Present when the app runs the face step as a Regula liveness session.
          properties:
            provider:
              type: string
              enum: [regula]
            faceApiUrl:
              type: string
            tag:
              type: string
          required: [provider, faceApiUrl, tag]
        faceProvider:
          type: string
          enum: [regula, engine]
        stepResults:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/IdemStepResult'
        lifecycle:
          $ref: '#/components/schemas/IdemLifecycle'
        readyToSubmit:
          type: boolean
          description: Every step has a result and the session waits for POST .../submit.
        device:
          $ref: '#/components/schemas/IdemCallerDevice'
        devices:
          type: object
          description: Every slot's device, keyed web and native.
          properties:
            web:
              $ref: '#/components/schemas/IdemDevice'
            native:
              $ref: '#/components/schemas/IdemDevice'
          required: [web, native]
      required: [id, method, relyingParty, status, selfieLocation, expiresAt, requiredChecks, changeKey,
        stepResults, lifecycle, device, devices]
    IdemClaim:
      type: object
      properties:
        token:
          type: string
          description: Names the session in the app paths; it authorizes nothing.
        deviceToken:
          type: string
          description: The X-Device-Token from now on.
        role:
          $ref: '#/components/schemas/IdemDeviceRole'
        session:
          $ref: '#/components/schemas/IdemAppSession'
      required: [token, deviceToken, role, session]
    IdemHandoverRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/IdemDeviceRole'
      description: Role defaults to the caller's own slot.
    IdemHandover:
      type: object
      properties:
        handoverToken:
          type: string
        role:
          $ref: '#/components/schemas/IdemDeviceRole'
        expiresAt:
          type: string
          format: date-time
          description: Never after the session itself expires.
        qr:
          type: string
          description: What to render, the Idem app's deep link (vcmrtd://verify?handover=…&api=…).
        url:
          type: string
        deepLink:
          type: string
        slotClaimed:
          type: boolean
          description: A device already holds the slot, so redeeming this moves the session.
      required: [handoverToken, role, expiresAt, qr]
    IdemDeviceStateRequest:
      type: object
      properties:
        state:
          type: string
          enum: [active, inactive]
      required: [state]
    IdemDocument:
      type: object
      description: A document as the app read it.
      properties:
        type:
          type: string
          description: ICAO document code, e.g. P.
        number:
          type: string
        issuingState:
          type: string
        nationality:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        displayName:
          type: string
        sex:
          type: string
        dateOfBirth:
          type: string
          description: YYYY-MM-DD.
        dateOfExpiry:
          type: string
          description: YYYY-MM-DD.
        personalNumber:
          type: string
        placeOfBirth:
          type: string
        validity:
          type: object
          properties:
            documentNumberCheckDigitValid:
              type: boolean
            dateOfBirthCheckDigitValid:
              type: boolean
            dateOfExpiryCheckDigitValid:
              type: boolean
            compositeCheckDigitValid:
              type: boolean
            notExpired:
              type: boolean
    IdemDocumentCaptureRequest:
      type: object
      properties:
        document:
          allOf:
            - $ref: '#/components/schemas/IdemDocument'
          description: Required with at least `number`. A driving licence answers 422.
        chipAccess:
          $ref: '#/components/schemas/IdemChipAccessKey'
      required: [document]
    IdemImageRegion:
      type: object
      description: A box within the image, as fractions of its size; x+w and y+h at most 1.
      properties:
        x:
          type: number
        y:
          type: number
        w:
          type: number
        h:
          type: number
      required: [x, y, w, h]
    IdemDocumentPhotoSide:
      type: object
      properties:
        image:
          type: string
          description: Base64 image.
        mimeType:
          type: string
          description: Defaults to image/jpeg.
        bsnRegion:
          $ref: '#/components/schemas/IdemImageRegion'
      required: [image]
    IdemPhoto:
      type: object
      properties:
        imageBase64:
          type: string
        mimeType:
          type: string
          description: e.g. image/jpeg, image/jp2.
    IdemMrtdEvidence:
      type: object
      description: The chip as read; Passive Authentication hashes these bytes.
      properties:
        efSod:
          type: string
          description: EF.SOD, hex.
        dataGroups:
          type: object
          additionalProperties:
            type: string
          description: Raw data groups by name (DG1, DG2, …), hex.
        documentType:
          type: string
          description: Picks the Passive Authentication path; empty is ICAO. A driving licence answers 422.
        aaKeyDataGroup:
          type: string
          description: The data group with the Active Authentication key (DG15, or DG13 for a licence).
        nonce:
          type: string
          description: The challenge sent to the chip; required with aaKeyDataGroup.
        aaSignature:
          type: string
          description: The chip's signature over nonce; required with aaKeyDataGroup.
      required: [efSod, dataGroups]
    IdemNFCRequest:
      type: object
      properties:
        photo:
          allOf:
            - $ref: '#/components/schemas/IdemPhoto'
          description: >-
            The chip's DG2 portrait, byte for byte; required when the flow matches the face against the chip
            and no reference photo was sent with the session.
        document:
          allOf:
            - $ref: '#/components/schemas/IdemDocument'
          description: Accepted but ignored; the document is read from the evidence.
        mrtdEvidence:
          $ref: '#/components/schemas/IdemMrtdEvidence'
        device:
          type: object
          properties:
            appVersion:
              type: string
            devicePlatform:
              type: string
              description: e.g. android, ios.
      required: [mrtdEvidence]
    IdemSelfieRequest:
      type: object
      properties:
        livenessTransactionId:
          type: string
          description: The Regula liveness transaction the app ran.
      required: [livenessTransactionId]
    IdemStepResponse:
      type: object
      description: Every step route's answer, and the submit's.
      properties:
        status:
          $ref: '#/components/schemas/IdemSessionStatus'
        completedSteps:
          type: array
          items:
            type: string
        currentStep:
          type: string
          description: What comes next, empty once complete; absent without a flow.
        lifecycle:
          $ref: '#/components/schemas/IdemLifecycle'
        errorCode:
          type: string
          description: Why a decided session was rejected.
        readyToSubmit:
          type: boolean
        alreadyRecorded:
          type: boolean
          description: The step (or the submit) was already recorded, so nothing was stored.
      required: [status, completedSteps, lifecycle]
    IdemSelfieStepResponse:
      allOf:
        - $ref: '#/components/schemas/IdemStepResponse'
        - type: object
          properties:
            biometrics:
              type: object
              description: Absent when the step was already recorded.
              properties:
                faceMatchScore:
                  type: number
                faceVerified:
                  type: boolean
                livenessResult:
                  type: string
                  enum: [passed, failed]
                livenessScore:
                  type: number
                engine:
                  type: string
                threshold:
                  type: number
    IdemStepResultResponse:
      allOf:
        - $ref: '#/components/schemas/IdemStepResult'
        - $ref: '#/components/schemas/IdemStepResponse'
  parameters:
    IdemSessionToken:
      name: token
      in: path
      required: true
      schema:
        type: string
      description: The session token from the claim response; it names the session and authorizes nothing.
    IdemDeviceToken:
      name: X-Device-Token
      in: header
      required: true
      schema:
        type: string
      description: The device token the claim or handover returned.
    IdemAcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
      description: Picks the view's `language` when the session was sent without one.
    IdemStep:
      name: step
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/IdemFlowStep'
      description: A step of the session's flow; any face step name maps to the flow's own.
  responses:
    ApiUnauthorized:
      description: No API key was sent as a Bearer token (`unauthorized`), or it is unknown or revoked (`invalid_api_key`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ApiForbidden:
      description: >-
        The API key lacks the scope this call needs (`insufficient_scope`). Creating a session,
        or starting one in an app, is also refused while the organisation's proofing is paused
        (`proofing_paused`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid session cookie was supplied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The session lacks the required role for this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProofingForbidden:
      description: >-
        The session lacks the required role for this resource, or identity proofing is
        paused for the organisation (`proofing_paused`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: >-
        The organisation spent its public API budget (code `rate_limited`, "too many
        requests; retry after the Retry-After seconds"): 120 calls a minute, and of those 10 session
        creations. A client address presenting unknown or revoked keys gets this too past 60 a
        minute, instead of 401 (an IPv6 address counts with its /64). `Retry-After` says in how
        many seconds to try again.
      headers:
        Retry-After:
          description: Seconds until the next call is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    HostedTooManyRequests:
      description: >-
        A hosted link's budget is spent (code `rate_limited`): 600 calls a minute per client
        address (an IPv6 address counts with its /64), 3000 a minute across all of the
        organisation's links still in use, and 60 a minute for a link that is not (its session
        over and nothing left to download or upload). `Retry-After` says in how many seconds
        to try again.
      headers:
        Retry-After:
          description: Seconds until the next call is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The referenced resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IdemBadRequest:
      description: The body, step or role is invalid (plain `error`, no code).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemAppError'
    IdemDeviceUnauthorized:
      description: '`device_unauthorized`: X-Device-Token is missing or holds no slot of this session.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemAppError'
    IdemDeviceHandedOver:
      description: '`device_handed_over`: the slot moved to another device.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemAppError'
    IdemSessionNotFound:
      description: No session has this token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemAppError'
    IdemConflict:
      description: >-
        The session cannot take this request now: `session_complete`, `not_app_session` (a Yivi session), or
        without a code (no flow, or a state change that lost a race).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemAppError'
    IdemSessionExpired:
      description: '`session_expired`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemAppError'
    IdemDocumentUnsupported:
      description: '`document_unsupported`: EU driving licences are not supported yet.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemAppError'
    IdemTooManyRequests:
      description: Too many claims or waiting clients for this session; retry after Retry-After.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemAppError'
    IdemInternalError:
      description: A store or flow lookup failed; the detail is logged, not returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemAppError'
    IdemStepRecorded:
      description: The step is stored, or was already (`alreadyRecorded`, nothing stored).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdemStepResponse'
security:
  - cookieAuth: []
