  /api/v1/proof/{token}/employment:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: The hosted link's token.
    post:
      tags: [identity-proofing-hosted]
      summary: Upload the UWV Verzekeringsbericht on a hosted page
      description: >-
        Anonymous: the link's token is the credential. As the on-screen upload, for the subject
        of a hosted session. The link is checked before the body is read. One multipart `file`
        part, at most 5 MiB. Only within an hour of the identity check finishing (approved, or in
        review) on a request that asks for it, and kept once: the first accepted statement closes the step. The
        file is checked: UWV's seal (unchanged, a qualified e-seal certificate of UWV on the
        EU Trusted Lists, its revocation checked online), then the printed holder (initials,
        surname, alone or joined to a married name, and date of birth) against the proofed
        identity, then its date (at most 30 days old). The answer is `{fileName, accepted,
        employment}` or `{fileName, accepted: false, reason, failedCheck}` with `reason`
        `not_a_statement`, `signature_invalid`, `holder_mismatch` or `stale`; a refused file
        can be followed by another within the window. An accepted statement keeps the
        statement date and the relations current on it (reporting a month at most two
        months before the statement's): employer, payroll tax number, contract form, since
        when and the newest month, sealed. Never past relations, the PDF, the holder, the
        hours or the wages.
        Audited `identity_proofing.employment_added` (webhook `session.employment_added`), a
        refused one `identity_proofing.employment_rejected`. A kept statement with no current
        job (`employed: false`) moves the approved session to `needs_review` with
        `reviewReason` `no_current_employment`, one with a current UWV benefit beside a job
        with `current_benefit`, and one with other current income paid without hours worked
        beside a job with `current_other_income` (webhook `session.review_opened`), decided by an
        administrator through the review endpoint.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProofingEmploymentUpload'
      responses:
        '200':
          description: The verdict on the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingEmploymentVerdict'
              examples:
                accepted:
                  summary: Kept
                  value:
                    fileName: Verzekeringsbericht.pdf
                    accepted: true
                    employment:
                      statementDate: "2026-10-15"
                      employed: true
                      relations:
                        - kind: employment
                          employer: VOORBEELD B.V.
                          payrollTaxNumber: 123456789L01
                          contractForm: schriftelijke arbeidsovereenkomst voor onbepaalde tijd
                          from: "2025-01-01"
                          to: "2026-09-30"
                refused:
                  summary: Refused
                  value:
                    fileName: Verzekeringsbericht.pdf
                    accepted: false
                    reason: stale
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The session asks for no Verzekeringsbericht (`employment_not_asked`), holds one already or the window is closed (`employment_closed`), the session was cancelled or erased (`session_over`), or the deployment checks no Verzekeringsbericht (`no_employment_checker`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The file is too large (`too_large`).
        '503':
          description: The seal cannot be checked now (`seal_check_unavailable`), as the EU Trusted Lists or the revocation responder cannot be reached. Try again later; the file is not at fault.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/proofing/sessions:
    get:
      tags: [identity-proofing-api]
      summary: List proofing sessions (public API)
      description: >-
