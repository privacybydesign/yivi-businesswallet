  /api/v1/orgs/{slug}/identity-proofing/api-keys:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    get:
      tags: [identity-proofing-internal]
      summary: List the organisation's API keys
      description: >-
        Requires an administrator role in the organisation. Every key of the organisation,
        revoked ones included, oldest first: its `id`, name, `scopes`, its public `prefix`,
        when it was created, by whom (`createdByName`, absent once that user is gone) and last
        used, and `revokedAt` once revoked. Never a secret.
      responses:
        '200':
          description: The keys, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingApiKeyList'
              examples:
                keys:
                  summary: One key
                  value:
                    - id: 5e4d3c2b-1a09-4f8e-8d7c-6b5a49382716
                      name: Production backend
                      prefix: yp_live_3kq7
                      scopes: [sessions:write, sessions:read, results:read, flows:read, flows:write, settings:read, settings:write, webhooks:write, reviews:read, reviews:write]
                      createdByName: Sam de Vries
                      createdAt: "2026-09-01T10:05:00Z"
                      lastUsedAt: "2026-10-02T09:30:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
    post:
      tags: [identity-proofing-internal]
      summary: Create an API key
      description: >-
        Requires an administrator role in the organisation. `name` labels the key. The answer
        carries the key's `secret` (`yp_live_…`). Its SHA-256 authenticates it, and the key is
        kept sealed with the proofing encryption key, so an admin can show it again
        (`GET .../api-keys/{keyID}/secret`). The organisation's backend sends it as a Bearer token to the public
        `/api/v1/proofing` routes. A key gets every scope: `sessions:write` (create, cancel,
        erase), `sessions:read`, `results:read` (the verified identity), `flows:read`,
        `flows:write` (create and edit flows, their hosted page and steps, the default flow),
        `settings:read`, `settings:write` (the session settings and the allowed redirect
        origins), `webhooks:write` (the webhook endpoint), `reviews:read` (what waits for a
        reviewer, with its evidence) and `reviews:write` (decide it, and make a review link). A
        route the key lacks the scope for answers 403 `insufficient_scope`. An empty `name` or
        one over 100 characters is 400 `invalid_input`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingCreateApiKey'
            examples:
              key:
                summary: A key
                value:
                  name: Production backend
      responses:
        '201':
          description: Created; the only answer that carries the secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingCreatedApiKey'
              examples:
                created:
                  summary: A new key
                  value:
                    id: 5e4d3c2b-1a09-4f8e-8d7c-6b5a49382716
                    name: Production backend
                    prefix: yp_live_3kq7
                    scopes: [sessions:write, sessions:read, results:read, flows:read, flows:write, settings:read, settings:write, webhooks:write, reviews:read, reviews:write]
                    createdAt: "2026-09-01T10:05:00Z"
                    secret: yp_live_3kq7Vb9xR2mT8nW4cZ6hJ1pL5sD0fG7a
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
  /api/v1/orgs/{slug}/identity-proofing/api-keys/{keyID}:
    parameters:
