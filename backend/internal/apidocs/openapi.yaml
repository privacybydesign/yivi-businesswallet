# The apidocs.TestSpecCoversAllRoutes drift check fails CI if this list falls out
# of sync with the registered handlers.
openapi: 3.0.3
info:
  title: Yivi Business Wallet API
  description: |
    HTTP API for the Yivi Business Wallet backend. All endpoints live under the
    versioned `/api/v1` prefix. Authentication uses the `ybw_session` cookie set
    by the login flow; endpoints that do not require it are marked with no security.
  version: "1.0.0"
servers:
  - url: /
    description: Same origin; every path carries the versioned /api/v1 prefix
tags:
  - name: auth
    description: Login sessions and the current user.
  - name: wallet
    description: Organisation registration and the organisation wallet.
  - name: organizations
    description: Organisations, members, invitations and departments.
  - name: attestation
    description: Attestation schemas, templates, keys and issuance.
  - name: qerds
    description: Qualified electronic registered delivery service messaging.
  - name: postguard
    description: PostGuard attribute-based encryption settings and files.
  - name: email
    description: Per-organisation email settings and transactional mail templates.
  - name: issuer-settings
    description: Per-organisation issuer settings.
  - name: wsca
    description: Per-organisation WSCA holder-wallet activation and rotation.
  - name: theme
    description: Per-organisation colour scheme and logo.
  - name: notifications
    description: Per-organisation notification subscriptions per audit event.
  - name: slack
    description: Per-organisation Slack incoming-webhook notification settings.
  - name: msteams
    description: Per-organisation Microsoft Teams webhook notification settings.
  - name: provisioning
    description: Per-organisation user and department provisioning from an identity directory.
  - name: csc
    description: Per-organisation CSC API v2 signing-provider (remote QTSP) connection settings.
  - name: signing
    description: Qualified document signing — the RP-centric signing ceremony against a CSC provider.
  - name: openid4vp
    description: >-
      Inbound OpenID4VP — an external verifier invoking the business wallet as the
      holder of an organisation's credentials. The browser-facing entry point
      GET /openid4vp and the wallet-metadata document
      /.well-known/oauth-authorization-server live outside /api/v1.
  - name: idem-app
    description: >-
      The Idem (vcmrtd) app's proofing session routes. The path token names the
      session and the X-Device-Token header authorizes the device holding one of
      its slots; there is no wallet login. Only the app calls them: integrators
      use the customer proofing API.
  - name: identity-proofing
    description: >-
      Identity document and face verification, run by the wallet's own proofing engine:
      the wallet's own routes (flows, customers, requests) and the hosted page.

      The Idem app's own session routes (`/api/v1/app/...`, the `api=` of its deep link) are
      under the `idem-app` tag: only that app calls them, and an integrator never does; the
      customer API below is what a customer uses.
  - name: identity-proofing-api
    x-displayName: 'Identity proofing: customer API'
    description: |
      The API a proofing customer's own backend calls, with one of its API keys as a
      Bearer token (`Authorization: Bearer yp_live_…`).

      An organisation admin first creates a flow (what is checked) in the wallet and
      assigns it to the customer; `GET /proofing/flows` lists the customer's flows.
      Outcomes arrive as webhooks (see `ProofingWebhookEvent`) and can be read with
      `GET /proofing/sessions/{id}`.

      ### Use cases

      **Verify a new person** (onboarding, optionally with DUO diplomas): create a
      session with the person's `email` (mailed QR code) or `hosted: true` (a link you
      hand them). A flow with the diploma step must be hosted: the extracts are uploaded
      on the page, and arrive as `session.diploma_added`.

      **Password reset / account recovery**: on "forgot password", create a session with
      `hosted: true`, a `redirectUrl` back to your reset page, and the account holder's
      `name` and `birthDate`. Send the user to `hostedUrl`. Allow the reset only when the
      session is `approved`; someone else's document gives `rejected` with `errorCode`
      `IDENTITY_MISMATCH`. Use a flow at assurance level `substantial` (chip, face match,
      liveness).

      **One known person must identify** (e.g. Anna de Vries): any channel, with `name`
      and `birthDate`. Only that person's document is `approved`; the session reads
      `expectedSubject: true`.

      **Confirm a change, such as a bank account, with a liveness check**:
      - with the document (recommended): a `substantial` flow plus `name` and
        `birthDate`, as for a password reset;
      - against your own photo of the person, without a document: a flow whose only step
        is the face check (`needsReferencePhoto: true` in the flow list), and
        `referencePhoto` with your photo. It runs in the Idem app only and reaches no
        assurance level: it shows the live person matches your photo, not who they are.

      ### Outcomes

      `status` ends as `approved`, `rejected` (`errorCode` says why; the wallet itself
      sets `IDENTITY_MISMATCH`, `ASSURANCE_NOT_MET` and `REVIEW_LAPSED`; the session
      itself is rejected for `FACE_NO_MATCH`, `LIVENESS_FAILED`, `DOC_EXPIRED`,
      `DOC_TAMPERED` and `ASSURANCE_NOT_MET`), `needs_review` (an admin decides), `expired` or
      `cancelled`.
paths:
  /api/v1/admin/identity-proofing/pauses:
    get:
      tags: [identity-proofing]
      summary: List orgs whose identity proofing is paused (platform admin)
      description: >-
        Requires the platform administrator role. `pauses` holds one entry per paused org
        (`organizationId`). `paused` is whether identity proofing is stopped for the org; `platformPausedAt` and `orgPausedAt` say who paused it.
      responses:
        '200':
          description: Every paused org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingPauseList'
              examples:
                pauses:
                  summary: One org paused by the platform
                  value:
                    pauses:
                      - organizationId: 1b2c3d4e-5f60-4a7b-8c9d-0e1f2a3b4c5d
                        paused: true
                        platformPausedAt: "2026-10-01T22:15:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/organizations/{id}/identity-proofing/pause:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Organisation id.
    put:
      tags: [identity-proofing]
      summary: Pause or resume an org's identity proofing (platform admin)
      description: >-
        Requires the platform administrator role. Body `{paused}`. While paused, the org's
        identity-proofing routes, its customers' API keys and its hosted links answer 403
        `proofing_paused`; sessions already running still settle and their webhooks still go
        out. Pausing first rejects every session of the org waiting for review, `errorCode`
        `ORG_PAUSED` with a reason saying so: nothing can be decided while it is paused. A
        review that cannot be rejected refuses the pause (500); a session that reaches review
        while paused is rejected the same way as it arrives. The org's admin cannot lift a platform pause. Audited `identity_proofing.paused` or
        `identity_proofing.resumed` with `by: platform`. `paused` is whether identity proofing
        is stopped for the org; `platformPausedAt` and `orgPausedAt` say which level paused it,
        `platformPausedBy` and `orgPausedBy` who.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingSetPause'
            examples:
              pause:
                summary: Pause
                value:
                  paused: true
      responses:
        '200':
          description: The pause after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingPause'
              examples:
                paused:
                  summary: Paused by the platform
                  value:
                    organizationId: 1b2c3d4e-5f60-4a7b-8c9d-0e1f2a3b4c5d
                    paused: true
                    platformPausedAt: "2026-10-02T09:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/identity-reviews:
