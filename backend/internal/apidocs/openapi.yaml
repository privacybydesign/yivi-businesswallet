    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    get:
      tags: [identity-proofing]
      summary: List the org's identity proofing flows
      description: >-
        Requires organisation membership. Active flow versions at the identity-
        proofing-service. An administrator sees every flow, a member only the flows
        an administrator made available (`allowed`); `default` is the one the request
        form preselects, and `completable` is false for a flow a recipient cannot
        finish with only the vcmrtd app. The organisation's tenant at the
        identity-proofing-service is provisioned on its first use of any of these
        routes.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The deployment has no identity proofing encryption key, so the organisation's tenant cannot be provisioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [identity-proofing]
      summary: Create an identity proofing flow
      description: >-
        Requires an administrator role in the organisation. The identity-proofing-service
        flow configuration: `name`, `steps`, and optionally `requestedAttributes`,
        `acceptedDocumentTypes`, `acceptedIssuingCountries`, `requiredChecks`,
        `checkThresholds`, `requiredAssuranceLevel`, `bsnPolicy`, `blurFace`, `blurBsn`,
        `retentionOverrideSeconds`, `assuranceTiers`, `legalBasis` and
