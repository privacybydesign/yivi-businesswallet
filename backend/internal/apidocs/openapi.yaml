        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [identity-proofing]
      summary: Create a customer API key
      description: >-
        Requires an administrator role in the organisation. `name` labels the key. The answer
        carries the key's `secret` (`yp_live_…`), the one time it is readable: only its SHA-256
        is kept. The customer's backend sends it as a Bearer token to the public
        `/api/v1/proofing` routes. A key gets every scope: `sessions:write` (create, cancel,
        erase), `sessions:read`, `results:read` (the verified identity) and `flows:read`. A
        route the key lacks the scope for answers 403 `insufficient_scope`. An empty `name` or
        one over 100 characters is 400 `invalid_input`.
