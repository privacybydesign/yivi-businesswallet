    post:
      tags: [idem-app]
      summary: Claim a session slot with a claim or handover link
      description: >-
        Moves the slot the grant is for to this device and returns its device token. Single use; a previous device is revoked.
      security: []
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The session cannot take this request now (finished, expired, a step already recorded, or a Yivi session).
        '429':
          description: Too many requests; see Retry-After.
  /api/v1/app/{token}:
    parameters:
