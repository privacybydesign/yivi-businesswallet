  /api/v1/proofing/sessions:
    get:
      tags: [identity-proofing]
      summary: List proofing sessions (public API)
      description: >-
        Authenticated with a customer API key with `sessions:read`. The customer's
        sessions, newest first, as stored (no re-check at the identity-proofing-service),
        `limit` per page (default 50, at most 100): `{sessions, nextCursor}`. Pass
        `nextCursor` back as `cursor` for the next page; it is null on the last.
      security:
        - customerApiKey: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags: [identity-proofing]
      summary: Create a proofing session (public API)
      description: >-
        Send an `Idempotency-Key` header to make a retry safe: the same key and body
        within 24 hours get the first answer again (`Idempotent-Replayed: true`), the
        key with another body is 422 `idempotency_key_reused`, and while the first call
        still runs 409 `idempotency_in_flight`. `cancel` takes the header too.
        Authenticated with a customer API key as a Bearer token. `email` and an optional
        `name` of the subject, `flowId` (absent is the customer's default flow) and
        `sendMail` (absent or true mails the subject as a member's request would), and
        `language` (`en` or `nl`: the mail's and the Idem app's; absent is the deployment
        default for the mail and the phone's language in the app). The answer carries the session's vcmrtd `deepLink`, for a caller that shows the QR code
        itself, and `mailSent`. Refused while the customer is paused. With a test key
        the session runs in the org's sandbox and resolves at once to `scriptedOutcome`
        (`approve`, the default; `reject:<CODE>`; `needs_review`; or `expire`): it is not
        mailed, has no `deepLink`, is left out of the stats, and carries `livemode:
        false`, as do its webhooks. A live key may not set `scriptedOutcome` (400).
        With `hosted: true` no session is created yet: the answer carries `hostedUrl`,
        a link to the public page the subject opens on their own device (valid 72 hours)
        and starts once from; nothing is mailed. Not with a test key. `redirectUrl`, only with
        `hosted: true`, is where the page sends the subject once the session settles, with
        `?session=<id>&status=<status>` added; its origin must be one of the customer's
        `allowedRedirectOrigins` (else 400 `redirect_not_allowed`).
      security:
        - customerApiKey: []
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '409':
          description: Proofing is paused for the customer, or the deployment has no encryption key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The flow does not exist, cannot be completed in the app, or is not assigned to the customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/proofing/sessions/{sessionID}:
    parameters:
      - name: sessionID
        in: path
        required: true
        schema:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        description: Session id (`ps_…`), as the create answer and webhooks give it.
    get:
      tags: [identity-proofing]
      summary: Get a proofing session (public API)
      description: >-
        Authenticated with a customer API key as a Bearer token. One of the customer's
