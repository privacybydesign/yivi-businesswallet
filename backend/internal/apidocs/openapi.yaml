        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request does not run in the Idem app or is a test request (`wrong_method`), or its session has ended (`session_over`).
