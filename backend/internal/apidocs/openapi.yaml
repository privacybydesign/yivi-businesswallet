        '429':
          $ref: '#/components/responses/HostedTooManyRequests'
        '409':
          description: The link was started already (`link_started`), its session ended (`session_over`), the customer is paused (`customer_paused`), or the deployment cannot run Yivi sessions (`method_unavailable`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
