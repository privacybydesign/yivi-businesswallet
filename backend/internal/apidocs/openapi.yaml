  /api/v1/orgs/{slug}/identity-proofing/flows:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    get:
      tags: [identity-proofing]
      summary: List the org's identity proofing flows
      description: >-
        Requires organisation membership. The active version of each of the organisation's flows
        in its proofing engine. An administrator sees every flow, a member only the flows an
        administrator made available (`allowed`); `default` is the one the request form
        preselects, `completable` is false for a flow a recipient cannot finish with only the
        vcmrtd app, `needsReferencePhoto` marks a flow that matches the face against a reference
        photo (only a customer's API can send one), and `diplomaMode` is whether the flow asks
        for DUO diploma extracts. The organisation is the proofing engine's tenant under its own
        id: nothing is provisioned first.
      responses:
        '200':
          description: The flows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingFlowList'
              examples:
                flows:
                  summary: One flow, made available and preselected
                  value:
                    - id: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                      name: Onboarding
                      steps: [document_capture, nfc_read, face_verification]
                      requiredChecks: [nfc.passive_auth, nfc.chip_auth, face.match, face.liveness]
                      selfieLocation: native
                      requestedAttributes: [dg1, dg2, selfie]
                      faceProvider: regula
                      requiredAssuranceLevel: substantial
                      version: 3
                      active: true
                      createdAt: "2026-09-14T08:12:00Z"
                      completable: true

                      allowed: true
                      default: true
                      diplomaMode: "off"
                      needsReferencePhoto: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
    post:
      tags: [identity-proofing]
      summary: Create an identity proofing flow
      description: >-
        Requires an administrator role in the organisation. The flow configuration: `name`,
        `steps`, and optionally `faceProvider` (`regula`, the default for a flow with a face
        step and the only provider; anything else is refused),
        `requestedAttributes`, `acceptedDocumentTypes`, `acceptedIssuingCountries`,
        `requiredChecks`, `checkThresholds`, `requiredAssuranceLevel`, `bsnPolicy`, `blurFace`,
        `blurBsn`, `retentionOverrideSeconds`, `assuranceTiers`, `legalBasis` and
        `processingPurpose`. Face capture is always set to the app (`selfieLocation` is
        overwritten). An empty `name` or `steps`, or an unknown `faceProvider`, is 400
        `invalid_input`. The proofing engine validates the combination (including `regula` on a
        deployment without Regula) and its refusal is returned as 422 `rejected_by_provider`.
        Creates version 1; the answer is the flow with `completable` and `needsReferencePhoto`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingFlowSpec'
            examples:
              onboarding:
                summary: Chip read with a face match
                value:
                  name: Onboarding
                  steps: [document_capture, nfc_read, face_verification]
                  requiredChecks: [nfc.passive_auth, nfc.chip_auth, face.match, face.liveness]
                  faceProvider: regula
                  selfieLocation: native
                  requiredAssuranceLevel: substantial
      responses:
        '201':
          description: Created as version 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingFlow'
              examples:
                created:
                  summary: The new flow
                  value:
                    id: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                    name: Onboarding
                    steps: [document_capture, nfc_read, face_verification]
                    requiredChecks: [nfc.passive_auth, nfc.chip_auth, face.match, face.liveness]
                    selfieLocation: native
                    requestedAttributes: [dg1, dg2, selfie]
                    faceProvider: regula
                    requiredAssuranceLevel: substantial
                    version: 1
                    active: true
                    createdAt: "2026-09-14T08:12:00Z"
                    completable: true

                    allowed: false
                    default: false
                    needsReferencePhoto: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '422':
          description: The proofing engine refused the configuration (`rejected_by_provider`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/flows/{flowID}/versions:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: flowID
        in: path
        required: true
        schema:
          type: string
        description: Flow id (stable across versions).
    get:
      tags: [identity-proofing]
      summary: List every version of an identity proofing flow
      description: >-
        Requires an administrator role in the organisation. Oldest first; exactly one
        is `active`, the version new requests run.
      responses:
        '200':
          description: Every version, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingFlowList'
              examples:
                versions:
                  summary: Two versions, the second active
                  value:
                    - id: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                      name: Onboarding
                      steps: [document_capture, nfc_read, face_verification]
                      requiredChecks: [nfc.passive_auth, nfc.chip_auth, face.match, face.liveness]
                      selfieLocation: native
                      requestedAttributes: [dg1, dg2, selfie]
                      faceProvider: regula
                      requiredAssuranceLevel: substantial
                      version: 1
                      active: false
                      createdAt: "2026-09-14T08:12:00Z"
                      completable: true

                      allowed: false
                      default: false
                      needsReferencePhoto: false
                    - id: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                      name: Onboarding
                      steps: [document_capture, nfc_read, face_verification]
                      requiredChecks: [nfc.passive_auth, nfc.chip_auth, face.match, face.liveness]
                      selfieLocation: native
                      requestedAttributes: [dg1, dg2, selfie]
                      faceProvider: regula
                      requiredAssuranceLevel: substantial
                      version: 2
                      active: true
                      createdAt: "2026-09-14T08:12:00Z"
                      completable: true

                      allowed: false
                      default: false
                      needsReferencePhoto: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '422':
          description: The flow does not exist (`flow_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [identity-proofing]
      summary: Edit an identity proofing flow as a new version
      description: >-
        Requires an administrator role in the organisation. Same body as creating a flow; it is
        stored as the next version and made the active one. Requests already sent keep the
        version their session pinned. An empty `name` or `steps`, or an unknown `faceProvider`,
        is 400 `invalid_input`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingFlowSpec'
            examples:
              edit:
                summary: Add a document photo
                value:
                  name: Onboarding
                  steps: [document_capture, nfc_read, document_photo, face_verification]
                  requiredChecks: [nfc.passive_auth, nfc.chip_auth, face.match, face.liveness]
                  faceProvider: regula
                  selfieLocation: native
                  requiredAssuranceLevel: substantial
      responses:
        '201':
          description: Saved as the next version, now active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingFlow'
              examples:
                saved:
                  summary: Version 4
                  value:
