        of the organisation the API key belongs to, never another organisation's: your
        sessions for external people, newest first, as stored (no re-check with the engine),
        `limit` per page (default 50, at most 100): `{sessions, nextCursor}`. Pass
        `nextCursor` back as `cursor` for the next page; it is null on the last.
