        refused one `identity_proofing.employment_rejected`. A kept statement with no current
        job (`employed: false`) goes to review with `reviewReason` `no_current_employment`, one
        with a current UWV benefit beside a job with `current_benefit`, and one with other
        current income paid without hours worked beside a job with `current_other_income`: an
