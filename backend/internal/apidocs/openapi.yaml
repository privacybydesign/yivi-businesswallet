# Generated from a route table; see internal/apidocs/README.md for how to regenerate.
# The apidocs.TestSpecCoversAllRoutes drift check fails CI if this list falls out
# of sync with the registered handlers.
openapi: 3.0.3
info:
  title: Yivi Business Wallet API
  description: |
    HTTP API for the Yivi Business Wallet backend. All endpoints live under the
    versioned `/api/v1` prefix. Authentication uses the `ybw_session` cookie set
    by the login flow; endpoints that do not require it are marked with no security.
  version: "1.0.0"
servers:
  - url: /
    description: Same origin; every path carries the versioned /api/v1 prefix
tags:
  - name: auth
    description: Login sessions and the current user.
  - name: wallet
    description: Organisation registration and the organisation wallet.
  - name: organizations
    description: Organisations, members, invitations and departments.
  - name: attestation
    description: Attestation schemas, templates, keys and issuance.
  - name: qerds
    description: Qualified electronic registered delivery service messaging.
  - name: postguard
    description: PostGuard attribute-based encryption settings and files.
  - name: email
    description: Per-organisation email settings and transactional mail templates.
  - name: issuer-settings
    description: Per-organisation issuer settings.
  - name: wsca
    description: Per-organisation WSCA holder-wallet activation and rotation.
  - name: theme
    description: Per-organisation colour scheme and logo.
  - name: notifications
    description: Per-organisation notification subscriptions per audit event.
  - name: slack
    description: Per-organisation Slack incoming-webhook notification settings.
  - name: msteams
    description: Per-organisation Microsoft Teams webhook notification settings.
  - name: provisioning
    description: Per-organisation user and department provisioning from an identity directory.
  - name: csc
    description: Per-organisation CSC API v2 signing-provider (remote QTSP) connection settings.
  - name: signing
    description: Qualified document signing — the RP-centric signing ceremony against a CSC provider.
  - name: openid4vp
    description: >-
      Inbound OpenID4VP — an external verifier invoking the business wallet as the
      holder of an organisation's credentials. The browser-facing entry point
      GET /openid4vp and the wallet-metadata document
      /.well-known/oauth-authorization-server live outside /api/v1.
  - name: idem-app
    description: >-
      The Idem app's proofing session routes. The path token names the
      session and the X-Device-Token header authorizes the device holding one of
      its slots; there is no wallet login. Only the app calls them: integrators
      use the proofing API.
  - name: identity-proofing
    description: >-
      Identity document and face verification, run by the wallet's own proofing engine:
      the wallet's own routes (flows, settings, API keys, webhook, requests) and the hosted page.

      The Idem app's own session routes (`/api/v1/app/...`, the `api=` of its deep link) are
      under the `idem-app` tag: only that app calls them, and an integrator never does; the
      API below is what an integrator uses.
  - name: identity-proofing-api
    x-displayName: 'Identity proofing: API'
    description: |
      The API an organisation's own backend calls, with one of the organisation's API keys
      as a Bearer token (`Authorization: Bearer yp_live_…`). It sends requests to external
      people (no login) and reads their outcome.

      An organisation admin first creates a flow (what is checked) in the wallet and an API
      key for the organisation. The API works on any flow of the organisation that a
      recipient can finish: `GET /proofing/flows` lists them and marks the organisation's
      default flow. Outcomes arrive as webhooks (see `ProofingWebhookEvent`) and can be
      read with `GET /proofing/sessions/{id}`.

      ### Use cases

      **Verify a new person** (onboarding, optionally with DUO diplomas): create a
      session with the person's `email` (mailed QR code) or `hosted: true` (a link you
      hand them). A flow with the diploma step must be hosted: the extracts are uploaded
      on the page, and arrive as `session.diploma_added`.

      **Password reset / account recovery**: on "forgot password", create a session with
      `hosted: true`, a `redirectUrl` back to your reset page, and the account holder's
      `name` and `birthDate`. Send the user to `hostedUrl`. Allow the reset only when the
      session is `approved`; someone else's document gives `rejected` with `errorCode`
      `IDENTITY_MISMATCH`. Use a flow at assurance level `substantial` (chip, face match,
      liveness).

      **One known person must identify** (e.g. Anna de Vries): any channel, with `name`
      and `birthDate`. Only that person's document is `approved`; the session reads
      `expectedSubject: true`.

      **Confirm a change, such as a bank account, with a liveness check**:
      - with the document (recommended): a `substantial` flow plus `name` and
        `birthDate`, as for a password reset;
      - against your own photo of the person, without a document: a flow whose only step
        is the face check (`needsReferencePhoto: true` in the flow list), and
        `referencePhoto` with your photo. It runs in the Idem app only and reaches no
        assurance level: it shows the live person matches your photo, not who they are.

      ### Embedding the hosted page

      The hosted page may be shown in an iframe on one of the organisation's
      `allowedRedirectOrigins`; it posts `{type: "proofing.completed", session, status}` to
      the parent once settled.

      ### Outcomes

      `status` ends as `approved`, `rejected` (`errorCode` says why; the wallet itself
      sets `IDENTITY_MISMATCH`, `ASSURANCE_NOT_MET`, `REVIEW_LAPSED`,
      `ORG_PAUSED`, `LEGAL_RETENTION` and `EMPLOYMENT_NOT_PROVIDED`; a reviewer `REVIEW_NOT_HOLDER` (it is someone else's), `REVIEW_ALTERED`
      (it looks altered), `EVIDENCE_NOT_AS_REQUESTED` (it is not what was asked for) or
      `MANUAL_REVIEW_REJECTED` (something else); the session itself is rejected for `FACE_NO_MATCH`,
      `LIVENESS_FAILED`, `DOC_EXPIRED`, `DOC_TAMPERED`,
      `CHIP_CLONE_DETECTED`, `DOCUMENT_TYPE_NOT_ACCEPTED`, `DOCUMENT_COUNTRY_NOT_ACCEPTED`,
      `FACE_STEP_NOT_COMPLETED`, `AGE_NOT_DISCLOSED` and `ASSURANCE_NOT_MET`), `needs_review` (an admin decides),
      `expired` or `cancelled`.
paths:
  /api/v1/admin/identity-proofing/pauses:
    get:
      tags: [identity-proofing]
      summary: List orgs whose identity proofing is paused (platform admin)
      description: >-
        Requires the platform administrator role. `pauses` holds one entry per paused org
        (`organizationId`). `paused` is whether identity proofing is stopped for the org;
        `platformPausedAt` and `platformPausedBy` say since when and by whom.
      responses:
        '200':
          description: Every paused org.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingPauseList'
              examples:
                pauses:
                  summary: One org paused by the platform
                  value:
                    pauses:
                      - organizationId: 1b2c3d4e-5f60-4a7b-8c9d-0e1f2a3b4c5d
                        paused: true
                        platformPausedAt: "2026-10-01T22:15:00Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/organizations/{id}/identity-proofing/pause:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Organisation id.
    put:
      tags: [identity-proofing]
      summary: Pause or resume an org's identity proofing (platform admin)
      description: >-
        Requires the platform administrator role. Body `{paused}`. While paused, nothing new
        starts: sending a request, creating a session through the API and starting a
        hosted link answer 403 `proofing_paused`. Every other route stays open, so an admin can
        still revoke a key, remove a webhook or erase data, and sessions already running still
        settle and their webhooks still go out. Pausing first rejects every session of the org waiting for review, `errorCode`
        `ORG_PAUSED` with a reason saying so: nothing can be decided while it is paused. A
        review that cannot be rejected refuses the pause (500); a session that reaches review
        while paused is rejected the same way as it arrives. Only a platform admin pauses or
        resumes: the org's own admin cannot. Audited `identity_proofing.paused` or
        `identity_proofing.resumed` with `by: platform`. `paused` is whether identity proofing
        is stopped for the org; `platformPausedAt` says since when and `platformPausedBy` by
        whom.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingSetPause'
            examples:
              pause:
                summary: Pause
                value:
                  paused: true
      responses:
        '200':
          description: The pause after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingPause'
              examples:
                paused:
                  summary: Paused by the platform
                  value:
                    organizationId: 1b2c3d4e-5f60-4a7b-8c9d-0e1f2a3b4c5d
                    paused: true
                    platformPausedAt: "2026-10-02T09:30:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/identity-reviews:
    get:
      tags: [organizations]
      summary: List pending identity reviews (platform admin)
      description: Requires the platform administrator role.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/admin/identity-reviews/{id}/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource identifier.
    post:
      tags: [organizations]
      summary: Approve an identity review (platform admin)
      description: Requires the platform administrator role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON request payload; see the endpoint description.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/admin/identity-reviews/{id}/reject:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource identifier.
    post:
      tags: [organizations]
      summary: Reject an identity review (platform admin)
      description: Requires the platform administrator role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON request payload; see the endpoint description.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/app/handover/{handoverToken}/claim:
    parameters:
      - name: handoverToken
        in: path
        required: true
        schema:
          type: string
        description: The single-use grant from the claim or handover link.
    post:
      tags: [idem-app]
      summary: Claim a session slot with a claim or handover link
      description: >-
        Moves the slot the grant is for to this device and returns its device token. Single use; a previous device is revoked. Takes no body.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdemAcceptLanguage'
      responses:
        '200':
          description: The slot is this device's; send `deviceToken` as X-Device-Token from now on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemClaim'
        '404':
          description: '`handover_invalid`: no grant matches the token.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemAppError'
        '409':
          description: '`handover_used`, `device_already_claimed` or `session_complete`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemAppError'
        '410':
          description: '`handover_expired` or `session_expired`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemAppError'
        '429':
          $ref: '#/components/responses/IdemTooManyRequests'
        '500':
          $ref: '#/components/responses/IdemInternalError'
  /api/v1/app/{token}:
    parameters:
      - $ref: '#/components/parameters/IdemSessionToken'
    get:
      tags: [idem-app]
      summary: Read the session as the app sees it
      description: >-
        What to collect, who asks and how long the session has. Opening it marks a created session opened.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdemDeviceToken'
        - $ref: '#/components/parameters/IdemAcceptLanguage'
      responses:
        '200':
          description: The session view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemAppSession'
        '401':
          $ref: '#/components/responses/IdemDeviceUnauthorized'
        '403':
          $ref: '#/components/responses/IdemDeviceHandedOver'
        '404':
          $ref: '#/components/responses/IdemSessionNotFound'
        '409':
          $ref: '#/components/responses/IdemConflict'
        '500':
          $ref: '#/components/responses/IdemInternalError'
  /api/v1/app/{token}/claim:
    parameters:
      - $ref: '#/components/parameters/IdemSessionToken'
    post:
      tags: [idem-app]
      summary: Claim with the session token (retired)
      description: >-
        Always answers 410 `claim_token_required`: scan the claim or handover QR instead.
      security: []
      responses:
        '410':
          description: '`claim_token_required`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemAppError'
  /api/v1/app/{token}/device/state:
    parameters:
      - $ref: '#/components/parameters/IdemSessionToken'
    post:
      tags: [idem-app]
      summary: Report the device state
      description: >-
        Records whether the app is active or in the background, so the other device can offer a handover. Back to `active` cancels a handover code left for this device's slot.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdemDeviceToken'
        - $ref: '#/components/parameters/IdemAcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdemDeviceStateRequest'
      responses:
        '200':
          description: The session view after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemAppSession'
        '400':
          $ref: '#/components/responses/IdemBadRequest'
        '401':
          $ref: '#/components/responses/IdemDeviceUnauthorized'
        '403':
          $ref: '#/components/responses/IdemDeviceHandedOver'
        '404':
          $ref: '#/components/responses/IdemSessionNotFound'
        '409':
          $ref: '#/components/responses/IdemConflict'
        '410':
          $ref: '#/components/responses/IdemSessionExpired'
        '500':
          $ref: '#/components/responses/IdemInternalError'
  /api/v1/app/{token}/branding/logo:
    parameters:
      - $ref: '#/components/parameters/IdemSessionToken'
    get:
      tags: [idem-app]
      summary: Get the session's branding logo
      description: >-
        The logo of the session's `branding`, served with a locked-down content security policy.
        Only a device holding the session can read it.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdemDeviceToken'
      responses:
        '200':
          description: The logo image.
          content:
            'image/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/IdemDeviceUnauthorized'
        '403':
          $ref: '#/components/responses/IdemDeviceHandedOver'
        '404':
          description: No such session, or it has no logo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemAppError'
        '409':
          $ref: '#/components/responses/IdemConflict'
        '500':
          $ref: '#/components/responses/IdemInternalError'
  /api/v1/app/{token}/events:
    parameters:
      - $ref: '#/components/parameters/IdemSessionToken'
    get:
      tags: [idem-app]
      summary: Wait for a change to the session
      description: >-
        Long-polls until the app view changes (status, steps, resets, devices) or SessionEventsWait (25 s by default) passes, then answers the view. Capped per session and per server.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdemDeviceToken'
        - $ref: '#/components/parameters/IdemAcceptLanguage'
        - name: since
          in: query
          required: false
          schema:
            type: string
          description: The `changeKey` of the view the client last saw; answers at once when it differs.
      responses:
        '200':
          description: The session view, changed or after the wait.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemAppSession'
        '401':
          $ref: '#/components/responses/IdemDeviceUnauthorized'
        '403':
          $ref: '#/components/responses/IdemDeviceHandedOver'
        '404':
          $ref: '#/components/responses/IdemSessionNotFound'
        '409':
          $ref: '#/components/responses/IdemConflict'
        '429':
          $ref: '#/components/responses/IdemTooManyRequests'
        '500':
          $ref: '#/components/responses/IdemInternalError'
  /api/v1/app/{token}/handover:
    parameters:
      - $ref: '#/components/parameters/IdemSessionToken'
    post:
      tags: [idem-app]
      summary: Mint a handover link
      description: >-
        Issues a short-lived, single-use grant for one of the session slots, replacing its pending one. The body is optional; without it the grant is for the caller's own slot.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdemDeviceToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdemHandoverRequest'
      responses:
        '200':
          description: The minted grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemHandover'
        '400':
          $ref: '#/components/responses/IdemBadRequest'
        '401':
          $ref: '#/components/responses/IdemDeviceUnauthorized'
        '403':
          $ref: '#/components/responses/IdemDeviceHandedOver'
        '404':
          $ref: '#/components/responses/IdemSessionNotFound'
        '409':
          $ref: '#/components/responses/IdemConflict'
        '410':
          $ref: '#/components/responses/IdemSessionExpired'
        '500':
          $ref: '#/components/responses/IdemInternalError'
  /api/v1/app/{token}/result:
    parameters:
      - $ref: '#/components/parameters/IdemSessionToken'
    post:
      tags: [idem-app]
      summary: Submit a whole result (retired)
      description: >-
        Always answers 409 `flow_steps_required` to an authorized device: every session runs a flow, submitted step by step.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdemDeviceToken'
      responses:
        '401':
          $ref: '#/components/responses/IdemDeviceUnauthorized'
        '403':
          $ref: '#/components/responses/IdemDeviceHandedOver'
        '404':
          $ref: '#/components/responses/IdemSessionNotFound'
        '409':
          description: '`flow_steps_required`, or `not_app_session` for a Yivi session.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemAppError'
  /api/v1/app/{token}/steps/document_capture:
    parameters:
      - $ref: '#/components/parameters/IdemSessionToken'
    post:
      tags: [idem-app]
      summary: Submit the document_capture step
      description: >-
        The MRZ reading and, for a flow with nfc_read, the chip access key, kept until the chip read lands. A later nfc_read supersedes the MRZ reading.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdemDeviceToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdemDocumentCaptureRequest'
      responses:
        '200':
          $ref: '#/components/responses/IdemStepRecorded'
        '400':
          $ref: '#/components/responses/IdemBadRequest'
        '401':
          $ref: '#/components/responses/IdemDeviceUnauthorized'
        '403':
          $ref: '#/components/responses/IdemDeviceHandedOver'
        '404':
          $ref: '#/components/responses/IdemSessionNotFound'
        '409':
          $ref: '#/components/responses/IdemConflict'
        '410':
          $ref: '#/components/responses/IdemSessionExpired'
        '422':
          $ref: '#/components/responses/IdemDocumentUnsupported'
        '500':
          $ref: '#/components/responses/IdemInternalError'
  /api/v1/app/{token}/steps/document_photo:
    parameters:
      - $ref: '#/components/parameters/IdemSessionToken'
    post:
      tags: [idem-app]
      summary: Submit the document_photo step
      description: >-
        Photos of the document's data page and optional back, with the located BSN region of a Dutch document.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdemDeviceToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdemDocumentPhotoRequest'
      responses:
        '200':
          $ref: '#/components/responses/IdemStepRecorded'
        '400':
          $ref: '#/components/responses/IdemBadRequest'
        '401':
          $ref: '#/components/responses/IdemDeviceUnauthorized'
        '403':
          $ref: '#/components/responses/IdemDeviceHandedOver'
        '404':
          $ref: '#/components/responses/IdemSessionNotFound'
        '409':
          $ref: '#/components/responses/IdemConflict'
        '410':
          $ref: '#/components/responses/IdemSessionExpired'
        '500':
          $ref: '#/components/responses/IdemInternalError'
  /api/v1/app/{token}/steps/nfc:
    parameters:
      - $ref: '#/components/parameters/IdemSessionToken'
    post:
      tags: [idem-app]
      summary: Submit the nfc_read step
      description: >-
        The raw chip data, which the server verifies itself (Passive and Active or Chip Authentication). The document is read from DG1/DG11 of the evidence, never from the app's own `document`. On a flow with document_capture it fulfils that step too.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdemDeviceToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdemNFCRequest'
      responses:
        '200':
          $ref: '#/components/responses/IdemStepRecorded'
        '400':
          $ref: '#/components/responses/IdemBadRequest'
        '401':
          $ref: '#/components/responses/IdemDeviceUnauthorized'
        '403':
          $ref: '#/components/responses/IdemDeviceHandedOver'
        '404':
          $ref: '#/components/responses/IdemSessionNotFound'
        '409':
          $ref: '#/components/responses/IdemConflict'
        '410':
          $ref: '#/components/responses/IdemSessionExpired'
        '422':
          $ref: '#/components/responses/IdemDocumentUnsupported'
        '500':
          $ref: '#/components/responses/IdemInternalError'
  /api/v1/app/{token}/steps/selfie:
    parameters:
      - $ref: '#/components/parameters/IdemSessionToken'
    post:
      tags: [idem-app]
      summary: Submit the face steps
      description: >-
        The Regula liveness transaction of the live capture; one submission fulfils every face step of the flow, and the face is matched against the reference here. A failed attempt may be retried up to 3 times per session.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdemDeviceToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdemSelfieRequest'
      responses:
        '200':
          description: The step is stored (or was already, `alreadyRecorded`), with the face verdict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemSelfieStepResponse'
        '400':
          $ref: '#/components/responses/IdemBadRequest'
        '401':
          $ref: '#/components/responses/IdemDeviceUnauthorized'
        '403':
          $ref: '#/components/responses/IdemDeviceHandedOver'
        '404':
          $ref: '#/components/responses/IdemSessionNotFound'
        '409':
          description: >-
            As the other step routes, or the reference photo for the face match has not landed yet, or
            `face_attempts_spent`: every attempt is taken and none left evidence to stand.
