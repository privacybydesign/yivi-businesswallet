      summary: Get a customer's webhook endpoint
      description: >-
        Requires an administrator role in the organisation. `configured` is false for a
        customer without one. The endpoint's `url`, subscribed `events`, the last four
        characters of its signing secret, its `health` (`delivering`, `failing` since
