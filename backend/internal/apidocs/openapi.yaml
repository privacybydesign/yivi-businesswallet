  /api/v1/orgs/{slug}/customers/{customerID}/webhook:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: customerID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Customer id.
    get:
      tags: [identity-proofing]
      summary: Get a customer's webhook endpoint
      description: >-
        Requires an administrator role in the organisation. `configured` is false for a customer
        without one. The endpoint's `url`, subscribed `events`, the last four characters of its
        signing secret, its `health` (`delivering`, `failing` since `failingSince` with
        `pendingRetries`, or `not_configured`, and the `lastStatusCode`), the `availableEvents`
        and `maxAttempts`.
      responses:
        '200':
          description: The customer's endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingWebhookEndpoint'
              examples:
                configured:
                  summary: An endpoint that delivers
                  value:
                    configured: true
                    url: https://portal.acme.example/hooks/yivi
                    events: [session.verified, session.failed, session.review_opened, session.expired]
                    secretLast4: x9Qa
                    health:
                      state: delivering
                      lastStatusCode: 200
                      pendingRetries: 0
                    availableEvents: [session.created, session.started, session.handover, session.verified, session.failed, session.review_opened, session.expired, session.cancelled, session.purged, session.diploma_added]
                    maxAttempts: 8
                none:
                  summary: No endpoint
                  value:
                    configured: false
                    events: []
                    health:
                      state: not_configured
                      pendingRetries: 0
                    availableEvents: [session.created, session.started, session.handover, session.verified, session.failed, session.review_opened, session.expired, session.cancelled, session.purged, session.diploma_added]
                    maxAttempts: 8
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [identity-proofing]
      summary: Set a customer's webhook endpoint
      description: >-
        Requires an administrator role in the organisation. `url` (absolute https; it
        must resolve to a public address when an event is sent) and `events`, at least one
        of `session.created`, `session.started`, `session.handover`, `session.verified`, `session.failed`,
        `session.review_opened`, `session.expired`, `session.cancelled`, `session.purged` and
        `session.diploma_added`. A
        new endpoint's answer carries its signing `secret` (`whsec_…`), the one time it is
        readable. Each event is a POST of `{id, type, createdAt, data}`; `data` holds
        `sessionId` (`ps_…`), `status`, `flowId`, and when known `method`,
        `assuranceLevel`, `eidasLevel`, `errorCode` (such as `IDENTITY_MISMATCH`) and
        `expectedSubject: true`; never the person's name, address or photo. It is signed in the
        `Yivi-Signature` header as `t=<unix>,v1=<hex HMAC-SHA256 of "<t>.<body>">`, with
        `Yivi-Event` and `Yivi-Delivery`; for 24 hours after a secret rotation it carries a
        second `v1` under the previous secret. A customer without an endpoint is sent no events. A non-2xx answer is retried with exponential
        back-off, up to 8 attempts over about 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingSaveWebhook'
            examples:
              outcomes:
                summary: The outcomes only
                value:
                  url: https://portal.acme.example/hooks/yivi
                  events: [session.verified, session.failed, session.review_opened, session.expired]
      responses:
        '200':
          description: The endpoint; a new one carries its secret, once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingWebhookEndpoint'
              examples:
                created:
                  summary: A new endpoint
                  value:
                    configured: true
                    url: https://portal.acme.example/hooks/yivi
                    events: [session.verified, session.failed, session.review_opened, session.expired]
                    secretLast4: x9Qa
                    health:
                      state: delivering
                      lastStatusCode: 200
                      pendingRetries: 0
                    availableEvents: [session.created, session.started, session.handover, session.verified, session.failed, session.review_opened, session.expired, session.cancelled, session.purged, session.diploma_added]
                    maxAttempts: 8
                    secret: whsec_4tY8mK2qN6vB1xC9zR3wP7sL5dF0gH8jA2eU6iO4x9Qa
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The deployment has no identity proofing encryption key to seal the secret with.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [identity-proofing]
