        sessions, newest first, as stored (no re-check with the engine),
        `limit` per page (default 50, at most 100): `{sessions, nextCursor}`. Pass
        `nextCursor` back as `cursor` for the next page; it is null on the last.
      security:
        - customerApiKey: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
