        disclosure of the subject's passport or ID-card credential with its photo,
        at the wallet's EUDI verifier, and answers its `walletLink` (the
        `openid4vp://` request the Yivi app opens; shown as a QR code and a
        universal link) with `expiresAt`, the session's cap. The verifier's
        transaction id stays on the server.
      responses:
