  /api/v1/orgs/{slug}/identity-proofing/flows:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    get:
      tags: [identity-proofing]
      summary: List the org's identity proofing flows
      description: >-
        Requires organisation membership. The active version of each of the organisation's flows
        in its proofing engine. An administrator sees every flow, a member only the flows an
        administrator made available to members (`allowed`); `default` marks the
        organisation's one default flow, the one sent to an external person that names no
        flow, whether or not members may use it. `completable` is false for a flow a
        recipient cannot finish with only the Idem app, `needsReferencePhoto` marks a flow
        that matches the face against a reference photo (only the API can send one),
        `diplomaMode` is whether the flow asks for DUO diploma extracts and `retentionDays` is
        the most days an external person's data is kept on this flow (the flow's own retention
        when it sets one, else the organisation's `dataRetentionDays`, plus the day the
        proofing engine needs to purge it). `hostedEnabled` is the flow's "Allow sending this
        flow as a link" switch: off, the wallet's Verify a person dialog offers only Show on
        this screen. The organisation is the proofing engine's tenant under its own id: nothing
        is provisioned first. See my data and Delete my data are not listed: they are the
        wallet's own flows (`GET .../data-request-flows`), and no flow is made one.
      responses:
        '200':
          description: The flows.
          content:
            application/json:
              schema:
