      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  redirectUri:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The request does not belong to this organisation, or is not awaiting approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The organisation holds no credential that satisfies the request; the transaction is consumed as denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The presentation could not be built or delivered; the transaction is consumed as denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
