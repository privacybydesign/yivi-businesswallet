        Authenticated with a customer API key as a Bearer token. One of the customer's
        sessions, re-checked with the engine first (at most every 10 seconds) while it
        may still change: its `status`, assurance, `errorCode`, and for an approved subject the name
        read off the document (`proofedName`) until the customer's data retention clears
        it. `expectedSubject: true` is a session created for one person (`name` with
        `birthDate`). Rejection codes the wallet itself sets: `IDENTITY_MISMATCH` (the
        document is another person's) and `ASSURANCE_NOT_MET` (the checks fell short of
        the flow's required level).
      security:
        - customerApiKey: []
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingApiSession'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [identity-proofing-api]
      summary: Erase a proofing session (public API)
      description: >-
        Authenticated with a customer API key as a Bearer token. Erases the session in
        the engine and what the wallet holds of its outcome (the
        proofed name), whatever its state, and sends `session.purged`. The session stays
        readable with `purgedAt` set, for the audit trail. Audited
        `identity_proofing.session_purged`; erasing it again changes nothing.
      security:
        - customerApiKey: []
      responses:
        '204':
          description: Erased.
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/proofing/sessions/{sessionID}/result:
    parameters:
      - name: sessionID
        in: path
        required: true
        schema:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        description: Session id (`ps_…`), as the create answer and webhooks give it.
    get:
      tags: [identity-proofing-api]
      summary: Get a proofing session's verified identity (public API)
      description: >-
        Authenticated with a customer API key with the `results:read` scope. A settled
        session's result, read from the engine's session on each call (the wallet
        keeps no identity of its own): `status`, `method`, assurance, `verifiedAt`, for an
        approved session `identity` (`givenName`, `familyName`, `birthDate`,
        `nationality`), and `evidence` (`type` `emrtd` or `yivi_disclosure`, the
        document's type, issuing state and expiry, `passiveAuth` and `activeAuth`
        `valid`/`invalid`/`not_performed`, `faceMatch`, `liveness`). Never the document
        number or an image. Every read is audited `identity_proofing.result_read`.
      security:
        - customerApiKey: []
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingApiResult'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The session has no outcome yet (`result_not_ready`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/proofing/sessions/{sessionID}/methods/{method}:
    parameters:
      - name: sessionID
        in: path
        required: true
        schema:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        description: Session id (`ps_…`), as the create answer and webhooks give it.
      - name: method
        in: path
        required: true
        schema:
          type: string
          enum: [idem_app, yivi_app]
        description: The app the subject proofs with.
    post:
      tags: [identity-proofing-api]
      summary: Start a hosted session in an app, headless (public API)
      description: >-
        Authenticated with a customer API key with `sessions:write`, for a customer
        building its own UI: starts a session created with `hosted: true` in the app, as
        the subject picking it on the hosted page would, and answers the link to show:
        `appLink` (the Idem app's `vcmrtd://` link) or `walletLink` (the Yivi app's
        `openid4vp://` request, its disclosure started already), with `expiresAt`. The
        Yivi face check then runs through `/api/v1/proof/{token}/yivi/…` with the token
        of the `hostedUrl`, which also serves `claim-link` for a new Idem code. Takes an
        `Idempotency-Key`.
      security:
        - customerApiKey: []
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingApiMethodStart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The session was not created hosted (`not_hosted`), was started already, or ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/proofing/sessions/{sessionID}/methods/{method}/status:
    parameters:
      - name: sessionID
        in: path
        required: true
        schema:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        description: Session id (`ps_…`), as the create answer and webhooks give it.
      - name: method
        in: path
        required: true
        schema:
          type: string
          enum: [idem_app, yivi_app]
        description: The app the subject proofs with.
    get:
      tags: [identity-proofing-api]
      summary: Poll a headless session (public API)
      description: >-
        Authenticated with a customer API key with `sessions:read`. The session's
        `status` as stored (no re-check with the engine), and `done`
        once it has an outcome or ended.
      security:
        - customerApiKey: []
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingApiMethodStatus'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The session does not run in that app (`wrong_method`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/proofing/sessions/{sessionID}/cancel:
    parameters:
      - name: sessionID
        in: path
        required: true
        schema:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        description: Session id (`ps_…`), as the create answer and webhooks give it.
    post:
      tags: [identity-proofing-api]
      summary: Cancel a proofing session (public API)
      description: >-
        Authenticated with a customer API key as a Bearer token. Ends a session that is
        still `pending` or `in_progress`, in the engine too, and
        answers it with `status` `cancelled` and `cancelledAt`. Audited
        `identity_proofing.session_cancelled`.
      security:
        - customerApiKey: []
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingApiSession'
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The session already has an outcome, ended, or was erased (`session_over`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/identity-proofing/default-webhook:
    post:
      tags: [identity-proofing]
      summary: Receive a customer webhook at the wallet's default endpoint
      description: >-
        Called by the wallet's own webhook deliverer, not by users: where a customer without an
        endpoint of its own is sent its session events
        (`IDENTITY_PROOFING_DEFAULT_WEBHOOK_URL`). Signed like every customer webhook, with the
        deployment's default secret; the result is already stored, so a valid delivery is
        acknowledged. A body over 16 KiB is 400 `invalid_body`; a bad or stale signature is 401
        `bad_signature`.
      security: []
      parameters:
        - name: Yivi-Signature
          in: header
          required: true
          schema:
            type: string
          description: >-
            `t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<body>">`; refused when `t` is
            more than 5 minutes off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, type, createdAt, data]
              properties:
                id:
                  type: string
                  format: uuid
                type:
                  type: string
                createdAt:
                  type: string
                  format: date-time
                data:
                  type: object
      responses:
        '204':
          description: Accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The deployment has no identity proofing encryption key, so there is no default secret (`no_encryption_key`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/customers/{customerID}/flows:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: customerID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Customer id.
    get:
      tags: [identity-proofing]
      summary: List a customer's flows
      description: >-
        Requires organisation membership. An administrator sees every flow of the organisation
        with `assigned` and `default` for this customer; a member only the assigned flows a
        recipient can finish. Each also carries `completable`, `needsReferencePhoto` and
        `diplomaMode`.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/orgs/{slug}/customers/{customerID}/flow-selection:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: customerID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Customer id.
    put:
      tags: [identity-proofing]
      summary: Assign flows to a customer
      description: >-
        Requires an administrator role in the organisation. Replaces the customer's assignment:
        `flowIds` (any active flow of the organisation a recipient can finish, including a flow
        matched against a reference photo sent through the customer API, whether or not members
        may use it) and `defaultFlowId` (one of them, or empty when the list is; a default
        outside the list is 400 `invalid_input`). Returns the customer's flows as the list
        endpoint does for an administrator.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: A flow does not exist or cannot be completed in the app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/signing/availability:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    get:
      tags: [signing]
      summary: Whether a signing provider is configured for the org
      description: >-
        Requires organisation membership. Member-safe signal (no secret) reporting
        whether the org has a CSC signing provider configured and enabled; used to
        gate the signing feature in the UI for members (who cannot read the
        admin-only CSC settings).
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/orgs/{slug}/signing/credential/link:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    post:
      tags: [signing]
      summary: Start linking a signing credential
      description: >-
        Requires organisation membership. Begins the OAuth2/OID4VP authorization to
        link the acting user's signing credential and returns an `authorizeUrl` the
        browser must open to complete the wallet ceremony. Answers 409
        `not_configured` when no CSC provider is configured.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The organisation has no CSC signing provider configured.
  /api/v1/orgs/{slug}/signing/requests:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    get:
      tags: [signing]
      summary: List the organisation's signing requests (history)
      description: >-
        Requires organisation admin. Returns the org's signing requests newest
        first, cursor-paginated (`{requests, nextCursor}`), for the signed-documents
        history.
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque pagination cursor from a previous page.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Page size (1–100, default 25).
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [signing]
      summary: Create a co-signing request
      description: >-
        Requires organisation membership. Accepts a PDF in the `document` multipart
        field plus the chosen signers (`signers`, repeated — one JSON object each),
        the signing `mode` (`parallel` or `sequential`), and the recipient
        (`recipientChannel` one of `none`/`qerds`/`email`, plus `recipientAddress`,
        `recipientName`, `message`). A signer is either an internal member
        (`{"kind":"internal","userId":"<uuid>"}`) or an external signee
        (`{"kind":"external","email":"...","name":"..."}`); the order of the values is
        the signing order for sequential mode. Each signer object may carry
        `placements`: where their visible marks land, in PDF user-space points with the
        origin at the page's bottom-left — at most one `{"kind":"signature",...}` (it
        becomes the visible appearance of their own PAdES signature) and at most one
        `{"kind":"paraph",...}` per page. "A paraph on every page" is sent as one
        placement per page. A signer with no placements signs invisibly. Stores the
        request awaiting signatures and returns `{id}`. A member signs via
        `.../requests/{id}/sign`; an external signee is mailed a one-time link and signs
        under `/api/v1/signing/external/{token}`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document:
                  type: string
                  format: binary
                  description: >-
                    The PDF to sign, at most 25 MB — the documented per-file cap on
                    a QERDS attachment, the channel a signed document is delivered
                    over. A larger one is refused with 413.
                signers:
                  type: array
                  items:
                    type: string
                  description: >-
                    One JSON object per signer, in signing order (1–50): either
                    `{"kind":"internal","userId":"<uuid>"}` for an org member or
                    `{"kind":"external","email":"...","name":"..."}` for an external signee.
                    Either may carry `"placements":[{"kind":"signature"|"paraph","page":1,
                    "x":0,"y":0,"width":0,"height":0}]` — rectangles in PDF points on that
                    page, refused (400) when they fall outside it or past the last page.
                mode:
                  type: string
                  enum: [parallel, sequential]
                recipientChannel:
                  type: string
                  enum: [none, qerds, email]
                recipientAddress:
                  type: string
                recipientName:
                  type: string
                message:
                  type: string
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: No CSC provider configured.
        '413':
          description: The uploaded document is larger than the accepted maximum.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/signing/requests/pending:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    get:
      tags: [signing]
      summary: List documents awaiting the caller's signature
      description: >-
        Requires organisation membership. Returns the requests where the acting user
        is a still-pending signer whose turn it is (`{requests}`).
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/orgs/{slug}/signing/requests/{id}/sign:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Signing request id.
    post:
      tags: [signing]
      summary: Start the caller's signature for a request
      description: >-
        Requires organisation membership, a linked signing credential, and that the
        caller is a pending signer whose turn it is. Prepares the current document,
        binds its hash into the authorization, and returns `{requestId, authorizeUrl}`;
        the browser opens `authorizeUrl` to complete the wallet ceremony.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: No credential linked, already signed, not your turn, or a signature is in progress.
  /api/v1/orgs/{slug}/signing/requests/{id}/decline:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Signing request id.
    post:
      tags: [signing]
      summary: Decline to sign a request
      description: >-
        Requires organisation membership and that the caller is a pending signer of
        the request; unlike signing, it need not be their turn in sequential mode.
        Accepts an optional JSON body `{reason}` (at most 500 characters), shown to
        the requester. Ends the request outright — marks the signer declined and the
        whole request `declined`, since incremental PAdES cannot produce a document
        one selected signer refused — and notifies the requester. Answers 204 on
        success.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional free-text reason shown to the requester.
      responses:
        '204':
          description: The decline was recorded.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already signed, or a signature is in progress.
  /api/v1/orgs/{slug}/signing/requests/{id}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Signing request id.
    get:
      tags: [signing]
      summary: Get a signing request's status
      description: >-
        Requires organisation membership; the caller must be the request's creator or
        a signer (org admins may read any). Returns the request with its signers and
        their per-signer status, the recipient, and the delivery status.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/orgs/{slug}/signing/requests/{id}/document:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Signing request id.
    get:
      tags: [signing]
      summary: Download the signed document
      description: >-
        Requires organisation membership. Returns the signed PAdES PDF
        (`application/pdf`) for a completed request, 409 `not_completed` while it is
        still in progress, or 404 if the request does not exist.
      responses:
        '2XX':
          description: The signed PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The signed document is not ready yet.
  /api/v1/signing/external/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: The external signee's one-time invitation token.
    get:
      tags: [signing]
      summary: An external signee's view of the request they must sign
      description: >-
        Unauthenticated by design: an external signee has no membership and no
        session, so the unguessable one-time token from their invitation mail is their
        whole authorization (the same posture as `GET /api/v1/invite/{token}`).
        Returns who is asking, the document name, their own signer status, how far the
        request has got, whether they have linked a credential and whether it is their
        turn — deliberately not the other signers' names or addresses. 404 when the
        link is unknown, spent or expired.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '404':
          description: The signing link is not valid or has expired.
  /api/v1/signing/external/{token}/document:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: The external signee's one-time invitation token.
    get:
      tags: [signing]
      summary: The document an external signee is being asked to sign
      description: >-
        Returns the current state of the document (`application/pdf`, inline) — the
        original upload, or the accumulating PAdES once earlier signers have signed —
        so the signee can read what they are signing. Keyed by the invitation token
        only.
      responses:
        '2XX':
          description: The document to review.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: The signing link is not valid or has expired.
  /api/v1/signing/external/{token}/credential/link:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: The external signee's one-time invitation token.
    post:
      tags: [signing]
      summary: Start linking an external signee's signing credential
      description: >-
        Runs the same service-scope wallet ceremony a member runs, but caches the
        resulting credential under the signee's (organisation, e-mail) subject rather
        than an internal user row. Returns `{authorizeUrl}`.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '404':
          description: The signing link is not valid or has expired.
        '409':
          description: The organisation has no CSC signing provider configured.
  /api/v1/signing/external/{token}/sign:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: The external signee's one-time invitation token.
    post:
      tags: [signing]
      summary: Start an external signee's signature
      description: >-
        Requires a linked credential and that it is this signee's turn (the same turn
        and in-flight rules as a member's signature). Prepares the current document,
        binds its hash into the authorization, and returns `{requestId, authorizeUrl}`.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '404':
          description: The signing link is not valid or has expired.
        '409':
          description: No credential linked, already signed, not your turn, or a signature is in progress.
  /api/v1/signing/external/{token}/decline:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
        description: The external signee's one-time invitation token.
    post:
      tags: [signing]
      summary: Decline an external signee's signature
      description: >-
        Same as the member decline, keyed by the invitation token: it need not be
        this signee's turn. Accepts an optional JSON body `{reason}` (at most 500
        characters), shown to the requester. Ends the request outright and notifies
        the requester. Answers 204 on success.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Optional free-text reason shown to the requester.
      responses:
        '204':
          description: The decline was recorded.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: The signing link is not valid or has expired.
        '409':
          description: Already signed, or a signature is in progress.
  /api/v1/signing/callback:
    get:
      tags: [signing]
      summary: OAuth2 signing-ceremony redirect callback
      description: >-
        The QTSP-registered redirect target the browser returns to after the wallet
        ceremony. Correlated by an unguessable `state` (so it needs no session); it
        completes the link or sign flow and 302-redirects the browser back to the
        app. Not called directly by clients.
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
          description: OAuth2 authorization code.
        - name: state
          in: query
          required: false
          schema:
            type: string
          description: Opaque state correlating the callback to the in-flight ceremony.
      responses:
        '302':
          description: Redirect back to the application.
