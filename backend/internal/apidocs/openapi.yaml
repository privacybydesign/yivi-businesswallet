                    started: true
                approved:
                  summary: Approved
                  value:
                    status: approved
                    method: idem_app
                    linkExpiresAt: "2026-10-02T09:40:00Z"
                    started: true
                    completedAt: "2026-10-02T09:34:12Z"
        '403':
