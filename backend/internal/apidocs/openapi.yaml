  /api/v1/orgs/{slug}/wsca/rotate:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    post:
      tags: [wsca]
      summary: Rotate the organisation WSCA holder-wallet secret
      description: >-
