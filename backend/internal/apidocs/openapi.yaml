      summary: Upload a VOG PDF through a submission link
      security: []
      description: >-
        Multipart form with a "file" field carrying the PDF; validated live against validatie.nl and matched against the member's stored identity. 200 for a passing check, 422 for a recorded rejection. A passing check retires the link.
