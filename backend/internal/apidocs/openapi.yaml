    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource identifier.
    post:
      tags: [attestation]
      summary: Cancel an unclaimed attestation offer
      description: >-
        Withdraws an offer that was never claimed (status `offered`), setting it
        to `cancelled`. Nothing was held, so this is not a revocation and never
        touches the Token Status List. Requires an administrator role. Returns
        409 when the attestation is not an unclaimed offer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON request payload; see the endpoint description.
      responses:
        '2XX':
          description: Successful response.
