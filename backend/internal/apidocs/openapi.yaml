  /api/v1/orgs/{slug}/identity-proofing/requests:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    get:
      tags: [identity-proofing]
      summary: List identity proofing requests
      description: >-
        Requires organisation membership. An administrator sees every request of the
        organisation, a member the requests they sent; `?subjectUserId=` narrows either to the
        ones proofing one member (a malformed id is 400 `invalid_id`), `?subjectKind=` to
        those sent to members or to external people (any other value is 400 `invalid_input`),
        `?flowId=` to those sent on one flow, any of its versions, `?status=` to those that read
        in one status (any other value is 400 `invalid_input`), and `?flowKind=data_request` to
        the data requests (`data_access` and `data_erasure`); the narrowings combine. A member
        with the reviewer right also sees every request of the organisation for
        `?status=needs_review` and for `?flowKind=data_request`, whatever else narrows it; any
        other list is the requests they sent. `external` is true for a request that went to an
        external person, not a member. At most the 200 newest of those asked for (with
        `status=needs_review`, the 200 longest in review, oldest in review first), as stored:
        outcomes land as the engine reports them,
        and a list read does not re-check it. Only the outcome and assurance level are
        returned, and for an external person's approved request the name read off the document
        (`proofedName`), until its flow's retention, else the organisation's fixed 7 days
        (`dataRetentionDays`), clears it. No other document data.
      parameters:
        - name: subjectUserId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Only the requests proofing this member, newest first.
        - name: subjectKind
          in: query
          required: false
          schema:
            type: string
            enum: [member, external]
          description: Only the requests sent to members, or only those sent to external people.
        - name: flowId
          in: query
          required: false
          schema:
            type: string
          description: >-
            Only the requests sent on this flow, newest first. The 200 cap counts only those, so a
            flow's own requests are listed even when the organisation's newest 200 are on other
            flows. An id the organisation has no requests on lists none.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, in_progress, needs_review, approved, rejected, expired, cancelled]
          description: >-
            Only the requests whose `status` reads this, newest first (`needs_review`: the longest
            in review first): a request whose link or session lapsed unfinished is `expired`, not
            `pending` or `in_progress`, one in review whose session ended is `expired` too, and one
            an API caller ended is `cancelled`. The 200 cap counts only those.
        - name: flowKind
          in: query
          required: false
          schema:
            type: string
            enum: [data_request]
          description: Only the data requests, "See my data" (`data_access`) and "Delete my data" (`data_erasure`).
        - name: addressReview
          in: query
          required: false
          schema:
            type: string
            enum: [pending, confirmed, rejected]
          description: >-
            Only the requests whose self-declared address stands so with a reviewer. A member with
            the reviewer right lists `pending` for the whole organisation.
      responses:
        '200':
          description: >-
            The requests, newest first; for `status=needs_review` the longest in review first, for
            `addressReview=pending` the longest waiting first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingRequestList'
              examples:
                requests:
                  summary: An external person's approved request
                  value:
                    - id: 3f6b44a0-9d6b-4b18-a57a-2b7e4a0a9c11
                      requestedByName: Sanne de Vries
                      external: true
                      subjectName: Anna Jansen
                      subjectEmail: anna@example.org
                      proofedName: Anna Jansen
                      flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                      flowName: Onboarding
                      flowVersion: 3
                      method: idem_app
                      status: approved
                      assuranceLevel: substantial
                      eidasLevel: substantial
                      linkExpiresAt: "2026-10-02T09:40:00Z"
                      createdAt: "2026-10-02T09:30:00Z"
                      completedAt: "2026-10-02T09:34:12Z"
                      purgeAt: "2026-11-01T09:34:12Z"
                      diplomaMode: "off"
                      addressMode: "off"
                      diplomas: []
                      expectedSubject: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '409':
          description: The deployment has no identity proofing encryption key (`no_encryption_key`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [identity-proofing]
      summary: Send an identity proofing request
      description: >-
        Requires organisation membership. Either `userId` (a member of the organisation) with
        `flowId` a flow an administrator made available to members, or, without `userId`, an
        external person (no login) given by `email` and an optional `name` and `birthDate`.
        For an external person an organisation admin may send any flow a recipient can
        finish; any other member only a flow members may use (else 422 `flow_not_allowed`).
        An omitted `flowId` is the organisation's default flow, or 422 `no_default_flow` when
        it has none. Creates the proofing session and e-mails the subject its Idem deep link
        as a QR code and a button; after the session ends, a new request means a new mail. The
        session runs 10 minutes, or the organisation's session length, from the send; once the
        subject opens it the engine may extend it by up to 10 minutes, never past 15 minutes
        from its creation. `mailSent` is false when the mail could not be sent. `method` is the
        app the subject proofs with (`idem_app`, the default, or `yivi_app`) and `channel` how
        the session reaches them (`email`, the default, `on_screen`, or `hosted` for an
        external person: the answer carries `hostedUrl`, a link to the organisation's hosted
        page valid 72 hours, which the sender hands the person; nothing is mailed, the
        session starts when the person picks an app there, and a flow whose hosted page is
        off is 409 `hosted_disabled`). An on-screen request
        mails nothing and needs no `email` for an external person; an on-screen Idem request
        answers the Idem link as `deepLink` (scannable until `deepLinkExpiresAt`), and a Yivi
        one must be on-screen (an e-mailed one is 400), its disclosure started through
        `yivi/start`. A Yivi request needs a flow that takes no document photos and is not matched
        against a reference photo (else 400
        `invalid_input`). A flow that asks for diplomas, the address or the Verzekeringsbericht cannot be
        e-mailed (422 `diplomas_need_page`, `address_needs_page`, `employment_needs_page`), and a flow matched
        against a reference photo cannot be sent from here, which takes no photo (422 `reference_photo_required`). A request for
        an external person with `birthDate` (a past date, YYYY-MM-DD, with `name`) is for that
        one person: an approval of anyone else is recorded as `rejected` with `errorCode`
        `IDENTITY_MISMATCH`, and the request reads `expectedSubject: true`. The flow must read
        the document data (dg1), and a member's request cannot carry `birthDate`. `flowKind`
        `data_access` ("See my data") or `data_erasure` ("Delete my data") sends a data request
        instead of an identity check, on the organisation's own flow of that kind (`GET
        .../data-request-flows`, created the first time): only an administrator sends one,
        only to an external person (else 422 `flow_not_allowed`, `data_flow_for_member`). A
        `flowId` that names a data request flow sends a data request of its kind the same way.
        Other 400 `invalid_input` causes are an unknown `method`, `channel`, `language` or
        `flowKind`, a `flowKind` that is not the kind of the `flowId` given, a `hosted` channel
        for a member, and an invalid `email`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingCreateRequest'
            examples:
              member:
                summary: Proof a colleague by mail
                value:
                  userId: 2a3b4c5d-6e7f-4a8b-9c0d-1e2f3a4b5c6d
                  flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
              external:
                summary: Mail an external person, on the default flow
                value:
                  email: anna@example.org
                  name: Anna Jansen
                  language: nl
              onScreen:
                summary: Show the QR code on screen
                value:
                  name: Anna Jansen
                  channel: on_screen
              hosted:
                summary: Hand the person a link
                value:
                  email: anna@example.org
                  name: Anna Jansen
                  channel: hosted
      responses:
        '201':
          description: Sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingCreatedRequest'
              examples:
                mailed:
                  summary: Mailed
                  value:
                    id: 3f6b44a0-9d6b-4b18-a57a-2b7e4a0a9c11
                    requestedByName: Sanne de Vries
                    external: true
                    subjectName: Anna Jansen
                    subjectEmail: anna@example.org
                    flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                    flowName: Onboarding
                    flowVersion: 3
                    method: idem_app
                    status: pending
                    linkExpiresAt: "2026-10-02T09:40:00Z"
                    createdAt: "2026-10-02T09:30:00Z"
                    diplomaMode: "off"
                    addressMode: "off"
                    diplomas: []
                    expectedSubject: false
                    mailSent: true
                onScreen:
                  summary: On screen
                  value:
                    id: 3f6b44a0-9d6b-4b18-a57a-2b7e4a0a9c11
                    requestedByName: Sanne de Vries
                    external: true
                    subjectName: Anna Jansen
                    subjectEmail: ""
                    flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                    flowName: Onboarding
                    flowVersion: 3
                    method: idem_app
                    status: pending
                    linkExpiresAt: "2026-10-02T09:40:00Z"
                    createdAt: "2026-10-02T09:30:00Z"
                    diplomaMode: "off"
                    addressMode: "off"
                    diplomas: []
                    expectedSubject: false
                    mailSent: false
                    deepLink: vcmrtd://verify?handover=hv_3m8x2kq7&api=https%3A%2F%2Fwallet.example.nl
                    deepLinkExpiresAt: "2026-10-02T09:35:00Z"
