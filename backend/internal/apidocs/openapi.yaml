        `borderColor`, `linkColor`, `successColor`, `warningColor`, `errorColor`,
        `topbarColor` and `fontFamily`; setting any colour or the font gives the organisation's
        proofing a look of its own in the Idem app and hosted page, where what it leaves empty
        keeps the design's, not the organisation's; without one they show the organisation's
        theme), `supportContact` and `privacyUrl` (an https URL), each added to the mail and
        left out when empty,
        and a `logo` file (PNG, JPEG, GIF or WebP, at most 512 KiB; mail clients do not
        render SVG) or `removeLogo=true`. `hidePoweredBy=true` leaves the "powered by" line off
        the organisation's hosted pages, whose accent colour is `primaryColor`. Returns the
        settings.
      requestBody:
        required: true
