  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/yivi/disclosure:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the API and webhooks show.
    get:
      tags: [identity-proofing]
      summary: Redeem an on-screen request's Yivi disclosure
      description: >-
        Requires organisation membership. `done` is false while the subject has not finished the
        OpenID4VP presentation in the Yivi app. Once done, the disclosure decides the session:
        `ok` true approved it, `ok` false rejected it and `code` says why
        (document_not_accepted, or age_not_disclosed when an age check's claim did not come
        back). No face check runs: the Yivi app vouches for its holder, and
        the session reaches eIDAS low.
        The response returns no disclosed value; on approval the engine keeps the disclosed identity attributes (and the
        photo, when the flow requested it) as the session's result, readable through `result`,
        until its retention.
      responses:
        '200':
          description: The disclosure's state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingYiviDisclosure'
              examples:
                pending:
                  summary: Not finished in the app yet
                  value:
                    done: false
                    ok: false
                approved:
                  summary: The disclosure approved the session
                  value:
                    done: true
                    ok: true
                refused:
                  summary: The document is not one the flow accepts
                  value:
                    done: true
                    ok: false
                    code: document_not_accepted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request does not run in the Yivi app (`wrong_method`) or its session has ended (`session_over`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The proofing engine refused the step (`rejected_by_provider`), e.g. the disclosure is not complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/flows/{flowID}/hosted:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: flowID
        in: path
        required: true
        schema:
          type: string
        description: The flow's id.
    get:
      tags: [identity-proofing]
      summary: Read a flow's hosted page settings
      description: >-
        Requires an administrator role in the organisation. `enabled` (hosted links may be made
        for the flow), `locales` (`en`/`nl` the page offers; empty is every one) and
        `completion`: `redirect` (the session's `redirectUrl` when it has one, else the page's
        own thank-you screen) or `done` (always the thank-you screen), and `returnUrl`: the
        page a link for the flow is made with as its `redirectUrl` when it names none of its
        own (empty for none). A flow never set reads `enabled: true, locales: [], completion:
        redirect, returnUrl: ""`.
      responses:
        '200':
          description: The flow's hosted page settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingFlowHosted'
              examples:
                default:
                  summary: A flow never set
                  value:
                    enabled: true
                    locales: []
                    completion: redirect
                    returnUrl: ""
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '422':
          description: The flow is not one of the organisation's (`flow_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [identity-proofing]
      summary: Save a flow's hosted page settings
      description: >-
        Requires an administrator role in the organisation. Body `{enabled, locales,
        completion, returnUrl}` as read; an absent `returnUrl` removes the return page. A
        `returnUrl` must be on one of the organisation's `allowedRedirectOrigins` (else 400
        `redirect_not_allowed`), and a `done` flow has none (400 `invalid_input`). A link made
        after the save takes the new return page; one made before keeps its own. A hosted
        session on a flow with its page off is 409
        `hosted_disabled`; one with a `redirectUrl` on a `done` flow, or a `language` the flow
        does not offer, is 400. Audited `identity_proofing.flow_hosted_configured` with before
        and after. A missing `enabled` is 400 `invalid_body`; a `completion` other than
        `redirect` or `done`, or an unsupported locale, is 400 `invalid_input`. Offering a
        language (or every language, `locales: []`) that the flow's active version gives an
        item it collects no `attributeReasons` in is 400 `reasons_missing`; a version saved
        before reasons existed gives none and may offer any language.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingFlowHostedUpdate'
            examples:
              dutchOnly:
                summary: Dutch only, always the thank-you screen
                value:
                  enabled: true
                  locales: [nl]
                  completion: done
              returnPage:
                summary: Back to the portal once the check ends
                value:
                  enabled: true
                  locales: []
                  completion: redirect
                  returnUrl: https://portal.example.nl/verified
      responses:
        '200':
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingFlowHosted'
              examples:
                saved:
                  summary: Dutch only
                  value:
                    enabled: true
                    locales: [nl]
                    completion: done
                    returnUrl: ""
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '409':
          description: The flow is See my data or Delete my data, the wallet's own (`data_request_flow`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The flow is not one of the organisation's (`flow_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
