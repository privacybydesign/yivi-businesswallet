    get:
      tags: [identity-proofing]
      summary: Open a hosted proofing link
      security: []
      description: >-
        The hosted page, unauthenticated: the token is the whole authorization, and every route
        is rate-limited per organisation, across all its links. `organization` (its `name`,
        `branding`, whose `logoUri` is this
        link's logo route, and `dataRetentionDays`), `flow` (its `name`, `requestedAttributes`,
        `attributeReasons`, `requiredAssuranceLevel`, `yiviAvailable`, `diplomaMode`, `retentionDays`, the most
        days the session's data is kept, and `sessionTtlSeconds`, how long a started session runs), the extracts added so far
        (`diplomas`), and the progress: `status`, `errorCode`, `method`, `started`,
        `completedAt`, `diplomasUntil` and `linkExpiresAt` (the link's end until started, then
        the session's). `sessionId` is the API's id for the session; `redirectUrl` (absent
        for the page's own done screen) where the page sends the subject once settled;
        `embedOrigins` the organisation's allowed redirect origins, the only ones the page posts its
        `proofing.completed` message to; `language` (`en` or `nl`, absent for the browser's) the
        page's language, and `locales` the languages the flow's page offers (empty is every
        one). No identity data; `diplomas` lists each extract the person added by
        `qualification`, `institution`, `dateAwarded` and `nlqfLevel` only, never its document
        number, since whoever holds the link can read it. `theme` is the look the page takes. A flow no longer in the organisation is 422 `flow_not_found`.
