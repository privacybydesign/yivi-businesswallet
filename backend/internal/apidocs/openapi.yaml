  /api/v1/orgs/{slug}/identity-proofing/data-request-flows:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    get:
      tags: [identity-proofing]
      summary: List the org's See my data and Delete my data flows
      description: >-
        Requires an administrator role in the organisation. The two data requests every
        organisation offers, as the GDPR requires: `data_access` ("See my data") first, then
        `data_erasure` ("Delete my data"), each as the flow list shows a flow. They are the
        wallet's own flows, on its own definition: the person scans their document, its chip is
        read and their face checked, at eIDAS Substantial, and the result carries the name and
        date of birth the request finds their sessions by, with the checks' outcomes and scores,
        never an image. The first read creates the ones the organisation lacks (audited
        `identity_proofing.flow_created` and `identity_proofing.flow_kind_configured`, without an
        actor), and one whose definition falls short of the wallet's gets it back in a new
        version. Neither is listed among the flows, and changing one (its versions, hosted page,
        branding, diplomas, address or employment) is 409 `data_request_flow`. Send one with `flowKind` on
        `POST .../requests`. A deployment without the Regula face check cannot create them (422
        `rejected_by_provider`).
      responses:
        '200':
          description: See my data, then Delete my data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingFlowList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '422':
          description: The proofing engine refused to create a flow (`rejected_by_provider`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
