        '200':
          description: The disclosure request for the Yivi app.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingYiviStart'
              examples:
                started:
                  summary: Started
                  value:
                    walletLink: openid4vp://?client_id=verifier.example.nl&request_uri=https%3A%2F%2Fverifier.example.nl%2Fr%2F8f3k
                    expiresAt: "2026-10-02T09:40:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
