                "requiredChecks": [
                  "nfc.passive_auth",
                  "face.match"
                ],
                "requestedAttributes": [
                  "dg1"
                ],
                "attributeReasons": {
                  "dg1": {
                    "en": "To confirm who you are.",
                    "nl": "Om te bevestigen wie je bent."
                  }
                }
              }'
        - lang: Go
          label: Go
          source: |
            package main

            import (
            	"fmt"
            	"io"
            	"log"
            	"net/http"
            	"strings"
            )

            func main() {
            	req, err := http.NewRequest(http.MethodPost, "https://wallet.example.org/api/v1/proofing/flows", strings.NewReader(`{
            	  "name": "Passport with face check",
            	  "steps": [
            	    "document_capture",
