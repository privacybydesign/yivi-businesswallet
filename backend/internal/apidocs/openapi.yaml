      description: |
        Requires an administrator role in the organisation. The body is
        `{"canReview": true}` or `{"canReview": false}`. A member with the right
        decides identity checks and data requests in identity proofing: it reaches
        what waits for review and every data request, not the organisation's
        other checks. An admin reviews by their role, so the right for an admin is
        409 `admin_reviews`, and a role change clears it. Audited
        `membership.review_changed` when it changes.
