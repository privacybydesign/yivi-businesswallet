  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/result:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the API and webhooks show.
    get:
      tags: [identity-proofing-internal]
      summary: Read an external person's request's verified identity
      description: >-
        Requires an administrator role in the organisation, or the reviewer right, which reaches
        a request waiting for review and a data request only (any other is 404). A settled
        external request's result,
        read from the engine's session on each call, in the shape of the API's `GET
        /proofing/sessions/{id}/result`: `identity` for an approval and for a check waiting for
        review, `evidence`, and `diplomas` (the DUO extracts the subject added). For an approval,
        and for a check waiting for review, it also carries `photo` (the document's portrait),
        `selfie` (the live face matched against it), and `documentImage` and `documentImageBack`
        (photos of the document's front and back; a passport's back is its personal number
        page), each `{mimeType, data}` with `data` base64, when the flow requested them; the API
        carries the document's images for an approval only, and never the selfie. A check
        waiting for review holds its face photos until it is decided, also on a flow that does
        not keep them after the match. Audited `identity_proofing.result_read`
        with the administrator as actor on every read. A member's request, one erased, or a
        hosted one never started is 404.
      responses:
        '200':
          description: The verified identity, with the images for an approval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingAdminResult'
              examples:
                approved:
                  summary: Approved, with the chip photo and the selfie
                  value:
                    id: ps_q4r7tz2mxk3vbn6hw5jc2dfa7e
                    status: approved
                    method: idem_app
                    assuranceLevel: substantial
                    eidasLevel: substantial
                    verifiedAt: "2026-10-02T09:34:12Z"
                    identity:
                      givenName: Anna
                      familyName: Jansen
                      birthDate: "1991-03-14"
                      nationality: NLD
                    evidence:
                      - type: emrtd
                        documentType: P
                        issuingState: NLD
                        expiryDate: "2031-05-02"
                        passiveAuth: valid
                        activeAuth: valid
                        faceMatch: 0.97
                        liveness: passed
                    photo:
                      mimeType: image/jpeg
                      data: /9j/4AAQSkZJRgABAQAAAQABAAD
                    selfie:
                      mimeType: image/jpeg
                      data: /9j/4AAQSkZJRgABAQAAAQABAAD
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request has no outcome (`result_not_ready`), which stays so for one that expired or was cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/review:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the API and webhooks show.
    post:
      tags: [identity-proofing-internal]
      summary: Decide a request under review
      description: >-
        Requires an administrator role in the organisation, or the reviewer right (a request
        that waits for review; any other is 404 for a reviewer). `decision` is `approve` or `reject`,
        `reason` (required, at most 500 characters) says why, and a rejection may name what is
        wrong as `errorCode`: `REVIEW_NOT_HOLDER` (it is someone else's), `REVIEW_ALTERED` (it
        looks altered), `EVIDENCE_NOT_AS_REQUESTED` (it is not what was asked for) or
        `MANUAL_REVIEW_REJECTED` (something else, also when absent). The engine settles the
        session and the outcome lands as any other: an approval still has to meet the flow's
        assurance level, and the organisation's webhook is sent. Deciding drops the face photos a
        check held for its review, unless its flow keeps them. Audited
        `identity_proofing.review_decided` with the administrator as actor. The answer is the
        request. An `errorCode` with an approval, or any other code, is 400 `invalid_input`. An
        identity check the caller sent, or one about the caller, is 403 `own_review`: another
        reviewer decides it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingReviewDecision'
            examples:
              approve:
                summary: Approve
                value:
                  decision: approve
                  reason: Document checked by hand against the original
              reject:
                summary: Reject with a code
                value:
                  decision: reject
                  reason: The payslip is in another person's name
                  errorCode: REVIEW_NOT_HOLDER
      responses:
        '200':
          description: The request after the decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Not an administrator (`forbidden`), or an identity check the caller sent or is the
            subject of (`own_review`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The request is not under review (`not_under_review`), decided already or its session
            ended; or an approved erasure names a session still within the organisation's legal
            retention (`legal_retention`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/address:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the API and webhooks show.
    post:
      tags: [identity-proofing-internal]
      summary: Enter the postal address on an on-screen request
      description: >-
        Requires organisation membership (an admin, or the member who sent it). Once, within an
        hour of the identity check finishing (approved, or in review) on a request that asks for the address. Every field is
        required, at most 200 characters, trimmed; a missing one is 400 `invalid_input`. An
        address with a Dutch postal code (`1234 AB`) is checked against the Dutch address
        register (the BAG): one it has is kept as the register writes its street, house number,
        postal code and city (`verification: verified`), one it lacks is 422
        `address_not_found`; while the register cannot be reached it is kept as entered
        (`unchecked`). Any other address is kept as entered (`unsupported`). On a Yivi app
        request whose disclosure carried the registered (BRP) address, the address is then
        compared with it instead: the same postal code and house number (with any letter or
        addition) is `registered`; another postal code or house number is
        `registered_mismatch`, carrying the registered address as `registered` for the reviewer.
        One that differs only in its letter or addition is kept as the register checked it
        (`verified` or `unchecked`). Only `registered` confirms where the person lives; every
        other address, `registered_mismatch` and `verified` included, waits for a reviewer
        (`addressReview: pending`, see `.../review-items/address`), and the session keeps its outcome.
        The address is kept sealed and shown with the request; audited
        `identity_proofing.address_added` with its `verification` but without the address (webhook
        `session.address_added`, which carries it without `registered`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingAddress'
            examples:
              address:
                summary: An address
                value:
                  street: Kerkstraat
                  houseNumber: 12a
                  postalCode: 6511 AB
                  city: Nijmegen
                  country: Nederland
      responses:
        '204':
          description: The address is kept.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request asks for no address (`address_not_asked`), it holds one already or the window is closed (`address_closed`), or the request was cancelled or erased (`session_over`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The address has a Dutch postal code but is not in the Dutch address register (`address_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/address/lookup:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the API and webhooks show.
      - name: postalCode
        in: query
        required: true
        schema:
          type: string
          maxLength: 200
        description: The postal code the subject typed; one that is not Dutch finds nothing.
      - name: houseNumber
        in: query
        required: true
        schema:
          type: string
          maxLength: 200
        description: The house number the subject typed; only the number it starts with is looked up.
    get:
      tags: [identity-proofing-internal]
      summary: Look up a Dutch address on an on-screen request
      description: >-
        Requires organisation membership (an admin, or the member who sent it). While the
        request takes its address (as the POST), every address in the Dutch address register
        (the BAG, through PDOK) at `postalCode` and the number `houseNumber` starts with, with
        each letter and addition. The page fills in the street and city from it; the POST
        checks the address again.
      responses:
        '200':
          description: The addresses found; none for a postal code that is not Dutch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingAddressLookup'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request takes no address now (`address_not_asked`, `address_closed`, `session_over`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The Dutch address register cannot be reached (`address_lookup_unavailable`); the address is entered in full.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/review-items/{kind}:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the API and webhooks show.
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum: [identity, address, employment, diplomas, data_request]
        description: The review item decided; any other is 404 `not_found`.
    post:
      tags: [identity-proofing-internal]
      summary: Confirm or reject a review item
      description: >-
        Requires an administrator role in the organisation, or the reviewer right. `decision` is
        `confirm` or `reject`, with a required `reason` (at most 500 characters; 400
        `invalid_input` otherwise).

        - `address`: an address the registered (BRP) address did not confirm (any
          `verification` but `registered`, so every Idem app address and a
          `registered_mismatch`) waits as `addressReview: pending`. Only the address is decided:
          the session keeps its outcome. No `errorCode` (400 `invalid_input`). Audited
          `identity_proofing.review_item_decided` with the kind, the decision and the reason, sent
          as webhook `session.address_reviewed`. An address that waits for no review, decided
          already, lapsed or erased, is 409 `address_not_under_review`.

        - `employment`: a kept Verzekeringsbericht with no current job, or a current benefit or
          other income beside one (`reviewReason`), waits as `employmentReview: pending`. As for
          the address, only the step is decided and the session keeps its outcome; no
          `errorCode`. Audited `identity_proofing.review_item_decided`, sent as webhook
          `session.step_reviewed`. One that waits for no review is 409 `not_under_review`.

        - `identity` and `data_request`: the request's own review (`status: needs_review`),
          decided as `.../review` decides it (`confirm` approves, and `errorCode` names a
          rejection). A request whose review is of another kind, or that is not in review, is
          409 `not_under_review`.

        The answer is the request; to a reviewer who is not an administrator, without
        `proofedName` and diplomas, and without `employment` unless it is reviewed. A reviewer who is not an administrator does
        not reach a request outside the Reviews page: 404 `session_not_found`. One on a request
        the caller sent, or about the caller, is 403 `own_review`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision:
                  type: string
                  enum: [confirm, reject]
                reason:
                  type: string
                  maxLength: 500
                errorCode:
                  type: string
                  description: Only rejecting a request's own review, as `.../review` takes it.
            examples:
              confirm:
                summary: Confirm an address
                value:
                  decision: confirm
                  reason: Matches the rental contract
      responses:
        '200':
          description: The request after the decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Not an administrator or reviewer (`forbidden`), or a request the caller sent or is the
            subject of (`own_review`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The item waits for no decision (`address_not_under_review`, `not_under_review`), or
            `confirm` on a step with a file whose seal was never checked (`seal_unchecked`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/review-items/{kind}/seal-check:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the API and webhooks show.
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum: [diplomas, employment]
        description: The step whose files are checked; another review kind is 400 `invalid_input`, an unknown one 404 `not_found`.
    post:
      tags: [identity-proofing-internal]
      summary: Check the seals that could not be checked at upload again
      description: >-
        Requires an administrator role in the organisation, or the reviewer right, on a step
        whose review item waits (409 `not_under_review` otherwise). Each of the step's files
        whose seal could not be checked at upload (`uncheckedDiplomas`, `uncheckedEmployment`)
        is checked as on upload, against the identity the session approved: kept or refused,
        audited as on upload, and its PDF deleted, its outcome kept in `sealChecks`. A seal that is still unreachable is 503
        `seal_check_unavailable`, with the files checked before it decided and the rest still
        waiting. The step's item still waits for the reviewer's decision, which `confirm` can
        only make once no file waits. A reviewer who is not an administrator does not reach a
        request outside the Reviews page (404 `session_not_found`); one on a request the caller
        sent, or about the caller, is 403 `own_review`. The answer is the request.
      responses:
        '200':
          description: The request after the check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Not an administrator or reviewer (`forbidden`), or a request the caller sent or is the
            subject of (`own_review`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The step's item waits for no decision (`not_under_review`), or the deployment checks no diplomas (`no_diploma_checker`) or no Verzekeringsbericht (`no_employment_checker`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: The seal still cannot be checked (`seal_check_unavailable`). Try again later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/review-items/counts:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    get:
      tags: [identity-proofing-internal]
      summary: Count what waits for review
      description: >-
        Requires an administrator role in the organisation, or the reviewer right. How many
        sessions that are not erased wait for a decision: per kind of review in `counts` (a
        session waiting for its identity and its address counts under both), each once in
        `sessions`, and those waiting for a step (an address, a Verzekeringsbericht) in
        `stepSessions`. Every kind is in `counts`, 0 when none waits.
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema:
                type: object
                required: [counts, sessions, stepSessions]
                properties:
                  counts:
                    type: object
                    required: [identity, address, employment, diplomas, data_request]
                    properties:
                      identity:
                        type: integer
                      address:
                        type: integer
                      employment:
                        type: integer
                      diplomas:
                        type: integer
                      data_request:
                        type: integer
                  sessions:
                    type: integer
                    description: The sessions that wait, each once.
                  stepSessions:
