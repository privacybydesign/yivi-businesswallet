components:
  securitySchemes:
    customerApiKey:
      type: http
      scheme: bearer
      description: A proofing customer's API key (`yp_live_…`), for the public `/api/v1/proofing` routes.
    cookieAuth:
      type: apiKey
      in: cookie
      name: ybw_session
  schemas:
    OutboundPresentationRequest:
      type: object
      properties:
        id:
          type: string
        sender:
          type: string
        recipient:
          type: string
        status:
          type: string
          enum: [sent, completed, failed, expired]
        failureReason:
          type: string
        fetched:
          type: boolean
          description: Whether the recipient's wallet has fetched the Request Object.
        credentials:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              vct:
                type: string
              claims:
                type: array
                items:
                  type: string
        disclosed:
          type: array
          items:
            type: object
            properties:
              queryId:
                type: string
              vct:
                type: string
              issuer:
                type: string
              claims:
                type: object
                additionalProperties: true
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        respondedAt:
          type: string
          format: date-time
    Error:
      type: object
      description: Error response body returned by respond.Error.
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Stable machine-readable error code.
      required: [error, code]
    ProofingApiFlow:
      type: object
      description: A flow assigned to the customer.
      properties:
        id:
          type: string
          description: The flow's id, stable across versions; `flowId` when creating a session.
        name:
          type: string
        version:
          type: integer
          description: The active version, which new sessions run.
        requiredAssuranceLevel:
          type: string
          enum: [low, substantial]
          description: The eIDAS level an approval must reach; absent for none.
        requestedAttributes:
          type: array
          items:
            type: string
          description: What the result may carry (`dg1` the document data with name and birth date, `dg2` the chip photo, `selfie`, …).
        default:
          type: boolean
          description: The flow a session without `flowId` runs.
        needsReferencePhoto:
          type: boolean
          description: The face is checked without reading the chip, against the `referencePhoto` every session on this flow must carry.
      required: [id, name, version, requestedAttributes, default, needsReferencePhoto]
    ProofingApiFlowList:
      type: array
      items:
        $ref: '#/components/schemas/ProofingApiFlow'
    ProofingApiCreateSession:
      type: object
      additionalProperties: false
      description: >-
        Who to verify and how. Without `hosted`, the session starts now and runs 10 minutes
        (or the customer's session length); with `hosted: true` you get a link valid 72 hours,
        and the session starts when the person opens it.
      properties:
        email:
          type: string
          format: email
          description: The person's address; required unless `hosted` or `sendMail` is false.
        name:
          type: string
          maxLength: 200
          description: The person's name. Only a label, unless `birthDate` is given too.
        birthDate:
          type: string
          format: date
          example: "1984-07-21"
          description: >-
            With `name`, makes the session one for that person only: the name and birth date
            on the document must match, or the session is `rejected` with `IDENTITY_MISMATCH`.
            The flow must read the document data.
        referencePhoto:
          type: string
          format: byte
          description: >-
            Your own photo of the person's face, standard base64 of a PNG, JPEG or WebP of
            at most 512 KiB. Required on a flow with `needsReferencePhoto`, refused on any
            other. Deleted once the face check can no longer run.
        flowId:
          type: string
          description: One of the customer's flows; absent runs its default flow.
        sendMail:
          type: boolean
          default: true
          description: False skips the mail; show the answer's `deepLink` as a QR code yourself.
        language:
          type: string
          enum: [en, nl]
          description: The mail's, the page's and the Idem app's language.
        hosted:
          type: boolean
          default: false
          description: Answer a `hostedUrl` to hand the person instead of starting the session now. Live keys only.
        redirectUrl:
          type: string
          format: uri
          description: >-
            With `hosted`, where the page sends the person once the session settles, with
            `?session=<id>&status=<status>` added. Its origin must be one of the customer's
            allowed redirect origins.
        scriptedOutcome:
          type: string
          example: approve
          description: Test keys only. `approve` (default), `reject:<CODE>`, `needs_review` or `expire`.
    ProofingApiSession:
      type: object
      description: A session as stored, with its outcome. Never document data beyond the proofed name.
      properties:
        id:
          type: string
          pattern: '^ps_[a-z2-7]{26}$'
        status:
          type: string
          enum: [pending, in_progress, approved, rejected, needs_review, expired, cancelled]
        flowId:
          type: string
        flowName:
          type: string
        flowVersion:
          type: integer
        method:
          type: string
          enum: [idem_app, yivi_app, browser]
          description: The app the person used; absent while nobody opened the session.
        subjectEmail:
          type: string
        subjectName:
          type: string
        proofedName:
          type: string
          description: The name read off an approved document, until the customer's data retention clears it.
        assuranceLevel:
          type: string
        eidasLevel:
          type: string
          enum: [low, substantial, high]
          description: The eIDAS level reached; absent when the flow sets none.
        errorCode:
          type: string
          example: IDENTITY_MISMATCH
          description: >-
            Why a session was rejected. The wallet itself sets `IDENTITY_MISMATCH` (the
            document is not the expected person's) and `ASSURANCE_NOT_MET` (the checks fell
            short of the flow's level); others come from the checks (`FACE_NO_MATCH`,
            `DOC_EXPIRED`, `CHIP_CLONE_DETECTED`, …).
        expiresAt:
          type: string
          format: date-time
          description: When the session, or an unstarted hosted link, ends.
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
        purgedAt:
          type: string
          format: date-time
          description: When its personal data was erased.
        livemode:
          type: boolean
          description: False for a test key's session.
        expectedSubject:
          type: boolean
          description: Created for one known person (`name` with `birthDate`).
      required: [id, status, flowId, flowName, subjectEmail, expiresAt, createdAt, livemode, expectedSubject]
    ProofingApiCreatedSession:
      allOf:
        - $ref: '#/components/schemas/ProofingApiSession'
        - type: object
          properties:
            deepLink:
              type: string
              description: The Idem app's `vcmrtd://` link, to show as a QR code; empty for a hosted or test session.
            mailSent:
              type: boolean
            hostedUrl:
              type: string
              format: uri
              description: A hosted session's link to hand the person.
          required: [deepLink, mailSent]
    ProofingApiSessionPage:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ProofingApiSession'
        nextCursor:
          type: string
          nullable: true
          description: Pass back as `cursor` for the next page; null on the last.
      required: [sessions, nextCursor]
    ProofingApiResult:
      type: object
      description: A settled session's verified identity and the evidence it rests on. Never the document number or an image.
      properties:
        id:
          type: string
        status:
          type: string
        method:
          type: string
        assuranceLevel:
          type: string
        eidasLevel:
          type: string
        errorCode:
          type: string
        verifiedAt:
          type: string
          format: date-time
        identity:
          type: object
          description: Only for an approved session.
          properties:
            givenName:
              type: string
            familyName:
              type: string
            birthDate:
              type: string
            nationality:
              type: string
        evidence:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [emrtd, yivi_disclosure, reference_photo]
                description: >-
                  `reference_photo`: no document was read; the live face was matched
                  against the `referencePhoto` the session was created with.
              documentType:
                type: string
              issuingState:
                type: string
              expiryDate:
                type: string
              passiveAuth:
                type: string
                enum: [valid, invalid, not_performed]
              activeAuth:
                type: string
                enum: [valid, invalid, not_performed]
              faceMatch:
                type: number
              liveness:
                type: string
        livemode:
          type: boolean
        diplomas:
          type: array
          description: The DUO diploma extracts the person added, each checked against DUO's signature and the proofed identity.
          items:
            type: object
            properties:
              documentType:
                type: string
              qualification:
                type: string
              profiles:
                type: array
                items:
                  type: string
              institution:
                type: string
              placeOfIssue:
                type: string
              dateAwarded:
                type: string
                format: date
              nlqfLevel:
                type: string
              eqfLevel:
                type: string
              documentNumber:
                type: string
              signedAt:
                type: string
                format: date-time
              addedAt:
                type: string
                format: date-time
      required: [id, status, evidence, livemode, diplomas]
    ProofingApiMethodStart:
      type: object
      properties:
        id:
          type: string
        method:
          type: string
          enum: [idem_app, yivi_app]
        appLink:
          type: string
          description: The Idem app's link, for `idem_app`.
        walletLink:
          type: string
          description: The Yivi app's link, for `yivi_app`.
        expiresAt:
          type: string
          format: date-time
      required: [id, method, expiresAt]
    ProofingApiMethodStatus:
      type: object
      properties:
        id:
          type: string
        method:
          type: string
        status:
          type: string
        done:
          type: boolean
          description: True once the session has an outcome or ended.
      required: [id, method, status, done]
    ProofingWebhookEvent:
      type: object
      description: >-
        What a customer's webhook endpoint receives: a POST signed in `Yivi-Signature`
        (`t=<unix>,v1=<hex HMAC-SHA256 of "<t>.<body>">` with the endpoint's `whsec_…`
        secret), with `Yivi-Event` and `Yivi-Delivery` headers. Answer 2xx; anything else
        is retried up to 8 times over about 24 hours.
      properties:
        id:
          type: string
          format: uuid
          description: The delivery's id; the same on every retry.
        type:
          type: string
          enum: [session.created, session.started, session.handover, session.verified, session.failed, session.review_opened, session.expired, session.cancelled, session.purged, session.diploma_added, test]
        createdAt:
          type: string
          format: date-time
        data:
          type: object
          description: Never the person's name, address or photo.
          properties:
            sessionId:
              type: string
            status:
              type: string
            flowId:
              type: string
            livemode:
              type: boolean
            method:
              type: string
            assuranceLevel:
              type: string
            eidasLevel:
              type: string
            errorCode:
              type: string
              example: IDENTITY_MISMATCH
            expectedSubject:
              type: boolean
      required: [id, type, createdAt, data]
  responses:
    ApiUnauthorized:
      description: No API key was sent as a Bearer token (`unauthorized`), or it is unknown or revoked (`invalid_api_key`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ApiForbidden:
      description: The API key lacks the scope this call needs (`insufficient_scope`), or proofing is paused (`proofing_paused`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: No valid session cookie was supplied.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The session lacks the required role for this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ProofingForbidden:
      description: >-
        The session lacks the required role for this resource, or identity proofing is
        paused for the organisation (`proofing_paused`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The referenced resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: >-
        The customer spent its public API budget (code `rate_limited`): 120 calls a
        minute, and of those 10 session creations. `Retry-After` says in how many
        seconds to try again.
      headers:
        Retry-After:
          description: Seconds until the next call is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
security:
  - cookieAuth: []
