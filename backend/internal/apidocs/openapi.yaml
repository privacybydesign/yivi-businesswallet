    post:
      tags: [organizations]
      summary: Grant a mandate
      description: >-
        Grants a full or administrative mandate to a member. Requires a
        register-backed legal representative or an active full mandate — an
        administrator role does not reach this endpoint. A grantor who is not a
        legal representative is delegating, so the grant is cut from the mandate
        they hold and clamped to its scope and validity window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON request payload; see the endpoint description.
      responses:
        '2XX':
          description: Successful response.
