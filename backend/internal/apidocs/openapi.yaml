        '409':
          description: >-
            The part does not wait for a decision (`not_under_review`, `address_not_under_review`), or a file of the step has a seal nobody checked yet (`seal_unchecked`): check it again first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
