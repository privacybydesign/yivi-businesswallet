      responses:
        '2XX':
          description: The document to review.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: The signing link is not valid or has expired.
  /api/v1/signing/external/{token}/credential/link:
    parameters:
      - name: token
        in: path
        required: true
