                    - id: 5e4d3c2b-1a09-4f8e-8d7c-6b5a49382716
                      name: Production backend
                      prefix: yp_live_3kq7
                      scopes: [sessions:write, sessions:read, results:read, flows:read]
                      createdByName: Sam de Vries
                      createdAt: "2026-09-01T10:05:00Z"
                      lastUsedAt: "2026-10-02T09:30:00Z"
