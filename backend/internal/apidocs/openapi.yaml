    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    get:
      tags: [attestation]
      summary: List inbound credential offers awaiting a decision
      description: >-
        Credential offers delivered to the organisation over QERDS that have not
        been accepted or declined yet. Receiving an offer does not add the
        credential to the wallet; accepting it does. The offer deeplink itself is
        not returned, since anyone holding it could redeem the credential.
        Requires membership of the organisation.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
