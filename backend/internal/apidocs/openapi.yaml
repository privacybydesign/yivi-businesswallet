        new endpoint's answer carries its signing `secret` (`whsec_…`), the one time it is
        readable. Each event is a POST of `{id, type, createdAt, data}` (the `ps_` session id,
        outcome and assurance; never the person's name or address) signed in the
        `Yivi-Signature` header as `t=<unix>,v1=<hex HMAC-SHA256 of "<t>.<body>">`, with
        `Yivi-Event` and `Yivi-Delivery`. A non-2xx answer is retried with exponential
        back-off, up to 8 attempts over about 24 hours.
