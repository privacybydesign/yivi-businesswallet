                required:
                  summary: Verzekeringsbericht asked
                  value:
                    employmentMode: required
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '409':
