  /api/v1/orgs/{slug}/identity-proofing/flows:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    get:
      tags: [identity-proofing-internal]
      summary: List the org's identity proofing flows
      description: >-
        Requires organisation membership. The active version of each of the organisation's flows
        in its proofing engine. An administrator sees every flow, a member only the flows an
        administrator made available to members (`allowed`); `default` marks the
        organisation's one default flow, the one sent to an external person that names no
        flow, whether or not members may use it. `completable` is false for a flow a
        recipient cannot finish with only the Idem app, `needsReferencePhoto` marks a flow
        that matches the face against a reference photo (only the API can send one),
        `diplomaMode` is whether the flow asks for DUO diploma extracts and `retentionDays` is
        the most days an external person's data is kept on this flow (the flow's own retention
        when it sets one, else the organisation's `dataRetentionDays`, plus the day the
        proofing engine needs to purge it). `hostedEnabled` is the flow's "Allow sending this
        flow as a link" switch: off, the wallet's Verify a person dialog offers only Show on
        this screen. The organisation is the proofing engine's tenant under its own id: nothing
        is provisioned first. See my data and Delete my data are not listed: they are the
        wallet's own flows (`GET .../data-request-flows`), and no flow is made one.
      responses:
        '200':
          description: The flows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingFlowList'
              examples:
                flows:
                  summary: One flow, made available and preselected
                  value:
                    - id: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                      name: Onboarding
                      steps: [document_capture, nfc_read, face_verification]
                      requiredChecks: [nfc.passive_auth, nfc.chip_auth, face.match, face.liveness]
                      selfieLocation: native
                      requestedAttributes: [dg1, dg2, selfie]
                      faceProvider: regula
                      requiredAssuranceLevel: substantial
                      version: 3
                      active: true
                      createdAt: "2026-09-14T08:12:00Z"
                      completable: true

                      allowed: true
                      default: true
                      diplomaMode: "off"
                      addressMode: "off"
                      needsReferencePhoto: false
                      kind: identity
                      hostedEnabled: true
                      retentionDays: 31
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
    post:
      tags: [identity-proofing-internal]
      summary: Create an identity proofing flow
      description: >-
        Requires an administrator role in the organisation. The flow configuration: `name`,
        `steps`, and optionally `faceProvider` (`regula`, the default for a flow with a face
        step, or `idscan`, which checks the face in the document scan and needs the
        `document_photo` step; anything else is refused),
        `requestedAttributes`, `attributeReasons`, `acceptedDocumentTypes`, `acceptedIssuingCountries`,
        `requiredChecks`, `checkThresholds`, `requiredAssuranceLevel`, `bsnPolicy`, `keepFacePhotos`,
        `blurBsn`, `retentionOverrideSeconds`, `sessionTtlSeconds` and `alwaysReview` (a session the checks would approve
        goes to `needs_review` instead; a rejection stays one). Face capture is always set to the app (`selfieLocation` is
        overwritten). An empty `name` or `steps`, an unknown `faceProvider`, any choice the wallet's flow editor does not offer (see `POST /proofing/flows`), or a missing `attributeReasons` entry, is 400
        `invalid_input`. The proofing engine validates the combination (including `regula` on a
        deployment without Regula) and its refusal is returned as 422 `rejected_by_provider`.
        Creates version 1; the answer is the flow with `completable` and `needsReferencePhoto`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingFlowSpec'
            examples:
              onboarding:
                summary: Chip read with a face match
                value:
                  name: Onboarding
                  steps: [document_capture, nfc_read, face_verification]
                  requiredChecks: [nfc.passive_auth, nfc.chip_auth, face.match, face.liveness]
                  faceProvider: regula
                  selfieLocation: native
                  requiredAssuranceLevel: substantial
      responses:
        '201':
          description: Created as version 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingFlow'
              examples:
                created:
                  summary: The new flow
                  value:
                    id: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                    name: Onboarding
                    steps: [document_capture, nfc_read, face_verification]
                    requiredChecks: [nfc.passive_auth, nfc.chip_auth, face.match, face.liveness]
                    selfieLocation: native
                    requestedAttributes: [dg1, dg2, selfie]
                    faceProvider: regula
                    requiredAssuranceLevel: substantial
                    version: 1
                    active: true
                    createdAt: "2026-09-14T08:12:00Z"
                    completable: true

                    allowed: false
                    default: false
                    needsReferencePhoto: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '422':
          description: The proofing engine refused the configuration (`rejected_by_provider`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/flows/{flowID}/versions:
    parameters:
      - name: slug
