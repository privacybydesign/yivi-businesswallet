          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemStepResponse'
        '400':
          $ref: '#/components/responses/IdemBadRequest'
        '401':
          $ref: '#/components/responses/IdemDeviceUnauthorized'
        '403':
          $ref: '#/components/responses/IdemDeviceHandedOver'
        '404':
          $ref: '#/components/responses/IdemSessionNotFound'
        '409':
          $ref: '#/components/responses/IdemConflict'
        '410':
          $ref: '#/components/responses/IdemSessionExpired'
        '500':
          $ref: '#/components/responses/IdemInternalError'
  /api/v1/app/{token}/submit:
    parameters:
      - $ref: '#/components/parameters/IdemSessionToken'
    post:
      tags: [idem-app]
      summary: Submit the session
      description: >-
        Once every step has evidence the server decides the outcome; a repeat answers the current state with `alreadyRecorded`. Takes no body.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdemDeviceToken'
      responses:
        '200':
          description: The session's outcome (`status`, `errorCode`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemStepResponse'
        '401':
          $ref: '#/components/responses/IdemDeviceUnauthorized'
        '403':
          $ref: '#/components/responses/IdemDeviceHandedOver'
        '404':
          $ref: '#/components/responses/IdemSessionNotFound'
        '409':
          description: >-
            `steps_incomplete` (a step still lacks evidence, or the session was reset meanwhile), `not_app_session`, or the session has no flow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdemAppError'
        '410':
          $ref: '#/components/responses/IdemSessionExpired'
        '500':
          $ref: '#/components/responses/IdemInternalError'
