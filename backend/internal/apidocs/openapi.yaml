          description: Makes a retry safe; the same key and body within 24 hours get the first answer again.
          schema:
            type: string
            maxLength: 255
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingApiSession'
              examples:
                cancelled:
                  summary: Cancelled before the person finished
                  value:
                    id: ps_q4r7tz2mxk3vbn6hw5jc2dfa7e
                    status: cancelled
                    flowId: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                    flowName: Onboarding
                    flowVersion: 3
                    subjectEmail: anna@example.org
                    subjectName: Anna Jansen
                    expiresAt: "2026-10-02T09:40:00Z"
                    createdAt: "2026-10-02T09:30:00Z"
                    cancelledAt: "2026-10-02T09:31:45Z"
                    expectedSubject: false
        '401':
          $ref: '#/components/responses/ApiUnauthorized'
        '403':
          $ref: '#/components/responses/ApiForbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The session already has an outcome, ended, or was erased (`session_over`), or
            a call with this `Idempotency-Key` is still running or its outcome is unknown
            (`idempotency_in_flight`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The `Idempotency-Key` was used with another body (`idempotency_key_reused`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/signing/availability:
