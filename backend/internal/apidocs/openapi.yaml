                      name: Onboarding
                      steps: [document_capture, nfc_read, face_verification]
                      requiredChecks: [nfc.passive_auth, nfc.chip_auth, face.match, face.liveness]
                      selfieLocation: native
                      requestedAttributes: [dg1, dg2, selfie]
                      faceProvider: regula
                      requiredAssuranceLevel: substantial
                      version: 1
                      active: false
                      createdAt: "2026-09-14T08:12:00Z"
                      completable: true

                      allowed: false
                      default: false
                      needsReferencePhoto: false
                    - id: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                      name: Onboarding
                      steps: [document_capture, nfc_read, face_verification]
                      requiredChecks: [nfc.passive_auth, nfc.chip_auth, face.match, face.liveness]
                      selfieLocation: native
                      requestedAttributes: [dg1, dg2, selfie]
                      faceProvider: regula
                      requiredAssuranceLevel: substantial
                      version: 2
                      active: true
                      createdAt: "2026-09-14T08:12:00Z"
                      completable: true

                      allowed: false
                      default: false
                      needsReferencePhoto: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '422':
          description: The flow does not exist (`flow_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [identity-proofing-internal]
      summary: Edit an identity proofing flow as a new version
      description: >-
        Requires an administrator role in the organisation. Same body as creating a flow; it is
        stored as the next version and made the active one. Requests already sent keep the
        version their session pinned. An empty `name` or `steps`, an unknown `faceProvider`,
        any choice the wallet's flow editor does not offer (see `POST /proofing/flows`), or a missing `attributeReasons` entry is 400 `invalid_input`. A data request flow, or
        one requiring diplomas, keeps `dg1` in `requestedAttributes` (422 `flow_no_identity`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingFlowSpec'
            examples:
              edit:
                summary: Add a document photo
                value:
                  name: Onboarding
                  steps: [document_capture, nfc_read, document_photo, face_verification]
                  requiredChecks: [nfc.passive_auth, nfc.chip_auth, face.match, face.liveness]
                  faceProvider: regula
                  selfieLocation: native
                  requiredAssuranceLevel: substantial
      responses:
        '201':
          description: Saved as the next version, now active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingFlow'
              examples:
                saved:
                  summary: Version 4
                  value:
                    id: 6f1c0d2e-5b0a-4c7e-9f61-2a8d7c3e4b10
                    name: Onboarding
                    steps: [document_capture, nfc_read, document_photo, face_verification]
                    requiredChecks: [nfc.passive_auth, nfc.chip_auth, face.match, face.liveness]
                    selfieLocation: native
                    requestedAttributes: [dg1, dg2, selfie]
                    faceProvider: regula
                    requiredAssuranceLevel: substantial
                    version: 4
                    active: true
                    createdAt: "2026-09-14T08:12:00Z"
                    completable: true

                    allowed: false
                    default: false
                    needsReferencePhoto: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '409':
          description: The flow is See my data or Delete my data, the wallet's own (`data_request_flow`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The flow does not exist (`flow_not_found`), the proofing engine refused the configuration (`rejected_by_provider`), or a data request or diplomas-required flow would stop reading the name and date of birth (`flow_no_identity`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
