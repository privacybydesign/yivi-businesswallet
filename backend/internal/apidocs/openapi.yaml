    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    post:
      tags: [identity-proofing]
      summary: Send a test webhook event
      description: >-
        Requires an administrator role in the organisation. Queues a `test` event for the
        endpoint, whatever it subscribed to; it is sent within seconds. An organisation without
        an endpoint is 404 `webhook_not_found`. At most 10 a minute per organisation (429
        `rate_limited`).
      responses:
        '204':
          description: Queued.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Too many test events for this organisation (`rate_limited`); `Retry-After` says when to try again.
