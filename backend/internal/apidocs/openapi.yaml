    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource identifier.
    post:
      tags: [attestation]
      summary: Decline an inbound credential offer
      description: >-
        Refuses the offer. Nothing is redeemed, so the credential never reaches
        the wallet; the QERDS message and its evidence stay in the inbox.
        Requires an administrator role. Returns 404 when the offer is absent or
        already decided.
      responses:
        '2XX':
          description: Successful response.
