        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [theme]
      summary: Update the organisation theme
      description: >-
        Requires an administrator role in the organisation. Sent as
        multipart/form-data: the palette colour string fields (primaryColor,
        accentColor, textColor, surfaceColor, borderColor, linkColor,
        successColor, warningColor, errorColor), the navigation chrome colours
        (sidebarColor, topbarColor), a body font (fontFamily), an optional logo
        image file that replaces the logo, and removeLogo=true to clear it.
        Omitting both leaves the existing logo untouched.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                primaryColor:
                  type: string
                  description: Primary colour as a 6-digit hex string; empty clears it.
                accentColor:
                  type: string
                  description: Accent colour as a 6-digit hex string; empty clears it.
                textColor:
                  type: string
                  description: Text colour as a 6-digit hex string; empty clears it.
                surfaceColor:
                  type: string
                  description: Surface colour as a 6-digit hex string; empty clears it.
                borderColor:
                  type: string
                  description: Border colour as a 6-digit hex string; empty clears it.
                linkColor:
                  type: string
                  description: Link colour as a 6-digit hex string; empty clears it.
                successColor:
                  type: string
                  description: Success colour as a 6-digit hex string; empty clears it.
                warningColor:
                  type: string
                  description: Warning colour as a 6-digit hex string; empty clears it.
                errorColor:
                  type: string
                  description: Error colour as a 6-digit hex string; empty clears it.
                sidebarColor:
                  type: string
                  description: Sidebar colour as a 6-digit hex string; empty clears it.
                topbarColor:
                  type: string
                  description: Top bar colour as a 6-digit hex string; empty clears it.
                fontFamily:
                  type: string
                  description: CSS font-family list (e.g. "Open Sans", sans-serif); empty uses the default.
                logo:
                  type: string
                  format: binary
                  description: Logo image (PNG, JPEG, GIF, WebP or SVG) that replaces the current logo.
                removeLogo:
                  type: string
                  description: Set to "true" to clear the stored logo.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: The uploaded logo is too large.
