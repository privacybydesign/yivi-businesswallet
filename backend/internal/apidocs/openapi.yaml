    post:
      tags: [identity-proofing-api]
      summary: Cancel a proofing session (public API)
      description: >-
        Authenticated with the organisation's API key as a Bearer token. Ends a session that is
        still `pending` or `in_progress`, in the engine too, and
        answers it with `status` `cancelled` and `cancelledAt`. Audited
        `identity_proofing.session_cancelled`. Takes an `Idempotency-Key`.
      security:
        - apiKey: []
      parameters:
        - name: Idempotency-Key
