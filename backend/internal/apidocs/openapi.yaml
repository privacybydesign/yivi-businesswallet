        switch, beside a platform admin's pause, which it cannot lift. Pausing first rejects
        every session waiting for review with `errorCode` `ORG_PAUSED`; one that cannot be
        rejected refuses the pause (500), and a session that reaches review while paused is
        rejected the same way as it arrives. Audited
