                  summary: A new key
                  value:
                    id: 5e4d3c2b-1a09-4f8e-8d7c-6b5a49382716
                    name: Production backend
                    prefix: yp_live_3kq7
                    scopes: [sessions:write, sessions:read, results:read, flows:read]
                    createdAt: "2026-09-01T10:05:00Z"
                    secret: yp_live_3kq7Vb9xR2mT8nW4cZ6hJ1pL5sD0fG7a
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
