        at the wallet's EUDI verifier, and answers its `walletLink` (the
        `openid4vp://` request the Yivi app opens; shown as a QR code and a
        universal link) with `expiresAt`, the session's cap. The verifier's
        transaction id stays on the server.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
