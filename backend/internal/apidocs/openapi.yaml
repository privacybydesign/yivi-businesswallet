        schema:
          type: string
        description: Opaque hosted-link token from the `hostedUrl` of a hosted proofing session.
    post:
      tags: [identity-proofing]
      summary: Start a hosted proofing link
      security: []
      description: >-
        Body `{method}`: `idem_app` or `yivi_app` (only when the flow's `yiviAvailable`;
        otherwise, or for another method, 400 `invalid_input`). Creates the session once and
        answers 201 with the progress, plus the vcmrtd `deepLink` for an Idem session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingHostedStart'
            examples:
              idem:
                summary: The Idem app
                value:
                  method: idem_app
      responses:
        '201':
          description: Started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingHostedStarted'
              examples:
                idem:
                  summary: Started in the Idem app
                  value:
                    status: pending
                    method: idem_app
                    linkExpiresAt: "2026-10-02T09:40:00Z"
                    started: true
                    deepLink: vcmrtd://verify?handover=hv_3m8x2kq7&api=https%3A%2F%2Fwallet.example.nl
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
