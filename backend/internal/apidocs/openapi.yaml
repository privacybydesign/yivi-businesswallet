  /api/v1/orgs/{slug}/customers/{customerID}/webhook/rotate-secret:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: customerID
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Customer id.
    post:
      tags: [identity-proofing]
      summary: Rotate a customer's webhook signing secret
      description: >-
        Requires an administrator role in the organisation. The answer carries the new `secret`,
        the one time it is readable. For 24 hours every delivery is signed under both the new and
        the previous secret, so the endpoint can switch over without refusing any. A customer
        without an endpoint is 404 `webhook_not_found`.
      responses:
        '200':
          description: The endpoint with its new secret, shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingWebhookEndpoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The deployment has no identity proofing encryption key to seal the secret with (`no_encryption_key`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
