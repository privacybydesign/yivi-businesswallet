      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource identifier.
    post:
      tags: [attestation]
      summary: Revoke a claimed attestation
      description: >-
        Revokes an already-claimed credential (status `claimed`), setting it to
        `revoked`. This is the path backed by the issuer's IETF Token Status
        List. Unclaimed offers are withdrawn via cancel instead. Requires an
        administrator role. Returns 409 when the attestation is not a claimed
        credential.
      requestBody:
        required: true
        content:
