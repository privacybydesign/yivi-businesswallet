                  summary: Not started yet
                  value:
                    status: pending
                    linkExpiresAt: "2026-10-05T09:30:00Z"
                    started: false
                    addressGiven: false
                    sessionId: ps_b7k2mq4xz6rt3vnw5hc2jd7fae
                    redirectUrl: https://portal.acme.example/reset/return
                    embedOrigins: [https://portal.acme.example]
                    language: nl
                    locales: []
                    organization:
                      name: Acme Verzekeringen
                      branding:
                        displayName: Acme Verzekeringen
                        primaryColor: "#1f6feb"
                        secondaryColor: "#5412c7"
                        supportContact: support@acme.example
                        privacyUrl: https://acme.example/privacy
                        logoUri: /api/v1/proof/BwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyAhIiMkJSY/logo?v=1759397400
                        hidePoweredBy: false
                      dataRetentionDays: 7
                      erasureHandling: review
                    flow:
                      name: Onboarding
                      requiredAssuranceLevel: substantial
                      requestedAttributes: [dg1, dg2, selfie]
                      attributeReasons:
                        dg1:
                          en: To check who you are and your date of birth.
                          nl: Om te controleren wie je bent en je geboortedatum.
                      yiviAvailable: true
                      diplomaMode: "off"
                      addressMode: "off"
                      retentionDays: 31
                      sessionTtlSeconds: 600
                    diplomas: []
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
