        schema:
          type: string
        description: Organisation slug.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource identifier.
    delete:
      tags: [openid4vp]
      summary: Delete a credential request template
      description: Requires an administrator role.
