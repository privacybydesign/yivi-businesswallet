  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/review:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the customer API and webhooks show.
    post:
      tags: [identity-proofing]
      summary: Decide a request under review
      description: >-
        Requires an administrator role in the organisation. `decision` is `approve` or `reject`,
        `reason` (required, at most 500 characters) says why, and a rejection may name an
        `errorCode` (A-Z, 0-9 and _; `MANUAL_REVIEW_REJECTED` when absent). The engine settles
        the session and the outcome lands as any other: an approval still has to meet the flow's
        assurance level, and the customer's webhook is sent. Audited
        `identity_proofing.review_decided` with the administrator as actor. The answer is the
        request. An `errorCode` with an approval, or one not 1-64 of A-Z, 0-9 and _, is 400
        `invalid_input`.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request is not under review (`not_under_review`), decided already or its session ended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/diplomas:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the customer API and webhooks show.
    post:
      tags: [identity-proofing]
      summary: Upload diploma extracts on an on-screen request
      description: >-
        Requires organisation membership (an admin, or the member who sent it). Multipart `file`
        parts, each a DUO diploma extract PDF of at most 5 MiB, at most 10 per session. Only
        within an hour of an approved identity on a request that asks for diplomas. Each file is
        checked: DUO's PAdES signature (unchanged, DUO's qualified e-seal, trusted timestamp,
        chain on the EU Trusted Lists), then the printed holder against the proofed name and
        date of birth. The answer is a verdict per file: `{fileName, accepted, diploma}` or
        `{fileName, accepted: false, reason, failedCheck}` with `reason` `not_a_diploma`,
        `signature_invalid`, `holder_mismatch` or `duplicate`. An accepted extract keeps what
        DUO printed about the qualification, never the PDF, the name or the date of birth;
        audited `identity_proofing.diploma_added` (webhook `session.diploma_added`), a refused
        one `identity_proofing.diploma_rejected`. More than 10 `file` parts is 400
        `too_many_files`, and more than a session can still hold is 400 `invalid_input`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: One or more `file` parts.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request asks for no diplomas (`diplomas_not_asked`), the upload window is closed (`diplomas_closed`), or the request was cancelled or erased (`session_over`).
        '413':
          description: An extract or the upload is too large (`too_large`).
