  /api/v1/orgs/{slug}/identity-proofing/webhook:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    get:
      tags: [identity-proofing]
      summary: Get the organisation's webhook endpoint
      description: >-
        Requires an administrator role in the organisation. The organisation has one endpoint,
        for the events of all its flows. `configured` is false for an organisation without one.
        The endpoint's `url`, subscribed `events`, the last four characters of its
        signing secret, its `health` (`delivering`, `failing` since `failingSince` with
        `pendingRetries`, or `not_configured`, and the `lastStatusCode`; only what the
        current `url` answered counts), the `availableEvents` and `maxAttempts`.
      responses:
        '200':
          description: The organisation's endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingWebhookEndpoint'
              examples:
                configured:
                  summary: An endpoint that delivers
                  value:
                    configured: true
                    url: https://portal.acme.example/hooks/yivi
                    events: [session.verified, session.failed, session.review_opened, session.expired]
                    secretLast4: x9Qa
                    health:
                      state: delivering
                      lastStatusCode: 200
                      pendingRetries: 0
                    availableEvents: [session.created, session.started, session.handover, session.verified, session.failed, session.review_opened, session.expired, session.cancelled, session.purged, session.diploma_added, session.address_added, session.address_reviewed, session.employment_added]
                    maxAttempts: 8
                none:
                  summary: No endpoint
                  value:
                    configured: false
                    events: []
                    health:
                      state: not_configured
                      pendingRetries: 0
                    availableEvents: [session.created, session.started, session.handover, session.verified, session.failed, session.review_opened, session.expired, session.cancelled, session.purged, session.diploma_added, session.address_added, session.address_reviewed, session.employment_added]
                    maxAttempts: 8
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
    put:
      tags: [identity-proofing]
      summary: Set the organisation's webhook endpoint
      description: >-
        Requires an administrator role in the organisation. `url` (absolute https; it
        must resolve to a public address when an event is sent) and `events`, at least one
        of `session.created`, `session.started`, `session.handover`, `session.verified`, `session.failed`,
        `session.review_opened`, `session.expired`, `session.cancelled`, `session.purged`,
        `session.diploma_added`, `session.address_added` and `session.address_reviewed`. An
        endpoint is sent only the events it was saved with: save it again to add a new one. A
        new endpoint's answer carries its signing `secret` (`whsec_…`), the one time it is
        readable. Each event is a POST of `{id, type, createdAt, data}`; `data` holds
        `sessionId` (`ps_…`), `status`, `flowId`, and when known `method`,
        `assuranceLevel`, `eidasLevel`, `errorCode` (such as `IDENTITY_MISMATCH`) and
        `expectedSubject: true`; never the person's name or photo. Only `session.address_added`
        carries a person's data: the address they entered (`address`), never the registered (BRP)
        one. `session.address_reviewed` carries the decision as `addressReview`. It is signed in the
        `Yivi-Signature` header as `t=<unix>,v1=<hex HMAC-SHA256 of "<t>.<body>">`, with
        `Yivi-Event` and `Yivi-Delivery`; for 24 hours after a secret rotation it carries a
        second `v1` under the previous secret. An organisation without an endpoint is sent no
        events, and neither are requests sent to members. A non-2xx answer is retried with
        exponential back-off, up to 8 attempts over about 24 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingSaveWebhook'
            examples:
              outcomes:
                summary: The outcomes only
                value:
                  url: https://portal.acme.example/hooks/yivi
                  events: [session.verified, session.failed, session.review_opened, session.expired]
      responses:
        '200':
          description: The endpoint; a new one carries its secret, once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingWebhookEndpoint'
              examples:
                created:
                  summary: A new endpoint
                  value:
                    configured: true
                    url: https://portal.acme.example/hooks/yivi
                    events: [session.verified, session.failed, session.review_opened, session.expired]
                    secretLast4: x9Qa
                    health:
                      state: delivering
                      lastStatusCode: 200
                      pendingRetries: 0
                    availableEvents: [session.created, session.started, session.handover, session.verified, session.failed, session.review_opened, session.expired, session.cancelled, session.purged, session.diploma_added, session.address_added, session.address_reviewed, session.employment_added]
                    maxAttempts: 8
                    secret: whsec_4tY8mK2qN6vB1xC9zR3wP7sL5dF0gH8jA2eU6iO4x9Qa
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
