    post:
      tags: [identity-proofing]
      summary: Decide a part of a session's review (public API)
      description: >-
        Authenticated with the organisation's API key with `reviews:write`. Confirms or rejects
        one waiting part as the person named in `reviewer`, the one deciding in your own system.
        The decision is audited with your key as actor and that reviewer, the wallet shows the
        reviewer as having decided it, and the same webhooks go out as for a decision in the
        wallet. Confirming the identity approves the session; rejecting it rejects the session.
        A step's decision leaves the session's outcome as it is. Answers the review after the
        decision.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision, reason, reviewer]
              properties:
                decision:
                  type: string
                  enum: [confirm, reject]
                  description: Required. Confirm or reject the part.
                reason:
                  type: string
                  maxLength: 500
                  description: Required. Why, as the audit log keeps it.
                reviewer:
                  type: string
                  maxLength: 100
                  description: Required. The person deciding, as your own system names them.
                errorCode:
                  type: string
                  enum: [REVIEW_NOT_HOLDER, REVIEW_ALTERED, EVIDENCE_NOT_AS_REQUESTED, MANUAL_REVIEW_REJECTED]
                  description: >-
