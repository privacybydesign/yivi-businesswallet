  /api/v1/orgs/{slug}/identity-proofing/requests:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
    get:
      tags: [identity-proofing]
      summary: List identity proofing requests
      description: >-
        Requires organisation membership. An administrator sees every request of the
        organisation, a member the requests they sent; `?customerId=` narrows either to
        one customer's. Live requests are re-checked at the identity-proofing-service
        first. Only the outcome and assurance level are returned, and for a customer's
        approved subject the name read off the document (`proofedName`), until its
        retention (30 days) clears it. No other document data.
      parameters:
        - name: customerId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Only the requests sent for this customer.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The deployment has no identity proofing encryption key, so the organisation's tenant cannot be provisioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [identity-proofing]
      summary: Send an identity proofing request
      description: >-
        Requires organisation membership. Either `userId` (a member of the organisation)
        with `flowId` a flow an administrator made available to members, or
        `customerId` (one of the organisation's customers) with `email` and an optional
        `name` of that customer's subject, an external person, and `flowId` a flow
        assigned to that customer. Creates the session at the identity-proofing-service
        (10 minutes, counted from the send) and e-mails the subject its vcmrtd deep link
        as a QR code and a button; after the session ends, a new request means a new
        mail. `mailSent` is false when the mail could not be sent. `method` is the app
        the subject proofs with (`idem_app`, the default, or `yivi_app`) and `channel`
        how the session reaches them (`email`, the default, or `on_screen`). An
        on-screen request mails nothing and needs no `email` for a customer's subject;
        an on-screen Idem request answers the vcmrtd link as `deepLink` (scannable until
        `deepLinkExpiresAt`), and a Yivi one
        must be on-screen, its disclosure started through `yivi/start`. A Yivi request
        needs a flow without a face step or with the `engine` face provider: the Yivi
        app's face check runs on the proofing service's own engine.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The deployment has no identity proofing encryption key, so the organisation's tenant cannot be provisioned, proofing is paused for the customer (`customer_paused`), or a live request is for a customer without a live API key (`customer_no_api_key`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The person is not a member, or the flow does not exist, cannot be completed in the app, or is not available to members or assigned to the customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
