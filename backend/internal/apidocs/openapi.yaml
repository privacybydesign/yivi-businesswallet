                    clear it.
                groupId:
                  type: string
                  description: >-
                    Group whose members are in scope. Empty means the whole
                    directory.
                adminGroupIds:
                  type: array
                  description: >-
                    Groups whose members are provisioned as organisation
                    administrators. Everyone else becomes a member.
                  items:
                    type: string
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
