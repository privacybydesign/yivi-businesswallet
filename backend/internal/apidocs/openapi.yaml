  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/diplomas:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the customer API and webhooks show.
    post:
      tags: [identity-proofing]
      summary: Upload diploma extracts on an on-screen request
      description: >-
        Requires organisation membership (an admin, or the member who sent it). Multipart `file`
        parts, each a DUO diploma extract PDF of at most 5 MiB, at most 10 per session. Only
        within an hour of an approved identity on a request that asks for diplomas. Each file is
        checked: DUO's PAdES signature (unchanged, DUO's qualified e-seal, trusted timestamp,
        chain on the EU Trusted Lists), then the printed holder against the proofed name and
        date of birth. The answer is a verdict per file: `{fileName, accepted, diploma}` or
        `{fileName, accepted: false, reason, failedCheck}` with `reason` `not_a_diploma`,
        `signature_invalid`, `holder_mismatch` or `duplicate`. An accepted extract keeps what
        DUO printed about the qualification, never the PDF, the name or the date of birth;
        audited `identity_proofing.diploma_added` (webhook `session.diploma_added`), a refused
        one `identity_proofing.diploma_rejected`. More than 10 `file` parts is 400
        `too_many_files`, and more than a session can still hold is 400 `invalid_input`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProofingDiplomaUpload'
      responses:
        '200':
          description: A verdict per file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingDiplomaVerdictList'
              examples:
                verdicts:
                  summary: One accepted, one refused
                  value:
                    - fileName: diploma.pdf
                      accepted: true
                      diploma:
                        documentType: Diploma
                        qualification: HBO Bachelor Verpleegkunde
                        profiles: []
                        institution: Hogeschool van Amsterdam
                        placeOfIssue: Amsterdam
                        dateAwarded: "2019-07-05"
                        nlqfLevel: "6"
                        eqfLevel: "6"
                        documentNumber: "2019-0042137"
                        signedAt: "2026-10-02T09:36:40Z"
                        addedAt: "2026-10-02T09:37:02Z"
                    - fileName: cijferlijst.pdf
                      accepted: false
                      reason: not_a_diploma
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request asks for no diplomas (`diplomas_not_asked`), the upload window is closed (`diplomas_closed`), or the request was cancelled or erased (`session_over`).
        '413':
          description: An extract or the upload is too large (`too_large`).
  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/yivi/face:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the customer API and webhooks show.
    post:
      tags: [identity-proofing]
      summary: Score one face frame of an on-screen Yivi request
      description: >-
        Requires organisation membership. `image` is one live camera frame as a JPEG data URL
        (at most 2 MiB; a larger body is 400 `invalid_body`), scored against the photo the
        subject disclosed. The frame is matched by Regula and not kept; the answer is only the
        progress (`faceDetected`, `matched`, `consecutive`, `stableFrames`, `attempts`,
        `maxAttempts`) and the `decision` (pending, approved, rejected), which is recorded on
        the request at once. A session sends at most twice `maxAttempts` frames to Regula, a
        frame without a face included (a resent frame costs none); spending that budget rejects
        it. Frames count against the organisation's budget of 1500 a minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingFaceFrame'
            examples:
              frame:
                summary: One camera frame
                value:
                  image: data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD
      responses:
        '200':
          description: The face check's progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingFaceVerdict'
              examples:
                matching:
                  summary: A matching frame
                  value:
                    faceDetected: true
                    matched: true
                    consecutive: 2
                    stableFrames: 3
                    attempts: 5
                    maxAttempts: 30
                    decision: pending
                approved:
                  summary: Approved
                  value:
                    faceDetected: true
                    matched: true
                    consecutive: 3
                    stableFrames: 3
                    attempts: 6
                    maxAttempts: 30
                    decision: approved
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: >-
            The organisation spent its face-frame budget (code `rate_limited`): 1500 frames a
            minute. `Retry-After` says in how many seconds to try again.
          headers:
            Retry-After:
              description: Seconds until the next call is allowed.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The request does not run in the Yivi app (`wrong_method`), its session has ended (`session_over`), or the deployment cannot run the Yivi face check (`method_unavailable`, no Regula configured).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The proofing engine refused the step (`rejected_by_provider`), e.g. the disclosure is not complete or the image cannot be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
