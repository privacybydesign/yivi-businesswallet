  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/document-scan/start:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the API and webhooks show.
    post:
      tags: [identity-proofing-internal]
      summary: Start an on-screen request's document photo
      description: >-
        Requires organisation membership, and a request whose flow photographs the document
        (`documentScan` is `pending`). Starts (or, after a failed one, restarts) a scan at CM.com
        ID Scan, where the person photographs both sides of the document in the browser, and
        answers its page's `url`, which the wallet's page embeds in an iframe. When done the
        embedded page posts its parent the transaction's id, state and result id; `locale` is
        the page's language (`nl` or `en`). Only under the flow's BlurBSN does ID Scan cover the
        printed BSN in the photos; a BSN policy (retrieve, mask, omit) leaves them as taken. The
        transaction id stays on the server.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingDocumentScanStartRequest'
      responses:
        '200':
          description: The scan page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingDocumentScanStart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The flow takes no document photo (`document_scan_not_asked`), the photos are in already (`document_scan_done`), the deployment has no ID Scan (`no_document_scanner`), or the session has ended (`session_over`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/document-scan/finish:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the API and webhooks show.
    post:
      tags: [identity-proofing-internal]
      summary: Finish an on-screen request's document photo
      description: >-
        Requires organisation membership. Hands the photos of the scan the page started last
        to the session as its `document_photo` step: `transactionId` and `resultId` are what the
        embedded ID Scan page posted its parent when done. Finishing it again changes nothing.
        Without `resultId` it reports a scan that ended unfinished: one that used up ID Scan's own
        attempts rejects the session (`LIVENESS_FAILED` or `FACE_NO_MATCH` for the face checks,
        `DOC_EXPIRED` for an expired document, else `DOCUMENT_SCAN_FAILED`), as a new scan would
        give the person new attempts. So does one that ended at a face check, which ID Scan reports
        as still running once its page gave up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingDocumentScanFinishRequest'
      responses:
        '204':
          description: The photos are in, or the session was rejected for a scan out of attempts.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Not the scan the page started last (`document_scan_mismatch`), the flow takes no document photo (`document_scan_not_asked`), the deployment has no ID Scan (`no_document_scanner`), or the session has ended (`session_over`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The person did not finish the scan with attempts left, or it gave no photo (`document_scan_failed`); start another.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: >-
            The scan service could not hand over the scan's result (`document_scan_unavailable`);
            the message names what it answered. Nothing reached the session: start another scan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/flows/{flowID}/hosted:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: flowID
        in: path
        required: true
        schema:
          type: string
        description: The flow's id.
    get:
      tags: [identity-proofing-internal]
      summary: Read a flow's hosted page settings
      description: >-
        Requires an administrator role in the organisation. `enabled` (hosted links may be made
        for the flow), `locales` (`en`/`nl` the page offers; empty is every one) and
        `completion`: `redirect` (the session's `redirectUrl` when it has one, else the page's
        own thank-you screen) or `done` (always the thank-you screen), and `returnUrl`: the
        page a link for the flow is made with as its `redirectUrl` when it names none of its
        own (empty for none). A flow never set reads `enabled: true, locales: [], completion:
        redirect, returnUrl: ""`.
      responses:
        '200':
          description: The flow's hosted page settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingFlowHosted'
              examples:
                default:
                  summary: A flow never set
                  value:
                    enabled: true
                    locales: []
                    completion: redirect
                    returnUrl: ""
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '422':
          description: The flow is not one of the organisation's (`flow_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [identity-proofing-internal]
      summary: Save a flow's hosted page settings
      description: >-
        Requires an administrator role in the organisation. Body `{enabled, locales,
        completion, returnUrl}` as read; an absent `returnUrl` removes the return page. A
        `returnUrl` must be on one of the organisation's `allowedRedirectOrigins` (else 400
        `redirect_not_allowed`), and a `done` flow has none (400 `invalid_input`). A link made
        after the save takes the new return page; one made before keeps its own. A hosted
        session on a flow with its page off is 409
        `hosted_disabled`; one with a `redirectUrl` on a `done` flow, or a `language` the flow
        does not offer, is 400. Audited `identity_proofing.flow_hosted_configured` with before
        and after. A missing `enabled` is 400 `invalid_body`; a `completion` other than
        `redirect` or `done`, or an unsupported locale, is 400 `invalid_input`. Offering a
        language (or every language, `locales: []`) that the flow's active version gives an
        item it collects no `attributeReasons` in is 400 `reasons_missing`; a version saved
        before reasons existed gives none and may offer any language.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProofingFlowHostedUpdate'
            examples:
              dutchOnly:
                summary: Dutch only, always the thank-you screen
                value:
                  enabled: true
                  locales: [nl]
                  completion: done
              returnPage:
                summary: Back to the portal once the check ends
                value:
                  enabled: true
                  locales: []
                  completion: redirect
                  returnUrl: https://portal.example.nl/verified
      responses:
        '200':
          description: The saved settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingFlowHosted'
              examples:
                saved:
                  summary: Dutch only
                  value:
                    enabled: true
                    locales: [nl]
                    completion: done
                    returnUrl: ""
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '409':
          description: The flow is See my data or Delete my data, the wallet's own (`data_request_flow`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The flow is not one of the organisation's (`flow_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/flows/{flowID}/branding:
