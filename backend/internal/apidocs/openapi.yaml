  /api/v1/orgs/{slug}/identity-proofing/requests/{requestID}/yivi/disclosure:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: requestID
        in: path
        required: true
        schema:
          type: string
        description: Request id, the UUID or the `ps_…` id the customer API and webhooks show.
    get:
      tags: [identity-proofing]
      summary: Redeem an on-screen request's Yivi disclosure
      description: >-
        Requires organisation membership. `done` is false while the subject has not finished the
        OpenID4VP presentation in the Yivi app. Once done, the credential's photo becomes the
        face check's reference: `ok` true moves the session on to the face check (`stableFrames`
        matching frames approve it, `maxAttempts` without them reject it); `ok` false ended the
        session and `code` says why (photo_missing, reference_no_face, document_not_accepted).
        The response returns no disclosed value; on approval the engine keeps the disclosed identity attributes (and the
        photo, when the flow requested it) as the session's result, readable through `result`,
        until its retention.
      responses:
        '200':
          description: The disclosure's state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProofingYiviDisclosure'
              examples:
                pending:
                  summary: Not finished in the app yet
                  value:
                    done: false
                    ok: false
                ready:
                  summary: On to the face check
                  value:
                    done: true
                    ok: true
                    stableFrames: 3
                    maxAttempts: 30
                noPhoto:
                  summary: The credential had no photo
                  value:
                    done: true
                    ok: false
                    code: photo_missing
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ProofingForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The request does not run in the Yivi app (`wrong_method`), its session has ended (`session_over`), or the deployment cannot run the Yivi face check (`method_unavailable`, no Regula configured).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: The proofing engine refused the step (`rejected_by_provider`), e.g. the disclosure is not complete or the image cannot be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/identity-proofing/flows/{flowID}/hosted:
    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: flowID
        in: path
        required: true
        schema:
          type: string
        description: The flow's id.
    get:
      tags: [identity-proofing]
      summary: Read a flow's hosted page settings
      description: >-
        Requires an administrator role in the organisation. `enabled` (hosted links may be made
        for the flow), `locales` (`en`/`nl` the page offers; empty is every one) and
