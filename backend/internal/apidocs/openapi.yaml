                  $ref: '#/components/schemas/CredentialRequestTemplate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [openid4vp]
      summary: Save a credential request as a template
      description: >-
        Saves a named set of credential types and claim names to ask other
        organisations for, without a recipient. The credentials are checked
        with the same rules as a sent request. Requires an administrator role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, credentials]
              properties:
                name:
                  type: string
                  maxLength: 120
                credentials:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [vct]
                    properties:
                      vct:
                        type: string
                      claims:
                        type: array
                        maxItems: 50
                        items:
                          type: string
      responses:
        '201':
          description: The template was saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRequestTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The organisation already has a template with this name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/orgs/{slug}/openid4vp/templates/{id}:
    parameters:
      - name: slug
        in: path
