    parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Organisation slug.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource identifier.
    post:
      tags: [organizations]
      summary: Revoke a mandate
      description: >-
        Ends a mandate and everything delegated from it. An empty body revokes at
        once; an effectiveAt in the future closes the validity window on that date
        instead. Requires a legal representative, or the grantor of the mandate.
        Returns every mandate the revocation reached, the target first; a mandate
        that had already ended on its own is left out. Only a pending or active
        mandate can be revoked — one already revoked or expired is a conflict.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: JSON request payload; see the endpoint description.
      responses:
        '2XX':
          description: Successful response.
          content:
            application/json:
              schema:
                description: Response payload; shape depends on the endpoint.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The mandate has already been revoked or has expired.
