# OAuth2 client registrations for the QTSP authorization server, loaded via
# --spring.config.additional-location (see the qtsp-authz compose service). The
# authorization server persists these into oauth2_registered_client on startup
# (JdbcRegisteredClientRepository).
#
# DEMO ONLY. The client secret below is a well-known dev value; this is not a
# real credential. The business wallet (the RP-centric SCA) authenticates to the
# token endpoint with client_secret_basic using exactly these values, which it
# reads from its per-org CSC settings (internal/csc).
authorizationserver:
  client:
    yivi-business-wallet:
      client-id: "yivi-business-wallet"
      # {noop} = Spring's no-op password encoder (plaintext), fine for a dev secret.
      client-secret: "{noop}yivi-business-wallet-demo-secret"
      client-authentication-methods:
        - "client_secret_basic"
      authorization-grant-types:
        - "authorization_code"
      # cross-device-flow => the authorization server renders a QR the phone scans
      # (the wallet ceremony). same-device-flow returns a deep link instead.
      authentication-flow: "cross-device-flow"
      redirect-uris:
        # TODO(Phase D): finalize the real SCA callback the business-wallet backend
        # exposes (it will carry the org slug / a signing-session id). These dev
        # values let the authorize->code->token flow be exercised now.
        - "http://localhost:8080/api/v1/signing/callback"
        - "http://localhost:5173/signing/callback"
      scopes:
        - "service"
        - "credential"
        - "credential_creation"
        - "credential_deletion"
